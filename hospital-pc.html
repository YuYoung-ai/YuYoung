// ===== N-CARE 전용 서비스 현황 대시보드 =====
// dashboard.html의 N-Care 정기점검 현황 패턴을 로컬 HOSPITALS(가입 병원) 기준으로 이식.
// 정기점검 현황(정상 비율 게이지 + 상태 배지 + 점검 필요 병원 리스트) + 등급/지역 분포.
function renderNcareService(ncare){
  const STCOL=['var(--ok)','var(--teal)','var(--warn)','var(--danger)','var(--neutral)'];
  const STLB=[t('bNormal'),t('bTarget'),t('bRec'),t('bWarn'),t('bNone')];
  const total=ncare.length;
  // 병원별 경과 상태 인덱스(0 정상 ~ 4 미점검) — renderDash의 ages 버킷과 동일 기준
  const cnt=[0,0,0,0,0];
  const list=ncare.map(function(h){
    let si, days=null;
    if(h.st==='미점검'||!h.li){ si=4; }
    else { days=daysSince(h.li);
      if(days==null) si=4; else if(days<=30) si=0; else if(days<=60) si=1; else if(days<=90) si=2; else si=3; }
    cnt[si]++;
    return {hosp:h.n, grade:h.nc, days:days, si:si};
  });
  const rate=total?Math.round(cnt[0]/total*100):0;
  // 점검 필요(si>0) 목록: 경과일 내림차순, 미점검(si4)은 뒤로
  const need=list.filter(function(x){return x.si>0;}).sort(function(a,b){
    if(a.si===4&&b.si!==4) return 1;
    if(b.si===4&&a.si!==4) return -1;
    return (b.days||0)-(a.days||0);
  });
  const inspBlock=
    '<div class="nck-rate">'+
      '<div class="nck-rate-top"><b>✅ '+t('ncsRate')+' '+rate+'%</b>'+
        '<span>'+t('ncsNormalOf').replace('{n}',cnt[0]).replace('{t}',total)+'</span></div>'+
      '<div class="nck-ratebar"><div style="width:'+Math.max(2,rate)+'%"></div></div>'+
    '</div>'+
    '<div class="nck-sum">'+STLB.map(function(lb,i){
      return '<div class="nck-badge" style="background:'+STCOL[i]+'"><b>'+cnt[i]+'</b>'+escapeHtml(lb)+'</div>';
    }).join('')+'</div>'+
    (need.length
      ? '<div class="nck-list">'+need.map(function(x){
          const dy = x.days!=null ? t('dayAgo').replace('{d}',x.days) : t('bNone');
          return '<div class="nck-row">'+
            '<span class="nck-dot" style="background:'+STCOL[x.si]+'"></span>'+
            '<span class="nm">'+escapeHtml(x.hosp)+'</span>'+
            '<span class="gd">'+escapeHtml(x.grade||'')+'</span>'+
            '<span class="dy">'+dy+'</span>'+
          '</div>';
        }).join('')+'</div>'
      : '<div style="text-align:center;padding:20px;color:var(--text-muted);font-size:13px;">'+t('ncsAllDone')+'</div>');
  // 분포 막대 헬퍼 (등급/지역 공용)
  function distBars(counts, color){
    const keys=Object.keys(counts).sort(function(a,b){return counts[b]-counts[a];});
    if(!keys.length) return '<div style="color:var(--text-muted);font-size:12px;text-align:center;padding:12px;">'+t('ncsNoData')+'</div>';
    const mx=Math.max.apply(null,keys.map(function(k){return counts[k];}).concat([1]));
    return keys.map(function(k){
      const v=counts[k], w=Math.round(v/mx*100);
      return '<div class="bar-row"><div class="bar-label" style="width:92px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="'+escAttr(k)+'">'+escapeHtml(k)+'</div>'+
        '<div class="bar-track"><div class="bar-fill" style="width:'+Math.max(w,8)+'%;background:'+color+'">'+v+'</div></div></div>';
    }).join('');
  }
  const gradeCount={}; ncare.forEach(function(h){ const g=h.nc||'-'; gradeCount[g]=(gradeCount[g]||0)+1; });
  const regCount={};   ncare.forEach(function(h){ const r=h.rg||'-'; regCount[r]=(regCount[r]||0)+1; });

  return '<div class="dash-card"><div class="dash-title">🩺 '+t('ncsTitle')+
      ' <span style="font-weight:400;color:var(--text-muted);font-size:11px;">'+t('ncsSubscribed').replace('{n}',total)+'</span></div>'+
    '<div class="dash-subtitle">'+t('ncsInspTitle')+'</div>'+
    inspBlock+
    '<hr class="dash-divider">'+
    '<div class="dash-subtitle">'+t('ncsGradeTitle')+'</div>'+
    distBars(gradeCount,'var(--teal)')+
    '<hr class="dash-divider">'+
    '<div class="dash-subtitle">'+t('ncsRegionTitle')+'</div>'+
    distBars(regCount,'var(--purple)')+
  '</div>';
}

// ===== 최근 처리 탭 =====
// HISTORY(병원별 처리 이력)를 날짜순으로 펼쳐 "오늘/이번주에 어느 병원이 어떻게 처리됐는지" 보여준다.
let rcRange = 1;        // 기본: 오늘 (오늘 기준 필터)
let rcFse = '';         // 처리자 필터 ('' = 전체)

// 병원명 → 영업담당 매핑 (HOSPITALS 기준)
function hospSalesMap(){
  const m = {};
  HOSPITALS.forEach(h=>{ if(h.n && !(h.n in m)) m[h.n] = h.sa || ''; });
  return m;
}

// 'yyyy-MM-dd' 안전 파싱 → Date(자정). 실패 시 null
function parseDateYMD(s){
  if(!s) return null;
  const m = String(s).match(/(\d{4})[-.\/](\d{1,2})[-.\/](\d{1,2})/);
  if(!m) return null;
  const d = new Date(+m[1], +m[2]-1, +m[3]);
  return isNaN(d) ? null : d;
}

// 최근 처리 집계에서 제외할 항목 (실제 병원이 아닌 데모/테스트 장비)
function rcIsExcluded(name){
  return /^데모/.test(name);   // "데모", "데모장비(...)" 등
}

// 모든 HISTORY 기록을 평탄화 (병원명 부착)
function flattenHistory(){
  const out = [];
  Object.keys(HISTORY).forEach(name=>{
    if(rcIsExcluded(name)) return;
    const recs = HISTORY[name];
    if(!Array.isArray(recs)) return;
    recs.forEach(r=>{
      const dt = parseDateYMD(r.d);
      if(!dt) return;
      out.push({ name:name, dt:dt, ds:r.d, rec:r });
    });
  });
  return out;
}

// [B1] 최근 30일 일별 처리 추이 — 인라인 SVG 에어리어(단일 시계열, 범례 없음)
// dataviz: 얇은 라인 2px, 은은한 그리드, 끝점 강조, 상태색과 무관한 accent(teal)
function dashTrendCard(){
  var DAYS=30, now=new Date();
  var today=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();
  var counts=new Array(DAYS).fill(0);
  flattenHistory().forEach(function(it){
    if(!it.dt) return;
    var diff=Math.round((today-it.dt.getTime())/86400000);
    if(diff>=0 && diff<DAYS) counts[DAYS-1-diff]++;
  });
  var total=counts.reduce(function(a,b){return a+b;},0);
  var max=Math.max.apply(null,counts.concat([1]));
  var W=600,H=80,padL=8,padR=8,padT=12,padB=18, plotW=W-padL-padR, plotH=H-padT-padB, base=H-padB;
  var X=function(i){ return padL+(DAYS<=1?0:i/(DAYS-1))*plotW; };
  var Y=function(v){ return padT+(1-v/max)*plotH; };
  var pts=counts.map(function(v,i){ return [X(i),Y(v)]; });
  var L=pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1);}).join(' L');
  var line='M'+L;
  var area='M'+X(0).toFixed(1)+','+base+' L'+L+' L'+X(DAYS-1).toFixed(1)+','+base+' Z';
  var midY=Y(max/2).toFixed(1), lp=pts[DAYS-1];
  var hits='';
  for(var i=0;i<DAYS;i++){
    var d=new Date(today-(DAYS-1-i)*86400000);
    var lbl=(d.getMonth()+1)+'/'+d.getDate()+' · '+counts[i]+'건';
    var w=plotW/(DAYS-1||1);
    hits+='<rect x="'+(X(i)-w/2).toFixed(1)+'" y="0" width="'+w.toFixed(1)+'" height="'+base+'" fill="transparent"><title>'+lbl+'</title></rect>';
  }
  var svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="height:auto;display:block;max-height:96px;" role="img" aria-label="최근 30일 일별 처리 건수 추이">'+
    '<line x1="'+padL+'" y1="'+base+'" x2="'+(W-padR)+'" y2="'+base+'" style="stroke:var(--line)" stroke-width="1"/>'+
    '<line x1="'+padL+'" y1="'+midY+'" x2="'+(W-padR)+'" y2="'+midY+'" style="stroke:var(--line)" stroke-width="1" stroke-dasharray="3 4" opacity=".7"/>'+
    '<path d="'+area+'" style="fill:var(--teal)" opacity=".13"/>'+
    '<path d="'+line+'" style="stroke:var(--teal)" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>'+
    '<circle cx="'+lp[0].toFixed(1)+'" cy="'+lp[1].toFixed(1)+'" r="3.6" style="fill:var(--teal);stroke:var(--surface)" stroke-width="2"/>'+
    hits+
  '</svg>';
  return '<div class="dash-card">'+
    '<div class="dash-title" style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;">최근 30일 처리 추이'+
      '<span style="font-size:18px;font-weight:800;color:var(--teal);">'+total+'<span style="font-size:11px;color:var(--text-muted);font-weight:600;"> 건</span></span></div>'+
    svg+
    '<div style="display:flex;justify-content:space-between;font-size:10px;color:var(--text-muted);margin-top:3px;"><span>30일 전</span><span>오늘</span></div>'+
  '</div>';
}

function renderRecent(){
  const wrap = document.getElementById('viewRecent');
  const now = new Date();
  const todayMid = new Date(now.getFullYear(), now.getMonth(), now.getDate());

  // 기간 시작일 (rcRange일 전 자정). '오늘'은 rcRange=1 → 오늘 0시부터
  const startMid = new Date(todayMid);
  startMid.setDate(startMid.getDate() - (rcRange - 1));

  const salesMap = hospSalesMap();

  // 기간 내 기록 추출 + 처리자 필터
  let items = flattenHistory().filter(it => it.dt >= startMid && it.dt <= todayMid);
  if(rcFse) items = items.filter(it => (it.rec.f||'') === rcFse);

  // 날짜 내림차순 (같은 날은 병원명 가나다)
  items.sort((a,b)=> b.dt - a.dt || a.name.localeCompare(b.name,'ko'));

  // 처리자 목록 (필터 드롭다운용 — 현재 보이는 전체 기간 무관, 30일 내 등장한 처리자)
  const fseStartMid = new Date(todayMid); fseStartMid.setDate(fseStartMid.getDate()-29);
  const fseSet = {};
  flattenHistory().forEach(it=>{ if(it.dt>=fseStartMid && it.dt<=todayMid && it.rec.f) fseSet[it.rec.f]=(fseSet[it.rec.f]||0)+1; });
  const fseList = Object.keys(fseSet).sort((a,b)=>fseSet[b]-fseSet[a]);

  // 기간 선택 칩
  const ranges = [[1,'rcToday'],[7,'rc7'],[14,'rc14'],[30,'rc30']];
  let rangeHtml = '<div class="rc-range">';
  ranges.forEach(([d,key])=>{
    rangeHtml += '<button class="chip'+(rcRange===d?' on':'')+'" data-rcrange="'+d+'">'+t(key)+'</button>';
  });
  rangeHtml += '</div>';

  // 처리자 필터
  let fseHtml = '<div class="rc-fsefilter"><select id="rcFseSelect"><option value="">'+t('rcAllFse')+'</option>';
  fseList.forEach(f=>{ fseHtml += '<option value="'+escAttr(f)+'"'+(rcFse===f?' selected':'')+'>'+escapeHtml(f)+' ('+fseSet[f]+')</option>'; });
  fseHtml += '</select></div>';

  // 요약
  const hospCount = new Set(items.map(it=>it.name)).size;
  const summary = '<div class="rc-summary">'+t('rcCount').replace('{n}', items.length).replace('{h}', hospCount)+'</div>';

  let body = '';
  if(!items.length){
    body = '<div class="tl-empty">'+t('rcEmpty')+'</div>';
  } else {
    // 날짜별 그룹
    const groups = {};
    items.forEach(it=>{ (groups[it.ds] = groups[it.ds] || []).push(it); });
    const dates = Object.keys(groups).sort((a,b)=> b.localeCompare(a));

    dates.forEach(ds=>{
      const list = groups[ds];
      body += '<div class="rc-day">';
      body += '<div class="rc-dayhead"><span>'+escapeHtml(rcDateLabel(ds))+'</span><span class="rc-daycnt">'+list.length+rcUnit()+'</span></div>';
      list.forEach(it=>{
        const r = it.rec;
        const isInsp = (r.t === '점검');
        const typeLabel = isInsp ? t('rcInsp') : t('rcAS');
        const typeCls = isInsp ? '점검' : 'AS';
        const sym = [r.pt, r.sy].filter(Boolean).join(' · ');
        const fx = r.fx ? escapeHtml(r.fx) : (r.m ? escapeHtml(r.m) : '');
        const meta = [];
        if(r.f) meta.push(t('rcFse')+' '+escapeHtml(r.f));
        const sa = salesMap[it.name];
        if(sa && sa!=='장비OUT') meta.push(t('sales')+' '+escapeHtml(sa));
        if(r.pay) meta.push(escapeHtml(r.pay));
        let metaLine = meta.length ? '<span>'+meta.join('</span><span>')+'</span>' : '';
        if(r.p && r.p!=='없음') metaLine += '<span class="rc-part">🔧 '+escapeHtml(r.p)+'</span>';

        body += '<div class="rc-item" data-rchosp="'+escAttr(it.name)+'">'+
          '<div class="rc-item-top"><span class="rc-hname">'+escapeHtml(it.name)+'</span>'+
            '<span class="rc-type '+typeCls+'">'+typeLabel+'</span></div>'+
          (sym ? '<div class="rc-sym">'+escapeHtml(sym)+'</div>' : '')+
          (fx ? '<div class="rc-fx">'+fx+'</div>' : '')+
          (metaLine ? '<div class="rc-metaline">'+metaLine+'</div>' : '')+
        '</div>';
      });
      body += '</div>';
    });
  }

  wrap.innerHTML = rangeHtml + fseHtml + summary + body;
  bindRecent();
}

// 건수 단위 (언어별)
function rcUnit(){ return LANG==='ja' ? '件' : (LANG==='en' ? '' : '건'); }

// 날짜 라벨: 오늘/어제 표기 + 요일
function rcDateLabel(ds){
  const dt = parseDateYMD(ds);
  if(!dt) return ds;
  const now = new Date();
  const todayMid = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const diff = Math.round((todayMid - dt)/86400000);
  const wkKo=['일','월','화','수','목','금','토'];
  const wk = wkKo[dt.getDay()];
  const md = (dt.getMonth()+1)+'월 '+dt.getDate()+'일';
  if(LANG==='en'){
    const wkEn=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const mdEn=(dt.getMonth()+1)+'/'+dt.getDate();
    if(diff===0) return 'Today · '+mdEn+' ('+wkEn[dt.getDay()]+')';
    if(diff===1) return 'Yesterday · '+mdEn+' ('+wkEn[dt.getDay()]+')';
    return mdEn+' ('+wkEn[dt.getDay()]+')';
  }
  if(LANG==='ja'){
    const wkJa=['日','月','火','水','木','金','土'];
    const mdJa=(dt.getMonth()+1)+'月'+dt.getDate()+'日';
    if(diff===0) return '今日 · '+mdJa+'('+wkJa[dt.getDay()]+')';
    if(diff===1) return '昨日 · '+mdJa+'('+wkJa[dt.getDay()]+')';
    return mdJa+'('+wkJa[dt.getDay()]+')';
  }
  if(diff===0) return '오늘 · '+md+' ('+wk+')';
  if(diff===1) return '어제 · '+md+' ('+wk+')';
  return md+' ('+wk+')';
}

let histEditing = false;
let histCurName = null;

/* ── 이력 편집 저장 위치 전환 (localStorage → 서버) ────────────────────────
   예전에는 관리자(레벨2) 인증까지 받은 편집을 baz_hosp_history 에만 저장했다.
   ① 편집한 사람의 브라우저에서만 보였고
   ② 그 로컬 값이 서버 이력(applyIssueHist)을 매번 덮어써, 다른 사람이 고친
      최신 이력이 그 PC 에서는 영영 안 보였다.
   → 이제 서버(handover_gas.gs history_save)가 진실이다. localStorage 는
     "서버에 아직 못 보낸 초안" 보관용으로만 쓴다(js/baz-history-api.js).
   기존 로컬 편집본은 지우지 않고 초안으로 옮겨, 사용자가 확인 후 서버에
   반영하거나 버릴 수 있게 한다. */
var histServerRev = {};        // 병원명 → 서버 rev (충돌 판정 기준)
var histServerSourceRev = {};  // 병원명 → 마지막 현장 원본 행(편집 중 새 기록 충돌 판정)
var histLegacyNames = {};      // 마이그레이션된 구버전 편집본 병원 목록
(function migrateHistEdits(){
  try{
    var r = BazHistoryApi.migrateLegacyDrafts(localStorage);
    (r.names||[]).forEach(function(n){ histLegacyNames[n]=1; });
    if(r.migrated) console.log('[이력] 이 기기의 옛 편집본 '+r.migrated+'건을 초안으로 옮겼습니다 — 서버 반영은 이력 창에서');
  }catch(e){ console.warn('[이력] 편집본 마이그레이션 실패(무시):', e); }

var histNoteState = null;      // {kind:'info'|'ok'|'err', msg, draft:boolean}

  histCurName = name;

/* 안내 배너(초안 있음 · 저장 실패 · 충돌 등). 문자열은 전부 i18n·이스케이프 */
function histNoteHTML(){
  if(!histNoteState) return '';
  var acts='';
  if(histNoteState.draft){
    acts='<div class="acts">'+
      '<button type="button" data-histdraft="apply">'+escapeHtml(t('histDraftApply'))+'</button>'+
      '<button type="button" data-histdraft="drop">'+escapeHtml(t('histDraftDrop'))+'</button>'+
    '</div>';
  }
  return '<div class="hist-note'+(histNoteState.kind==='err'?' err':histNoteState.kind==='ok'?' ok':'')+'" role="status">'+
    escapeHtml(histNoteState.msg)+acts+'</div>';
}

function renderHistBody(){
  const name = histCurName;
  const recs = HISTORY[name] || [];
  document.getElementById('histName').textContent = name;
  document.getElementById('histSub').textContent = t('histCount').replace('{n}', recs.length) + (histEditing?' · '+t('histEditMode'):'');
  const body = document.getElementById('histBody');
  const note = histNoteHTML();

  if(histEditing){
    // 편집 모드: 각 기록을 폼으로
    body.innerHTML = note + (recs.map((r,i)=>histEditRow(r,i)).join('') || '<div class="tl-empty">'+t('histEmpty')+'</div>');
    return;
  }
  // 보기 모드
  if(!recs.length){
    body.innerHTML = note + '<div class="tl-empty">'+t('histEmpty')+'</div>';
  }else{
    body.innerHTML = note + recs.map(r=>{
      const isInsp = (r.t==='점검');
      const typeLabel = isInsp ? '점검' : 'A/S';
      const typeCls = isInsp ? '점검' : 'AS';
      const symLine = (r.pt||r.sy) ? '<div class="tl-cat">'+escapeHtml([r.pt,r.sy].filter(Boolean).join(' · '))+'</div>' : '';
      const memo = r.m ? '<div class="tl-memo">'+escapeHtml(r.m)+'</div>' : '';
      const fix = r.fx ? '<div class="tl-memo tl-fix">↳ '+escapeHtml(r.fx)+'</div>' : '';
      let partLine='';
      if(r.p){ partLine='<div class="tl-part">🔧 '+t('histPart')+': '+escapeHtml(r.p)+'</div>'; }
      const meta=[];
      if(r.f) meta.push(t('histFse')+' '+escapeHtml(r.f));
      if(r.pay) meta.push(escapeHtml(r.pay));
      const metaLine = meta.length ? '<div class="tl-meta">'+meta.join(' · ')+'</div>' : '';
      return '<div class="tl-item '+(isInsp?'':'as')+'">'+
        '<div class="tl-date">'+escapeHtml(r.d)+'<span class="tl-type '+typeCls+'">'+typeLabel+'</span></div>'+
        metaLine + symLine + memo + fix + partLine +
      '</div>';
    }).join('');
  }
}

function histEditRow(r,i){
  const v=(s)=>escapeHtml(s||'');
  return '<div class="tl-edit" data-i="'+i+'">'+
    '<div class="row2">'+
      '<input type="date" data-f="d" value="'+v(r.d)+'">'+
      '<select data-f="t"><option value="A/S"'+(r.t!=='점검'?' selected':'')+'>A/S</option><option value="점검"'+(r.t==='점검'?' selected':'')+'>점검</option></select>'+
    '</div>'+
    '<div class="row2">'+
      '<input type="text" data-f="pt" placeholder="부위" value="'+v(r.pt)+'">'+
      '<input type="text" data-f="sy" placeholder="현상" value="'+v(r.sy)+'">'+
    '</div>'+
    '<div class="row2">'+
      '<input type="text" data-f="f" placeholder="처리자" value="'+v(r.f)+'">'+
      '<input type="text" data-f="pay" placeholder="유/무상" value="'+v(r.pay)+'">'+
    '</div>'+
    '<textarea data-f="m" rows="2" placeholder="상세 내용">'+v(r.m)+'</textarea>'+
    '<textarea data-f="fx" rows="2" placeholder="처리 내용">'+v(r.fx)+'</textarea>'+
    '<input type="text" data-f="p" placeholder="교환품" value="'+v(r.p)+'">'+
    '<div style="text-align:right;"><button type="button" class="tl-edit-del" data-histdel="'+i+'">🗑 삭제</button></div>'+
  '</div>';
}

// 편집 모드의 입력값을 HISTORY에 반영
function histCollectEdits(){
  const name = histCurName;
  const rows = document.querySelectorAll('#histBody .tl-edit');
  const newRecs=[];
  rows.forEach(row=>{
    const rec={};
    row.querySelectorAll('[data-f]').forEach(el=>{
      const f=el.getAttribute('data-f');
      const val=el.value.trim();
      if(val) rec[f]=val;
    });
    if(rec.d || rec.sy || rec.m) newRecs.push(rec);
  });
  // 날짜 내림차순 정렬
  newRecs.sort((a,b)=>(b.d||'').localeCompare(a.d||''));
  HISTORY[name]=newRecs;
}

function histDelRow(i){
  histCollectEdits();
  HISTORY[histCurName].splice(i,1);
  renderHistBody();
}

function histAddRow(){
  histCollectEdits();
  const ds=BazDate.todayStr();   // Asia/Seoul — 자정 넘겨 열어 둔 탭도 오늘로 찍힌다
  if(!HISTORY[histCurName]) HISTORY[histCurName]=[];
  HISTORY[histCurName].unshift({d:ds, t:'A/S'});
  renderHistBody();
}

/* ── 서버 저장 ────────────────────────────────────────────────────────────
   성공했을 때만 화면을 "저장됨"으로 바꾼다. 실패·권한부족·충돌은 편집 모드를
   유지하고 초안을 남긴다(입력을 잃지 않게). */
var histSaving=false;
function histSetNote(kind, msg, draft){
  histNoteState = msg ? {kind:kind, msg:msg, draft:!!draft} : null;
  renderHistBody();
}
function histPostSave(payload){
  /* 이력 저장은 쓰기 경로다 — 조회용 bazGet 이 아니라 진행상태 저장과 같은 POST 규약
     (text/plain + 토큰 동봉)을 쓴다. GAS 콜드스타트가 JSON 대신 HTML 을 주면 실패로 본다. */
  return fetch(HANDOVER_URL, {
    method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(payload)
  }).then(function(r){ return r.text(); })
    .then(function(txt){
      if(/^\s*</.test(txt)) throw {kind:'html'};
      return JSON.parse(txt);
    });
}
function histSaveEdits(){
  if(histSaving) return;
  histCollectEdits();
  var name=histCurName;
  var records=BazHistoryApi.sanitizeRecords(HISTORY[name]||[]);
  var token=''; try{ token=(window.BazAuth&&BazAuth.token&&BazAuth.token())||''; }catch(e){}
  if(!token){ histSetNote('err', t('histNeedAuth')); return; }
  // 서버 왕복 중 브라우저가 닫혀도 입력이 남도록 먼저 초안으로 보관
  try{ BazHistoryApi.saveDraft(localStorage, name, records); }catch(e){}
  var payload=BazHistoryApi.buildPayload({
    hosp:name, records:records, who:pcWho(), baseRev:(histServerRev[name]||0),
    baseSourceRev:(histServerSourceRev[name]||0), token:token
  });
  histSaving=true;
  histSetNote('info', t('histSaving'));
  var save=document.getElementById('histSave'); if(save) save.disabled=true;
  histPostSave(payload)
    .then(function(d){
      var r=BazHistoryApi.classifyResponse(d);
      if(r.ok){
        histServerRev[name]=r.rev;
        histServerSourceRev[name]=r.sourceRev;
        HISTORY[name]=Array.isArray(r.records)?r.records:records;
        try{ BazHistoryApi.clearDraft(localStorage, name); }catch(e){}
        delete histLegacyNames[name];
        histInvalidateIssueCache();          // 다음 동기화가 서버 최신본을 다시 받게
        bazAuthOk();
        histNoteState=null;
        histExitEdit();
        try{ bazClearVerMemo(); }catch(e){}  // 이력 변경 → HP/UI 버전 메모 무효화
        try{ render(); }catch(e){}
        showHistToast(t('histServerSaved'));
        bazAnnounce(t('histServerSaved'));
        return;
      }
      if(r.conflict){
        /* 조용히 덮어쓰지 않는다 — 서버 최신본을 화면에 반영하고 다시 확인받는다 */
        if(Array.isArray(r.records)) HISTORY[name]=r.records;
        histServerRev[name]=r.rev;
        histServerSourceRev[name]=r.sourceRev;
        histInvalidateIssueCache();
        renderHistBody();
        histSetNote('err', t('histConflict')+(r.updatedBy?' ('+r.updatedBy+(r.updatedAt?' · '+r.updatedAt:'')+')':''), true);
        bazAnnounce(t('histConflict'));
        return;
      }
      if(r.unauthorized){ bazAuthFail(); histSetNote('err', t('histNeedAuth'), true); return; }
      histSetNote('err', t('histSaveFail')+(r.error?' ('+r.error+')':''), true);
    })
    .catch(function(e){
      console.warn('[이력] 서버 저장 실패:', (e&&e.kind)||e);
      histSetNote('err', t('histSaveFail')+' · '+t('histDraftKept'), true);
    })
    .then(function(){
      histSaving=false;
      var s=document.getElementById('histSave'); if(s) s.disabled=false;
    });
}
/* 저장·충돌 뒤에는 이슈이력 캐시를 버려야 다음 동기화가 서버 최신본을 받는다 */
function histInvalidateIssueCache(){
  try{
    localStorage.removeItem('bazIssueHistCache');
    localStorage.removeItem('bazIssueHistCacheTs');
    localStorage.removeItem('bazIssueHistCacheRev');
  }catch(e){}
  try{ if(typeof window.bazRefreshIssueHist==='function') window.bazRefreshIssueHist(); }catch(e){}
}
/* 이 기기 초안 → 서버 반영 / 버리기.
   서버 반영은 편집과 같은 권한(레벨2)이 필요하므로, 잠금 상태면 먼저 인증을 받는다. */
var histPendingDraftApply=false;
function histApplyDraft(){
  var d=null; try{ d=BazHistoryApi.readDraft(localStorage, histCurName); }catch(e){}
  if(!d){ histSetNote(null,''); return; }
  if(!histEditing){ histPendingDraftApply=true; histOpenPwModal(); return; }
  HISTORY[histCurName]=d.records.slice();
  histNoteState=null;
  renderHistBody();
  histSaveEdits();
}
function histDropDraft(){
  try{ BazHistoryApi.clearDraft(localStorage, histCurName); }catch(e){}
  delete histLegacyNames[histCurName];
  histSetNote(null,'');
}

function histEnterEdit(){

  renderHistBody();
}
function histExitEdit(){
  histEditing=false;
  document.getElementById('histEditBar').style.display='none';
  document.getElementById('histLock').classList.remove('on');
  document.getElementById('histLock').textContent='🔒';
  renderHistBody();
}

function showHistToast(msg){
  let toast=document.getElementById('histToast');
  if(!toast){
    toast=document.createElement('div');
    toast.id='histToast';
    toast.style.cssText='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1B2F5E;color:#fff;font-size:13px;font-weight:700;padding:10px 18px;border-radius:20px;z-index:400;box-shadow:0 4px 16px rgba(0,0,0,.25);';
    document.body.appendChild(toast);
  }
  toast.textContent=msg;
  toast.style.opacity='1';
  setTimeout(()=>{ toast.style.transition='opacity .4s'; toast.style.opacity='0'; },1800);
}

/* [스크롤] 닫기는 body.style.overflow 를 직접 되돌리지 않는다.
   예전에는 이력 모달이 무조건 overflow='' 로 리셋해, 지도 전체화면이 배경을

// 병원 상세 모달 닫기 (✕·배경 클릭·Esc) — 표 전체화면 뷰 전용
(function(){
  var dm=document.getElementById('pcDetailModal');
  var cl=document.getElementById('pcDetailModalClose');
  if(cl) cl.addEventListener('click', function(){ if(typeof pcCloseDetailModal==='function') pcCloseDetailModal(); });
  if(dm) dm.addEventListener('click', function(e){ if(e.target.id==='pcDetailModal' && typeof pcCloseDetailModal==='function') pcCloseDetailModal(); });
  /* Esc — 모달은 BazModal 이 스택 최상단만 닫는다(중첩 안전). 열린 모달이 없을 때만
     지도 전체화면을 해제한다. capture 단계의 BazModal.bind 가 먼저 처리하므로
     여기서는 "남은 경우"만 본다. */
  BazModal.bind(document);
  document.addEventListener('keydown', function(e){
    if(e.key!=='Escape') return;
    if(e.__bazModalHandled) return;      // 이 Esc 는 모달이 이미 소비했다
    if(BazModal.openCount()>0) return;
    if(typeof pcMapIsFull==='function' && pcMapIsFull()){ pcExitFullscreen(); }
  });
})();

// 🤖 AI 문의 버튼 → 현재 장비 정보·이력을 챗봇으로 전달
document.getElementById('histAiBtn').addEventListener('click', ()=>{
  const name = histCurName;
  if(!name) return;
  const hosp = HOSPITALS.find(h=>h.n===name) || {};
  const recs = (HISTORY[name] || []).slice(0, 12);  // 최근 12건만 전달

  // 이력을 챗봇이 읽는 최소 필드로 압축
  const slim = recs.map(r=>({
    d: r.d || '', sy: r.sy || '', fx: r.fx || '',
    p: r.p || '', pt: r.pt || ''
  }));

  // base64(JSON)로 인코딩 — 한글·특수문자 URL 안전 전달
  let ctxParam = '';
  try{
    ctxParam = btoa(unescape(encodeURIComponent(JSON.stringify(slim))));
  }catch(e){ ctxParam = ''; }

  const params = new URLSearchParams({
    hosp: name,
    serial: hosp.s || '',
    status: hosp.st || '',
    ncare: hosp.nc || '',
    pay: hosp.as || '',
    li: hosp.li || ''
  });
  if(ctxParam) params.set('ctx', ctxParam);

  location.href = 'chatbot.html?' + params.toString();
});

// 잠금 버튼 → 비밀번호 모달
function histOpenPwModal(){
  document.getElementById('histPwInput').value='';
  document.getElementById('histPwErr').textContent='';
  BazModal.open(document.getElementById('histPwModal'), {
    name:'histPw', sheet:'.pw-box', initialFocus:'#histPwInput'
  });
}
function histClosePwModal(){
  histPendingDraftApply=false;
  BazModal.close(document.getElementById('histPwModal'));
}
document.getElementById('histLock').addEventListener('click', ()=>{
  if(histEditing){ histExitEdit(); return; }
  histOpenPwModal();
});
async function histCheckPw(){
  const v=document.getElementById('histPwInput').value;
  if(!v) return;
  const okBtn=document.getElementById('histPwOk');
  const prev=okBtn.textContent;
  okBtn.disabled=true; okBtn.textContent='...';
  try{
    const r=await BazAuth.login(v);
    if(r.ok && r.level>=2){
      var pending=histPendingDraftApply; histPendingDraftApply=false;
      BazModal.close(document.getElementById('histPwModal'));
      histEnterEdit();
      if(pending) histApplyDraft();
    }else if(r.ok && r.level<2){
      // 일반 비번으로는 편집 불가 (관리자 전용)
      document.getElementById('histPwErr').textContent=t('histWrongPw');
    }else if(r.error==='auth_url_missing'){
      document.getElementById('histPwErr').textContent='인증 서버 미설정 (auth.js의 AUTH_URL 입력)';
    }else if(r.error==='network'){
      document.getElementById('histPwErr').textContent='네트워크 오류. 연결을 확인해 주세요.';
    }else{
      document.getElementById('histPwErr').textContent=t('histWrongPw');
    }
  }finally{
    okBtn.disabled=false; okBtn.textContent=prev;
  }
}
document.getElementById('histPwOk').addEventListener('click', histCheckPw);
document.getElementById('histPwCancel').addEventListener('click', histClosePwModal);

// ===== 초기화 =====
populateFilters();
updateStats();
applyLang();

// ── 구글시트 동기화 (백그라운드, 안전모드) ──
(function(){
  // [Core 통합] 병원정보DB·이슈이력을 handover(Core) 단일 백엔드로 일원화
  //   (기존 hospital_gas·hospital_issue_gas·visit_log 3개 백엔드 팬아웃 → handover 1개)
  var HANDOVER_CORE='https://script.google.com/macros/s/AKfycbwhf3fnxQPSM4cDLVEls0gtGgVGIpNOP83gMiBn-7JZmWciIsAlxyf4cYmPRiA2Ct0/exec';
  var HOSPITAL_DB_URL=HANDOVER_CORE+'?action=hospdbrich';   // was hospital_gas
  var ISSUE_HIST_URL =HANDOVER_CORE+'?action=issuehist';    // was hospital_issue_gas
  var VISIT_LOG_URL='';                                     // 방문로그 비활성화(사용 안 함) — 아래 동기화 skip

  var ISSUE_CACHE_KEY='bazIssueHistCache';
  var ISSUE_CACHE_TS='bazIssueHistCacheTs';
  var ISSUE_CACHE_REV='bazIssueHistCacheRev', ISSUE_DATA_REV='';
  var ISSUE_CACHE_TTL=5*60*1000; // 5분

  // 시트 배열 변경으로 체크박스 값(true/false)이 유형·현상 자리에 섞여 오는 것 방어:
  // 불리언/'true'/'false' 값 필드는 버리고 나머지만 사용
  function cleanIssueRec(r){
    var out={};
    Object.keys(r||{}).forEach(function(k){
      var v=r[k];
      if(typeof v==='boolean') return;
      var s=String(v==null?'':v).trim();
      if(!s || /^(true|false)$/i.test(s)) return;
      out[k]=v;
    });
    return out;
  }

  // 시트 이슈이력을 HISTORY에 반영 (서버가 진실)
  function applyIssueHist(data, revs){
    if(!data || typeof data!=='object') return false;
    var names=Object.keys(data);
    if(!names.length) return false;
    names.forEach(function(name){
      if(!Array.isArray(data[name])) return;
      data[name]=data[name].map(cleanIssueRec);
      /* 시트가 전 기간(2025~) 이력을 제공하므로 서버 응답을 그대로 사용한다.
         ※ 예전처럼 기존 HISTORY의 2025년을 보존해 합치면, 캐시 적용 후
            네트워크 응답이 다시 적용될 때 2025 이력이 중복 누적된다. */
      var combined=data[name].slice();
      combined.sort(function(a,b){ return (b.d||'').localeCompare(a.d||''); });
      HISTORY[name]=combined;
    });
    /* [수정] 로컬 편집본 재적용을 없앤다.
       예전에는 여기서 baz_hosp_history 를 매번 다시 덮어써, 서버(=다른 관리자)가
       고친 최신 이력이 이 PC 에서만 영영 보이지 않았다. 편집은 이제 서버에 저장되고,
       아직 못 보낸 편집은 '초안'으로만 남아 이력 창에서 사용자 확인 후 반영된다. */
    if(revs && typeof revs==='object'){
      Object.keys(revs).forEach(function(n){
        var r=revs[n];
        histServerRev[n]=(r && typeof r.rev==='number')?r.rev:(Number(r)||0);
        histServerSourceRev[n]=(r && typeof r.sourceRev==='number')?r.sourceRev:0;
      });
    }
    return true;
  }

  function refreshHistViews(){
    try{ if(typeof bazClearVerMemo==='function') bazClearVerMemo(); }catch(e){}   // HISTORY 변경 → 버전 캐시 무효화
    try{ if(typeof render==='function') render(); }catch(e){}
    try{ if(typeof renderRecent==='function' && curTab==='recent') renderRecent(); }catch(e){}
    try{
      var modal=document.getElementById('histModal');
      if(modal && modal.classList.contains('show') && typeof renderHistBody==='function'){
        renderHistBody();
      }
    }catch(e){}
  }

  function cacheFresh(tsKey, ttl){
    try{ var ts=parseInt(localStorage.getItem(tsKey)||'0',10); return !!ts && (Date.now()-ts)<ttl; }
    catch(e){ return false; }
  }
  /* 서버 응답 채택 — 캐시 기록 + 화면 반영을 한곳에서 (bootstrap·개별 요청 공용) */
  function acceptIssueHist(data, revs, dataRev){
    ISSUE_DATA_REV=dataRev||ISSUE_DATA_REV;
    try{
      localStorage.setItem(ISSUE_CACHE_KEY, JSON.stringify({data:data, revs:revs||null}));
      localStorage.setItem(ISSUE_CACHE_TS, String(Date.now()));
      if(ISSUE_DATA_REV) localStorage.setItem(ISSUE_CACHE_REV, ISSUE_DATA_REV);
    }catch(e){}
    if(applyIssueHist(data, revs)){
      refreshHistViews();
      console.log('[이슈이력] '+Object.keys(data).length+'개 병원 동기화');
      return true;
    }
    return false;
  }
  function applyIssueCache(){
    try{
      var raw=localStorage.getItem(ISSUE_CACHE_KEY);
      if(!raw) return false;
      ISSUE_DATA_REV=localStorage.getItem(ISSUE_CACHE_REV)||'';
      var o=JSON.parse(raw);
      /* 구버전 캐시는 data 자체가 최상위였다 — 형태를 보고 갈라 읽는다 */
      var data=(o && o.data && typeof o.data==='object') ? o.data : o;
      var revs=(o && o.revs) ? o.revs : null;
      if(applyIssueHist(data, revs)){ refreshHistViews(); console.log('[이슈이력] 캐시 적용'); return true; }
    }catch(e){ console.warn('[이슈이력] 캐시 읽기 오류(무시):',e); }
    return false;
  }
  function syncIssueHist(force){
    if(ISSUE_HIST_URL.indexOf('여기에_')===0) return Promise.resolve(true);
    if(!force && cacheFresh(ISSUE_CACHE_TS, ISSUE_CACHE_TTL)){
      console.log('[이슈이력] 캐시 신선 — 동기화 생략'); return Promise.resolve(true);
    }
    var q=force?'&force=1':(ISSUE_DATA_REV?'&rev='+encodeURIComponent(ISSUE_DATA_REV):'');
    return bazGet(ISSUE_HIST_URL+q)
      .then(function(d){
        if(d&&d.nochange){
          ISSUE_DATA_REV=d.rev||ISSUE_DATA_REV;
          try{ localStorage.setItem(ISSUE_CACHE_TS,String(Date.now())); }catch(e){}
          return true;
        }
        if(!d.success || !d.data){ console.warn('[이슈이력] 응답 형식 이상:',d); return false; }
        acceptIssueHist(d.data, d.revs, d.rev); return true;
      })
      .catch(function(e){ console.warn('[이슈이력] 읽기 실패:',e); return false; });
  }
  /* 이력 편집 저장 직후 최신본을 다시 받기 위한 진입점 */
  window.bazRefreshIssueHist=function(){ syncIssueHist(true); };

  // 날짜를 yyyy-MM-dd로 정규화 (깨진 형식 방어)
  function cleanDate(v){
    if(!v) return '';
    var s=String(v).trim();
    var m=s.match(/(\d{4})[-.\/](\d{1,2})[-.\/](\d{1,2})/);
    if(m) return m[1]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[3]).slice(-2);
    var d=new Date(s);
    if(!isNaN(d)) return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
    return '';
  }

  /* [정합성] 예전 applyDB 는 `if(r.sales) h.sa=r.sales;` 식 truthy 검사라
     시트에서 담당자·주소·N-CARE·상태를 지워도 브라우저 메모리에는 옛 값이 남았다.
     이제 js/baz-hospital-data.js 가 "필드 존재" 와 "값이 비었는가" 를 나눠 처리한다:
       · 응답에 필드가 있으면 빈 문자열도 권위 있는 값 → 지운 값은 화면에서도 지워진다
       · 응답에 없는 필드(구버전 백엔드)는 손대지 않는다
       · 좌표는 유효범위 밖이면 null · 병원명 중복은 접는다
       · 스냅샷에서 사라진 병원은 메모리에서도 제거(prune) */
  function applyDB(rows){
    var st=BazHospitalData.mergeRows(HOSPITALS, rows, {prune:true});
    if(st.duplicates) console.warn('[병원정보DB] 중복 병원명 '+st.duplicates+'건 정리');
    if(st.invalidCoords) console.warn('[병원정보DB] 좌표 이상값 '+st.invalidCoords+'건 무시');
    if(st.removed) console.log('[병원정보DB] 시트에서 사라진 병원 '+st.removed+'곳 제거');
    if(st.cleared) console.log('[병원정보DB] 빈 값으로 갱신된 병원 '+st.cleared+'곳');
    return st.changed;
  }

  // ── 병원정보DB 동기화 (5분 캐시) ──
  var HDB_CACHE_KEY='bazHospDBCache';
  var HDB_CACHE_TS='bazHospDBCacheTs';
  var HDB_CACHE_REV='bazHospDBCacheRev', HDB_DATA_REV='';
  var HDB_CACHE_TTL=5*60*1000; // 5분

  function applyHospDB(rows){
    if(applyDB(rows)){
      populateFilters();
      updateStats(); render();
      if(curTab==='dash') renderDash();
      // DB로 주소가 채워졌을 수 있으니 좌표 없는 병원 지오코딩
      try{ if(typeof bazGeocodeRefresh==='function') bazGeocodeRefresh(); }catch(e){}
      return true;
    }
    return false;
  }
  function acceptHospDB(rows, dataRev){
    if(!rows || !rows.length) return false;
    HDB_DATA_REV=dataRev||HDB_DATA_REV;
    try{
      localStorage.setItem(HDB_CACHE_KEY, JSON.stringify(rows));
      localStorage.setItem(HDB_CACHE_TS, String(Date.now()));
      if(HDB_DATA_REV) localStorage.setItem(HDB_CACHE_REV, HDB_DATA_REV);
    }catch(e){}
    try{
      if(applyHospDB(rows)){ console.log('[병원정보DB] '+rows.length+'건 동기화'); return true; }
    }catch(e){ console.warn('[병원정보DB] 적용 오류(무시):',e); }
    return false;
  }
  function applyHospDBCache(){
    try{
      var cached=localStorage.getItem(HDB_CACHE_KEY);
      if(!cached) return false;
      HDB_DATA_REV=localStorage.getItem(HDB_CACHE_REV)||'';
      var arr=JSON.parse(cached);
      if(arr && arr.length && applyHospDB(arr)){
        console.log('[병원정보DB] 캐시 적용 '+arr.length+'건');
        return true;
      }
    }catch(e){ console.warn('[병원정보DB] 캐시 읽기 오류(무시):',e); }
    return false;
  }

  function syncHospDB(force){
    if(!force && cacheFresh(HDB_CACHE_TS, HDB_CACHE_TTL)){
      console.log('[병원정보DB] 캐시 신선 — 동기화 생략'); return Promise.resolve(true);
    }
    var q=force?'&force=1':(HDB_DATA_REV?'&rev='+encodeURIComponent(HDB_DATA_REV):'');
    return bazGet(HOSPITAL_DB_URL+q)
      .then(function(d){
        if(d&&d.nochange){
          HDB_DATA_REV=d.rev||HDB_DATA_REV;
          try{ localStorage.setItem(HDB_CACHE_TS,String(Date.now())); }catch(e){}
          return true;
        }
        if(!d.success||!d.data||!d.data.length) return false;
        acceptHospDB(d.data,d.rev); return true;
      })
      .catch(function(e){console.warn('[병원정보DB] 읽기 실패:',e); return false;});
  }
  // 칩 필터(전체/N-CARE/점검필요) 활성화 시 재동기화 트리거용으로 노출 (5분 캐시 준수)
  window.refreshHospDB=function(){ syncHospDB(false); };

  /* ── 부팅: bootstrap 1콜 (hospdbrich + issuehist) ────────────────────────
     예전에는 페이지가 뜨자마자 병원정보DB·이슈이력을 각각 GET 했다. GAS 콜드스타트에서
     두 요청이 각자 인스턴스를 깨우느라 첫 화면이 늦었다. handover_gas 에 이미 있는
     action=bootstrap 으로 한 번에 받는다.
     ★ 구버전 백엔드(미재배포)는 bootstrap 을 모르거나 빈 응답을 준다 →
       hospdb/issuehist 중 못 받은 쪽만 기존 개별 요청으로 안전하게 폴백한다. */
  var BAZ_BOOT_IN_FLIGHT=null, BAZ_BOOT_FORCE=false;
  function bazBootSync(force){
    applyHospDBCache();
    applyIssueCache();
    if(BAZ_BOOT_IN_FLIGHT){
      if(force && !BAZ_BOOT_FORCE) return BAZ_BOOT_IN_FLIGHT.then(function(){ return bazBootSync(true); });
      return BAZ_BOOT_IN_FLIGHT;
    }
    var needH=force || !cacheFresh(HDB_CACHE_TS, HDB_CACHE_TTL);
    var needI=force || !cacheFresh(ISSUE_CACHE_TS, ISSUE_CACHE_TTL);
    if(!needH && !needI) return Promise.resolve(true);
    if(!needH) return syncIssueHist(force);   // 한쪽만 필요하면 1콜이 이득이 없다
    if(!needI) return syncHospDB(force);
    BAZ_BOOT_FORCE=!!force;
    var bq=force?'&force=1':'';
    if(!force && HDB_DATA_REV) bq+='&hrev='+encodeURIComponent(HDB_DATA_REV);
    if(!force && ISSUE_DATA_REV) bq+='&irev='+encodeURIComponent(ISSUE_DATA_REV);
    BAZ_BOOT_IN_FLIGHT=bazGetRetry(HANDOVER_CORE+'?action=bootstrap'+bq,2)
      .then(function(d){
        if(d && d.success===false){
          throw {kind:/unauthorized|토큰|로그인/i.test(String(d.error||''))?'auth':'server'};
        }
        var hd=d && d.hospdb, ih=d && d.issuehist;
        var okH=!!(hd && hd.success && (hd.nochange || (Array.isArray(hd.data) && hd.data.length)));
        var okI=!!(ih && ih.success && (ih.nochange || ih.data));
        if(!okH && !okI) throw {kind:'bootstrap-unsupported'};
        if(okH && hd.nochange){ HDB_DATA_REV=hd.rev||HDB_DATA_REV; try{ localStorage.setItem(HDB_CACHE_TS,String(Date.now())); }catch(e){} }
        else if(okH) acceptHospDB(hd.data,hd.rev);
        if(okI && ih.nochange){ ISSUE_DATA_REV=ih.rev||ISSUE_DATA_REV; try{ localStorage.setItem(ISSUE_CACHE_TS,String(Date.now())); }catch(e){} }
        else if(okI) acceptIssueHist(ih.data, ih.revs, ih.rev);
        var missing=[];
        if(!okH) missing.push(syncHospDB(true));
        if(!okI) missing.push(syncIssueHist(true));
        console.log('[부트스트랩] 1콜 동기화'+(okH?' · 병원정보DB':'')+(okI?' · 이슈이력':''));
        return Promise.all(missing).then(function(v){ return v.every(function(x){return x!==false;}); });
      })
      .catch(function(e){
        if(e && e.kind==='bootstrap-unsupported'){
          console.warn('[부트스트랩] 구버전 — 개별 요청으로 폴백');
          return Promise.all([syncHospDB(true),syncIssueHist(true)])
            .then(function(v){ return v.every(function(x){return x!==false;}); });
        }
        /* 네트워크·타임아웃·인증 장애에서는 2개 요청을 추가해 부하를 증폭시키지 않는다. */
        console.warn('[부트스트랩] 동기화 실패 — 캐시 유지:', (e&&e.kind)||e);
        return false;
      });
    BAZ_BOOT_IN_FLIGHT=BAZ_BOOT_IN_FLIGHT.then(function(v){ BAZ_BOOT_IN_FLIGHT=null; BAZ_BOOT_FORCE=false; return v; },
      function(){ BAZ_BOOT_IN_FLIGHT=null; BAZ_BOOT_FORCE=false; return false; });
    return BAZ_BOOT_IN_FLIGHT;
  }
  window.bazBootReady=bazBootSync(false);

  // ── 방문로그 동기화 (5분 캐시) ──
  var VLOG_CACHE_KEY='bazVisitLogCache';
  var VLOG_CACHE_TS='bazVisitLogCacheTs';
  var VLOG_CACHE_TTL=5*60*1000;

  function applyVisits(visits){
    if(!visits) return false;
    var updated=false;
    HOSPITALS.forEach(function(h){
      var v=visits[h.n];
      if(v&&v.date&&cleanDate(v.date)>=(h.li||'')){ h.li=cleanDate(v.date); updated=true; }
    });
    if(updated){ updateStats(); render(); }
    return updated;
  }

  function syncVisitLog(){
    if(!VISIT_LOG_URL) return Promise.resolve(true);   // 방문로그 비활성화 — 동기화 skip
    try{
      var cached=localStorage.getItem(VLOG_CACHE_KEY);
      var ts=parseInt(localStorage.getItem(VLOG_CACHE_TS)||'0',10);
      if(cached){ applyVisits(JSON.parse(cached)); }
      if(cached && (Date.now()-ts)<VLOG_CACHE_TTL){
        console.log('[방문로그] 캐시 신선 — 동기화 생략');
        return Promise.resolve(true);
      }
    }catch(e){ console.warn('[방문로그] 캐시 읽기 오류(무시):',e); }

    return bazGet(VISIT_LOG_URL)
      .then(function(d){
        if(!d.ok||!d.visits) return false;
        try{
          localStorage.setItem(VLOG_CACHE_KEY, JSON.stringify(d.visits));
          localStorage.setItem(VLOG_CACHE_TS, String(Date.now()));
        }catch(e){}
        try{ applyVisits(d.visits); }
        catch(e){ console.warn('[방문로그] 적용 오류(무시):',e); }
        return true;
      })
      .catch(function(e){console.warn('[방문로그] 읽기 실패:',e); return false;});
  }
  syncVisitLog();

  // ── 수동 새로고침: 5분 캐시를 무시하고 모든 데이터를 강제 재동기화 ──
  window.bazRefreshAll=function(done){
    try{
      localStorage.removeItem(ISSUE_CACHE_TS);
      localStorage.removeItem(ISSUE_CACHE_REV);
      localStorage.removeItem(HDB_CACHE_TS);
      localStorage.removeItem(HDB_CACHE_REV);
      localStorage.removeItem(VLOG_CACHE_TS);
      localStorage.removeItem('baz_pc_recent_ts');
    }catch(e){}
    try{ pcRecentTs=0; }catch(e){}   // 신선도 판정은 메모리가 진실 — 강제 새로고침에 함께 초기화
    try{ if(typeof bazGeocodeRefresh==='function') bazGeocodeRefresh(); }catch(e){}
    var bootP, visitP, recentP;
    try{ bootP=bazBootSync(true); }catch(e){ bootP=Promise.resolve(false); }
    try{ visitP=syncVisitLog(); }catch(e){ visitP=Promise.resolve(false); }
    try{
      recentP=Promise.resolve(bootP).then(function(){
        return (typeof pcLoadRecent==='function')?pcLoadRecent(null,true):true;
      });
    }
    catch(e){ recentP=Promise.resolve(false); }
    return Promise.all([bootP,visitP,recentP]).then(function(v){
      try{ if(typeof pcRenderRecentCard==='function') pcRenderRecentCard(); }catch(e){}
      try{ if(typeof pcRenderRouteCard==='function') pcRenderRouteCard(); }catch(e){}
      try{ if(typeof pcShowMap==='function' && typeof pcRightMode!=='undefined' && pcRightMode!=='detail') pcShowMap(pcList); }catch(e){}
      var ok=v.every(function(x){return x!==false;});
      if(typeof done==='function') done(ok);
      return ok;
    },function(){
      if(typeof done==='function') done(false);
      return false;
    });
  };
})();

// ===== Window 전용: 카드/표 + 지도/상세 2-pane =====
var pcListView = localStorage.getItem('baz_pc_listview') || 'cards'; // 'cards' | 'table'

// 삭제 무시목록(tombstone): 삭제한 병원이 서버 왕복(GAS 콜드스타트/POST 지연) 동안 폴링으로

// 다른 사용자가 오늘 새로 등록한 같은 병원까지 계속 지워버리므로 짧게 만료시킨다.
// 날짜(Asia/Seoul)가 바뀌면 폐기 · PC_GONE_TTL 경과 시 자동 만료.
var PC_GONE_TTL=6e5;      // 10분 — 서버 왕복을 덮기에 충분한 최소 유예(기존 24h → 사고 원인)
var PC_GONE_RESEND=6e4;   // 60초 — 이 시간 안에만 서버에 삭제를 재요청(POST 유실 보정)
var pcGone=(function(){
  var raw={}; try{ raw=JSON.parse(localStorage.getItem('baz_pc_gone')||'{}')||{}; }catch(e){ raw={}; }
  var out={};   // 구버전(숫자=24h·날짜 없음) 표식은 그대로 두면 오늘 일정을 지우므로 폐기
  Object.keys(raw).forEach(function(h){ var v=raw[h]; if(v&&typeof v==='object'&&v.t) out[h]=v; });
  return out;
})();
function pcSaveGone(){ try{ localStorage.setItem('baz_pc_gone', JSON.stringify(pcGone)); }catch(e){} }
function pcGoneAdd(hosp){ if(hosp){ pcGone[hosp]={t:Date.now(), d:pcTodayStr()}; pcSaveGone(); } }
function pcGoneDel(hosp){ if(hosp && pcGone[hosp]!=null){ delete pcGone[hosp]; pcSaveGone(); } }
function pcGoneEntry(hosp){
  var v=pcGone[hosp]; if(!v) return null;
  if(v.d!==pcTodayStr() || Date.now()-v.t>PC_GONE_TTL){ delete pcGone[hosp]; pcSaveGone(); return null; }
  return v;
}
function pcGoneHas(hosp){ return !!pcGoneEntry(hosp); }
// 최근 추가 보호(anti-tombstone): 방금 로컬에서 추가/설정한 병원을, 서버 왕복(GAS 콜드스타트)
// 지연 동안 폴링이 지우지 않도록 잠시 보존한다. 서버 큐에 반영이 확인되면 즉시 해제, 30초 후 자동 만료.
// (새로고침에도 유지되도록 localStorage 저장 → 저장 직후 새로고침해도 낙관적 추가가 유실되지 않음.)

function pcSaveFresh(){ try{ localStorage.setItem('baz_pc_fresh', JSON.stringify(pcFresh)); }catch(e){} }
function pcFreshMark(hosp){ if(hosp){ pcFresh[hosp]=Date.now(); pcSaveFresh(); } }
function pcFreshDel(hosp){ if(hosp && pcFresh[hosp]!=null){ delete pcFresh[hosp]; pcSaveFresh(); } }
function pcFreshHas(hosp){ var ts=pcFresh[hosp]; if(ts==null) return false; if(Date.now()-ts>30000){ delete pcFresh[hosp]; pcSaveFresh(); return false; } return true; }
// 서버 큐에서 tombstone된 병원 제거 + 서버에 삭제를 재요청할 목록 반환.
// 재요청은 방금(PC_GONE_RESEND 이내) 삭제한 건에만 한정한다 — 오래된 표식으로 서버를 지우면
// 다른 사용자가 오늘 다시 등록한 일정까지 폴링마다 삭제된다.
function pcGoneFilter(queues){
  var removed=[], out={};
  Object.keys(queues||{}).forEach(function(f){
    var arr=(queues[f]||[]).filter(function(x){
      if(!x||!x.h) return true;
      var g=pcGoneEntry(x.h); if(!g) return true;
      if(Date.now()-g.t<=PC_GONE_RESEND) removed.push({fse:f,hosp:x.h});
      return false;
    });
    if(arr.length) out[f]=arr;
  });
  return {q:out, removed:removed};
}

// 일일 자동 초기화: 날짜(Asia/Seoul)가 바뀌면 어제 일정의 '로컬 캐시'만 비우고 서버를 다시 받아온다.
// 서버(handover_gas.gs progRead_)가 같은 Asia/Seoul 기준으로 자체 초기화하므로 클라이언트는

// 이 검사를 통과하면서 q_clear를 쏴, 그날 이미 등록된 다른 사람의 현장 일정까지 통째로
// 지워버리던 사고(현장 일정 카드 전체 초기화)를 막는다. 어제 병원 tombstone도 남기지 않는다
// (오늘 다시 방문하는 병원이 폴링마다 서버에서 삭제되던 원인).

/* 파싱 시점 실행 — 여기서 예외가 새면 이후 스크립트 전체가 정의되지 않아 화면이 통째로
   먹통이 된다. 일일 초기화 확인 실패는 화면을 못 쓰게 만들 만한 일이 아니므로 반드시 삼킨다. */
try{ pcDailyResetCheck(); }catch(e){ try{ console.warn('[현장일정] 일일 초기화 확인 실패(무시):', e); }catch(_){} }
function pcqEnsure(fse){ if(!pcQueues[fse]) pcQueues[fse]=[]; return pcQueues[fse]; }
function pcqFind(q,hosp){ for(var i=0;i<q.length;i++){ if(q[i].h===hosp) return i; } return -1; }
function pcqRemoveAll(hosp){ Object.keys(pcQueues).forEach(function(f){ pcQueues[f]=pcQueues[f].filter(function(x){return x.h!==hosp;}); }); }
function pcqOf(hosp){ var r=''; Object.keys(pcQueues).forEach(function(f){ if(pcqFind(pcQueues[f],hosp)>=0) r=f; }); return r; }
// 큐 → prog/done 파생 (wait 있고 prog 없으면 맨 앞 wait 자동 승격)
function pcDeriveProg(){
  var prog={}, seen={};
  Object.keys(pcQueues).forEach(function(fse){
    // 중복 병원 행 제거(같은 병원이 두 번 들어가는 유령 방지) + 잘못된 항목 정리
    var q=(pcQueues[fse]||[]).filter(function(x){ if(!x||!x.h||seen[x.h]) return false; seen[x.h]=1; return true; });
    pcQueues[fse]=q;
    if(!q.length){ delete pcQueues[fse]; return; }
    if(!q.some(function(x){return x.s==='prog';})){
      for(var i=0;i<q.length;i++){ if(q[i].s==='wait'){ q[i].s='prog'; break; } }
    }
    q.forEach(function(it){ if(it.s==='prog') prog[it.h]=fse; if(it.s==='done') pcDone[it.h]=1; });
  });
  pcInProgress=prog; pcSaveProg(); pcSaveDone(); pcSaveQueues();
}
// 큐 op 적용(로컬 낙관적) + 서버 반영 + 재렌더. 서버 progSave_와 동일 의미.
function pcQueueApply(op, fse, hosp, to){
  fse=(fse||'').trim(); hosp=(hosp||'').trim();
  var extra=null;   // 서버 정합용 보조 op(레거시 clear 등)
  if(op==='q_add' && fse && hosp){ pcGoneDel(hosp); pcFreshMark(hosp); pcqRemoveAll(hosp); pcqEnsure(fse).push({h:hosp,s:'wait'}); if(pcIsDone(hosp)) delete pcDone[hosp]; }
  else if(op==='q_remove' && hosp){ pcqRemoveAll(hosp); pcGoneAdd(hosp); pcFreshDel(hosp); if(pcIsProg(hosp)) delete pcInProgress[hosp]; if(pcIsDone(hosp)){ delete pcDone[hosp]; } extra={op:'clear', hosp:hosp}; }
  else if(op==='q_move' && fse && hosp){ var qm=pcqEnsure(fse),im=pcqFind(qm,hosp); if(im>=0){ var t=Math.max(0,Math.min(qm.length-1,Number(to))); var it=qm.splice(im,1)[0]; qm.splice(t,0,it); } }
  else if(op==='q_clear' && fse){ (pcQueues[fse]||[]).forEach(function(x){ if(x&&x.h){ pcGoneAdd(x.h); pcFreshDel(x.h); if(pcIsProg(x.h)) delete pcInProgress[x.h]; } }); delete pcQueues[fse]; }
  else if((op==='q_done'||op==='done') && hosp){ var f2=fse||pcqOf(hosp); if(f2){ var qd=pcqEnsure(f2),idd=pcqFind(qd,hosp); if(idd>=0) qd[idd].s='done'; } pcDone[hosp]=1; }
  else if(op==='set' && hosp){ pcGoneDel(hosp); pcFreshMark(hosp); pcqRemoveAll(hosp); var qs=pcqEnsure(fse); qs.forEach(function(x){ if(x.s==='prog') x.s='wait'; }); qs.unshift({h:hosp,s:'prog'}); if(pcIsDone(hosp)) delete pcDone[hosp]; }
  else if(op==='clear' && hosp){ pcqRemoveAll(hosp); pcGoneAdd(hosp); pcFreshDel(hosp); }
  else { return; }
  pcDeriveProg();
  var spec={op:op, hosp:hosp, fse:fse};
  if(op==='q_move') spec.to=Number(to);
  pcProgOp(spec);
  if(extra) pcProgOp(extra);
  pcRefreshProgViews(hosp, true);
}
// 레거시 진입점(상세/카드/표) → 큐 op로 라우팅
function pcSetProg(hosp, fse){ pcQueueApply('set', fse, hosp); }
function pcClearProg(hosp){ pcQueueApply('clear', '', hosp); }
function pcMarkDone(hosp){ if(!hosp) return; pcQueueApply('done', '', hosp); }
window.pcMarkDone=pcMarkDone;
// Handover 자동 완료: 진행중 병원이 오늘 handover(오늘 완료)에 기록되면 자동 완료 →
// 다음 병원 자동 진행중 승격. 담당자(fse)+병원 일치 우선(기록에 담당자 없으면 병원만 일치).
// 연쇄로 여러 건이 한 번에 완료되는 경우가 흔하므로 배치로 감싼다
// → POST 왕복 1회 + 재렌더 1회 (기존: 완료 1건마다 POST·전체 재렌더)
function pcAutoAdvanceFromHandover(){
  if(!pcQueues || typeof pcTodayList!=='function') return;
  var today=pcTodayList(); if(!today.length) return;
  var byHF={}, byH={};
  today.forEach(function(r){ var h=normalize(r.hosp); if(!h) return; var f=normalize(r.fse); if(f) byHF[h+'|'+f]=1; else byH[h]=1; });
  function completed(hosp, fse){ var h=normalize(hosp); return !!(byHF[h+'|'+normalize(fse)] || byH[h]); }
  var advanced=false;
  pcBatchRun(function(){
    var guard=0;
    while(guard++<60){
      var found=null;
      var fses=Object.keys(pcQueues);
      for(var i=0;i<fses.length && !found;i++){
        var fse=fses[i], q=pcQueues[fse]||[];
        for(var j=0;j<q.length;j++){ if(q[j].s==='prog' && completed(q[j].h, fse)){ found={fse:fse, h:q[j].h}; break; } }
      }
      if(!found) break;
      pcQueueApply('q_done', found.fse, found.h);   // 자동 완료 + 다음 승격 + 서버 반영
      advanced=true;
    }
  });
  return advanced;
}

// ── 서버 동기화 (HANDOVER_URL, 사용자 간 연동) ──
// [안정성] hold는 4초. 예전 8초는 조작 직후 폴링 간격(7초)보다 길어, 쓰기가 계속 실패하는 동안
// (pcAutoAdvanceFromHandover가 매 폴링마다 재전송) hold가 항상 미래에 있게 되어
// pcProgPull이 한 번도 실행되지 않는 자기지속 교착이 생겼다. 폴링 간격보다 짧게 둔다.
var pcProgHold=0, pcProgHoldAt=0;   // 로컬 변경 직후 폴링이 되돌리지 않도록 보호 + 설정 시각(안전밸브용)
var PC_HOLD_MS=4000, PC_HOLD_MAX=30000;
var pcProgRev=0;     // 서버 리비전 — 폴링에 실어 보내면 변경 없을 때 큐 전체를 받지 않는다
var pcProgInFlight=null;  // 느린 GAS 응답 중 다음 폴링·포커스 요청이 겹치지 않게 공유
var pcLastAct=0;     // 마지막 조작 시각 — 직후에는 폴링을 촘촘히(공동 편집 반응 개선)
var pcOpBatch=null;  // 배치 수집 중이면 op 배열 — 연쇄 변경을 POST 1회로 묶는다
var pcRenderHold=0, pcRenderPending=null;   // >0이면 재렌더를 미뤘다가 배치 끝에 1회로 합친다

// 요청자(로그 시트의 '요청자' 열) — 누가 지웠는지 추적 가능하게
function pcWho(){ try{ return (window.BazAuth&&BazAuth.name&&BazAuth.name())||''; }catch(e){ return ''; } }
// op 1건: 배치 중이면 쌓고, 아니면 즉시 전송
function pcProgOp(spec){
  if(pcOpBatch){ pcOpBatch.push(spec); return; }
  pcProgSend(Object.assign({action:'progress_save', who:pcWho()}, spec));
}
// fn 안에서 일어나는 모든 큐 변경을 한 번의 POST + 한 번의 재렌더로 묶는다
function pcBatchRun(fn){
  if(pcOpBatch){ return fn(); }               // 이미 배치 중이면 그대로 합류
  pcOpBatch=[]; pcRenderHold++;
  try{ fn(); }
  finally{
    var ops=pcOpBatch; pcOpBatch=null;
    pcRenderHold--;
    if(ops.length===1) pcProgSend(Object.assign({action:'progress_save', who:pcWho()}, ops[0]));
    else if(ops.length>1) pcProgSend({action:'progress_save', ops:ops, who:pcWho()});
    var pend=pcRenderPending; pcRenderPending=null;
    if(pend) pcRefreshProgViews(pend.hosp, pend.silent);
  }
}
// 서버가 확정한 상태(POST 응답·GET 응답 공용)를 로컬에 반영. 반영했으면 true.
function pcProgAccept(d){
  if(!d || d.success!==true) return false;
  // 백엔드(v2.5+)가 queues를 줄 때만 서버 상태로 동기화. 구버전(미재배포)은
  // queues 필드가 없으므로 로컬 큐가 진실 — 서버 prog/done으로 덮어쓰지 않는다
  // (일정이 폴링에 사라지거나 유령처럼 되살아나는 문제 방지).
  var hasQ=Object.prototype.hasOwnProperty.call(d,'queues') && d.queues && typeof d.queues==='object';
  if(!hasQ) return false;
  if(typeof d.rev==='number'){
    if(d.rev < pcProgRev) return false;        // 늦게 도착한 옛 응답은 무시(순서 뒤바뀜 방지)
    pcProgRev=d.rev;
  }
  // tombstone: 삭제한 병원이 서버에 남아 되살아나면 걸러내고 서버에 재삭제 요청
  var f=pcGoneFilter(d.queues);
  var nq=f.q;
  if(f.removed.length){
    var ops=[];
    f.removed.forEach(function(r){ ops.push({op:'q_remove',fse:r.fse,hosp:r.hosp}); ops.push({op:'clear',hosp:r.hosp}); });
    pcProgSend({action:'progress_save', ops:ops, who:pcWho()});
  }
  // 최근 추가 보호: 방금 로컬에서 추가한 병원이 서버 왕복(콜드스타트) 지연으로 서버 큐에
  // 아직 없을 때, 폴링이 그 추가를 지우지 않도록 다시 넣어준다. 서버에 이미 있으면 표식 해제.
  // (동시 편집 시 상대의 변경을 반영하면서도 내 최신 추가가 유실되지 않게 함.)
  Object.keys(pcQueues).forEach(function(fq){
    (pcQueues[fq]||[]).forEach(function(x){
      if(!x||!x.h||!pcFreshHas(x.h)) return;
      var inServer=false;
      Object.keys(nq).forEach(function(g){ if(nq[g]&&pcqFind(nq[g],x.h)>=0) inServer=true; });
      if(inServer){ pcFreshDel(x.h); }
      else { if(!nq[fq]) nq[fq]=[]; nq[fq].push({h:x.h, s:'wait'}); }
    });
  });
  var nd=(d.done&&typeof d.done==='object')?d.done:{};
  // 큐가 진실 → 큐에서 prog 파생. done은 tombstone 아닌 항목만 병합 유지.
  if(JSON.stringify(nq)===JSON.stringify(pcQueues)){
    var changed=false; Object.keys(nd).forEach(function(h){ if(!pcGoneHas(h)&&!pcDone[h]){ pcDone[h]=1; changed=true; } });
    if(!changed) return false;
  }
  pcQueues=nq; pcSaveQueues();
  pcDeriveProg();
  Object.keys(nd).forEach(function(h){ if(!pcGoneHas(h)) pcDone[h]=1; });
  pcSaveDone();
  try{ pcAutoAdvanceFromHandover(); }catch(e){}   // handover 기록 반영 자동 승격
  pcRefreshProgViews(null, true);
  return true;
}
function pcProgSend(payload){
  if(!HANDOVER_URL) return;
  pcProgHold=Date.now()+PC_HOLD_MS; pcProgHoldAt=Date.now();
  pcLastAct=Date.now();
  /* [보안] 서버 쓰기 인증 토큰 동봉 */
  try{ if(window.BazAuth&&BazAuth.token) payload=Object.assign({},payload,{token:BazAuth.token()}); }catch(e){}
  var body=JSON.stringify(payload);
  /* POST 응답에 서버가 확정한 큐가 들어 있다 — 이를 바로 반영하면 다음 폴링(최대 25초)을
     기다리지 않고 왕복 1회로 서버 상태가 확정된다. 응답을 못 읽으면(no-cors 폴백·네트워크
     오류) 로컬이 서버와 어긋났을 수 있으므로 rev를 지워 다음 폴링이 전체를 다시 받게 한다. */
  function fallback(){ pcProgRev=0; try{ fetch(HANDOVER_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:body}); }catch(e){} }
  /* [중요] 재전송(fallback)은 "요청이 서버에 닿지 못했을 때"만 해야 한다.
     예전에는 .then(...).then(...).catch(fallback) 구조라, 서버 쓰기가 이미 성공했는데
     응답 처리(pcProgAccept) 안에서 예외가 나도 catch에 걸려 같은 op를 한 번 더 POST했다.
     q_done 같은 op가 두 번 적용되면 큐가 한 칸 더 진행돼 "유령 진행중/건너뜀"이 생긴다.
     → 전송 실패는 fetch/파싱 단계에서만 판정하고, 응답 처리 예외는 여기서 삼킨다. */
  try{
    fetch(HANDOVER_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:body})
      .then(function(r){ return r.text(); })
      .then(function(txt){
        if(/^\s*</.test(txt)) throw {kind:'html'};     // 데이터 대신 로그인/권한 HTML
        return JSON.parse(txt);
      })
      .then(function(d){
        /* 여기부터는 "서버에 닿았다"가 확정 — 무슨 일이 나도 재전송하지 않는다 */
        try{
          if(!d || d.success!==true){
            pcProgRev=0;
            if(d && /unauthorized|토큰|로그인/i.test(String(d.error||''))) bazAuthFail();
            return;
          }
          bazAuthOk();
          var hs=[]; if(payload.hosp) hs.push(payload.hosp);
          (payload.ops||[]).forEach(function(o){ if(o&&o.hosp) hs.push(o.hosp); });
          hs.forEach(pcFreshDel);          // 서버 반영 확인 → 보호 표식 해제
          pcProgHold=0;                    // 서버가 확정 → 폴링을 더 막아둘 이유가 없다
          pcProgAccept(d);
        }catch(e){ pcProgRev=0; console.warn('[동기화] 쓰기 응답 처리 오류(재전송 안 함):',e); }
      })
      .catch(function(e){
        if(e && e.kind==='html'){ pcProgRev=0; fallback(); return; }   // GAS 콜드스타트·리다이렉트(일시적) — 쓰기가 서버에 닿지 못했으니 재전송, 만료 배너는 띄우지 않는다
        fallback();
      });
  }catch(e){ fallback(); }
}
function pcProgPull(){
  if(!HANDOVER_URL) return Promise.resolve(true);
  /* [안전밸브] hold가 비정상적으로 오래 유지되면(쓰기 연속 실패 등) 강제로 푼다. */
  if(pcProgHold && Date.now()-pcProgHoldAt > PC_HOLD_MAX){ pcProgHold=0; }
  if(Date.now()<pcProgHold) return Promise.resolve(true);
  if(pcProgInFlight) return pcProgInFlight;
  /* rev 동봉 → 변경이 없으면 서버가 {nochange:true}만 반환(큐 직렬화·전송·파싱 생략) */
  var url=HANDOVER_URL+'?action=progress'+(pcProgRev?('&rev='+pcProgRev):'');
  pcProgInFlight=bazGet(url)
    .then(function(d){
      pcPollFailN=0;                                    // 성공 → 백오프 해제
      if(!d || d.success!==true) return false;
      if(d.nochange===true){ if(typeof d.rev==='number') pcProgRev=d.rev; return true; }
      pcProgAccept(d); return true;
    })
    .catch(function(e){ pcPollFailN++; console.warn('[동기화] progress 실패:', (e&&e.kind)||e); return false; });
  pcProgInFlight=pcProgInFlight.then(function(v){ pcProgInFlight=null; return v; },
    function(){ pcProgInFlight=null; pcPollFailN++; return false; });
  return pcProgInFlight;
}
// 초기 동기화 + 적응형 폴링 + 포커스/복귀 시 즉시 갱신(+ 자정 넘김 자동 초기화)
// 조작 직후 90초는 7초 간격 — 같은 일정을 함께 보는 다른 사용자에게 빠르게 전파된다.
// 그 외에는 25초, 숨은 탭은 정지. rev 덕분에 촘촘한 폴링도 대부분 빈 응답이라 비용이 낮다.
// [안정성] 연속 실패 시 백오프(7/25 → 60초)로 죽은 서버를 7초마다 두드리지 않는다.
var pcPollTimer=null, pcPollFailN=0, pcPollCycleInFlight=null;
function pcPollDelay(){
  if(bazAuthBlocked() || pcPollFailN>=3) return 60000;               // 인증 끊김·연속 실패 → 느리게
  /* [부하] 열린 탭 하나가 하루 종일 도는 폴링이다. 사용자·탭이 늘수록 GAS 실행 슬롯을
     그대로 잡아먹어 접속 지연으로 이어졌다. 공동 편집 반응성을 크게 해치지 않는 선에서
     완화한다(조작 직후 7→10초, 평상시 25→40초). 서버측 캐시 개선과 함께 적용된다. */
  return (Date.now()-pcLastAct < 90000) ? 10000 : 40000;
}
function pcPollTick(){ pcPollCycle_(); }
function pcPollSchedule(){ try{ clearTimeout(pcPollTimer); }catch(e){} pcPollTimer=setTimeout(pcPollTick, pcPollDelay()); }
function pcPollCycle_(){
  if(pcPollCycleInFlight) return pcPollCycleInFlight;
  if(document.visibilityState==='hidden'){ pcPollSchedule(); return Promise.resolve(true); }
  try{ pcDailyResetCheck(); }catch(e){}
  var p;
  try{ p=pcProgPull(); }catch(e){ console.warn('[동기화] pcProgPull 예외:',e); p=Promise.resolve(false); }
  pcPollCycleInFlight=Promise.resolve(p).then(function(ok){
    try{ return pcRecentRequested?pcLoadRecent():ok; }catch(e){ return false; }
  }).then(function(v){
    pcPollCycleInFlight=null; pcPollSchedule(); return v;
  },function(){
    pcPollCycleInFlight=null; pcPollSchedule(); return false;
  });
  return pcPollCycleInFlight;
}
function pcProgWake(){ pcPollCycle_(); }
try{
  setTimeout(pcProgWake, 250);   // 첫 요청이 끝난 뒤 다음 폴링을 예약한다
  document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='visible') pcProgWake(); });
  window.addEventListener('focus', pcProgWake);
}catch(e){}

// 이벤트 위임 + 포인터 기반 드래그 (한 번만 바인딩)
function pcSchedBind(){
  if(pcSchedBound) return; pcSchedBound=true;
  var box=document.getElementById('viewSched'); if(!box) return;
  box.addEventListener('click', function(e){
    var t2;
    if((t2=e.target.closest('#schAddFseBtn'))){ var sel=document.getElementById('schFseSel'); var f=sel?sel.value:''; if(f){ pcSchedDraft[f]=1; renderSched(); } return; }
    if((t2=e.target.closest('.sch-res'))){ pcQueueApply('q_add', t2.getAttribute('data-fse'), t2.getAttribute('data-h')); return; }
    if((t2=e.target.closest('.sch-done'))){ var f2=t2.getAttribute('data-fse'), h2=t2.getAttribute('data-h'); pcQueueApply('q_done', f2, h2); var nx=pcqNextProg(f2); if(nx){ try{ if(typeof bazToast==='function') bazToast('✅ '+h2+' → '+t('schNext')+': '+nx); }catch(_){} } return; }
    if((t2=e.target.closest('.sch-up, .sch-down'))){ if(t2.disabled) return; pcQueueApply('q_move', t2.getAttribute('data-fse'), t2.getAttribute('data-h'), t2.getAttribute('data-to')); return; }
    if((t2=e.target.closest('.sch-del'))){ pcQueueApply('q_remove', t2.getAttribute('data-fse'), t2.getAttribute('data-h')); return; }
    if((t2=e.target.closest('.sch-fse-del'))){ var fd=t2.getAttribute('data-fse'); if(!pcConfirmClear(fd)) return; pcQueueApply('q_clear', fd); delete pcSchedDraft[fd]; renderSched(); return; }
    if((t2=e.target.closest('.sch-reset'))){ var fr=t2.getAttribute('data-fse'); if(!pcConfirmClear(fr)) return; pcQueueApply('q_clear', fr); delete pcSchedDraft[fr]; renderSched(); return; }
    var nm=e.target.closest('.sch-cn');
    if(nm){ var card=nm.closest('.sch-card'); var hn=card&&card.getAttribute('data-h'); if(hn) pcSchedOpenHosp(hn); return; }
  });
  box.addEventListener('input', function(e){ var s=e.target.closest('.sch-search'); if(s) schSearch(s); });
  // 포인터 드래그로 순서 이동(마우스·터치 공용)
  box.addEventListener('pointerdown', function(e){
    var handle=e.target.closest('.sch-handle'); if(!handle) return;
    var card=handle.closest('.sch-card'); var list=card&&card.parentNode; if(!card||!list) return;
    e.preventDefault();
    var fse=card.getAttribute('data-fse'), h=card.getAttribute('data-h');
    card.classList.add('dragging');
    function onMove(ev){
      var y=ev.clientY;
      var others=[].slice.call(list.querySelectorAll('.sch-card:not(.dragging)'));
      var after=null;
      for(var i=0;i<others.length;i++){ var r=others[i].getBoundingClientRect(); if(y < r.top + r.height/2){ after=others[i]; break; } }
      if(after) list.insertBefore(card, after); else list.appendChild(card);
    }
    function onUp(){
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      card.classList.remove('dragging');
      var all=[].slice.call(list.querySelectorAll('.sch-card'));
      var idx=all.indexOf(card);
      if(idx>=0) pcQueueApply('q_move', fse, h, idx); else renderSched();
    }
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
  });
}

   "직전 중심·배율 저장 → DOM/CSS 변경 → relayout 1회 → 복원" 순서를 여기서만 보장한다.

// 목록 동일성 판정용 해시. 예전 키는 첫·마지막 이름만 봐서, 길이와 양끝이 같은 필터 변경을
// 놓치고 지도를 갱신하지 않았다. 전체 이름을 훑되 문자열 연결 없이 32bit로 접는다.
// [수정] 좌표는 "있음/없음"이 아니라 실제 값을 섞는다. 병원정보DB 동기화(applyDB)가 기존 병원의
// lat/lng를 덮어써도 예전 해시는 그대로여서 pcDrawBase가 early-return했고, 마커가 옛 좌표에
// 그대로 남아 데이터와 어긋났다. 1e4 스케일 ≈ 10m 해상도면 실사용에 충분하다.
function pcListHash(list){
  var h=2166136261, n=list.length;
  for(var i=0;i<n;i++){
    var o=list[i], s=o.n||'';
    for(var j=0;j<s.length;j++){ h^=s.charCodeAt(j); h=(h*16777619)>>>0; }
    if(o.lat==null||o.lng==null){ h^=1; h=(h*16777619)>>>0; }
    else {
      h^=(Math.round(o.lat*1e4)|0); h=(h*16777619)>>>0;
      h^=(Math.round(o.lng*1e4)|0); h=(h*16777619)>>>0;
    }
  }
  return n+':'+h;
}

// 세션 첫 지도 생성에서 한 번만, 12h 이내 저장값이 있고 현재 목록 중 하나라도 그 화면에
// 들어올 때만 복원(빈 지도 회피). 이후에는 목록 변경마다 전체 맞춤을 유지한다.
function pcMapViewRestore(list){
  if(pcViewRestoredOnce) return false;
  // 병원 데이터는 서버에서 비동기로 온다 — 목록이 아직 비었으면 복원 시도를 소비하지 말고
  // 실제 데이터가 있는 첫 렌더까지 미룬다(빈 목록으로 소비하면 새로고침 복원이 영영 안 됨).
  var located=false; for(var k=0;k<list.length;k++){ if(list[k].lat!=null){ located=true; break; } }
  if(!located) return false;
  pcViewRestoredOnce=true;
  var v=null; try{ v=JSON.parse(localStorage.getItem('baz_pc_mapview')||'null'); }catch(e){}
  if(!v || typeof v.lat!=='number' || (Date.now()-(v.ts||0))>432e5) return false;   // 12h
  try{
    pcMapObj.setLevel(v.level); pcMapObj.setCenter(new kakao.maps.LatLng(v.lat, v.lng));
    var b=pcMapObj.getBounds(), inside=false;
    for(var i=0;i<list.length;i++){ var h=list[i]; if(h.lat==null) continue; if(b.contain(new kakao.maps.LatLng(h.lat,h.lng))){ inside=true; break; } }
    if(!inside) return false;   // 복원 위치에 목록 병원이 하나도 없으면 전체 맞춤으로 폴백
    return true;
  }catch(e){ return false; }
}

// 지도 컨트롤: 확대·축소·전체 보기 — 카카오 레벨은 값이 작을수록 확대(1=최대, 14=최소)
var PC_MAP_LMIN=1, PC_MAP_LMAX=14;
var pcLastZoomAt=0;
function pcMapZoom(delta){
  if(!pcMapObj) return;
  var lv=Math.max(PC_MAP_LMIN, Math.min(PC_MAP_LMAX, pcMapObj.getLevel()+delta));
  /* 연타(<300ms)에는 애니메이션을 끈다. 이전 확대 애니메이션이 끝나기 전에 새 setLevel 이
     겹치면 카카오가 타일 레이어를 계산하는 도중 목표 배율이 바뀌어, 중간 배율 타일이
     회색으로 남는 원인이 된다. 마지막 한 번만 부드럽게. */
  var fast=(Date.now()-pcLastZoomAt)<300; pcLastZoomAt=Date.now();
  try{
    if(fast) pcMapObj.setLevel(lv);

  pcMapCtl.markUserView();   // 사용자가 직접 맞춘 배율 — 폴링·데이터 갱신이 되돌리지 않게

// ── 지도 높이 조절 · 접기 · 고정 ─────────────────────────────────────────────
var PC_MAPH_DEF=400, PC_MAPH_MIN=220;
// 최대 높이는 화면에 맞춰 제한한다. sticky는 슬롯보다 커지면 아래가 접혀 스크롤 이탈하므로
// 이 클램프는 장식이 아니라 '스크롤 고정'을 지키는 핵심이다(큰 모니터 저장값이 노트북을 깨지 않게).
function pcMapHMax(){
  var hdr=0; try{ hdr=parseInt(getComputedStyle(document.documentElement).getPropertyValue('--hdr-h'))||56; }catch(e){ hdr=56; }
  return Math.max(PC_MAPH_MIN, (window.innerHeight||800)-hdr-40);
}

/* ── 전체화면 ──────────────────────────────────────────────────────────────
   position:fixed 로 흐름에서 빠지므로 배경 문서가 짧아져 스크롤이 튄다.
   예전에는 #pcPane 에 paddingTop 을 넣어 자리만 예약했다 — 배경은 여전히 스크롤됐고,
   닫으면 카드 목록 위치가 어긋났다(이력 모달이 body.overflow 를 무조건 리셋해
   전체화면이 스스로 잠글 수 없었던 것이 원인).
   → 이제 BazScrollLock 이 소유자 카운트로 잠그고, 해제 시 scrollY 를 정확히 되돌린다. */
function pcMapIsFull(){ return document.body.classList.contains('pc-mapfs'); }
function pcEnterFullscreen(){
  if(pcMapIsFull()) return;
  if(!pcMapVisible()) return;   // 표 뷰·접힘 등 지도 없는 상태에선 무시
  var view=pcMapCtl.captureView();
  BazScrollLock.lock('mapfs');                    // 진입 직전 scrollY 저장 + 배경 잠금
  pcMapTransition(function(){
    document.body.classList.add('pc-mapfs');
    var pane=document.getElementById('pcPane'); if(pane) pane.style.paddingTop='';   // 구버전 보정 잔재 제거
    pcFsBtnSync();
    pcMapInteractSync();                          // 전체화면에선 휠 확대 허용
  });
  if(view) pcMapState=view;
  bazAnnounce(t('mapFullscreen'));
}
function pcExitFullscreen(){
  if(!pcMapIsFull()) return;
  var view=pcMapCtl.captureView();
  pcMapTransition(function(){
    document.body.classList.remove('pc-mapfs');
    var pane=document.getElementById('pcPane'); if(pane) pane.style.paddingTop='';
    pcFsBtnSync();
    pcMapInteractSync();
  });
  BazScrollLock.unlock('mapfs');                  // 저장해 둔 scrollY 로 정확히 복원
  if(view) pcMapState=view;
  bazAnnounce(t('mapExitFull'));
}
function pcToggleFullscreen(){ if(pcMapIsFull()) pcExitFullscreen(); else pcEnterFullscreen(); }

function pcMapVisible(){

}
// 드래그 핸들: 현장 일정 카드와 같은 pointer 캡처 패턴
function pcMapGripBind(){
  var grip=document.getElementById('pcMapGrip'); if(!grip || grip._bound) return; grip._bound=1;
  var startY=0, startH=0, dragging=false;
  grip.addEventListener('pointerdown', function(e){
    var rt=document.getElementById('pcRight'); if(!rt) return;
    dragging=true; startY=e.clientY; startH=rt.getBoundingClientRect().height;
    document.body.classList.add('pc-mapresizing');   // transition 끔 → 즉시 따라옴
    pcMapCtl.dragStart();
    try{ grip.setPointerCapture(e.pointerId); }catch(_){}
    e.preventDefault();
  });
  grip.addEventListener('pointermove', function(e){
    if(!dragging) return;
    pcMapHApply(startH + (e.clientY-startY), false);
    /* [성능] pointermove 마다 relayout 하면 큰 지도에서 눈에 띄게 버벅인다.
       컨트롤러가 드래그 중에는 최대 90ms 간격으로만 통과시키고,
       드래그가 끝나면 아래 end() 에서 최종 relayout 1회를 반드시 보장한다. */
    pcMapCtl.dragMove();
  });
  function end(e){
    if(!dragging) return; dragging=false;
    document.body.classList.remove('pc-mapresizing');
    try{ grip.releasePointerCapture(e.pointerId); }catch(_){}
    var rt=document.getElementById('pcRight');
    if(rt) pcMapHApply(rt.getBoundingClientRect().height, true);   // 최종값만 저장
    pcMapCtl.dragEnd();                                            // 최종 relayout 1회
  }
  grip.addEventListener('pointerup', end);
  grip.addEventListener('pointercancel', end);
  grip.addEventListener('dblclick', function(){ pcMapHApply(PC_MAPH_DEF, true); });   // 더블클릭 → 기본 높이
}
/* 컨테이너 크기 변화 → relayout. 이제 직접 relayout 하지 않고 컨트롤러에 "요청"만 한다 —
   드래그·필터 폭 transition·창 크기 변경이 동시에 요청해도 프레임당 1회로 병합된다.
   (예전에는 여기서 rAF relayout, 다른 곳에서 setTimeout relayout 이 각각 돌아 중복됐다) */
var pcRO=null, pcROw=0, pcROh=0;
function pcMapROBind(){
  if(pcRO || typeof ResizeObserver==='undefined') return;
  var body=document.getElementById('pcRightBody'); if(!body) return;
  try{
    pcRO=new ResizeObserver(function(entries){
      var r=entries[0]&&entries[0].contentRect; if(!r) return;
      var w=Math.round(r.width), h=Math.round(r.height);
      if(w===0||h===0) return;                 // 접힘·표뷰·display:none → 그리지 않음
      if(w===pcROw && h===pcROh) return;       // 동일 크기 재발화 무시(피드백 루프 방지)
      pcROw=w; pcROh=h;
      pcScheduleRelayout();
    });
    pcRO.observe(body);
  }catch(e){ pcRO=null; }
}
// [성능] 5km 주변 병원 탐색용 격자 인덱스.
// 예전에는 HOSPITALS(400+) × 목록 전체를 이중 루프로 돌며 distKm을 호출했다.
// 0.05° 셀(위도 ≈5.6km · 경도 ≈4.4km@37.5°N)에 한 번만 담아두고, 인접 셀만 검사한다.
var PC_GRID_DEG=0.05, pcGrid=null, pcGridSig='';
function pcGridKey(lat,lng){ return Math.floor(lat/PC_GRID_DEG)+','+Math.floor(lng/PC_GRID_DEG); }
// [수정] 무효화 기준이 "좌표를 가진 병원 개수"뿐이었다. 개수는 그대로인데 좌표만 바뀌면
// (병원정보DB 동기화가 lat/lng를 덮어쓰는 경우) 재구축되지 않아 병원이 틀린 셀에 남았다.
// → 개수 + 좌표 합계 체크섬으로 판정한다.
function pcGridSignature(){
  var n=0, s=0;
  for(var i=0;i<HOSPITALS.length;i++){
    var o=HOSPITALS[i]; if(o.lat==null||o.lng==null) continue;
    n++; s+=(o.lat*1e4|0)+(o.lng*1e4|0)*3;
  }
  return n+':'+s;
}
function pcGridBuild(){
  var sig=pcGridSignature();
  if(pcGrid && pcGridSig===sig) return pcGrid;
  pcGrid={}; pcGridSig=sig;
  for(var i=0;i<HOSPITALS.length;i++){
    var o=HOSPITALS[i]; if(o.lat==null||o.lng==null) continue;
    var k=pcGridKey(o.lat,o.lng);
    (pcGrid[k]||(pcGrid[k]=[])).push(o);
  }
  return pcGrid;
}
// 기준 병원들 반경 km 안에 있는 '목록 밖' 병원 수집
function pcNearbyOf(list, km){
  var g=pcGridBuild(), seen={}, out=[], inList={};
  list.forEach(function(h){ inList[h.n]=1; });
  // [수정] 예전 span은 위도만 봤다: ceil(5/111/0.05)=1 → 3×3 셀.
  // 그런데 경도 0.05°는 위도 37.5°에서 111.32·cos(37.5°) ≈ 4.42km밖에 안 된다.
  // 5km ÷ 4.42km = 1.13셀이라, 기준 병원이 셀 동/서 끝에 있으면 5km 이내 병원이
  // +2번째 셀에 들어가 3×3 스캔에서 빠졌다(주변 5km 개수가 검색마다 흔들림).
  // → 위도·경도 span을 따로 구하고, 경도는 cos φ 압축을 병원별로 반영한다.
  //   셀 안 위치 f∈[0,1)에서 최대 오프셋은 floor(f+d) ≤ ceil(d)+1 이므로 +1이 안전 상한.
  var latSpan=Math.ceil(km/111.32/PC_GRID_DEG)+1;
  list.forEach(function(b){
    if(b.lat==null||b.lng==null) return;
    var kmPerDegLng=Math.max(1, 111.32*Math.cos(b.lat*Math.PI/180));
    var lngSpan=Math.ceil(km/kmPerDegLng/PC_GRID_DEG)+1;
    var ci=Math.floor(b.lat/PC_GRID_DEG), cj=Math.floor(b.lng/PC_GRID_DEG);
    for(var di=-latSpan; di<=latSpan; di++){
      for(var dj=-lngSpan; dj<=lngSpan; dj++){
        var cell=g[(ci+di)+','+(cj+dj)]; if(!cell) continue;
        for(var i=0;i<cell.length;i++){
          var o=cell[i];
          if(seen[o.n]||inList[o.n]) continue;
          if(distKm(b.lat,b.lng,o.lat,o.lng)<=km){ seen[o.n]=1; out.push(o); }
        }
      }
    }
  });
  return out;
}
