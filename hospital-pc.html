<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<!-- [접근성] user-scalable=no·maximum-scale 을 두지 않는다 — 확대가 막히면 저시력 사용자가
     현장에서 장비번호·경과일을 읽을 수 없다(WCAG 1.4.4). 확대해도 레이아웃은 유지된다. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>BAZ BIOMEDIC — 병원 데이터 센터 (PC)</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1B2F5E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BAZ CS">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  /* Pretendard Variable (자체 호스팅, 오프라인 PWA — sw.js 프리캐시) */
  @font-face{
    font-family:'Pretendard Variable';
    font-weight:45 920; font-style:normal; font-display:swap;
    src:url('fonts/PretendardVariable.woff2') format('woff2-variations');
  }
  :root{
    /* ── 브랜드 ── */
    --navy:#1B2F5E; --navy2:#16264D; --teal:#2E7D9E; --on-navy:#CADCFC;
    /* ── 중립(표면) ── */
    --bg:#F5F7FA; --surface:#FFFFFF; --surface-2:#EDF1F6; --line:#DDE3EE;
    --text:#1A1A2E; --text-muted:#6B7A99;
    /* ── 시맨틱 (상태 전용, soft=배경쌍) ── */
    --ok:#1E7E4E;      --ok-soft:#E4F3EA;
    --info:#2563EB;    --info-soft:#E7F0FE;
    --warn:#B8860B;    --warn-soft:#FBF1DA;
    --danger:#C0392B;  --danger-soft:#FBE6E3;
    --neutral:#6B7A99; --neutral-soft:#EDF1F6;
    --purple:#6C5CE7;  --purple-soft:#EEEBFB;
    --teal-soft:#EAF4F8;
    /* ── 하위호환 alias ── */
    --gray-bg:var(--bg); --gray-line:var(--line);
    --red:var(--danger); --green:var(--ok); --amber:var(--warn);
    --st-normal:var(--ok); --st-target:var(--teal); --st-warn:var(--warn); --st-danger:var(--danger); --st-none:var(--neutral);
    /* ── 라운드·그림자·모션 ── */
    --r-sm:7px; --r-md:10px; --r-lg:14px; --r-pill:999px;
    --sh-1:0 2px 8px rgba(20,34,66,.06);
    --sh-2:0 4px 14px rgba(20,34,66,.10);
    --sh-ring:0 0 0 2px var(--navy) inset;
    --dur:.16s; --ease:cubic-bezier(.2,.7,.3,1);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  :focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:2px;}
  @media(prefers-reduced-motion:reduce){ *{animation-duration:.001ms !important;transition-duration:.001ms !important;} }
  body{font-family:'Pretendard Variable','Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    background:var(--gray-bg);color:var(--text);-webkit-text-size-adjust:100%;padding-bottom:24px;
    font-feature-settings:'ss06';-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
  /* 숫자 정렬 필요한 곳: 스탯·표·거리/분·카운트 */
  .stats .num,.pc-table td,.prc-dt,.rrc-cnt,.chip .cnt,.bar-fill,.legend-val,.h-dist,.result-count b{font-variant-numeric:tabular-nums;}
  .wrap{max-width:560px;margin:0 auto;transition:max-width .18s ease;}

  /* ===== Window(PC) 모드 : 넓은 화면 활용 레이아웃 ===== */
  .mode-toggle{display:flex;gap:2px;background:rgba(202,220,252,.15);border:1px solid rgba(202,220,252,.4);border-radius:8px;padding:2px;margin-right:8px;}
  .mode-toggle button{background:transparent;border:0;color:var(--on-navy);font-size:11px;font-weight:700;padding:5px 9px;border-radius:6px;cursor:pointer;line-height:1;}
  .mode-toggle button.on{background:var(--on-navy);color:#16264D;}
  body.mode-window .wrap{max-width:1360px;}
  body.mode-window .body{padding:20px 26px;}
  body.mode-window .tabs{max-width:520px;}
  body.mode-window #cardList{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;align-items:start;}
  body.mode-window #cardList .h-card{margin-bottom:0;}
  body.mode-window .load-more{max-width:520px;margin-left:auto;margin-right:auto;}
  @media(max-width:720px){ body.mode-window .wrap{max-width:560px;} body.mode-window #cardList{grid-template-columns:1fr;} body.mode-window .body{padding:14px;} }

  /* ===== Window 전용: 카드/표 + 지도/상세 2-pane ===== */
  #pcPane{display:none;}
  body.mode-window #pcPane{display:block;}
  body.mode-window #cardList{display:none !important;}
  /* 표 뷰: 지도/상세 상단 패널 숨김 → 표(#pcLeft)를 전체 폭·전체 높이로 */
  body.mode-window.pc-table #pcRight{display:none;}
  body.mode-window #loadMore{display:none !important;}
  #pcToolbar{display:flex;align-items:center;gap:10px;margin:2px 0 12px;flex-wrap:wrap;}
  .pc-viewtoggle{display:flex;gap:2px;background:var(--surface);border:1px solid var(--gray-line);border-radius:9px;padding:3px;}
  .pc-viewtoggle button{background:transparent;border:0;color:var(--text-muted);font-size:12.5px;font-weight:700;padding:6px 13px;border-radius:6px;cursor:pointer;font-family:inherit;line-height:1.1;}
  .pc-viewtoggle button.on{background:var(--navy);color:#fff;}
  #pcToolbar .pc-hint{font-size:11.5px;color:var(--text-muted);}
  /* Window: 지도(상단 전폭) → 툴바 → 카드/표 세로 스택 */
  body.mode-window #viewList>.result-count{display:none !important;}   /* '417곳' 표기 제거 */
  #pcLeft{min-width:0;}
  #pcRight{background:var(--surface);border:1px solid var(--gray-line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 2px 10px rgba(20,34,66,.05);transition:height .16s ease;}
  /* 높이는 사용자 조절값(--pc-map-h). 드래그 중에는 transition을 꺼 지연 없이 따라오게 한다. */
  body.mode-window #pcRight{height:var(--pc-map-h,400px);margin-bottom:14px;position:sticky;top:calc(var(--hdr-h,56px) + 12px);z-index:20;}
  body.pc-mapresizing #pcRight{transition:none;}
  /* 스크롤 고정 해제(따라다니지 않음) */
  body.mode-window.pc-mapunpin #pcRight{position:static;}
  /* 접기: 지도 몸통만 감추고 헤더 줄은 남긴다. 상세 모드는 예외(:not(.detail))라
     접힌 상태에서 카드를 눌러도 상세는 정상 표시되고, 접힘 '선호'는 지도 복귀 시 되살아난다. */
  body.mode-window.pc-mapcol #pcRight:not(.detail){height:auto;}
  body.mode-window.pc-mapcol #pcRight:not(.detail) #pcRightBody,
  body.mode-window.pc-mapcol #pcRight:not(.detail) #pcMapGrip{display:none;}
  /* 헤더 컨트롤(고정·접기) */
  .pc-headctl{flex:0 0 auto;display:flex;gap:3px;margin-left:auto;}
  .pc-hctl{width:26px;height:26px;display:flex;align-items:center;justify-content:center;border:1px solid var(--gray-line);background:var(--surface);color:var(--text-muted);font-size:12px;line-height:1;border-radius:7px;cursor:pointer;font-family:inherit;transition:background .12s,border-color .12s,color .12s;}
  .pc-hctl:hover{border-color:var(--navy);color:var(--navy);}
  .pc-hctl.on{background:var(--navy);color:#fff;border-color:var(--navy);}
  body.pc-mapcol .pc-hctl[data-headctl="fold"]{transform:rotate(180deg);}   /* 접힘: ▾ → ▴ */
  #pcRight.detail .pc-headctl{display:none;}   /* 상세 모드: 지도 조작 무의미 */
  /* 높이 조절 핸들 — 하단 모서리 */
  #pcMapGrip{flex:0 0 auto;height:11px;display:flex;align-items:center;justify-content:center;cursor:ns-resize;background:var(--surface-2);border-top:1px solid var(--gray-line);touch-action:none;}
  #pcMapGrip span{width:34px;height:3px;border-radius:2px;background:var(--gray-line);transition:background .12s;}
  #pcMapGrip:hover span{background:var(--navy);}
  #pcRight.detail #pcMapGrip{display:none;}
  @media(max-width:980px){ #pcMapGrip{display:none;} }   /* 좁은 화면: 고정 높이 유지 */
  /* 전체화면 — z-index 160: 페이지 크롬(헤더50) 위, 모든 모달(상세190·이력200) 아래.
     2클래스 선택자로 L86·L185(모두 1,1,0)를 명시도(1,2,0)로 이긴다(소스 순서 무관). */
  #pcMapBackdrop{display:none;position:fixed;inset:0;background:rgba(16,29,61,.45);z-index:159;}
  body.pc-mapfs #pcMapBackdrop{display:block;}
  body.mode-window.pc-mapfs #pcRight{position:fixed;inset:12px;height:auto;width:auto;margin:0;z-index:160;box-shadow:0 12px 40px rgba(16,29,61,.4);}
  body.pc-mapfs #pcMapGrip{display:none;}                 /* 전체화면에선 높이 조절 무의미 */
  /* 접힘 상태로 전체화면 진입해도 펼쳐 보이게 — 접기 규칙(:not(.detail) 포함)보다 명시도 우위 */
  body.pc-mapfs.pc-mapcol #pcRight:not(.detail) #pcRightBody{display:block;}
  /* 좌측 필터 하단: 담당자 오늘 완료 카드 */
  #pcRecentCard{display:none;}
  body.mode-window #pcRecentCard{display:block;background:var(--surface);border:1px solid var(--gray-line);border-radius:12px;padding:11px 12px;box-shadow:0 2px 8px rgba(20,34,66,.05);}
  .rrc-head{font-size:12.5px;font-weight:800;color:var(--navy);display:flex;align-items:center;gap:6px;margin-bottom:9px;}
  .rrc-head .rrc-cnt{font-size:11px;font-weight:700;color:var(--ok);background:var(--ok-soft);border-radius:7px;padding:1px 7px;}
  .rrc-empty{font-size:11.5px;color:var(--text-muted);padding:4px 2px;}
  .rrc-list{display:flex;flex-direction:column;gap:7px;max-height:300px;overflow:auto;overscroll-behavior:contain;}
  .rrc-item{border:1px solid var(--gray-line);border-radius:9px;padding:8px 9px;cursor:pointer;transition:border-color .12s,box-shadow .12s;}
  .rrc-item:hover{border-color:var(--teal);box-shadow:0 2px 8px rgba(20,34,66,.08);}
  .rrc-item.sel{border-color:var(--navy);box-shadow:0 0 0 2px var(--navy) inset;}
  .rrc-nm{font-size:12.5px;font-weight:800;color:var(--navy);line-height:1.35;margin-bottom:3px;word-break:break-all;}
  .rrc-meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:11px;color:var(--text-muted);}
  .rrc-meta .fse{color:var(--ok);font-weight:700;}
  .rrc-g{font-size:10px;font-weight:700;padding:1px 6px;border-radius:6px;background:var(--gray-bg);color:var(--text-muted);}
  .rrc-cnt2{font-size:10px;font-weight:700;padding:1px 6px;border-radius:6px;background:var(--ok-soft);color:var(--ok);}
  .rrc-prog{display:flex;align-items:center;gap:7px;margin-top:6px;font-size:11px;font-weight:800;color:var(--teal);background:var(--teal-soft);border-radius:7px;padding:4px 8px;}
  .rrc-done{margin-left:auto;border:1px solid var(--teal);background:var(--teal);color:#fff;font-size:10px;font-weight:800;padding:2px 9px;border-radius:6px;cursor:pointer;font-family:inherit;white-space:nowrap;}
  .rrc-done:hover{filter:brightness(1.08);}
  #pcRightHead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 13px;border-bottom:1px solid var(--gray-line);background:var(--surface-2);flex:0 0 auto;}
  #pcRightHead .ttl{font-size:12.5px;font-weight:800;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #pcRightBody{flex:1 1 auto;position:relative;min-height:0;}
  #pcMapPane{position:absolute;inset:0;background:var(--surface-2);}
  /* 지도 위 컨트롤(확대·축소·전체 보기) — 우하단 세로 스택 */
  /* bottom:38px — 카카오 저작권 표기(우하단)·로고와 겹치지 않는 높이.
     예전 12px 에서는 '전체 보기' 버튼이 저작권 글자 위에 올라앉아 둘 다 못 눌렀다. */
  #pcMapCtl{position:absolute;right:10px;bottom:38px;z-index:8;display:flex;flex-direction:column;gap:5px;}
  .pc-mctl{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border:1px solid var(--gray-line);background:var(--surface);color:var(--navy);font-size:16px;font-weight:800;line-height:1;border-radius:9px;cursor:pointer;font-family:inherit;box-shadow:0 2px 8px rgba(20,34,66,.16);transition:background .12s,border-color .12s,opacity .12s;}
  .pc-mctl:hover{background:var(--navy);color:#fff;border-color:var(--navy);}
  .pc-mctl:disabled{opacity:.35;cursor:default;background:var(--surface);color:var(--navy);}
  #pcRight.detail #pcMapCtl{display:none;}   /* 상세 모드: 지도가 안 보이므로 컨트롤도 숨김 */
  .pc-mapfail{display:flex;align-items:center;justify-content:center;height:100%;padding:24px;text-align:center;color:var(--text-muted);font-size:12.5px;line-height:1.6;}
  /* 최근 완료(현장) 리스트 */
  .pc-recent-list{display:flex;flex-direction:column;gap:9px;}
  .pc-recent-item{background:var(--surface);border:1px solid var(--gray-line);border-radius:11px;padding:11px 13px;cursor:pointer;transition:border-color .12s,box-shadow .12s;}
  .pc-recent-item:hover{border-color:var(--teal);box-shadow:0 3px 12px rgba(20,34,66,.08);}
  .pc-recent-item.sel{border-color:var(--navy);box-shadow:0 0 0 2px var(--navy) inset;}
  .pc-recent-item.noloc{opacity:.72;}
  .pc-recent-top{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
  .pc-recent-top .nm{font-size:13.5px;font-weight:800;color:var(--navy);}
  .pc-recent-g{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;}
  .pc-recent-g.insp{background:var(--teal-soft);color:var(--info);}
  .pc-recent-g.as{background:var(--purple-soft);color:var(--purple);}
  .pc-recent-meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--text-muted);}
  .pc-recent-meta .fse{color:var(--ok);font-weight:700;}
  /* 지도 커스텀 마커(최근 완료: 초록 점 + FSE 라벨) — 지도 이동/줌 중 repaint 최소화 위해 합성 레이어로 승격 */
  .pc-cmk{display:flex;align-items:center;gap:4px;transform:translateY(-4px);cursor:pointer;will-change:transform;}
  .pc-cmk .dot{width:13px;height:13px;border-radius:50%;background:var(--ok);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);flex:0 0 auto;}
  .pc-cmk .lb{background:var(--ok);color:#fff;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:8px;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.25);}
  /* 지도 커스텀 마커(현재 처리중: 파란 점 + 라벨 · 현장 일정 진행중 연동) */
  .pc-pmk{display:flex;align-items:center;gap:4px;transform:translateY(-4px);cursor:pointer;will-change:transform;}
  .pc-pmk .dot{position:relative;width:14px;height:14px;border-radius:50%;background:var(--teal);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);flex:0 0 auto;}
  /* 펄스: box-shadow(매 프레임 repaint) 대신 transform+opacity 링(합성 레이어)으로 처리 → 줌 중 버벅임 방지 */
  .pc-pmk .dot::after{content:'';position:absolute;inset:-3px;border-radius:50%;border:2px solid var(--teal);opacity:.6;animation:pcProgPulse 1.8s ease-out infinite;will-change:transform,opacity;}
  .pc-pmk .lb{background:var(--teal);color:#fff;font-size:10.5px;font-weight:800;padding:1px 6px;border-radius:8px;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.3);}
  @keyframes pcProgPulse{0%{transform:scale(.7);opacity:.6;}70%{transform:scale(1.9);opacity:0;}100%{transform:scale(1.9);opacity:0;}}
  /* 선택 병원 강조 링 — 클러스터에 묶여도 보이도록 마커 위에 얹는 단일 오버레이 */
  .pc-selring{width:30px;height:30px;border-radius:50%;border:3px solid var(--navy);background:rgba(27,47,94,.12);box-shadow:0 0 0 2px #fff, 0 2px 8px rgba(20,34,66,.35);pointer-events:none;animation:pcSelPop .18s ease-out;}
  @keyframes pcSelPop{0%{transform:scale(.4);opacity:0;}100%{transform:scale(1);opacity:1;}}
  /* 지도 말풍선(InfoWindow) — 병원 정보 + 최근 이력 요약 + 전체 이력 버튼.
     카카오 InfoWindow 의 바탕은 항상 흰색이라 다크 모드 변수를 쓰면 글자가 사라진다.
     여기서만 고정 색을 쓴다(페이지 테마와 무관하게 항상 읽히도록). */
  .pc-iw{font-family:'Noto Sans KR',sans-serif;padding:10px 12px 11px;min-width:206px;max-width:290px;color:#2B3A55;}
  .pc-iw .iw-nm{font-size:13.5px;font-weight:800;color:#1B2F5E;line-height:1.35;word-break:break-all;margin-bottom:6px;padding-right:16px;}
  .pc-iw .iw-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:7px;}
  .pc-iw .iw-tag{font-size:10px;font-weight:700;padding:1px 6px;border-radius:6px;background:#EEF1F7;color:#5A6B8C;white-space:nowrap;}
  .pc-iw .iw-tag.prog{background:#2E7D9E;color:#fff;}
  .pc-iw .iw-rows{display:grid;grid-template-columns:auto 1fr;gap:3px 9px;font-size:11px;margin-bottom:8px;}
  .pc-iw .iw-rows .k{color:#7C8AA5;white-space:nowrap;}
  .pc-iw .iw-rows .v{color:#2B3A55;word-break:break-all;}
  .pc-iw .iw-h{font-size:11px;font-weight:800;color:#1B2F5E;border-top:1px solid #E2E7F0;padding-top:7px;margin-bottom:5px;}
  .pc-iw .iw-hist{display:flex;flex-direction:column;gap:6px;max-height:136px;overflow:auto;overscroll-behavior:contain;margin-bottom:9px;}
  .pc-iw .iw-hi{font-size:11px;line-height:1.45;border-left:2px solid #2E7D9E;padding-left:7px;color:#5A6B8C;}
  .pc-iw .iw-hi .d{font-weight:800;color:#1B2F5E;}
  .pc-iw .iw-hi .tp{font-size:9.5px;font-weight:700;padding:1px 5px;border-radius:5px;background:#DFF0F6;color:#1F6F94;margin-left:4px;}
  .pc-iw .iw-hi .tp.as{background:#EFE4F7;color:#7B4BA8;}
  .pc-iw .iw-hi .m{display:block;color:#2B3A55;}
  .pc-iw .iw-empty{font-size:11px;color:#7C8AA5;margin-bottom:9px;}
  .pc-iw .iw-btn{display:block;width:100%;border:0;background:#2E7D9E;color:#fff;font-size:11.5px;font-weight:800;
    padding:7px 8px;border-radius:7px;cursor:pointer;font-family:inherit;line-height:1.2;}
  .pc-iw .iw-btn:hover{filter:brightness(1.08);}

  /* 상세 패널 — 예전에는 inset:0 로 지도를 통째로 가리고(#pcMapPane visibility:hidden)
     지도 문맥이 사라졌다. 넓은 화면에서는 오른쪽 drawer 로 얹어 지도를 계속 보여준다.
     좁은 화면(≤980px)에서만 전면을 덮는다. */
  #pcDetail{position:absolute;inset:0;overflow:auto;overscroll-behavior:contain;padding:15px 16px;display:none;background:var(--surface);}
  #pcRight.detail #pcDetail{display:block;}
  @media(min-width:981px){
    #pcRight.detail #pcDetail{left:auto;width:min(430px,58%);border-left:1px solid var(--gray-line);box-shadow:-6px 0 20px rgba(20,34,66,.12);}
    #pcRight.detail #pcMapPane{visibility:visible;}
    #pcRight.detail #pcMapCtl{display:flex;right:calc(min(430px,58%) + 10px);}   /* 지도가 보이므로 컨트롤도 남긴다 */
    #pcRight.detail .pc-headctl{display:flex;}
  }
  .pc-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px;}
  .pc-cardwrap{cursor:pointer;position:relative;}
  .pc-cardwrap .h-card{margin-bottom:0;height:100%;transition:box-shadow .12s,border-color .12s;}
  .pc-cardwrap:hover .h-card{border-color:var(--teal);box-shadow:0 3px 12px rgba(20,34,66,.10);}
  .pc-cardwrap.sel .h-card{border-color:var(--navy);box-shadow:0 0 0 2px var(--navy) inset;}
  .pc-cardwrap.prog .h-card{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal) inset;}
  /* 우측 카드 진행중 토글 칩(호버 시 노출, 진행중이면 상시) */
  .pc-progchip{position:absolute;top:-8px;right:12px;z-index:3;border:1px solid var(--teal);background:var(--surface);color:var(--teal);
    font-size:10px;font-weight:800;padding:3px 8px;border-radius:8px;cursor:pointer;font-family:inherit;line-height:1.2;
    box-shadow:0 2px 6px rgba(20,34,66,.14);opacity:0;transition:opacity .12s;}
  .pc-cardwrap:hover .pc-progchip{opacity:1;}
  .pc-progchip.on{opacity:1;background:var(--teal);color:#fff;}
  .pc-progchip.tbl{position:static;opacity:1;box-shadow:none;padding:1px 5px;margin-right:5px;border-radius:6px;font-size:10.5px;vertical-align:1px;}
  .pc-progchip.tbl:not(.on){border-color:var(--gray-line);color:var(--text-muted);}
  .pc-table-wrap{overflow-x:auto;overscroll-behavior-x:contain;background:var(--surface);border:1px solid var(--gray-line);border-radius:12px;}
  .pc-table th:focus-visible{outline:2px solid var(--on-navy);outline-offset:-3px;}
  table.pc-table{width:100%;border-collapse:collapse;font-size:12.5px;}
  .pc-table th{position:sticky;top:0;background:var(--navy);color:#fff;font-weight:700;padding:9px 11px;text-align:left;white-space:nowrap;cursor:pointer;user-select:none;z-index:1;}
  .pc-table th .ar{opacity:.55;font-size:10px;margin-left:3px;}
  .pc-table td{padding:8px 11px;border-top:1px solid var(--gray-line);white-space:nowrap;color:var(--text);}
  .pc-table tbody tr{cursor:pointer;}
  .pc-table tbody tr:hover{background:var(--teal-soft);}
  .pc-table tbody tr.sel{background:var(--info-soft);}
  .pc-table tbody tr.prog{box-shadow:inset 3px 0 0 var(--teal);}
  .pc-badge{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;}
  .pc-dt-name{font-size:17px;font-weight:800;color:var(--navy);margin-bottom:3px;line-height:1.3;}
  .pc-dt-sub{font-size:12px;color:var(--text-muted);margin-bottom:12px;}
  .pc-dt-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:13px;}
  .pc-dt-rows{display:grid;grid-template-columns:auto 1fr;gap:7px 12px;font-size:12.5px;margin-bottom:14px;}
  .pc-dt-rows dt{color:var(--text-muted);font-weight:600;}
  .pc-dt-rows dd{color:var(--text);word-break:break-all;}
  .pc-dt-progflag{font-size:11px;font-weight:800;color:#fff;background:var(--teal);border-radius:7px;padding:2px 8px;vertical-align:2px;white-space:nowrap;}
  .pc-dt-prog{width:100%;margin:0 0 12px;padding:10px;border-radius:9px;border:1.5px solid var(--teal);background:var(--surface);color:var(--teal);font-weight:800;font-size:12.5px;cursor:pointer;font-family:inherit;}
  .pc-dt-prog:hover{background:var(--teal-soft);}
  .pc-dt-prog.on{background:var(--teal);color:#fff;}
  .pc-dt-prog.on:hover{opacity:.92;background:var(--teal);}
  .pc-dt-progrow{display:flex;align-items:stretch;gap:8px;margin:0 0 12px;}
  .pc-dt-progrow .pc-dt-prog{margin:0;flex:1;}
  .pc-assign{flex:0 0 auto;min-width:96px;max-width:130px;border:1.5px solid var(--gray-line);border-radius:9px;background:var(--surface);color:var(--text);font-family:inherit;font-size:12.5px;font-weight:700;padding:0 8px;cursor:pointer;}
  .pc-dt-done{flex:0 0 auto;padding:10px 14px;border-radius:9px;border:1.5px solid var(--ok);background:var(--ok);color:#fff;font-weight:800;font-size:12.5px;cursor:pointer;font-family:inherit;white-space:nowrap;}
  .pc-dt-done:hover{filter:brightness(1.06);}
  .pc-dt-sched{width:100%;margin:0 0 12px;padding:9px;border-radius:9px;border:1.5px solid var(--navy);background:var(--surface);color:var(--navy);font-weight:800;font-size:12.5px;cursor:pointer;font-family:inherit;}
  .pc-dt-sched:hover{background:var(--navy);color:#fff;}
  .pc-dt-acts{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
  .pc-dt-acts button{flex:1;min-width:88px;padding:9px 6px;border-radius:8px;border:1px solid var(--gray-line);background:var(--surface);font-weight:700;font-size:12px;cursor:pointer;font-family:inherit;color:var(--navy);}
  .pc-dt-acts button:hover{background:var(--gray-bg);}
  .pc-dt-h3{font-size:12.5px;font-weight:800;color:var(--navy);margin:4px 0 9px;padding-bottom:6px;border-bottom:1px solid var(--gray-line);}
  .pc-backmap{background:var(--surface);border:1px solid var(--gray-line);border-radius:7px;padding:5px 11px;font-size:12px;font-weight:700;color:var(--navy);cursor:pointer;font-family:inherit;white-space:nowrap;}
  .pc-backmap:hover{background:var(--surface);border-color:var(--navy);}
  @media(max-width:980px){ body.mode-window #pcRight{height:340px;position:static;} }

  /* ═══ 지도 조작 · 범례 · 내 주변 5km · 이력 초안 (v3) ═══════════════════ */
  /* 지도 위에서 굴린 휠이 페이지 스크롤 대신 지도 확대를 먹던 문제.
     해결은 오버레이가 아니라 SDK 설정이다 — setZoomable(false) 면 카카오가 휠 이벤트를
     가로채지 않아 페이지가 자연스럽게 스크롤되고, 드래그(이동)는 그대로 살아 있다.
     확대는 +/− 버튼, 또는 헤더의 '지도 조작' 토글을 켠 뒤 휠로.
     아래 힌트는 그 사실을 한 번 알려 주는 안내일 뿐이라 클릭을 가로채지 않는다. */
  #pcMapHint{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:9;pointer-events:none;
    background:rgba(27,47,94,.88);color:#fff;font-size:11.5px;font-weight:700;padding:5px 12px;border-radius:var(--r-pill);
    white-space:nowrap;opacity:0;transition:opacity .18s;}
  #pcMapHint.show{opacity:1;}
  #pcRight.detail #pcMapHint{display:none;}
  .pc-hctl[data-headctl="interact"].on{background:var(--teal);color:#fff;border-color:var(--teal);}

  /* 지도 범례 — 마커 색이 무엇을 뜻하는지(색만으로 전달하지 않도록 텍스트 병기) */
  #pcMapLegend{position:absolute;left:10px;bottom:10px;z-index:8;display:flex;flex-wrap:wrap;gap:4px 10px;
    background:rgba(255,255,255,.92);border:1px solid var(--gray-line);border-radius:9px;padding:5px 9px;
    font-size:10.5px;color:var(--text-muted);max-width:calc(100% - 120px);box-shadow:0 2px 8px rgba(20,34,66,.12);}
  body.dark #pcMapLegend{background:rgba(20,30,54,.92);}
  #pcMapLegend .lg{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;}
  #pcMapLegend .sw{width:9px;height:9px;border-radius:50%;border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.18);flex:0 0 auto;}
  #pcMapLegend .sw.base{background:var(--navy);}
  #pcMapLegend .sw.near{background:rgba(46,125,158,.85);}
  #pcMapLegend .sw.done{background:var(--ok);}
  #pcMapLegend .sw.prog{background:var(--teal);}
  #pcRight.detail #pcMapLegend{display:none;}
  @media(max-width:980px){ #pcMapLegend{display:none;} }

  /* ※ '내 주변 5km N-CARE 병원 조회'(브라우저 위치 기준 필터)는 제거했다.
       지도에 뜨는 '검색 결과 주변 5km 참고 마커'(pcDrawNearby)는 다른 기능이라 그대로 둔다. */

  /* 이력 편집: 서버 저장 상태 · 이 기기 초안 안내 */
  .hist-note{margin:0 0 10px;padding:8px 11px;border-radius:9px;font-size:11.5px;line-height:1.5;
    background:var(--warn-soft);color:var(--warn);border:1px solid rgba(184,134,11,.25);}
  .hist-note.err{background:var(--danger-soft);color:var(--danger);border-color:rgba(192,57,43,.25);}
  .hist-note.ok{background:var(--ok-soft);color:var(--ok);border-color:rgba(30,126,78,.25);}
  .hist-note .acts{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap;}
  .hist-note button{border:1px solid currentColor;background:transparent;color:inherit;font-family:inherit;
    font-size:11px;font-weight:800;padding:4px 10px;border-radius:7px;cursor:pointer;}
  .hist-note button:hover{background:rgba(0,0,0,.06);}

  /* 스크린리더 전용 */
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
    clip:rect(0 0 0 0);white-space:nowrap;border:0;}

  header{background:var(--navy);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:50;}
  header .logo-area{display:flex;align-items:center;gap:10px;min-width:0;flex:0 1 auto;}
  header .logo-area svg{width:32px;height:32px;flex:0 0 auto;}
  header .logo-area>div{min-width:0;}
  header h1{color:var(--on-navy);font-size:15px;font-weight:700;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  header .subtitle{color:rgba(202,220,252,.65);font-size:11px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hdr-ctrls{display:flex;align-items:center;flex:0 0 auto;}
  /* 모바일/좁은 화면: 컨트롤을 제목 아래 줄로 내려 헤더 깨짐 방지 */
  @media(max-width:600px){
    header{flex-wrap:wrap;padding:10px 13px;gap:8px;}
    header .logo-area{flex:1 1 100%;}
    .hdr-ctrls{flex:1 1 100%;flex-wrap:wrap;justify-content:flex-start;gap:6px;}
    .mode-toggle{margin-right:0;}
    .hublang{margin-left:0;}
    .theme-toggle{margin-left:0;}
  }
  .home-link{background:rgba(202,220,252,.15);border:1px solid rgba(202,220,252,.4);color:var(--on-navy);
    font-size:11px;font-weight:700;padding:6px 11px;border-radius:16px;text-decoration:none;white-space:nowrap;}
  .hublang{display:flex;gap:2px;background:rgba(255,255,255,.08);border-radius:8px;padding:2px;margin-left:8px;}
  .hublang button{background:transparent;border:none;color:var(--on-navy);font-size:11px;font-weight:700;
    padding:4px 7px;border-radius:6px;cursor:pointer;font-family:inherit;}

  .body{padding:14px;}

  /* ===== 필터: 모바일 상단 고정 / PC 좌측 사이드바 ===== */
  /* 모바일: filterRail은 레이아웃상 사라져(display:contents) filterSticky가
     긴 #viewList 기준으로 고정되어 카드 목록 내내 상단에 붙어 있음 */
  #filterRail{display:contents;}
  #filterSticky{position:sticky;top:var(--hdr-h,56px);z-index:30;background:var(--gray-bg);padding-top:8px;margin-bottom:2px;}
  #filterSticky::after{content:'';position:absolute;left:0;right:0;bottom:-8px;height:8px;background:linear-gradient(rgba(245,247,250,.9),rgba(245,247,250,0));pointer-events:none;}
  body.mode-window #viewList{display:grid;grid-template-columns:250px minmax(0,1fr);gap:20px;align-items:start;transition:grid-template-columns .18s ease;}
  body.mode-window #viewList>#schedNotice{grid-column:1/-1;}
  /* 필터 폭 3단계: 숨김 / 기본(250) / 확장(440) */
  body.mode-window.filt-wide #viewList{grid-template-columns:440px minmax(0,1fr);}
  body.mode-window.filt-hide #viewList{grid-template-columns:44px minmax(0,1fr);}
  /* overscroll-behavior:contain — 필터 레일 끝까지 굴렸을 때 본문이 갑자기 따라 움직이는
     scroll chaining 을 막는다(스크롤 소유권을 명확히). */
  body.mode-window #filterRail{grid-column:1;position:sticky;top:calc(var(--hdr-h,56px) + 10px);align-self:start;max-height:calc(100vh - var(--hdr-h,56px) - 24px);overflow:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:10px;padding-right:2px;}
  /* 필터 폭 토글 버튼 (필터 상단, 스크롤해도 고정) */
  #filtToggle{display:none;}
  body.mode-window #filtToggle{display:flex;position:sticky;top:0;z-index:6;justify-content:flex-end;padding:2px 0 4px;background:var(--gray-bg);}
  #filtToggle button{border:1px solid var(--gray-line);background:var(--surface);color:var(--navy);font-size:11px;font-weight:800;padding:5px 10px;border-radius:8px;cursor:pointer;font-family:inherit;white-space:nowrap;line-height:1.1;box-shadow:0 1px 4px rgba(20,34,66,.08);}
  #filtToggle button:hover{border-color:var(--teal);color:var(--teal);}
  /* 숨김 상태: 토글만 남기고 나머지 숨김 + 세로 라벨 */
  body.mode-window.filt-hide #filterRail{overflow:hidden;padding-right:0;}
  body.mode-window.filt-hide #filterRail>*:not(#filtToggle){display:none !important;}
  body.mode-window.filt-hide #filtToggle{justify-content:center;}
  body.mode-window.filt-hide #filtToggle button{writing-mode:vertical-rl;padding:9px 5px;letter-spacing:1px;}
  /* 넓게: 주변 이동 소요시간·오늘 완료 병원명 풀네임 표기(생략 없이 줄바꿈) */
  body.mode-window.filt-wide .prc-nm{white-space:normal;overflow:visible;text-overflow:clip;}
  body.mode-window #filterSticky{position:static;top:auto;background:transparent;padding-top:0;z-index:auto;}
  body.mode-window #filterSticky::after{display:none;}
  body.mode-window #viewList>.result-count,
  body.mode-window #viewList>#cardList,
  body.mode-window #viewList>#loadMore,
  body.mode-window #viewList>#pcPane{grid-column:2;min-width:0;}
  @media(max-width:980px){ body.mode-window #viewList{grid-template-columns:1fr;} body.mode-window #filterRail{position:static;max-height:none;overflow:visible;} }

  /* ═══ 지도는 항상 '상단 전폭 고정' ══════════════════════════════════════
     한동안 1200px 이상에서 "필터 · 결과 목록 · 지도" 3열을 썼다(지도가 오른쪽 칸).
     실사용에서 문제가 컸다:
       · 지도 칸이 좁고 세로로 길어 전국·수도권 형태를 한눈에 보기 어려웠다
       · 결과 목록(#pcLeft)이 자체 스크롤 컨테이너가 되어 본문 스크롤과 이중이 됐고,
         지도 위 휠을 목록으로 대신 흘려보내는 우회 코드까지 필요했다
       · #pcRight 가 sticky + 뷰포트 기준 높이 + 그리드 행 스팬을 동시에 갖는 바람에
         확대/축소 중 컨테이너 크기 재계산이 엇갈려 타일이 회색으로 남는 경우가 있었다
     → 넓은 화면에서도 지도는 위에 전폭으로 고정하고, 표·카드는 그 아래를 쓴다.
       (표 뷰는 기존대로 지도를 숨기고 전체 폭을 쓴다 — 아래 .pc-table 규칙)
     레이아웃 규칙은 L87 의 sticky 지도 하나로 일원화된다. */

  /* 탭 */
  .tabs{display:flex;gap:6px;margin-bottom:14px;background:var(--surface);border:1px solid var(--gray-line);border-radius:12px;padding:4px;}
  .tab{flex:1;text-align:center;padding:9px 6px;border-radius:9px;font-size:13px;font-weight:700;color:var(--text-muted);cursor:pointer;border:none;background:transparent;font-family:inherit;}
  .tab.on{background:var(--navy);color:#fff;}

  /* 검색 */
  .search-wrap{position:relative;margin-bottom:12px;}
  .search-wrap .ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:17px;color:var(--text-muted);pointer-events:none;}
  #searchInput{width:100%;border:1.5px solid var(--gray-line);border-radius:10px;padding:13px 13px 13px 40px;
    font-size:16px;font-family:inherit;color:var(--text);background:var(--surface);outline:none;}
  #searchInput:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(46,125,158,.12);}
  .search-clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:var(--gray-line);
    border:none;border-radius:50%;width:22px;height:22px;font-size:13px;color:#fff;cursor:pointer;display:none;line-height:1;}

  /* 필터 */
  .filter-section{margin-bottom:12px;}
  .filter-label{font-size:11px;font-weight:700;color:var(--text-muted);margin-bottom:6px;padding-left:2px;}
  .filter-row{display:flex;gap:7px;flex-wrap:wrap;}
  .chip{border:1.5px solid var(--gray-line);background:var(--surface);color:var(--text-muted);font-size:12px;font-weight:600;
    padding:7px 12px;border-radius:18px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:5px;white-space:nowrap;}
  .chip.on{border-color:var(--teal);background:var(--teal-soft);color:var(--navy);}
  .chip .cnt{font-size:10px;opacity:.7;}
  .chip.sm{padding:6px 10px;font-size:11px;}

  select.flt{border:1.5px solid var(--gray-line);border-radius:10px;padding:10px 12px;font-size:13px;font-family:inherit;color:var(--text);background:var(--surface);outline:none;width:100%;}
  select.flt:focus{border-color:var(--teal);}

  /* 통계 */
  .stats{display:flex;gap:8px;margin-bottom:12px;}
  .stats .s{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 6px;text-align:center;font-family:inherit;transition:border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease);}
  #stats .s{cursor:pointer;}
  #stats .s:hover{border-color:var(--teal);}
  #stats .s.on{border-color:var(--navy);box-shadow:var(--sh-ring);}
  .stats .num{font-size:19px;font-weight:800;line-height:1.1;}
  .stats .lbl{font-size:10px;color:var(--text-muted);margin-top:2px;}

  .result-count{font-size:12px;color:var(--text-muted);margin-bottom:10px;padding-left:2px;}
  .result-count b{color:var(--navy);}

  /* 병원 카드 */
  .h-card{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:13px 14px 13px 17px;margin-bottom:10px;box-shadow:var(--sh-1);}
  /* 심각도 좌측 스트라이프 — 카드→표→지도까지 통일된 상태 언어 */
  .h-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:transparent;border-radius:4px 0 0 4px;}
  .h-card.urgent::before{background:var(--danger);}
  .h-card.soon::before{background:var(--warn);}
  .h-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px;}
  .h-name{font-size:15px;font-weight:700;color:var(--navy);line-height:1.35;}
  .h-dist{font-size:11px;color:var(--purple);font-weight:700;margin-top:2px;display:none;}
  .h-dist.show{display:block;}
  /* 상태 뱃지: 색+도트(형태)로 인코딩 — 색맹/다크 가독 향상 */
  .st-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px 3px 8px;border-radius:var(--r-sm);white-space:nowrap;flex:0 0 auto;}
  .st-badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;flex:0 0 auto;}
  .st-badge.비대상::before{opacity:.5;}
  .st-badge.정상{background:var(--ok-soft);color:var(--st-normal);}
  .st-badge.점검대상{background:var(--teal-soft);color:var(--st-target);}
  .st-badge.권고{background:var(--warn-soft);color:var(--st-warn);}
  .st-badge.경고{background:var(--danger-soft);color:var(--st-danger);}
  .st-badge.미점검{background:var(--neutral-soft);color:var(--st-none);}
  .st-badge.진행중{background:var(--teal-soft);color:var(--teal);}
  .st-badge.진행중::before{background:var(--teal);}
  .st-badge.비대상{background:var(--neutral-soft);color:var(--text-muted);font-weight:600;}
  /* [보안] 상태 문자열을 class 에 그대로 넣지 않는다 — BazDom.statusClass 허용목록이
     아래 ASCII 클래스로 매핑한다. 목록에 없는 값은 st-unknown(중립)으로 떨어진다.
     (위 한글 클래스는 예전 마크업 호환용으로 남겨 둔다) */
  .st-badge.st-normal{background:var(--ok-soft);color:var(--st-normal);}
  .st-badge.st-target{background:var(--teal-soft);color:var(--st-target);}
  .st-badge.st-rec{background:var(--warn-soft);color:var(--st-warn);}
  .st-badge.st-warn{background:var(--danger-soft);color:var(--st-danger);}
  .st-badge.st-none{background:var(--neutral-soft);color:var(--st-none);}
  .st-badge.st-prog{background:var(--teal-soft);color:var(--teal);}
  .st-badge.st-prog::before{background:var(--teal);}
  .st-badge.st-out{background:var(--neutral-soft);color:var(--text-muted);font-weight:600;}
  .st-badge.st-out::before{opacity:.5;}
  .st-badge.st-unknown{background:var(--neutral-soft);color:var(--text-muted);font-weight:600;}

  .warn-tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;margin-top:6px;}
  .warn-tag.over{background:var(--danger-soft);color:var(--red);}
  .warn-tag.near{background:var(--warn-soft);color:var(--amber);}

  .h-meta{font-size:12.5px;color:var(--text-muted);line-height:1.7;}
  .h-meta .line{display:flex;align-items:flex-start;gap:6px;}
  .h-meta .ico{font-size:13px;flex:0 0 auto;margin-top:2px;}

  .h-tags{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap;}
  .h-tag{font-size:11px;font-weight:600;padding:3px 9px;border-radius:7px;}
  .h-tag.ncare{background:var(--teal-soft);color:var(--info);}
  .h-tag.ncare.none{background:var(--neutral-soft);color:var(--text-muted);}
  .h-tag.as{background:var(--gray-bg);color:var(--text-muted);}
  .h-tag.sales{background:var(--purple-soft);color:var(--purple);}
  .h-tag.hpver{background:var(--ok-soft);color:var(--ok);}
  .h-tag.uiver{background:var(--info-soft);color:var(--info);}
  .h-tag.vendor{background:var(--neutral-soft);color:var(--text-muted);}
  .h-tag.warranty{background:var(--ok-soft);color:var(--ok);}

  .h-actions{display:flex;gap:6px;margin-top:11px;}
  /* 액션 버튼: ghost 통일(무채색 테두리+컬러 라벨), 점검접수만 filled primary */
  .h-actions button{flex:1;font-size:12px;font-weight:700;padding:9px 6px;border-radius:var(--r-md);cursor:pointer;font-family:inherit;border:1px solid var(--line);background:var(--surface);color:var(--text-muted);display:flex;align-items:center;justify-content:center;gap:4px;transition:border-color var(--dur) var(--ease),background var(--dur) var(--ease);}
  .h-actions button:hover{border-color:var(--navy);}
  .h-actions button:active{background:var(--gray-bg);}
  .h-actions .nmap{color:#0F9D58;}
  .h-actions .insp{border-color:var(--navy);background:var(--navy);color:#fff;}
  .h-actions .insp:hover{background:var(--navy2);}
  .h-actions .surv{color:var(--teal);}

  .empty{text-align:center;padding:40px 20px;color:var(--text-muted);font-size:13px;line-height:1.7;}
  .empty .ico{font-size:40px;margin-bottom:10px;opacity:.4;}
  .load-more{width:100%;padding:12px;border:1.5px solid var(--gray-line);background:var(--surface);color:var(--text-muted);
    font-size:13px;font-weight:700;border-radius:10px;cursor:pointer;font-family:inherit;margin-top:4px;}

  /* 대시보드 */
  .dash-card{background:var(--surface);border:1px solid var(--gray-line);border-radius:12px;padding:16px;margin-bottom:12px;}
  .dash-title{font-size:13px;font-weight:700;color:var(--navy);margin-bottom:14px;}
  /* 통합 카드 내부 구역 소제목·구분선 */
  .dash-subtitle{font-size:12px;font-weight:700;color:var(--text-muted);margin:0 0 10px;}
  .dash-divider{border:none;border-top:1px solid var(--line);margin:16px 0;}
  /* N-CARE 전용 서비스 현황 대시보드 */
  .nck-rate{margin-bottom:12px;}
  .nck-rate-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;}
  .nck-rate-top b{font-size:13.5px;color:var(--ok);}
  .nck-rate-top span{font-size:11px;color:var(--text-muted);}
  .nck-ratebar{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden;}
  .nck-ratebar div{height:100%;background:var(--ok);border-radius:5px;transition:width .3s;}
  .nck-sum{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
  .nck-badge{flex:1;min-width:64px;text-align:center;border-radius:8px;padding:7px 4px;font-size:11px;color:#fff;}
  .nck-badge b{display:block;font-size:17px;line-height:1.2;}
  .nck-list{max-height:280px;overflow:auto;-webkit-overflow-scrolling:touch;}
  .nck-row{display:flex;align-items:center;gap:8px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:12.5px;}
  .nck-row:last-child{border-bottom:none;}
  .nck-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;}
  .nck-row .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);}
  .nck-row .gd{color:var(--teal);font-size:11px;flex:0 0 auto;}
  .nck-row .dy{color:var(--text-muted);font-size:11px;white-space:nowrap;flex:0 0 auto;}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .bar-label{font-size:12px;color:var(--text);width:64px;flex:0 0 auto;}
  .bar-track{flex:1;height:22px;background:var(--gray-bg);border-radius:6px;overflow:hidden;position:relative;}
  .bar-fill{height:100%;border-radius:6px;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;color:#fff;font-size:11px;font-weight:700;min-width:28px;}
  /* N-CARE 점검 운영률 게이지 */
  .oprate{display:flex;align-items:center;gap:22px;flex-wrap:wrap;}
  .oprate-ring{position:relative;width:104px;height:104px;flex:0 0 auto;}
  .oprate-ring svg circle{transition:stroke-dasharray var(--dur) var(--ease);}
  .oprate-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
  .oprate-pct span{font-size:13px;font-weight:700;margin-left:1px;margin-top:6px;}
  .oprate-info{min-width:0;}
  .oprate-main{font-size:14px;font-weight:700;color:var(--text);}
  .oprate-main b{font-weight:800;}
  .oprate-main span{color:var(--text-muted);font-weight:600;font-size:12.5px;}
  .oprate-sub{font-size:12px;color:var(--text-muted);margin-top:5px;}
  .oprate-sub b{color:var(--text);font-weight:700;font-variant-numeric:tabular-nums;}
  .donut-wrap{display:flex;align-items:center;gap:18px;}
  .legend{flex:1;}
  .legend-item{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:7px;}
  .legend-dot{width:11px;height:11px;border-radius:3px;flex:0 0 auto;}
  .legend-val{margin-left:auto;font-weight:700;color:var(--navy);}

  /* 이력 버튼 */
  .h-actions .hist{color:var(--purple);}
  /* 사용자 숙련도 평가 배지 (이력 옆) */
  .h-skill{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:4px;
    font-size:11.5px;font-weight:700;padding:9px 8px;border-radius:var(--r-md);
    background:var(--teal-soft,#EAF4F8);color:var(--navy);border:1px solid var(--line);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .h-skill.warn{background:#FBEAE8;color:#C0392B;border-color:#E8B4AD;}
  .h-skill.ok{background:var(--ok-soft,#EAF6EE);color:var(--ok,#1E7E4E);border-color:#BFE3CC;}
  /* 병원 상세 모달 (표 전체화면 뷰에서 행 클릭 시) */
  #pcDetailModal{position:fixed;inset:0;background:rgba(20,34,66,.5);z-index:190;display:none;align-items:center;justify-content:center;padding:20px;}   /* 이력 편집(histModal 200)·비번(300) 모달이 위에 스택되도록 190 */
  #pcDetailModal.show{display:flex;}
  .pc-dm-sheet{position:relative;background:var(--surface);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:16px;padding:18px;box-shadow:var(--sh-2);animation:slideUp .2s ease;}
  .pc-dm-close{position:absolute;top:10px;right:12px;border:0;background:transparent;font-size:18px;line-height:1;color:var(--text-muted);cursor:pointer;padding:4px;z-index:1;}
  .pc-dm-close:hover{color:var(--text);}
  /* 이력 모달 */
  #histModal{position:fixed;inset:0;background:rgba(20,34,66,.5);z-index:200;display:none;align-items:flex-end;justify-content:center;}
  #histModal.show{display:flex;}
  .hist-sheet{background:var(--surface);width:100%;max-width:560px;max-height:86vh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;animation:slideUp .25s ease;}
  @keyframes slideUp{from{transform:translateY(40px);opacity:.6;}to{transform:translateY(0);opacity:1;}}
  .hist-head{padding:16px 18px 12px;border-bottom:1px solid var(--gray-line);display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex:0 0 auto;}
  .hist-head .hn{font-size:16px;font-weight:700;color:var(--navy);line-height:1.35;}
  .hist-head .hsub{font-size:12px;color:var(--text-muted);margin-top:3px;}
  .hist-close{background:var(--gray-bg);border:none;border-radius:50%;width:30px;height:30px;font-size:16px;color:var(--text-muted);cursor:pointer;flex:0 0 auto;}
  .hist-body{overflow-y:auto;padding:16px 18px 24px;}
  .tl-item{position:relative;padding-left:22px;padding-bottom:18px;}
  .tl-item:before{content:'';position:absolute;left:5px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--teal);border:2px solid var(--surface);box-shadow:0 0 0 1.5px var(--teal);}
  .tl-item.as:before{background:var(--purple);box-shadow:0 0 0 1.5px var(--purple);}
  .tl-item:after{content:'';position:absolute;left:9px;top:16px;bottom:0;width:1.5px;background:var(--gray-line);}
  .tl-item:last-child:after{display:none;}
  .tl-date{font-size:13px;font-weight:700;color:var(--navy);}
  .tl-type{display:inline-block;font-size:10px;font-weight:700;padding:1px 7px;border-radius:5px;margin-left:6px;vertical-align:1px;}
  .tl-type.점검{background:var(--teal-soft);color:var(--teal);}
  .tl-type.AS{background:var(--purple-soft);color:var(--purple);}
  .tl-meta{font-size:12px;color:var(--text-muted);margin-top:3px;line-height:1.6;}
  .tl-cat{display:inline-block;font-size:11px;font-weight:600;color:var(--purple);background:var(--purple-soft);padding:2px 8px;border-radius:6px;margin-top:5px;}
  .tl-memo{font-size:12.5px;color:var(--text);margin-top:6px;line-height:1.55;background:var(--gray-bg);border-radius:8px;padding:8px 10px;}
  .tl-fix{background:var(--teal-soft);}   /* 조치내용(↳) 박스 */
  .tl-part{font-size:11.5px;color:var(--text-muted);margin-top:5px;}
  .tl-empty{text-align:center;color:var(--text-muted);font-size:13px;padding:30px 0;}

  /* 최근 처리 탭 */
  .rc-range{display:flex;gap:7px;margin-bottom:12px;}
  .rc-range .chip{flex:1;justify-content:center;text-align:center;}
  .rc-summary{font-size:12px;color:var(--text-muted);text-align:center;margin-bottom:14px;font-weight:600;}
  .rc-day{margin-bottom:18px;}
  .rc-dayhead{font-size:12px;font-weight:800;color:var(--navy);background:var(--teal-soft);
    border-radius:8px;padding:6px 12px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}
  .rc-dayhead .rc-daycnt{font-size:11px;font-weight:700;color:var(--teal);}
  .rc-item{background:var(--surface);border:1px solid var(--gray-line);border-radius:11px;padding:12px 13px;margin-bottom:9px;cursor:pointer;transition:box-shadow .12s,border-color .12s;}
  .rc-item:active{box-shadow:0 2px 8px rgba(20,34,66,.12);border-color:var(--teal);}
  .rc-item-top{display:flex;align-items:center;gap:7px;margin-bottom:5px;}
  .rc-hname{font-size:14px;font-weight:700;color:var(--text);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .rc-type{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;flex:0 0 auto;}
  .rc-type.점검{background:var(--teal-soft);color:var(--teal);}
  .rc-type.AS{background:var(--purple-soft);color:var(--purple);}
  .rc-sym{font-size:12px;font-weight:600;color:var(--purple);margin-bottom:4px;}
  .rc-fx{font-size:12.5px;color:var(--text);line-height:1.5;}
  .rc-metaline{font-size:11px;color:var(--text-muted);margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 10px;}
  .rc-metaline .rc-part{color:var(--amber);font-weight:600;}
  .rc-fsefilter{margin-bottom:12px;}
  .rc-fsefilter select{width:100%;border:1.5px solid var(--gray-line);border-radius:10px;padding:10px 12px;font-size:13px;font-family:inherit;color:var(--text);background:var(--surface);outline:none;}

  /* 이력 편집 */
  .hist-lock{background:var(--gray-bg);border:none;border-radius:50%;width:30px;height:30px;font-size:14px;color:var(--text-muted);cursor:pointer;flex:0 0 auto;margin-right:6px;}
  .hist-lock.on{background:var(--purple-soft);color:var(--purple);}
  #histPwModal{position:fixed;inset:0;background:rgba(20,34,66,.55);z-index:300;display:none;align-items:center;justify-content:center;padding:20px;}
  #histPwModal.show{display:flex;}
  .pw-box{background:var(--surface);border-radius:16px;width:100%;max-width:340px;padding:22px;box-shadow:0 12px 40px rgba(20,34,66,.4);}
  .pw-box h3{font-size:16px;font-weight:800;color:var(--navy);margin-bottom:6px;}
  .pw-box p{font-size:12px;color:var(--text-muted);margin-bottom:16px;line-height:1.5;}
  .pw-box input{width:100%;border:1.5px solid var(--gray-line);border-radius:9px;padding:11px 13px;font-size:15px;font-family:inherit;outline:none;}
  .pw-box input:focus{border-color:var(--teal);}
  .pw-err{color:var(--red);font-size:12px;min-height:16px;margin-top:6px;}
  .pw-btns{display:flex;gap:8px;margin-top:14px;}
  .pw-btns button{flex:1;padding:11px;border-radius:9px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;border:1.5px solid var(--gray-line);background:var(--surface);color:var(--text-muted);}
  .pw-btns button.primary{background:var(--navy);color:#fff;border-color:var(--navy);}

  .tl-edit{background:var(--surface-2);border:1.5px dashed #9cc4dc;border-radius:10px;padding:10px;margin-bottom:10px;}
  .tl-edit input,.tl-edit select,.tl-edit textarea{width:100%;border:1px solid var(--gray-line);border-radius:6px;padding:7px 9px;font-size:12px;font-family:inherit;margin-bottom:6px;outline:none;}
  .tl-edit input:focus,.tl-edit textarea:focus{border-color:var(--teal);}
  .tl-edit .row2{display:flex;gap:6px;}
  .tl-edit .row2>*{flex:1;}
  .tl-edit-del{background:var(--danger-soft);color:var(--red);border-radius:7px;padding:5px 10px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;}
  .hist-editbar{display:flex;gap:6px;padding:12px 18px;border-top:1px solid var(--gray-line);flex:0 0 auto;}
  .hist-editbar button{flex:1;padding:10px;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;border:none;}
  .hist-editbar .add{background:var(--teal-soft);color:var(--teal);}
  .hist-editbar .save{background:var(--navy);color:#fff;}
  .hist-editbar .cancel{background:var(--gray-bg);color:var(--text-muted);}

  /* ===== 주변 이동 소요시간 카드 (좌측 필터 하단) ===== */
  #pcRouteCard{display:none;}
  body.mode-window #pcRouteCard{display:block;background:var(--surface);border:1px solid var(--gray-line);border-radius:12px;padding:11px 12px;box-shadow:0 2px 8px rgba(20,34,66,.05);}
  .prc-head{font-size:12.5px;font-weight:800;color:var(--navy);display:flex;align-items:center;gap:6px;margin-bottom:9px;}
  .prc-head .prc-sub{font-size:10px;font-weight:700;color:var(--teal);background:var(--teal-soft);border-radius:7px;padding:1px 7px;}
  .prc-empty{font-size:11.5px;color:var(--text-muted);padding:4px 2px;}
  .prc-total{font-size:11px;font-weight:800;color:var(--teal);background:var(--teal-soft);border-radius:7px;padding:4px 9px;margin-bottom:7px;}
  .prc-fse{padding:8px 0;border-top:1px dashed var(--gray-line);}
  .prc-fse:first-of-type{border-top:0;padding-top:0;}
  .prc-fse-h{font-size:12px;font-weight:800;color:var(--ok);margin-bottom:6px;display:flex;flex-wrap:wrap;align-items:center;gap:4px 7px;}
  .prc-fse-h .prc-cur{font-size:10.5px;font-weight:600;color:var(--text-muted);}
  .prc-item{display:flex;align-items:center;gap:7px;padding:5px 6px;border-radius:8px;cursor:pointer;transition:background .12s;}
  .prc-item:hover{background:var(--teal-soft);}
  .prc-rank{flex:0 0 auto;width:16px;height:16px;border-radius:50%;background:var(--navy);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;}
  /* 정렬 토글 */
  .prc-sort{display:flex;gap:2px;background:var(--surface-2);border-radius:var(--r-sm);padding:2px;margin-bottom:10px;}
  .prc-sort button{flex:1;border:0;background:transparent;color:var(--text-muted);font-size:10.5px;font-weight:700;padding:5px 6px;border-radius:5px;cursor:pointer;font-family:inherit;line-height:1.1;}
  .prc-sort button.on{background:var(--surface);color:var(--navy);box-shadow:var(--sh-1);}
  /* 후보 심각도 도트 (상태 언어 재사용) */
  .prc-sev{flex:0 0 auto;width:8px;height:8px;border-radius:50%;box-shadow:0 0 0 2px var(--surface);}
  .prc-item.due .prc-nm{font-weight:800;}
  .prc-nm{flex:1;min-width:0;font-size:11.5px;font-weight:700;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .prc-dt{flex:0 0 auto;font-size:10.5px;font-weight:700;color:var(--teal);white-space:nowrap;}

<script>
/* [보안] 병원 데이터는 정적 파일에 두지 않는다 — 인증된 병원정보DB API에서 런타임 로드(applyDB) */
const HOSPITALS = [];
const KAKAO_JS_KEY = '44dadb8113fce5e8188f03bbdcd27fc6';
/* [날짜] 예전엔 `const TODAY = new Date()` 로 로드 시각을 고정했다. 공용 PC 는 탭을
   하루 종일 열어 두므로 자정을 넘겨도 점검 경과일·상태가 어제 값에 머물렀다
   (현장 일정은 Asia/Seoul 로 초기화되는데 화면만 어제였다).
   → 필요한 시점마다 Asia/Seoul 날짜를 계산하고(BazDate), 날짜가 바뀌면 다시 그린다. */
/* handover_gas.gs 배포 URL (handover.html·dashboard.html의 HANDOVER_URL과 동일) */
const HANDOVER_URL='https://script.google.com/macros/s/AKfycbwhf3fnxQPSM4cDLVEls0gtGgVGIpNOP83gMiBn-7JZmWciIsAlxyf4cYmPRiA2Ct0/exec';
/* [보안] 조회 API 인증 토큰 부착 헬퍼 (auth.js의 BazAuth.withToken 사용) */
function _tk(u){ try{ return (window.BazAuth&&BazAuth.withToken)?BazAuth.withToken(u):u; }catch(e){ return u; } }

/* ===== 공통 조회 계층 (bazGet) =====
   예전에는 조회마다 fetch(...).then(r=>r.json()).catch(()=>{}) 를 직접 썼다. 그 결과
   ① 응답이 오지 않아도 영원히 매달려 있고(타임아웃 없음)
   ② GAS가 데이터 대신 로그인/권한 HTML을 주면 r.json()이 던지고 catch가 삼키고
   ③ 서버가 {success:false, error:'unauthorized …'}(토큰 만료)를 줘도 그냥 무시했다.
   → 화면은 캐시된 옛 데이터로 멀쩡해 보이는데 연동만 조용히 죽어, 재접속해야 풀렸다.
   dashboard-pc.html의 fetchTimeout/diagnoseFail과 같은 계층을 여기에도 둔다.
   실패는 {kind:'timeout'|'html'|'parse'|'network'|'auth'|'server'} 로 분류해 던진다. */
var BAZ_GET_TIMEOUT=20000;
function bazGet(url, ms){
  var ctl=('AbortController' in window)?new AbortController():null;
  var t=ctl?setTimeout(function(){ try{ ctl.abort(); }catch(_){} }, ms||BAZ_GET_TIMEOUT):null;
  return fetch(_tk(url), ctl?{method:'GET', signal:ctl.signal}:{method:'GET'})
    .then(function(r){
      if(t){ clearTimeout(t); t=null; }
      if(!r.ok) throw {kind:'http',status:r.status};
      return r.text().then(function(txt){
        if(/^\s*</.test(txt)) throw {kind:'html'};        /* 데이터 대신 로그인/권한 페이지 */
        var d; try{ d=JSON.parse(txt); }catch(e){ throw {kind:'parse'}; }
        /* 서버가 명시적으로 인증 거부 → 조용히 무시하지 않고 위로 올린다 */
        if(d && d.success===false && /unauthorized|토큰|로그인/i.test(String(d.error||''))) throw {kind:'auth', error:d.error};
        bazAuthOk();                                      /* 정상 응답 1회 → 만료 배너 해제 */
        return d;
      });
    })
    .catch(function(e){
      if(t){ clearTimeout(t); t=null; }
      /* [오탐 수정] HTML 응답은 토큰 만료가 아니라 GAS 콜드스타트·리다이렉트 등 '일시적'
         현상이다(auth.js도 HTML을 'warmup'으로 보고 재시도한다). 실제 만료는 서버가
         {success:false, error:'unauthorized …'} JSON을 주며 여기선 kind:'auth'로 온다.
         예전엔 HTML도 만료로 세어, 로그인이 멀쩡한데도 서버가 잠깐 식으면 배너가 떴다
         (새로고침하면 백엔드가 데워지고 카운터가 0으로 리셋돼 사라졌다가, 다음 콜드스타트에
         다시 뜨는 증상). → 서버가 명시적으로 거부한 kind:'auth'만 만료 배너로 센다. */
      if(e && e.kind){ if(e.kind==='auth') bazAuthFail(); throw e; }
      if(e && e.name==='AbortError') throw {kind:'timeout'};
      throw {kind:'network'};
    });
}
function bazTransient_(e){
  return !!(e && (e.kind==='html' ||
    (e.kind==='http' && (e.status===404 || e.status===408 || e.status===429 || e.status>=500))));
}
function bazGetRetry(url, tries, ms){
  return bazGet(url,ms).catch(function(e){
    if(tries>1 && bazTransient_(e)){
      return new Promise(function(resolve){ setTimeout(resolve,700); })
        .then(function(){ return bazGetRetry(url,tries-1,ms); });
    }
    throw e;
  });
}

/* ===== 인증 만료 배너 =====
   토큰 검사는 auth.js의 guardPage_가 페이지 로드 시 1회만 한다. 세션 도중 토큰이
   만료·폐기되면 모든 조회가 unauthorized로 떨어지는데 예전에는 아무 표시가 없었다.
   단, 한 번의 실패로 배너를 띄우면 오탐이 난다(커밋 06f43ef에서 실제로 되돌린 이력).
   → 연속 2회 실패에서만 띄우고, 정상 응답이 한 번 오면 즉시 해제한다.
   또한 '실패'는 서버가 명시적으로 거부한 것(kind:'auth' = unauthorized JSON)만 센다.
   GAS 콜드스타트가 돌려주는 HTML 페이지는 만료 신호가 아니므로 배너 카운터에서 제외한다
   (예전엔 HTML도 세어, 로그인이 멀쩡한데도 서버가 잠깐 식으면 배너가 떴다). */
var bazAuthFailN=0, bazAuthBannerOn=false;
function bazAuthFail(){
  bazAuthFailN++;
  if(bazAuthFailN>=2) bazAuthBanner(true);
}
function bazAuthOk(){
  bazAuthFailN=0;
  if(bazAuthBannerOn) bazAuthBanner(false);
}
function bazAuthBanner(show){
  bazAuthBannerOn=!!show;
  var el=document.getElementById('bazAuthBanner');
  if(!show){ if(el) el.remove(); return; }
  if(el) return;
  el=document.createElement('div');
  el.id='bazAuthBanner';
  el.innerHTML='<span>⚠️ 서버 연동이 끊겼습니다 — 로그인이 만료되었을 수 있습니다.</span>'+
               '<button type="button" id="bazAuthBannerGo">다시 로그인</button>';
  document.body.appendChild(el);
  var go=document.getElementById('bazAuthBannerGo');
  if(go) go.addEventListener('click', function(){ location.href='index.html'; });
}
/* 배너가 떠 있는 동안(=서버가 계속 거부) 7초 폴링을 유지할 이유가 없다 — 폴링 간격 계산에서 참조 */
function bazAuthBlocked(){ return bazAuthBannerOn; }

function normalize(s){ return (s||'').toLowerCase().replace(/\s+/g,''); }
function isNcare(h){ return h.nc && h.nc!=='미가입'; }
function isDue(h){ return isNcare(h) && ['점검대상','권고','경고','미점검'].includes(h.st); }
/* 경과일 — 기준은 "지금의 Asia/Seoul 오늘". 날짜 문자열끼리 비교하므로
   기기 표준시간대가 어긋나 있어도 서버·시트와 같은 값이 나온다. */
function daysSince(dateStr){ return BazDate.daysSince(dateStr); }

function distKm(lat1,lng1,lat2,lng2){
  const R=6371, toR=x=>x*Math.PI/180;
  const dLat=toR(lat2-lat1), dLng=toR(lng2-lng1);
  const a=Math.sin(dLat/2)**2+Math.cos(toR(lat1))*Math.cos(toR(lat2))*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
/* [XSS] 이스케이프는 js/baz-dom.js 한 곳에만 둔다(테스트도 그 모듈을 본다).
   escapeHtml = 텍스트 문맥, escAttr = 속성 문맥(백틱·= 까지 차단).
   ★ 원격 데이터를 JavaScript 문맥(onclick="…")에 넣는 코드는 더 이상 만들지 않는다 —
     클릭은 전부 data-* 속성 + 이벤트 위임으로 처리한다. */
function escapeHtml(s){ return BazDom.escapeHtml(s); }
function escAttr(s){ return BazDom.escapeAttr(s); }
/* 상태 문자열 → CSS 클래스(허용 목록). 목록에 없으면 중립 클래스 */

/* 스크린리더 안내 — 색·아이콘만으로 전달되던 상태 변화를 문장으로도 알린다 */
function bazAnnounce(msg){

// N-CARE 점검 경과 위험도: over(90일초과/미점검), near(60~90), null
function dueLevel(h){
  if(!isNcare(h)) return null;
  if(h.st==='미점검') return 'over';
  const dd=daysSince(h.li);
  if(dd==null) return 'over';
  if(dd>90) return 'over';
  if(dd>60) return 'near';
  return null;
}

// ===== 검색 대상 문자열(병원명·주소·장비·거래처·UI/HP Ver·AS 유무상) =====
function searchHaystack(h){
  const vendor=(h.d||'').trim();
  const vendorLabel=vendor==='납품 1년 이내'?'워런티 유효':'';
  const hpVer=(h.hpv||'').trim()||getLastHpVer(h.n);
  const uiVer=(h.uiv||'').trim()||getLastUiVer(h.n);
  return normalize([h.n,h.a,h.s,vendor,vendorLabel,hpVer,uiVer,h.as,pcSkillLabel(h.n)].join(' '));
}
// ===== 필터 카운트 공용 조건 (다른 활성 필터 반영) =====
function matchSearchQ(h){
  if(!searchQ) return true;
  return searchHaystack(h).includes(normalize(searchQ));
}
function matchChipFilter(h){
  if(curFilter==='ncare') return isNcare(h);
  if(curFilter==='due') return isDue(h);
  return true;
}

// ===== 필터 드롭다운 채우기 (교차 필터 카운트) =====
function populateFilters(){
  const salesSet={}, regionSet={};
  HOSPITALS.forEach(h=>{
    // 영업담당 카운트: 칩·지역·검색 반영(영업담당 자신은 제외), 옵션 목록은 전체 유지
    if(h.sa && h.sa!=='장비OUT'){
      if(!(h.sa in salesSet)) salesSet[h.sa]=0;
      if(matchChipFilter(h)&&(!regionFilter||h.rg===regionFilter)&&matchSearchQ(h)) salesSet[h.sa]++;
    }
    // 지역 카운트: 칩·영업담당·검색 반영(지역 자신은 제외), 옵션 목록은 전체 유지
    if(h.rg){
      if(!(h.rg in regionSet)) regionSet[h.rg]=0;
      if(matchChipFilter(h)&&(!salesFilter||h.sa===salesFilter)&&matchSearchQ(h)) regionSet[h.rg]++;
    }
  });
  const sf=document.getElementById('salesFilter');
  while(sf.options.length>1) sf.remove(1);
  Object.keys(salesSet).sort((a,b)=>salesSet[b]-salesSet[a]).forEach(s=>{
    const o=document.createElement('option'); o.value=s; o.textContent=s+' ('+salesSet[s]+')'; sf.appendChild(o);
  });
  if(salesFilter && !(salesFilter in salesSet)) salesFilter='';
  sf.value=salesFilter;
  const rf=document.getElementById('regionFilter');
  while(rf.options.length>1) rf.remove(1);
  Object.keys(regionSet).sort((a,b)=>regionSet[b]-regionSet[a]).forEach(r=>{
    const o=document.createElement('option'); o.value=r; o.textContent=r+' ('+regionSet[r]+')'; rf.appendChild(o);
  });
  if(regionFilter && !(regionFilter in regionSet)) regionFilter='';
  rf.value=regionFilter;
}

// ===== 필터링 =====
function getFiltered(){
  let list=HOSPITALS.slice();
  if(curFilter==='ncare') list=list.filter(isNcare);
  else if(curFilter==='due') list=list.filter(isDue);
  if(salesFilter) list=list.filter(h=>h.sa===salesFilter);
  if(regionFilter) list=list.filter(h=>h.rg===regionFilter);
  if(searchQ){
    const nq=normalize(searchQ);
    list=list.filter(h=>searchHaystack(h).includes(nq));
  }
  const stOrder={'미점검':0,'경고':1,'권고':2,'점검대상':3,'정상':4};
  list.sort((a,b)=>{
    const na=isNcare(a), nb=isNcare(b);
    if(na!==nb) return na?-1:1;
    if(na&&nb){
      const sa=stOrder[a.st]??5, sb=stOrder[b.st]??5;
      if(sa!==sb) return sa-sb;
      return (a.li||'').localeCompare(b.li||'');
    }
    return (b.li||'').localeCompare(a.li||'');
  });
  return list;
}

  if(h.li&&dd!=null) return label+' '+h.li+' · '+t('dayAgo').replace('{d}',dd);
  return noLabel;
}
// 각 병원의 마지막 핸드피스 교체 버전 추출 (이력 기반, 실시간 동기화 반영)
// 핸드피스 버전은 1.x 대역만 존재 (FW/UI의 2.x·3.x와 구분)
// [성능] HP/UI 버전 추출은 병원별 HISTORY 정규식 스캔이라 비싸다 →
// 결과를 메모이즈하고 HISTORY 변경(동기화/편집) 시 무효화한다.
var verMemo={hp:{},ui:{}};
function bazClearVerMemo(){ verMemo.hp={}; verMemo.ui={}; }
function getLastHpVer(name){
  if(name in verMemo.hp) return verMemo.hp[name];
  var v=getLastHpVerRaw(name); verMemo.hp[name]=v; return v;
}
function getLastUiVer(name){
  if(name in verMemo.ui) return verMemo.ui[name];
  var v=getLastUiVerRaw(name); verMemo.ui[name]=v; return v;
}
function getLastHpVerRaw(name){
  var recs=HISTORY[name];
  if(!recs||!recs.length) return '';
  function pickHp(s){
    if(!s) return '';
    // (구버전→신버전) 패턴 중 신버전이 1.x인 것만
    var re=/(\d\.\d(?:\.\d)?)\s*(?:→|▶|->|~>)\s*(1\.\d(?:\.\d)?)/g, m, last='';
    while((m=re.exec(s))!==null){ last=m[2]; }
    if(last) return last;
    // HP 1.x.x 명시
    m=s.match(/HP\s*(1\.\d(?:\.\d)?)/);
    if(m) return m[1];
    return '';
  }
  for(var i=0;i<recs.length;i++){ // 이력은 최신순 정렬
    var r=recs[i];
    var pt=r.pt||'', p=r.p||'', fx=r.fx||'';
    var isHp=(pt.indexOf('핸드피스')>=0)||(p.indexOf('Handpiece')>=0)||(p.indexOf('HP')>=0)||(fx.indexOf('HP A')>=0)||(fx.indexOf('HP 교체')>=0)||(fx.indexOf('핸드피스')>=0&&fx.indexOf('교체')>=0);
    if(!isHp) continue;
    // p(부품) 먼저, 그 다음 fx(내용)
    var ver=pickHp(p) || pickHp(fx);
    if(ver) return ver;
  }
  return '';
}

// 각 병원의 마지막 UI 버전 추출 (FW는 제외, UI만)
// UI 버전은 2.x~3.x 대역, 'UI' 라벨로 FW와 구분
function getLastUiVerRaw(name){
  var recs=HISTORY[name];
  if(!recs||!recs.length) return '';
  function pickUI(s){
    if(!s) return '';
    var re=/UI\s*\(?\s*(\d\.\d(?:\.\d+)?)\s*(?:→|▶|->|~>)\s*(\d\.\d(?:\.\d+)?)/g, m, last='';
    while((m=re.exec(s))!==null){ last=m[2]; }
    if(last) return last;
    var m2=s.match(/UI[\s\(]*(\d\.\d(?:\.\d+)?)/);
    if(m2) return m2[1];
    return '';
  }
  // 'x.x.0' 또는 'x.x.02' 같은 잘림은 'x.x'로 정규화
  function norm(v){ var m=v.match(/^(\d\.\d)(?:\.\d+)?$/); return m?m[1]:v; }
  // 1순위: sy(유형)에 업그레이드/UI 표기된 건
  for(var i=0;i<recs.length;i++){
    var sy=recs[i].sy||'', fx=recs[i].fx||'';
    if(sy.indexOf('업그레이드')>=0 || sy.indexOf('UI')>=0){
      var v=pickUI(fx); if(v) return norm(v);
    }
  }
  // 2순위: 아무 이력의 fx에서 UI 버전
  for(var i=0;i<recs.length;i++){
    var v=pickUI(recs[i].fx||''); if(v) return norm(v);
  }
  return '';
}

/* ── 카드/표/상세 공용 액션 버튼 ────────────────────────────────────────────
   예전에는 버튼마다 onclick="window.open('…')" / onclick="openHist('○○병원')" 를
   문자열로 만들었다. 병원명에 따옴표·역슬래시가 있으면 그 자리에서 코드가 끊겨
   버튼이 죽거나(따옴표) 임의 코드가 실행됐다(escapeHtml 은 JS 문맥을 막지 못한다).
   → 병원명은 data-hn 속성(HTML 속성 문맥)에만 넣고, URL 은 클릭 시점에
     이벤트 위임 핸들러가 그 이름으로 병원을 찾아 직접 만든다. */
function pcActionButtons(h, opts){
  opts = opts || {};
  var hn = escAttr(h.n);
  function btn(act, cls, label){
    return '<button type="button"'+(opts.plain?'':' class="'+cls+'"')+' data-hact="'+act+'" data-hn="'+hn+'">'+label+'</button>';
  }
  return btn('nmap','nmap','🗺️ '+escapeHtml(t('nmap')))+
         btn('insp','insp','📋 '+escapeHtml(t('insp')))+
         btn('surv','surv','⭐ '+escapeHtml(t('surv')));
}
/* 액션별 목적지 — 문자열 조합은 여기 한 곳에서만, 값은 encodeURIComponent 로 */
function pcActionUrl(act, h){
  var q=encodeURIComponent;
  if(act==='nmap') return 'https://m.map.naver.com/search2/search.naver?query='+q(h.n);
  if(act==='insp') return 'inspection.html?h='+q(h.n)+'&sn='+q(h.s||'')+'&nc='+q(h.nc||'')+'&e='+q(h.sa||'');
  if(act==='surv') return 'survey.html?h='+q(h.n)+'&e='+q(h.sa||'');
  return '';
}
function pcRunAction(act, name){
  var h=pcHospByName(name)||{n:name};
  if(act==='hist'){ openHist(h.n||name); return; }
  var url=pcActionUrl(act, h);
  if(!url) return;
  /* 외부 지도는 새 창 — noopener/noreferrer 로 원본 창 조작(window.opener) 차단 */
  if(act==='nmap'){ BazDom.openExternal(url, 'bazNaverMap'); return; }
  location.href=url;
}
/* 카드·표·상세·최근처리 어디서 눌러도 같은 경로로 처리 */
document.addEventListener('click', function(e){
  var b=e.target.closest('[data-hact]'); if(!b) return;
  e.preventDefault(); e.stopPropagation();
  pcRunAction(b.getAttribute('data-hact'), b.getAttribute('data-hn')||'');
});

  const uiVer=(h.uiv||'').trim()||getLastUiVer(h.n);

    '<div class="h-card-head"><div style="min-width:0;"><div class="h-name">'+escapeHtml(h.n)+'</div>'+distHtml+'</div>'+badge+'</div>'+
    '<div class="h-meta">'+

      '<div class="line"><span class="ico">🔧</span><span>'+escapeHtml(h.s||'-')+' · '+escapeHtml(t('sales'))+' '+escapeHtml(h.sa||'-')+'</span></div>'+
      '<div class="line"><span class="ico">📅</span><span>'+escapeHtml(statusDays(h))+'</span></div>'+
    '</div>'+ (warnTag?'<div>'+warnTag+'</div>':'') +
    '<div class="h-tags">'+ncareTag+asTag+salesTag+hpTag+uiTag+vendorTag+'</div>'+
    '<div class="h-actions">'+pcActionButtons(h)+'</div>'+
    ((histBtn||skillBadge)?'<div class="h-actions" style="margin-top:6px;align-items:center;">'+histBtn+skillBadge+'</div>':'')+

// ===== 카카오맵 지도 =====
// [안정성] 예전에는 "로딩 완료" 가드(kakaoLoaded)만 있고 "로딩 중" 가드가 없었다.
// 부팅 직후 pcShowMap과 geocodeMissing이 거의 동시에 호출하므로 SDK <script>가 2개 이상 붙고,
// SDK가 두 번 평가되면 kakao.maps 네임스페이스가 재초기화되어 이미 만들어진 지도·마커가
// 옛 네임스페이스를 참조한 채 남는다(타일 회색화·마커 실종).
// → 로딩 중이면 콜백 큐에 합류시키고 <script>는 단 하나만 붙인다.
var kakaoWaiters=null;
function loadKakao(cb){
  if(kakaoLoaded){ cb(); return; }
  if(!KAKAO_JS_KEY || KAKAO_JS_KEY.indexOf('__')===0){ cb(false); return; }
  if(kakaoWaiters){ kakaoWaiters.push(cb); return; }     // ★ in-flight 합류 — 중복 로드 차단
  kakaoWaiters=[cb];
  function drain(arg){
    var q=kakaoWaiters||[]; kakaoWaiters=null;
    q.forEach(function(fn){ try{ fn(arg); }catch(e){ console.warn('[지도] SDK 콜백 오류:',e); } });
  }
  const s=document.createElement('script');
  s.src='https://dapi.kakao.com/v2/maps/sdk.js?appkey='+KAKAO_JS_KEY+'&autoload=false&libraries=services,clusterer';
  s.onload=()=>{
    try{ kakao.maps.load(()=>{ kakaoLoaded=true; drain(); }); }
    catch(e){ console.warn('[지도] SDK 초기화 실패:',e); drain(false); }
  };
  s.onerror=()=>{ try{ s.remove(); }catch(_){}  drain(false); };   // 실패한 태그는 치워 다음 시도가 새로 붙게
  document.head.appendChild(s);
}

// ===== 주소 → 좌표 지오코딩 (좌표 없는 병원 자동 보정) =====
// 병원정보DB에 주소는 있으나 좌표(lat/lng)가 없는 병원을 카카오 지오코더로 채운다.
// 결과는 주소 문자열 기준으로 localStorage 캐시(성공/실패 모두) → 재호출·쿼터 절약.
var GEO_CACHE_KEY='baz_geocache';
var geoCache=(function(){ try{ return JSON.parse(localStorage.getItem(GEO_CACHE_KEY)||'{}')||{}; }catch(e){ return {}; } })();
var geoRunning=false;
function geoSaveCache(){ try{ localStorage.setItem(GEO_CACHE_KEY, JSON.stringify(geoCache)); }catch(e){} }
function geocodeMissing(cb){
  if(geoRunning){ if(cb) cb(0); return; }
  var targets=HOSPITALS.filter(function(h){ return (h.lat==null||h.lng==null) && String(h.a||'').trim(); });
  if(!targets.length){ if(cb) cb(0); return; }
  // 1) 캐시(성공분) 먼저 적용
  var applied=0;
  targets.forEach(function(h){
    var c=geoCache[String(h.a).trim()];
    if(c && c.lat!=null){ h.lat=c.lat; h.lng=c.lng; applied++; }
  });
  // 캐시에 없는(성공/실패 모두 미기록) 주소만 실제 조회
  var remain=targets.filter(function(h){ return (h.lat==null||h.lng==null) && !(String(h.a).trim() in geoCache); });
  if(!remain.length){ if(cb) cb(applied); return; }
  geoRunning=true;
  loadKakao(function(ok){
    if(ok===false || typeof kakao==='undefined' || !kakao.maps || !kakao.maps.services){
      geoRunning=false; if(cb) cb(applied); return;
    }
    var geocoder=new kakao.maps.services.Geocoder();
    var i=0, filled=0;
    (function next(){
      if(i>=remain.length){ geoRunning=false; geoSaveCache(); if(cb) cb(applied+filled); return; }
      var h=remain[i++], addr=String(h.a).trim();
      // 같은 주소가 앞선 반복에서 이미 조회됨(중복 병원) → 캐시 재사용, 재호출 안 함
      if(addr in geoCache){
        var c=geoCache[addr];
        if(c && c.lat!=null){ h.lat=c.lat; h.lng=c.lng; filled++; }
        next(); return;
      }
      geocoder.addressSearch(addr, function(result, status){
        if(status===kakao.maps.services.Status.OK && result && result[0]){
          var la=parseFloat(result[0].y), ln=parseFloat(result[0].x);
          if(!isNaN(la)&&!isNaN(ln)){ h.lat=la; h.lng=ln; geoCache[addr]={lat:la,lng:ln}; filled++; }
          else { geoCache[addr]={lat:null,lng:null}; }
        } else {
          geoCache[addr]={lat:null,lng:null};   // 실패도 캐시(주소가 바뀌면 키가 달라져 재시도)
        }
        setTimeout(next, 130);   // 쿼터 보호용 throttle
      });
    })();
  });
}
// 지오코딩 후 좌표가 채워지면 목록/지도/이동시간 카드 재렌더

  });
}

function renderDash(){
  const ncare=HOSPITALS.filter(isNcare);
  // 경과 버킷
  const ages={normal:0,target:0,rec:0,warn:0,none:0};
  ncare.forEach(h=>{
    if(h.st==='미점검'||!h.li){ ages.none++; return; }
    const dd=daysSince(h.li);
    if(dd==null){ ages.none++; }
    else if(dd<=30) ages.normal++;
    else if(dd<=60) ages.target++;
    else if(dd<=90) ages.rec++;
    else ages.warn++;
  });
  const maxAge=Math.max(ages.normal,ages.target,ages.rec,ages.warn,ages.none,1);
  function bar(label,val,color){
    const w=Math.round(val/maxAge*100);
    return '<div class="bar-row"><div class="bar-label">'+label+'</div><div class="bar-track"><div class="bar-fill" style="width:'+(val?Math.max(w,8):0)+'%;background:'+color+'">'+(val||'')+'</div></div></div>';
  }
  // 상태 분포 (도넛 대신 범례+막대)
  const stCount={};
  ncare.forEach(h=>{ const s=h.st||'미점검'; stCount[s]=(stCount[s]||0)+1; });
  // 상태색 단일 소스: CSS 토큰(var)을 그대로 사용 → 다크모드 자동 적응
  const stColors={'정상':'var(--ok)','점검대상':'var(--teal)','권고':'var(--warn)','경고':'var(--danger)','미점검':'var(--neutral)'};
  const stTotal=ncare.length;
  let donut='';
  let acc=0; const segs=[];
  ['정상','점검대상','권고','경고','미점검'].forEach(s=>{
    const v=stCount[s]||0; if(!v) return;

  const overviewCard=
    '<div class="dash-card"><div class="dash-title">'+t('dashOverview')+'</div>'+

            '<circle cx="52" cy="52" r="'+opR+'" fill="none" style="stroke:'+opColor+'" stroke-width="11" stroke-linecap="round" stroke-dasharray="'+opDash.toFixed(1)+' '+(opC-opDash).toFixed(1)+'" transform="rotate(-90 52 52)"/>'+
          '</svg>'+

        '</div>'+
        '<div class="oprate-info">'+
          '<div class="oprate-main">정상 운영 <b style="color:var(--ok)">'+opNormal+'</b>곳 <span>/ 전체 '+opTotal+'곳</span></div>'+
          '<div class="oprate-sub">점검 필요 <b>'+opDue+'</b>곳 · 경고·미점검 <b>'+opUrgent+'</b>곳</div>'+
        '</div>'+
      '</div>'+
      '<hr class="dash-divider">'+
      // ② 점검 상태 분포
      '<div class="dash-subtitle">'+t('dashSubStatus')+'</div>'+
      '<div class="donut-wrap"><div style="width:120px;height:120px;border-radius:50%;background:'+donutBg+';flex:0 0 auto;position:relative;"><div style="position:absolute;inset:26px;background:var(--surface);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:var(--navy);">'+stTotal+'</div></div>'+
        '<div class="legend">'+legend+'</div></div>'+
