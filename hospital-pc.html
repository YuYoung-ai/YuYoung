// ===== 최근 완료(현장 처리) — handover 시트 기록 반영 =====
// handover 시트의 병원명 → HOSPITALS 항목.
// [수정] 예전 2차 폴백은 양방향 부분 문자열 매칭(n.indexOf(k)>=0 || k.indexOf(n)>=0)이라
// "○○병원"이 "○○병원 별관"에 붙는 식으로 엉뚱한 병원을 집었고, 그 좌표에 오늘완료(초록)·
// 진행중(파랑) 마커가 찍혀 지도 표시가 어긋났다. 접두 일치까지만 허용하고, 후보가 둘 이상이면
// 판단하지 않는다(틀린 곳에 찍느니 안 찍는 편이 낫다).
function pcHospByName(name){
  var k=normalize(name); if(!k) return null;
  for(var i=0;i<HOSPITALS.length;i++){ if(normalize(HOSPITALS[i].n)===k) return HOSPITALS[i]; }
  var hit=null, cnt=0;
  for(var j=0;j<HOSPITALS.length && cnt<2;j++){
    var n=normalize(HOSPITALS[j].n); if(!n) continue;
    if(n.indexOf(k)===0 || k.indexOf(n)===0){ hit=HOSPITALS[j]; cnt++; }
  }
  return cnt===1 ? hit : null;   // 모호하면 null
}
function pcMergeRecent(rows){
  var seen={}, out=[];
  (rows||[]).forEach(function(r){
    var hosp=String(r.hosp||'').trim(); if(!hosp) return;
    var date=String(r.date||'').trim(), fse=String(r.fse||'').trim();
    var key=normalize(hosp)+'|'+date+'|'+normalize(fse);
    if(seen[key]) return; seen[key]=1;
    out.push({hosp:hosp, fse:fse, date:date, gubun:String(r.gubun||'').trim()});
  });
  out.sort(function(a,b){ return pcDateKey(b.date).localeCompare(pcDateKey(a.date)); });
  return out.slice(0,40);
}
function pcLocalRecent(){ try{ return JSON.parse(localStorage.getItem('baz_recent_handover')||'[]')||[]; }catch(e){ return []; } }

/* ── 사용자 숙련도 평가 (handover R·S·T열) — 병원별 최신 1건만 카드 배지로 ──
   ※ PC_SKILL 초기화는 렌더보다 먼저 실행되어야 하므로 상단 유틸 영역에 있음 */
function pcBuildSkill(rows){
  var map={};
  (rows||[]).forEach(function(r){
    var hosp=String(r.hosp||'').trim(); if(!hosp) return;
    var nsFill=String(r.nsFill||'').trim(), nsAmt=String(r.nsAmt||'').trim(), jet=String(r.jet||'').trim();
    if(!nsFill && !nsAmt && !jet) return;                 /* 평가 없는 기록은 무시 */
    var k=normalize(hosp), dk=pcDateKey(r.date);
    if(map[k] && map[k].dk >= dk) return;                 /* 더 최근 방문 값만 유지 */
    map[k]={dk:dk, nsFill:nsFill, nsAmt:nsAmt, jet:jet};
  });
  PC_SKILL=map;
  try{ localStorage.setItem('baz_pc_skill_cache', JSON.stringify(map)); }catch(e){}
}
/* 병원별 숙련도 라벨: 3항목 중 X·부족·교육 필요면 '교육 필요', 그 외(O·정상·과다·가능)는 '교육 완료'.
   평가 데이터 없으면 '' — 배지·검색 대상 공용 */
function pcSkillLabel(name){
  var s=PC_SKILL && PC_SKILL[normalize(name)];
  if(!s) return '';
  return (s.nsFill==='X'||s.nsAmt==='부족'||s.jet==='교육 필요') ? '교육 필요' : '교육 완료';
}
function pcSkillBadge(name){
  var s=PC_SKILL && PC_SKILL[normalize(name)];   /* 초기화 전이어도 카드 렌더가 죽지 않도록 방어 */
  if(!s) return '';
  var label=pcSkillLabel(name), need=(label==='교육 필요');
  var detail=['NS충진 '+(s.nsFill||'-'), '충진량 '+(s.nsAmt||'-'), '젯 '+(s.jet||'-')].join(' · ');
  return '<span class="h-skill'+(need?' warn':' ok')+'" title="'+escAttr('사용자 숙련도 평가 · '+detail+(s.dk?' · '+s.dk:''))+'">'+(need?'🎓':'✅')+' '+label+'</span>';
}
/* [부하] action=all은 handover 시트 전체를 받는 무거운 요청이라 5분 캐시가 필수다.
   그런데 예전에는 신선도 판정을 localStorage의 baz_pc_recent_ts에만 의존해서,
   localStorage 쓰기가 실패하면(용량 초과 등) ts가 영영 안 써지고 폴링마다(최소 7초)
   시트 전체를 다시 받았다. → 메모리 변수를 진실로 삼고 localStorage는 부가 캐시로만 쓴다. */
var PC_RECENT_TTL=5*60*1000;
var pcRecentTs=(function(){ try{ return parseInt(localStorage.getItem('baz_pc_recent_ts')||'0',10)||0; }catch(e){ return 0; } })();
var PC_RECENT_REV_KEY='baz_pc_recent_rev';
var PC_RECENT_REV=(function(){ try{return localStorage.getItem(PC_RECENT_REV_KEY)||'';}catch(e){return '';} })();
var pcRecentInFlight=false, pcRecentBooted=false, pcRecentPromise=null, pcRecentForce=false;
function pcLoadRecent(cb, force){
  var local=pcLocalRecent();
  var cached=null;
  try{ cached=JSON.parse(localStorage.getItem('baz_pc_recent_cache')||'null'); }catch(e){}
  if(!pcRecentBooted){
    pcRecentBooted=true;
    if(!(cached && cached.length)){
      /* rev만 남고 본문 캐시가 사라졌다면 nochange를 보내면 빈 화면이 굳는다. */
      pcRecentTs=0; PC_RECENT_REV='';
      try{ localStorage.removeItem(PC_RECENT_REV_KEY); }catch(e){}
    }
  }
  if(cached && cached.length){ pcRecent=pcMergeRecent(local.concat(cached)); pcRecentState='done'; if(!pcFseAll.length) pcCollectFse(local.concat(cached), false); try{ pcAutoAdvanceFromHandover(); }catch(e){} if(cb) cb(); }
  else if(local.length){ pcRecent=pcMergeRecent(local); if(!pcFseAll.length) pcCollectFse(local, false); try{ pcAutoAdvanceFromHandover(); }catch(e){} if(cb) cb(); }
  if(!force && pcRecentTs && (Date.now()-pcRecentTs)<PC_RECENT_TTL) return Promise.resolve(true);
  if(!HANDOVER_URL){ if(!pcRecent.length){ pcRecentState='done'; } return Promise.resolve(!!pcRecent.length); }
  if(pcRecentInFlight){
    if(force && !pcRecentForce) return pcRecentPromise.then(function(){ return pcLoadRecent(cb,true); });
    if(cb && pcRecentPromise) pcRecentPromise.then(cb,cb);
    return pcRecentPromise||Promise.resolve(false);
  }
  pcRecentInFlight=true;
  pcRecentForce=!!force;
  if(pcRecentState!=='done') pcRecentState='loading';
  var rq=force?'&force=1':(PC_RECENT_REV?'&rev='+encodeURIComponent(PC_RECENT_REV):'');
  var bootReady=(!force && window.bazBootReady)?window.bazBootReady:Promise.resolve(true);
  pcRecentPromise=Promise.resolve(bootReady).then(function(){
    return bazGetRetry(HANDOVER_URL+'?action=all'+rq,2);
  })
    .then(function(d){
      if(d&&d.nochange){
        PC_RECENT_REV=d.rev||PC_RECENT_REV;
        pcRecentTs=Date.now();
        try{ localStorage.setItem('baz_pc_recent_ts',String(pcRecentTs)); if(PC_RECENT_REV)localStorage.setItem(PC_RECENT_REV_KEY,PC_RECENT_REV); }catch(e){}
        return true;
      }
      var data=(d&&d.data)||[];
      pcRecent=pcMergeRecent(pcLocalRecent().concat(data));
      pcCollectFse(data, true);
      pcBuildSkill(data);
      pcRecentState='done';
      pcRecentTs=Date.now();
      PC_RECENT_REV=(d&&d.rev)||PC_RECENT_REV;
      try{ localStorage.setItem('baz_pc_recent_cache', JSON.stringify(pcRecent)); localStorage.setItem('baz_pc_recent_ts', String(pcRecentTs)); if(PC_RECENT_REV)localStorage.setItem(PC_RECENT_REV_KEY,PC_RECENT_REV); }catch(e){}
      try{ pcAutoAdvanceFromHandover(); }catch(e){}
      if(cb) cb();
      return true;
    })
    .catch(function(e){
      pcRecentTs=Date.now()-PC_RECENT_TTL/2;
      pcRecentState=pcRecent.length?'done':'error';
      console.warn('[최근처리] 읽기 실패:', (e&&e.kind)||e);
      if(cb) cb();
      return false;
    });
  pcRecentPromise=pcRecentPromise.then(function(v){ pcRecentInFlight=false; pcRecentPromise=null; pcRecentForce=false; return v; },
    function(){ pcRecentInFlight=false; pcRecentPromise=null; pcRecentForce=false; return false; });
  return pcRecentPromise;
}
// 오늘 날짜(yyyy-MM-dd) — 서버(handover_gas.gs)·handover 시트와 동일하게 Asia/Seoul 고정.
// PC 시계/표준시간대가 어긋나 있으면 하루가 엉뚱한 시각에 넘어가 일정이 근무 중에 초기화되고
// '오늘 완료' 매칭도 빗나가므로 기기 로컬 시간을 쓰지 않는다(미지원 환경만 로컬로 폴백).
// 캐시는 함수 객체에 둔다(pcTodayStr._c). 이 함수는 선언보다 앞선 파싱 시점 코드
// (pcDailyResetCheck)에서 호출되므로, 모듈 스코프 var에 캐시를 두면 그 시점엔 아직
// undefined라 접근 자체가 예외가 되고 이후 스크립트 전체가 죽는다.
/* 구현은 js/baz-date.js 로 옮겼다 — 경과일(daysSince)·현장 일정·이력 추가가
   모두 같은 Asia/Seoul 날짜를 보게 하려면 계산이 한 곳에만 있어야 한다. */
function pcTodayStr(){ return BazDate.todayStr(); }
// 시트 표시형식(getDisplayValues)이 'yyyy. M. d' 등 로케일 형태로 오므로
// 구분자·공백에 상관없이 yyyy-MM-dd 키로 정규화 (handover 날짜 매칭 안정화)
function pcDateKey(s){
  if(!s) return '';
  var m=String(s).match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
  if(!m) return '';
  return m[1]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[3]).slice(-2);
}
function pcTodayList(){
  var today=pcTodayStr();
  return pcRecent.filter(function(r){ return pcDateKey(r.date)===today; });
}
// 좌측 필터 하단: 담당자 오늘 완료 카드
function pcRenderRecentCard(){
  var box=document.getElementById('pcRecentCard'); if(!box) return;
  var list=pcTodayList();
  // 총 건수는 오늘 전체 완료 건수 유지
  var head='<div class="rrc-head">'+escapeHtml(t('rcTodayDone'))+' <span class="rrc-cnt">'+list.length+escapeHtml(rcUnit())+'</span></div>';
  // 인원(FSE)별 가장 최신 완료 1건 + 건수 (pcTodayList는 오래된→최신 순 → 마지막이 최신)
  var latestByFse={}, cntByFse={}, order=[];
  list.forEach(function(r){
    var fse=String(r.fse||'').trim(); if(!fse) fse='(담당 미상)';
    if(!(fse in latestByFse)) order.push(fse);
    latestByFse[fse]=r; cntByFse[fse]=(cntByFse[fse]||0)+1;
  });
  // 현장 일정에서 진행중인 담당자(오늘 완료가 없어도 표시 → 일정↔완료 연동)
  var progByFse={};
  Object.keys(pcInProgress||{}).forEach(function(hn){ var f=pcInProgress[hn]; if(f){ progByFse[f]=hn; if(order.indexOf(f)<0) order.push(f); } });
  if(!order.length){
    var msg=(pcRecentState==='loading')?t('rcLoading'):(pcRecentState==='error')?t('rcLoadFail'):t('rcNoneToday');
    box.innerHTML=head+'<div class="rrc-empty">'+msg+'</div>'; return;
  }
  box.innerHTML=head+'<div class="rrc-list">'+order.map(function(fse){
    var r=latestByFse[fse];
    var g=(r&&r.gubun)?'<span class="rrc-g">'+escapeHtml(r.gubun)+'</span>':'';
    var cnt=cntByFse[fse]||0;
    var cntTag=(cnt>1)?'<span class="rrc-cnt2">오늘 '+cnt+'건</span>':'';
    var prog=progByFse[fse]||pcProgHospOf(fse);   // 이 담당자의 현재 진행중 병원(일정 기준)
    var progLine=prog
      ? '<div class="rrc-prog" data-hn="'+escAttr(prog)+'">🔵 '+escapeHtml(t('schProg'))+' · '+escapeHtml(prog)+
          '<button class="rrc-done" type="button" data-done-hn="'+escAttr(prog)+'" title="'+escAttr(t('schDone'))+'">'+escapeHtml(t('schDone'))+'</button></div>'
      : '';
    var nm = r ? escapeHtml(r.hosp) : ('🗺 '+escapeHtml(fse)+' · '+t('schActive'));
    var dataHn = r ? (function(){ var h=pcHospByName(r.hosp); return escAttr(h?h.n:r.hosp); })() : escAttr(prog||'');
    var meta = r
      ? '<div class="rrc-meta"><span class="fse">🧑‍🔧 '+escapeHtml(fse)+'</span>'+g+cntTag+'</div>'
      : '<div class="rrc-meta"><span class="fse">🧑‍🔧 '+escapeHtml(fse)+'</span><span class="rrc-g">'+t('schActive')+'</span></div>';
    return '<div class="rrc-item" data-hn="'+dataHn+'">'+
      (r?'<div class="rrc-nm">'+nm+'</div>':'')+
      meta+
      progLine+
    '</div>';
  }).join('')+'</div>';
}

// ===== 주변 병원 이동 소요시간 카드 =====
// 오늘 완료한 FSE 담당자별로, 가장 최근 처리 병원 위치 기준 가까운 병원 최대 3곳 + 예상 이동시간
function pcEstMin(km){ return Math.max(1, Math.round(km * 2.6)); }  // 도로계수 1.3 · 평균 30km/h 추정
// 정렬 모드: 'near'(가까운 순) | 'due'(점검필요 우선). localStorage 저장.
var pcRouteSort = (function(){ var v=localStorage.getItem('baz_pc_routesort'); return (v==='due'||v==='near')?v:'near'; })();
// 점검 심각도 랭크(높을수록 시급) — N-CARE 기준
function pcSevRank(h){ var m={'미점검':4,'경고':3,'권고':2,'점검대상':1}; return m[h.st]||0; }
function pcSevColor(h){
  if(!isNcare(h)) return 'var(--neutral)';
  return {'정상':'var(--ok)','점검대상':'var(--teal)','권고':'var(--warn)','경고':'var(--danger)','미점검':'var(--neutral)'}[h.st]||'var(--neutral)';
}
// 후보 병원 풀(현재 위치 from 기준). near=반경 5km(없으면 10km) 점검대상,
// due=반경 15km 점검대상(심각도 우선).
function pcRouteCandidates(from, mode){
  mode = mode || 'near';
  var all=[];
  for(var i=0;i<HOSPITALS.length;i++){
    var h=HOSPITALS[i];
    if(h.lat==null||h.lng==null) continue;
    if(h.n===from.n) continue;
    if(/^데모/.test(h.n)) continue;
    if(!isNcare(h)) continue;                          // N-CARE 가입 병원만
    if(!isDue(h)) continue;                             // 점검대상만
    all.push({h:h, d:distKm(from.lat,from.lng,h.lat,h.lng)});
  }
  if(mode==='due'){
    var pool=all.filter(function(x){ return x.d<=15; });
    pool.sort(function(a,b){ var sa=pcSevRank(a.h), sb=pcSevRank(b.h); if(sa!==sb) return sb-sa; return a.d-b.d; });
    return pool;
  }
  var within=all.filter(function(x){ return x.d<=5; });
  if(!within.length) within=all.filter(function(x){ return x.d<=10; });
  within.sort(function(a,b){ return a.d-b.d; });
  return within;
}
// 최적 동선(최근접 이웃 그리디): from → 가장 가까운 후보 → 그 지점에서 다시 최근접… 최대 n곳.
// 각 구간 거리(leg)·소요(legMin)와 누적 시간(cum) 반환.
function pcOptimalRoute(from, cands, n){
  var remaining=cands.slice(), route=[], cur={lat:from.lat,lng:from.lng}, cum=0;
  for(var k=0;k<n && remaining.length;k++){
    var bi=-1, bd=Infinity;
    for(var i=0;i<remaining.length;i++){ var d=distKm(cur.lat,cur.lng,remaining[i].h.lat,remaining[i].h.lng); if(d<bd){ bd=d; bi=i; } }
    if(bi<0) break;
    var pick=remaining.splice(bi,1)[0];
    var legMin=pcEstMin(bd); cum+=legMin;
    route.push({h:pick.h, leg:bd, legMin:legMin, cum:cum});
    cur={lat:pick.h.lat, lng:pick.h.lng};
  }
  return route;
}
function pcRenderRouteCard(){
  var box=document.getElementById('pcRouteCard'); if(!box) return;
  var head='<div class="prc-head">'+escapeHtml(t('prcTitle'))+' <span class="prc-sub">'+escapeHtml(t('prcToday'))+'</span></div>'+
    '<div class="prc-sort" role="group" aria-label="'+escAttr(t('prcNear'))+'">'+
      '<button type="button" data-rsort="near"'+(pcRouteSort==='near'?' class="on"':'')+'>'+escapeHtml(t('prcNear'))+'</button>'+
      '<button type="button" data-rsort="due"'+(pcRouteSort==='due'?' class="on"':'')+'>'+escapeHtml(t('prcDue'))+'</button>'+
    '</div>';
  var today=pcTodayList();
  // FSE 담당자별 '가장 최근' 오늘 완료 병원.
  // handover는 시트 하단에 append(오래된→최신)되어 pcTodayList도 오래된→최신 순 →
  // 마지막(최신)이 이기도록 덮어쓴다. 좌표가 없어도 '현재'는 최신 완료를 표시하고,
  // 주변 병원 계산은 좌표가 있을 때만 수행한다.
  var curByFse={}, order=[];
  today.forEach(function(r){
    var fse=String(r.fse||'').trim(); if(!fse) return;
    var name=String(r.hosp||'').trim(); if(!name) return;
    if(!(fse in curByFse)) order.push(fse);
    var h=pcHospByName(name);
    curByFse[fse]={ name:name, from:(h&&h.lat!=null&&h.lng!=null)?h:null };   // 최신으로 갱신
  });
  // 진행중(현재 처리중) 병원이 있으면 그 병원을 각 담당자의 '현재 위치'로 우선 적용 —
  // 이동 소요시간을 지금 있는(진행중) 병원 기준으로 계산. 진행중만 있고 오늘 완료가 없는 담당자도 포함.
  Object.keys(pcInProgress||{}).forEach(function(hn){
    var fse=String(pcInProgress[hn]||'').trim(); if(!fse) return;
    if(!(fse in curByFse)) order.push(fse);
    var h=pcHospByName(hn);
    curByFse[fse]={ name:hn, from:(h&&h.lat!=null&&h.lng!=null)?h:null };
  });
  if(!order.length){
    var msg=(pcRecentState==='loading')?t('rcLoading'):t('rcNoneToday');
    box.innerHTML=head+'<div class="prc-empty">'+msg+'</div>'; return;
  }
  box.innerHTML=head+order.map(function(fse){
    var cur=curByFse[fse];
    var prog=pcProgHospOf(fse);   // 이 담당자의 진행중 병원
    var fseAttr=escAttr(fse);
    var body;
    if(cur.from){
      var cands=pcRouteCandidates(cur.from, pcRouteSort);
      var route=pcOptimalRoute(cur.from, cands, 3);
      if(route.length){
        var totalMin=route[route.length-1].cum;
        body = '<div class="prc-total">🧭 '+t('schRouteTotal').replace('{n}',route.length).replace('{m}',totalMin)+'</div>'+
          route.map(function(x,i){
            var on=(prog===x.h.n);
            var dueCls=isDue(x.h)?' due':'';
            return '<div class="prc-item'+(on?' prog':'')+dueCls+'" data-hn="'+escAttr(x.h.n)+'">'+
              '<span class="prc-rank">'+(i+1)+'</span>'+
              '<span class="prc-sev" style="background:'+pcSevColor(x.h)+'" title="'+escAttr(x.h.st||'')+'"></span>'+
              '<span class="prc-nm">'+escapeHtml(x.h.n)+'</span>'+
              '<span class="prc-dt">'+escapeHtml(x.leg.toFixed(1))+'km · '+escapeHtml(t('schCum'))+' '+x.cum+escapeHtml(t('minUnit'))+'</span>'+
              '<button class="prc-prog" data-fse="'+fseAttr+'" data-hn="'+escAttr(x.h.n)+'" title="'+escAttr(t('schProgress'))+'">'+escapeHtml(on?t('schProg'):t('schProgress'))+'</button>'+
            '</div>';
          }).join('');
      } else {
        body = '<div class="prc-empty" style="padding:2px 6px;">'+escapeHtml(pcRouteSort==='near'?t('prcNoneNear'):t('prcNoneDue'))+'</div>';
      }
    } else {
      body = '<div class="prc-empty" style="padding:2px 6px;">'+escapeHtml(t('prcNoCoord'))+'</div>';
    }
    var progLine = prog ? '<div class="prc-prog-cur" data-fse="'+fseAttr+'" data-hn="'+escAttr(prog)+'">🔵 '+escapeHtml(t('schProg'))+' · '+escapeHtml(prog)+'<button class="prc-done" type="button" data-done-hn="'+escAttr(prog)+'" title="'+escAttr(t('schDone'))+'">'+escapeHtml(t('schDone'))+'</button></div>' : '';
    return '<div class="prc-fse">'+
      '<div class="prc-fse-h">🧑‍🔧 '+escapeHtml(fse)+'<span class="prc-cur">'+((prog&&prog===cur.name)?('🔵 '+escapeHtml(t('schProg'))+' '):(escapeHtml(t('prcCur'))+' '))+escapeHtml(cur.name)+'</span></div>'+
      progLine+
      body+
    '</div>';
  }).join('');
}
// 담당자별 진행중 병원 토글 (주변 이동 소요시간 카드에서 주변 병원 선택 → 진행상태)
function pcToggleInProgress(fse, hosp){
  if(!fse||!hosp) return;
  if(pcProgHospOf(fse)===hosp) pcClearProg(hosp);
  else pcSetProg(hosp, fse);
  pcRefreshProgViews(hosp);
  if(pcIsProg(hosp)){ try{ pcFocusHospOnMap(hosp, null); }catch(e){} }
}
/* ── 지도 말풍선 내용 ──────────────────────────────────────────────────────
   카드를 눌러도, 지도 마커를 눌러도 같은 말풍선을 띄운다.
   예전에는 병원 이름과 '이력 보기' 버튼만 들어 있어, 정작 알고 싶은
   상태·장비번호·담당·최근 이력을 보려면 상세 패널까지 한 번 더 들어가야 했다.
   이제 말풍선 자체에 요약 정보와 최근 이력 3건을 넣고,
   더 볼 게 있으면 '이력 전체 보기'로 상세 패널을 연다. */
var PC_IW_HIST=3;
function pcMapInfoNode(h){
  var E=BazDom.el, kids=[];
  kids.push(E('div',{class:'iw-nm',text:h.n}));

  var tags=[];
  if(pcIsProg(h.n)) tags.push(E('span',{class:'iw-tag prog',text:'🔵 '+t('schProg')}));
  if(h.st) tags.push(E('span',{class:'iw-tag',text:h.st}));
  if(isNcare(h) && h.nc) tags.push(E('span',{class:'iw-tag',text:'N-CARE '+h.nc}));
  if(h.rg) tags.push(E('span',{class:'iw-tag',text:h.rg}));
  if(tags.length) kids.push(E('div',{class:'iw-tags'},tags));

  var rows=[];
  function row(k,v){ if(v==null||v==='') return; rows.push(E('span',{class:'k',text:k})); rows.push(E('span',{class:'v',text:v})); }
  row(t('dtSn'), h.s);
  row(t('sales'), h.sa);
  // statusDays() 는 '최근 점검 2026-08-04 · 9일 경과' 처럼 라벨을 이미 포함한다 → 값만 넣는다
  rows.push(E('span',{class:'k',text:isNcare(h)?t('lastInsp'):t('lastVisit')}));
  rows.push(E('span',{class:'v',text:statusDays(h).replace(new RegExp('^'+(isNcare(h)?t('lastInsp'):t('lastVisit'))+'\\s*'),'')}));
  // 오늘 현장에서 처리한 건이면 담당자·구분을 함께 보여 준다
  var tl=pcTodayList(), nk=normalize(h.n);
  for(var i=0;i<tl.length;i++){
    if(normalize(tl[i].hosp)===nk){ row(t('lgDone'), (tl[i].fse||'-')+(tl[i].gubun?' · '+tl[i].gubun:'')); break; }
  }
  if(rows.length) kids.push(E('div',{class:'iw-rows'},rows));

  var recs=HISTORY[h.n]||[];
  kids.push(E('div',{class:'iw-h',text:'🕑 '+t('histTitle')+' '+t('histCount').replace('{n}', recs.length)}));
  if(recs.length){
    kids.push(E('div',{class:'iw-hist'}, recs.slice(0,PC_IW_HIST).map(function(r){
      var isInsp=(r.t==='점검');
      var memo=r.fx||r.m||[r.pt,r.sy].filter(Boolean).join(' · ')||'';
      return E('div',{class:'iw-hi'},[
        E('span',{class:'d',text:r.d||'-'}),
        E('span',{class:'tp'+(isInsp?'':' as'),text:isInsp?'점검':'A/S'}),
        r.f ? E('span',{text:' · '+r.f}) : null,
        memo ? E('span',{class:'m',text:memo}) : null
      ]);
    })));
  } else {
    kids.push(E('div',{class:'iw-empty',text:t('histEmpty')}));
  }

  var b=E('button',{type:'button',class:'iw-btn',text:t('mapHistBtn')});   /* mapHistBtn 에 이미 🕑 가 들어 있다 */
  b.addEventListener('click', function(){ pcSelect(h.n); });
  kids.push(b);
  return E('div',{class:'pc-iw'}, kids);
}

// 오늘 완료 병원을 상단 지도에서 위치로 이동 + 하이라이트
function pcFocusHospOnMap(name, itemEl){
  document.querySelectorAll('#pcRecentCard .rrc-item').forEach(function(el){ el.classList.toggle('sel', el===itemEl); });
  var h=pcHospByName(name); if(!h||h.lat==null||h.lng==null) return;
  // ★ 지도를 다시 그리는 어떤 호출보다 먼저 '이 병원을 보고 있다'를 기록한다.
  //   아래 pcRender·pcBackToMap이 부르는 pcShowMap의 applyFocus가 전체 맞춤(setBounds)으로
  //   되돌려, 방금 맞춘 확대가 120ms 뒤에 전국 축척으로 풀리던 문제를 막는다.
  pcFocusName=h.n;
  // 표 뷰·접힘 상태에선 지도가 없어 조용히 무시되던 버그 — 사용자 의도가 명확하므로 지도를 되살린다
  if(!pcMapVisible()){
    if(pcListView==='table'){ pcListView='cards'; try{ localStorage.setItem('baz_pc_listview','cards'); }catch(e){} }
    if(document.body.classList.contains('pc-mapcol')){ document.body.classList.remove('pc-mapcol'); try{ localStorage.setItem('baz_pc_mapcol','0'); }catch(e){} }
    try{ pcRender(pcList||[]); }catch(e){}
  }
  if(pcRightMode==='detail'){ pcBackToMap(); }
  if(pcMapObj && typeof kakao!=='undefined'){
    var pos=new kakao.maps.LatLng(h.lat,h.lng);
    // 이미 가까이 본 사용자를 강제로 축소하지 않는다 — 현재보다 확대만(레벨 최소화)
    var tgt; try{ tgt=Math.min(pcMapObj.getLevel(),5); }catch(e){ tgt=5; }
    try{ pcMapObj.setLevel(tgt,{animate:{duration:200}}); }catch(e){ try{ pcMapObj.setLevel(tgt); }catch(_){} }
    pcMapObj.panTo(pos);
    if(pcFocusIW){ try{ pcFocusIW.close(); }catch(e){} pcFocusIW=null; }
    /* [XSS] 말풍선은 문자열 조합 대신 DOM 으로 만든다. 예전에는 병원명을
       onclick="pcSelect('…')" 안에 넣고 역슬래시·따옴표만 손으로 이스케이프했다 —
       JavaScript 문맥 이스케이프는 안전하지 않다(유니코드 줄바꿈·중첩 인용 등).
       이제 이름은 클로저로만 전달되고 마크업에는 들어가지 않는다. */
    var content=pcMapInfoNode(h);
    /* [수정] 말풍선을 마커에 붙이지 않고 좌표에 직접 연다.
       마커는 클러스터러(minLevel:7)에 속해 있어 넓은 배율에서는 지도에서 내려가 있다.
       지도에 없는 마커에 InfoWindow 를 붙이면 아무것도 그려지지 않는다 —
       "카드를 눌렀는데 지도에 정보가 안 뜬다"는 증상의 직접 원인이었다.
       (위에서 배율을 5 이하로 낮추지만 setLevel 애니메이션이 끝나기 전이라
        그 시점의 마커는 여전히 클러스터에 묶여 있다.)
       좌표로 열면 클러스터 여부와 무관하게 항상 보인다.
       zIndex 는 선택 링(12)·진행중(9)보다 위 — 클러스터 숫자 버블에 가리지 않게. */
    pcFocusIW=new kakao.maps.InfoWindow({content:content, position:pos, removable:true, zIndex:20});
    pcFocusIW.open(pcMapObj);
  }
}

function pcHighlight(){
  document.querySelectorAll('#pcLeft .pc-cardwrap').forEach(function(el){ el.classList.toggle('sel', el.getAttribute('data-hname')===pcSelName); });
  document.querySelectorAll('#pcLeft tr[data-hname]').forEach(function(el){ el.classList.toggle('sel', el.getAttribute('data-hname')===pcSelName); });
  try{ pcMapSelRing(pcSelName); }catch(e){}   // 지도에서도 선택 병원 강조(목록↔지도 일치)
  try{ pcMapCtlSync(); }catch(e){}            // 선택이 있으면 '선택 해제' 버튼 노출
}

// ── 카드 클릭 = 지도를 그 병원으로 ──────────────────────────────────────────
// 예전에는 카드를 누르면 pcSelect가 우측 패널을 '상세'로 바꿔 지도를 통째로 숨겼다
// (#pcRight.detail #pcMapPane{visibility:hidden}). 목록에서 고른 병원이 지도 어디인지
// 확인할 방법이 없었다. 이제 카드 클릭은 지도를 그 병원으로 줌하고, 상세는
// 카드의 '🕑 이력' 버튼과 지도 말풍선의 '🕑 이력 보기' 버튼으로 연다(둘 다 기존 기능).
// 지도에 띄워 둔 병원(카드 클릭·검색 1곳). pcShowMap이 재렌더마다 전체 맞춤으로
// 되돌리지 않도록 applyFocus가 이 값을 먼저 본다.
var pcFocusName=null;
// 카드 해제 = 지도 포커스·선택·말풍선을 모두 풀고 현재 목록 전체로 되돌린다
function pcClearHospFocus(){
  pcFocusName=null; pcSelName=null;
  if(pcFocusIW){ try{ pcFocusIW.close(); }catch(e){} pcFocusIW=null; }
  document.querySelectorAll('#pcRecentCard .rrc-item.sel').forEach(function(el){ el.classList.remove('sel'); });
  pcHighlight();
  pcMapCtl.resetAutoFit();     // 해제는 명시적 요청 — 다음 렌더에서 결과 전체로 다시 맞춘다
  pcMapCtl.clearUserView();
  if(pcMapVisible()){ try{ pcShowMap(pcList||[]); }catch(e){} }
  pcMapCtlSync();
  bazAnnounce(t('mapClearSel'));
}
window.pcClearHospFocus=pcClearHospFocus;

function pcPickHosp(name){
  // 표 뷰는 지도가 없는 화면(표 전체화면) — 기존 중앙 상세 모달을 그대로 쓴다
  if(pcListView==='table'){ pcSelect(name); return; }
  // 이미 지도에 띄워 둔 카드를 다시 누르면 해제 — 목록 전체 보기로 초기화된다
  if(pcFocusName===name && pcSelName===name){ pcClearHospFocus(); return; }
  var h=pcHospByName(name);
  // 지도를 쓸 수 없거나(접힘·모바일) 좌표가 없으면 예전처럼 상세를 연다.
  // '🕑 이력' 버튼은 이력이 있을 때만 렌더되므로(cardHTML), 이 폴백이 없으면
  // 좌표도 이력도 없는 병원은 상세로 갈 길이 아예 사라진다.
  // 지도를 일부러 접어 둔 사용자를 강제로 펼치지도 않는다.
  if(!pcMapVisible() || !h || h.lat==null || h.lng==null){ pcSelect(name); return; }
  pcSelName=name;
  pcHighlight();                  // 목록 카드 강조 + 지도 선택 링
  pcFocusHospOnMap(name, null);   // 줌 + panTo + 말풍선(이력 보기 버튼 포함)
}
window.pcPickHosp=pcPickHosp;

// ── 검색어 변경에 대한 지도 반응 ────────────────────────────────────────────
// pcShowMap은 폴링(pcRefreshProgViewsNow)에서도 불린다. 그래서 "검색어가 실제로 바뀐
// 순간"에만 반응해야 한다 — 그러지 않으면 폴링마다 말풍선이 다시 열리고 사용자가
// 옮겨 둔 지도가 계속 되돌아간다.
var pcLastSearchQ=null;
function pcApplySearchView(){
  var q=(searchQ||'').trim();
  if(q===pcLastSearchQ) return;          // 변화 없음 → 아무것도 하지 않는다
  var prev=pcLastSearchQ; pcLastSearchQ=q;
  if(!q){ if(prev) pcResetSearchView(); return; }   // 검색 삭제 → 초기화
  if(!pcMapVisible()) return;            // 표 뷰·접힘에선 지도 조작 없음
  // 좌표가 있는 결과만 후보. 정확히 1곳이면 그 병원으로 줌한다.
  var found=null, n=0;
  for(var i=0;i<pcList.length && n<2;i++){
    var h=pcList[i];
    if(h && h.lat!=null && h.lng!=null){ n++; found=h; }
  }
  if(n===1){
    pcSelName=found.n;
    pcHighlight();
    pcFocusHospOnMap(found.n, null);
  } else {
    // 여러 곳이면 자동으로 고르지 않는다 — 결과 전체를 보여주고(아래 pcShowMap),
    // 사용자가 원하는 카드를 누르면 그때 pcPickHosp가 줌한다.
    pcFocusName=null; pcSelName=null;
    if(pcFocusIW){ try{ pcFocusIW.close(); }catch(e){} pcFocusIW=null; }
    pcHighlight();
    if(pcMapVisible()){ try{ pcShowMap(pcList||[]); }catch(e){} }   // 이전 포커스를 풀고 결과 전체로 맞춤
  }
}
// 검색을 지웠을 때의 초기화. ✕ 버튼과 백스페이스로 비운 경우 모두 여기로 온다
// (pcApplySearchView가 질의 변화를 감지하므로 호출 지점이 하나뿐이다).
function pcResetSearchView(){
  if(pcRightMode==='detail'){
    pcBackToMap();
    pcRestoreView=false;   // pcBackToMap은 '보던 위치 복귀'를 켜지만, 초기화는 전체 맞춤이 맞다
  }
  try{ pcCloseDetailModal(); }catch(e){}
  // 선택·말풍선 해제 + 전체 목록으로 화면 맞춤은 카드 해제와 같은 처리를 쓴다
  pcClearHospFocus();
  // 주변 5km 마커는 검색어가 비면 pcDrawNearby가 스스로 지운다 → 추가 작업 없음
}

function pcHistTimeline(name){
  var recs=HISTORY[name]||[];
  if(!recs.length) return '<div class="tl-empty">'+t('histEmpty')+'</div>';
  return recs.map(function(r){
    var isInsp=(r.t==='점검');
    var typeLabel=isInsp?'점검':'A/S', typeCls=isInsp?'점검':'AS';
    var symLine=(r.pt||r.sy)?'<div class="tl-cat">'+escapeHtml([r.pt,r.sy].filter(Boolean).join(' · '))+'</div>':'';
    var memo=r.m?'<div class="tl-memo">'+escapeHtml(r.m)+'</div>':'';
    var fix=r.fx?'<div class="tl-memo tl-fix">↳ '+escapeHtml(r.fx)+'</div>':'';
    var partLine=r.p?'<div class="tl-part">🔧 '+t('histPart')+': '+escapeHtml(r.p)+'</div>':'';
    var meta=[]; if(r.f) meta.push(t('histFse')+' '+escapeHtml(r.f)); if(r.pay) meta.push(escapeHtml(r.pay));
    var metaLine=meta.length?'<div class="tl-meta">'+meta.join(' · ')+'</div>':'';
    return '<div class="tl-item '+(isInsp?'':'as')+'"><div class="tl-date">'+escapeHtml(r.d)+'<span class="tl-type '+typeCls+'">'+typeLabel+'</span></div>'+metaLine+symLine+memo+fix+partLine+'</div>';
  }).join('');
}

function pcRenderDetail(name, box){
  box = box || document.getElementById('pcDetail'); if(!box) return;
  var h=null;
  for(var i=0;i<HOSPITALS.length;i++){ if(HOSPITALS[i].n===name){ h=HOSPITALS[i]; break; } }
  if(!h){ for(var j=0;j<pcList.length;j++){ if(pcList[j].n===name){ h=pcList[j]; break; } } }
  if(!h){ box.innerHTML='<div class="tl-empty">'+escapeHtml(t('notFound'))+'</div>'; return; }
  var hp=(h.hpv||'').trim()||getLastHpVer(h.n);
  var ui=(h.uiv||'').trim()||getLastUiVer(h.n);
  var tags='';
  tags+= isNcare(h)?'<span class="h-tag ncare">N-CARE '+escapeHtml(h.nc)+'</span>':'<span class="h-tag ncare none">미가입</span>';
  if(h.as) tags+='<span class="h-tag as">'+escapeHtml(h.as)+'</span>';
  if(h.sa) tags+='<span class="h-tag sales">'+escapeHtml(h.sa)+'</span>';
  if(hp) tags+='<span class="h-tag hpver">HP '+escapeHtml(hp)+'</span>';
  if(ui) tags+='<span class="h-tag uiver">UI '+escapeHtml(ui)+'</span>';
  tags+= pcVendorTag(h);
  var rows='';
  function row(k,v){ rows+='<dt>'+k+'</dt><dd>'+v+'</dd>'; }
  row(escapeHtml(t('colStatus')), pcStatusBadge(h));
  if(h.a) row(escapeHtml(t('dtAddr')), escapeHtml(h.a));
  row(escapeHtml(t('dtSn')), escapeHtml(h.s||'-'));
  row(escapeHtml(t('sales')), escapeHtml(h.sa||'-'));
  row(escapeHtml(t('colRegion')), escapeHtml(h.rg||'-'));
  row(escapeHtml(t('colClient')), escapeHtml(pcVendorText(h)));
  row(isNcare(h)?t('lastInsp'):t('lastVisit'), escapeHtml(statusDays(h)));
  /* [XSS] 병원명은 data-hn 속성에만 넣는다 — 예전처럼 onclick="pcSetProgUI('…')" 로
     JavaScript 문맥에 끼워 넣지 않는다. 클릭은 아래 [data-dtact] 위임이 받는다. */
  var hn=escAttr(h.n);
  var progOn=pcIsProg(h.n);
  var progFse=progOn?(pcInProgress[h.n]||''):'';
  box.innerHTML=
    '<div class="pc-dt-name">'+escapeHtml(h.n)+(progOn?' <span class="pc-dt-progflag">🔵 '+escapeHtml(t('schProg'))+(progFse?' · '+escapeHtml(progFse):'')+'</span>':'')+'</div>'+
    '<div class="pc-dt-sub">'+escapeHtml(h.s||'')+(h.rg?' · '+escapeHtml(h.rg):'')+'</div>'+
    '<div class="pc-dt-tags">'+tags+'</div>'+
    '<dl class="pc-dt-rows">'+rows+'</dl>'+
    (progOn
      ? '<div class="pc-dt-progrow">'+
          '<button type="button" class="pc-dt-prog on" data-dtact="progoff" data-hn="'+hn+'">🔵 진행중 해제</button>'+
          '<button type="button" class="pc-dt-done" data-dtact="done" data-hn="'+hn+'">✅ '+escapeHtml(t('schDone'))+'</button>'+
        '</div>'
      : '<div class="pc-dt-progrow">'+
          '<select id="pcAssignSel" class="pc-assign" aria-label="'+escAttr(t('schPickFse'))+'">'+
            pcSchedFseList().map(function(a){ return '<option value="'+escAttr(a)+'"'+(a===(h.sa||'').trim()?' selected':'')+'>'+escapeHtml(a)+'</option>'; }).join('')+
          '</select>'+
          '<button type="button" class="pc-dt-prog" data-dtact="progon" data-hn="'+hn+'">🔵 진행중으로 설정</button>'+
        '</div>'+
        '<button type="button" class="pc-dt-sched" data-dtact="sched" data-hn="'+hn+'">📋 '+escapeHtml(t('schToSchedule'))+'</button>')+
    '<div class="pc-dt-acts">'+pcActionButtons(h,{plain:true})+'</div>'+
    '<div class="pc-dt-h3">🕑 '+escapeHtml(t('histTitle'))+' <span style="font-weight:400;color:var(--text-muted);">'+escapeHtml(t('histCount').replace('{n}', (HISTORY[name]||[]).length))+'</span> '+
      '<button type="button" class="pc-backmap" style="float:right;font-size:11px;padding:3px 8px;" data-hact="hist" data-hn="'+hn+'">'+escapeHtml(t('dtEdit'))+'</button></div>'+
    pcHistTimeline(name);
}
/* 상세 패널 액션 위임 — 상세는 #pcDetail(패널)과 #pcDetailModalBody(표 뷰 모달)
   두 곳에 같은 마크업이 들어가므로 document 한 곳에서 받는다. */
document.addEventListener('click', function(e){
  var b=e.target.closest('[data-dtact]'); if(!b) return;
  e.preventDefault(); e.stopPropagation();
  var act=b.getAttribute('data-dtact'), hn=b.getAttribute('data-hn')||'';
  if(!hn) return;
  if(act==='progoff') pcToggleProgHosp(hn);
  else if(act==='done') pcMarkDone(hn);
  else if(act==='progon') pcSetProgUI(hn);
  else if(act==='sched') pcAddToSchedUI(hn);
});


// ── 지도 그리기: 레이어별로 분리 ──────────────────────────────────────────────
// 예전에는 한 함수가 기본 마커·오늘완료·진행중·주변 4개 레이어를 매번 전부 재생성했다.
// 진행중 상태만 바뀌어도 마커 수백 개가 새로 만들어져, 폴링이 잦아진 뒤 체감이 나빠졌다.
// 이제 레이어마다 독립된 키를 두고 실제로 바뀐 레이어만 다시 그린다.

// (1) 기본 병원 마커 + 클러스터러 — 목록이 바뀔 때만
function pcDrawBase(list, bounds){
  var key=pcListHash(list);
  if(key===pcBaseKey && pcMapMarkers.length){
    pcMapMarkers.forEach(function(m){ var p=m.getPosition(); if(p) bounds.extend(p); });
    return pcMapMarkers.length>0;
  }
  pcBaseKey=key;
  if(pcMapClusterer){ pcMapClusterer.clear(); }
  pcMapMarkers.forEach(function(m){m.setMap(null);}); pcMapMarkers=[]; pcMarkerByName={};
  var clustered=[], any=false;
  list.forEach(function(h){
    if(h.lat==null||h.lng==null) return;
    var pos=new kakao.maps.LatLng(h.lat,h.lng);
    var mk=new kakao.maps.Marker({position:pos, title:h.n});
    pcMapMarkers.push(mk); pcMarkerByName[h.n]=mk;
    /* [수정] 마커 클릭 → 상세 패널 직행(pcSelect)이 아니라 카드 클릭과 같은 처리(pcPickHosp).
       지도에서 병원을 눌렀을 때 그 자리에서 이름·상태·최근 이력을 먼저 보여 주고,
       더 볼 게 있으면 말풍선의 '이력 전체 보기'로 상세를 연다. */
    kakao.maps.event.addListener(mk,'click',function(){ pcPickHosp(h.n); });
    clustered.push(mk); bounds.extend(pos); any=true;
  });
  // [B2] 마커 클러스터링: 400+ 마커를 줌 레벨별로 묶어 가독성·성능 개선.
  // 라이브러리 로드 실패 시 일반 마커로 폴백.
  if(typeof kakao.maps.MarkerClusterer==='function'){
    if(!pcMapClusterer){
      pcMapClusterer=new kakao.maps.MarkerClusterer({
        map:pcMapObj, averageCenter:true, minLevel:7, gridSize:70, disableClickZoom:false,
        styles:[
          {width:'34px',height:'34px',background:'rgba(27,47,94,.88)',color:'#fff',borderRadius:'17px',textAlign:'center',lineHeight:'34px',fontSize:'12px',fontWeight:'800',border:'2px solid #fff',boxShadow:'0 2px 8px rgba(0,0,0,.3)'},
          {width:'42px',height:'42px',background:'rgba(46,125,158,.9)',color:'#fff',borderRadius:'21px',textAlign:'center',lineHeight:'42px',fontSize:'13px',fontWeight:'800',border:'2px solid #fff',boxShadow:'0 2px 10px rgba(0,0,0,.32)'},
          {width:'52px',height:'52px',background:'rgba(192,57,43,.9)',color:'#fff',borderRadius:'26px',textAlign:'center',lineHeight:'52px',fontSize:'14px',fontWeight:'800',border:'2px solid #fff',boxShadow:'0 3px 12px rgba(0,0,0,.35)'}
        ],
        calculator:[50,200]
      });
    }
    pcMapClusterer.addMarkers(clustered);
  } else {
    clustered.forEach(function(m){ m.setMap(pcMapObj); });
  }
  return any;
}

// (2) 오늘 완료(초록)·진행중(파랑) 오버레이 — 이 둘은 자주 바뀌지만 개수가 적다
function pcDrawOverlays(bounds){
  var today=pcTodayList();
  var key=today.map(function(r){return r.hosp+(r.fse||'');}).join(',')
    +'#'+Object.keys(pcInProgress||{}).sort().map(function(k){return k+':'+pcInProgress[k];}).join(',');
  if(key===pcOverlayKey && (pcRecentOverlays.length||pcProgOverlays.length)){
    pcRecentOverlays.concat(pcProgOverlays).forEach(function(o){ var p=o.getPosition(); if(p) bounds.extend(p); });
    return pcRecentOverlays.length>0||pcProgOverlays.length>0;
  }
  pcOverlayKey=key;
  var any=false;
  // 오늘 완료(현장) 병원 → 초록 마커 + FSE 라벨로 강조
  pcRecentOverlays.forEach(function(o){o.setMap(null);}); pcRecentOverlays=[];
  today.forEach(function(r){
    var h=pcHospByName(r.hosp); if(!h||h.lat==null||h.lng==null) return;
    var pos=new kakao.maps.LatLng(h.lat,h.lng);
    var el=document.createElement('div'); el.className='pc-cmk';
    el.innerHTML='<span class="dot"></span><span class="lb">'+escapeHtml(r.fse||r.hosp)+'</span>';
    (function(hn){ el.addEventListener('click',function(){ pcPickHosp(hn); }); })(h.n);
    var ov=new kakao.maps.CustomOverlay({position:pos, content:el, yAnchor:1, zIndex:6});
    ov.setMap(pcMapObj); pcRecentOverlays.push(ov);
    bounds.extend(pos); any=true;
  });
  // 현재 처리중(현장 일정 진행중) 병원 → 파란 마커 + 라벨로 강조 (병원 조회 지도 연동)
  pcProgOverlays.forEach(function(o){o.setMap(null);}); pcProgOverlays=[];
  Object.keys(pcInProgress||{}).forEach(function(hn){
    var h=pcHospByName(hn); if(!h||h.lat==null||h.lng==null) return;
    var pos=new kakao.maps.LatLng(h.lat,h.lng);
    var who=pcInProgress[hn]||'';
    var el=document.createElement('div'); el.className='pc-pmk';
    el.innerHTML='<span class="dot"></span><span class="lb">🔵 처리중'+(who?' · '+escapeHtml(who):'')+'</span>';
    (function(nm){ el.addEventListener('click',function(){ pcPickHosp(nm); }); })(h.n);
    var ov2=new kakao.maps.CustomOverlay({position:pos, content:el, yAnchor:1, zIndex:9});
    ov2.setMap(pcMapObj); pcProgOverlays.push(ov2);
    bounds.extend(pos); any=true;
  });
  return any;
}

// (3) 검색 중 반경 5km 주변 병원 — 검색어·목록이 그대로면 유지
// [성능] DOM CustomOverlay(줌 시 뒤처짐) 대신 네이티브 마커 사용 — 파란 원 이미지 재사용.
function pcDrawNearby(list, bounds){
  var q=searchQ?normalize(searchQ):'';
  var key=q+'#'+(q?pcListHash(list):'');
  if(key===pcNearKey){
    pcNearbyMarkers.forEach(function(m){ var p=m.getPosition(); if(p) bounds.extend(p); });
    return pcNearbyMarkers.length;
  }
  pcNearKey=key;
  pcNearbyMarkers.forEach(function(m){m.setMap(null);}); pcNearbyMarkers=[];
  if(!q || !list.length) return 0;
  if(!pcNearbyImg){
    var svg='<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14"><circle cx="7" cy="7" r="5" fill="rgba(46,125,158,.75)" stroke="#fff" stroke-width="2"/></svg>';
    pcNearbyImg=new kakao.maps.MarkerImage('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg), new kakao.maps.Size(14,14), {offset:new kakao.maps.Point(7,7)});
  }
  pcNearbyOf(list, 5).forEach(function(o){
    var npos=new kakao.maps.LatLng(o.lat,o.lng);
    var nmk=new kakao.maps.Marker({position:npos, image:pcNearbyImg, title:o.n, zIndex:3});
    (function(nm){ kakao.maps.event.addListener(nmk,'click',function(){ pcPickHosp(nm); }); })(o.n);
    nmk.setMap(pcMapObj); pcNearbyMarkers.push(nmk);
    bounds.extend(npos);
  });
  return pcNearbyMarkers.length;
}

// 지도 인스턴스를 버리고 처음부터 다시 만들 수 있는 상태로 되돌린다.
// 예전에는 로드 실패 시 #pcMapPane.innerHTML만 지우고 pcMapObj는 그대로 뒀다.
// 그러면 다음 호출에서 firstCreate=false가 되어 "DOM이 사라진 지도"에 relayout만 부르고,
// 새로고침 전까지 영구 빈 화면이 됐다. 컨테이너를 지울 땐 항상 이 함수로 함께 초기화한다.
function pcMapReset(){
  if(pcMapTimer){ clearTimeout(pcMapTimer); pcMapTimer=null; }
  /* 파기 전 지도에 예약된 relayout/뷰 복원을 새 지도에 적용하지 않는다. */
  try{ pcMapCtl.cancelRelayout(); pcMapCtl.resetAutoFit(); }catch(e){}
  pcMapObj=null; pcMapClusterer=null; pcSelOv=null; pcFocusIW=null;
  pcMapMarkers=[]; pcMarkerByName={}; pcRecentOverlays=[]; pcProgOverlays=[]; pcNearbyMarkers=[];
  pcBaseKey=''; pcOverlayKey=''; pcNearKey='';    // 레이어 키도 비워야 다음 렌더가 실제로 그린다
  pcMapBounds=null; pcMapBoundsAny=false;
  pcMapFocusBounds=null; pcMapFocusAny=false;
}
function pcShowMap(list){
  var pane=document.getElementById('pcMapPane'); if(!pane) return;
  /* [세대] pcShowMap 은 loadKakao 콜백 안에서 그린다(비동기). 초기 로딩 중에는
     캐시 적용·bootstrap 응답·폴링·검색이 겹쳐 콜백이 여러 개 떠 있고, 늦게 도착한
     옛 콜백이 최신 데이터와 사용자가 방금 맞춘 화면을 덮었다.
     여기서 세대 번호를 올리고, 콜백 진입 시 최신 세대가 아니면 그리지 않는다. */
  var gen=pcMapCtl.beginRender();
  var snapshot=(list||[]).slice();     // 콜백까지 사이에 배열이 바뀌어도 이 렌더는 이 목록만 본다
  loadKakao(function(ok){
    if(pcMapCtl.isStale(gen)) return;  // ★ 오래된 렌더 폐기 — 최신 렌더가 이미 그렸다
    list=snapshot;
    if(ok===false){
      // 이미 살아 있는 지도가 있으면 건드리지 않는다 — 동시 요청 중 하나만 실패한 경우
      // 멀쩡한 지도의 DOM을 날려 영구 빈 화면이 되던 문제 방지.
      if(pcMapObj) return;
      pcMapReset();
      pane.innerHTML='<div class="pc-mapfail">지도를 불러올 수 없습니다.<br>네트워크 연결 또는 지도 키 설정을 확인해 주세요.</div>';
      return;
    }
    if(pane.querySelector('.pc-mapfail')){ pane.innerHTML=''; pcMapReset(); }   // 실패 화면 → 지도 새로 생성
    if(pcMapTimer){ clearTimeout(pcMapTimer); pcMapTimer=null; }
    var center=new kakao.maps.LatLng(PC_DEFAULT_CENTER.lat,PC_DEFAULT_CENTER.lng);
    var firstCreate=!pcMapObj;
    if(firstCreate){
      /* [크기 0 방어] 크기가 아직 잡히지 않은 컨테이너에 지도를 만들면 카카오가 타일 격자를
         0×0 기준으로 계산해, 이후 relayout 을 부를 때까지 회색 화면으로 남는다.
         (탭 복귀·접기 해제·모드 전환 직후처럼 CSS 가 적용되기 전 프레임에서 실제로 발생했다)
         충분한 크기가 될 때까지 짧게 미룬다 — 세대 검사가 있으므로 중복 생성은 없다. */
      var box=pane.getBoundingClientRect();
      if(box.width<40 || box.height<40){
        pcMapTimer=setTimeout(function(){ pcMapTimer=null; pcShowMap(list); }, 120);
        return;
      }
      pcMapObj=new kakao.maps.Map(pane,{center:center,level:9,tileAnimation:false});   /* 타일 페이드 끄기 → 확대/축소 반응성↑ */
      try{ kakao.maps.event.addListener(pcMapObj,'zoom_changed',function(){ pcMapCtlSync(); pcMapNoteZoom(); }); }catch(e){}   // 휠·제스처 줌에도 +/- 상태 동기화 + 타일 복구 예약
      try{ kakao.maps.event.addListener(pcMapObj,'idle',function(){ pcMapViewSaveDebounced(); pcMapIdleFix(); }); }catch(e){}  // 이동·줌 멈추면 뷰포트 저장 + 필요 시 타일 재계산
      /* 사용자가 직접 지도를 옮기면 기록 → 폴링·데이터 갱신이 그 위치를 자동 맞춤으로
         되돌리지 않는다(예전에는 40초 폴링마다 원위치했다).
         ※ 확대는 zoom_changed 로 잡지 않는다 — setBounds·복원 같은 프로그램 호출도
           같은 이벤트를 쏘기 때문에 그러면 모든 자동 맞춤이 스스로를 막아 버린다.
           사용자 확대는 발생 지점에서 직접 표시한다(+/− 버튼 pcMapZoom · 휠 리스너). */
      try{ kakao.maps.event.addListener(pcMapObj,'dragend',function(){ pcMapCtl.markUserView(); }); }catch(e){}
      pcMapApplyZoomable();   // 기본은 휠 확대 꺼짐 → 지도 위에서도 페이지가 스크롤된다
    }
    else { pcScheduleRelayout(); }   // 크기 재계산은 컨트롤러가 프레임당 1회로 병합
    // 명시적 포커스(pcFocusName)가 있으면 '보던 위치 복귀'보다 우선한다.
    // pcBackToMap이 pcRestoreView를 켜므로, 상세에서 카드를 눌러 다른 병원으로 갈 때
    // pcApplyMapState가 상세 진입 전(전국) 화면을 되살려 방금 맞춘 확대를 지웠다.
    var restore=pcRestoreView && pcMapState && !pcFocusName; pcRestoreView=false;

    /* [프레이밍] 범위를 둘로 나눈다.
       focus = 지금 보고 있는 목록(검색·필터 결과) 그 자체  → 화면을 맞출 대상
       all   = focus + 주변 5km + 오늘 완료·진행중 오버레이 → '전체 보기(⤢)' 버튼 전용
       예전에는 하나의 bounds에 오버레이까지 합쳐 setBounds를 걸었다. 그래서 부산 병원 하나를
       검색해도 서울에 오늘 완료 건이 있으면 전국이 한 화면에 들어오도록 축소됐고, 그 레벨에선
       클러스터러(minLevel:7)가 켜져 검색한 병원이 숫자 버블에 삼켜져 보이지 않았다.
       주변 5km 이웃도 focus에서 뺀다 — 이웃은 맥락일 뿐인데 화면을 넓혀, 결과 여러 곳을
       검색하면 정작 결과가 필요보다 작게 보였다. */
    var focus=new kakao.maps.LatLngBounds();
    var all=new kakao.maps.LatLngBounds();
    var a1=pcDrawBase(list, focus);
    var nearCnt=pcDrawNearby(list, all);     // 주변 이웃은 '전체 보기' 범위에만
    var a2=pcDrawOverlays(all);              // 오버레이도 focus를 넓히지 않는다
    var focusAny=a1;
    var any=focusAny||nearCnt>0||a2;
    // '전체 보기'는 focus + 오버레이 전부. focus 쪽 마커 위치를 all에도 합친다.
    pcMapMarkers.forEach(function(m){ var p=m.getPosition(); if(p) all.extend(p); });
    pcNearbyMarkers.forEach(function(m){ var p=m.getPosition(); if(p) all.extend(p); });
    pcMapBounds=all; pcMapBoundsAny=any;                  // '전체(완료·진행중 포함)' 버튼용
    pcMapFocusBounds=focus; pcMapFocusAny=focusAny;       // '결과 맞춤' 버튼용

    if(pcRightMode==='map'){
      var rtl=document.getElementById('pcRightTtl');
      /* '주변 5km'는 검색 결과 주변의 참고 마커다(내 위치 기준 조회 기능은 제거됨). */
      if(rtl) rtl.textContent = nearCnt
        ? ('🗺 '+t('mapTitle')+' · '+t('mapNearby').replace('{n}', nearCnt))
        : ('🗺 '+t('mapTitle'));
    }
    // 결과가 1곳이면 setBounds가 의미 없는 점 범위라 줌이 튄다 → 중심 이동 + 충분한 확대로 확실히 보이게
    var single=(function(){
      var c=0, only=null;
      for(var i=0;i<list.length && c<2;i++){ if(list[i].lat!=null&&list[i].lng!=null){ c++; only=list[i]; } }
      return (c===1)?only:null;
    })();
    function applyFocus(){
      // ① 사용자가 명시적으로 띄운 병원(카드 클릭·검색 1곳)이 있으면 그 중심을 지킨다.
      //    배율은 건드리지 않는다 — 사용자가 직접 조정한 확대를 재렌더가 되돌리면 안 된다.
      //    (이 가드가 없으면 아래 setBounds가 목록 전체를 맞춰 전국 축척으로 풀린다)
      if(pcFocusName){
        var fh=pcHospByName(pcFocusName);
        if(fh && fh.lat!=null && fh.lng!=null){
          pcMapObj.setCenter(new kakao.maps.LatLng(fh.lat, fh.lng));
          return;
        }
        pcFocusName=null;   // 필터·검색으로 목록에서 사라진 병원 → 포커스 해제하고 일반 맞춤으로
      }
      if(single){
        pcMapObj.setCenter(new kakao.maps.LatLng(single.lat, single.lng));
        try{ pcMapObj.setLevel(Math.min(pcMapObj.getLevel(), 4)); }catch(e){}
      } else if(focusAny){ pcMapObj.setBounds(focus); }
    }
    if(restore){ pcApplyMapState(); }
    else if(pcMapViewRestore(list)){ /* 저장된 뷰포트 복원 성공 → 맞춤 생략 (데이터 있는 첫 렌더 1회) */ }
    else if(pcFocusName){ applyFocus(); }   // 명시적으로 띄운 병원은 항상 중심 유지
    else {
      /* [자동 맞춤 조건] 검색어·필터 결과가 실제로 바뀐 경우에만 화면을 다시 맞춘다.
         예전에는 재렌더마다 setBounds 를 걸어, 40초 폴링이나 진행중 토글 한 번에
         사용자가 확대해 둔 지도가 원위치했다. 컨트롤러가
           · 목록 시그니처가 그대로면 → 맞추지 않음
           · 사용자가 최근(2분 내) 지도를 만졌으면 → 맞추지 않음
         으로 걸러 준다. */
      var sig=pcListHash(list)+'|'+(searchQ||'')+'|'+curFilter+'|'+salesFilter+'|'+regionFilter;
      if(pcMapCtl.shouldAutoFit(sig)) applyFocus();
    }
    pcMapCtlSync();
    /* [제거] 예전에는 120ms 뒤 relayout + applyFocus 를 한 번 더 실행했다.
       그 두 번째 applyFocus 가 그 사이 사용자가 맞춘 중심·배율을 덮어써,
       "확대했는데 잠시 뒤 전국으로 풀린다"는 증상의 직접 원인이었다.
       크기 재계산은 ResizeObserver → 컨트롤러가 맡고, 뷰포트는 다시 건드리지 않는다. */
    pcScheduleRelayout();
  });
}

function pcSelect(name){
  // 표(전체화면) 뷰: 상단 패널이 숨겨져 있으므로 상세를 중앙 모달로 표시
  if(pcListView==='table'){
    pcSelName=name;
    pcRenderDetail(name, document.getElementById('pcDetailModalBody'));
    BazModal.open(document.getElementById('pcDetailModal'), {
      name:'pcDetail', sheet:'.pc-dm-sheet', initialFocus:'#pcDetailModalClose'
    });
    var dmb=document.getElementById('pcDetailModalBody'); if(dmb) dmb.scrollTop=0;
    pcHighlight();
    return;
  }
  /* 지도 → 상세: 지금 보고 있는 중심·배율을 저장해 둔다(복귀용).
     넓은 화면(≥981px)에서는 상세가 오른쪽 drawer 로 얹혀 지도가 계속 보이므로
     지도 문맥이 끊기지 않는다 — 폭이 줄어드는 만큼 relayout 만 한 번. */
  if(pcRightMode==='map') pcSaveMapState();
  pcSelName=name; pcRightMode='detail';
  pcMapTransition(function(){
    var r=document.getElementById('pcRight'); if(r) r.classList.add('detail');
    var bm=document.getElementById('pcBackMap'); if(bm) bm.style.display='';
    var tl=document.getElementById('pcRightTtl'); if(tl) tl.textContent=name;
  });
  pcRenderDetail(name);
  pcHighlight();
  var body=document.getElementById('pcDetail'); if(body) body.scrollTop=0;
}
window.pcSelect=pcSelect;

// 상세 모달 닫기 (배경 클릭·✕·Esc·카드 뷰 전환)
function pcCloseDetailModal(){
  BazModal.close(document.getElementById('pcDetailModal'));
}
window.pcCloseDetailModal=pcCloseDetailModal;

function pcBackToMap(){
  pcRightMode='map';
  pcMapTransition(function(){
    var r=document.getElementById('pcRight'); if(r) r.classList.remove('detail');
    var bm=document.getElementById('pcBackMap'); if(bm) bm.style.display='none';
    var tl=document.getElementById('pcRightTtl'); if(tl) tl.textContent='🗺 '+t('mapTitle');
  });
  pcRestoreView=true;   // 초기화면(전체 fit)이 아니라 이력 확인 당시 위치/줌으로 복귀
  if(pcMapVisible()) pcShowMap(pcList||[]);   // 표 뷰·접힘(지도 숨김)에서는 지도 렌더 생략
}

function pcRender(list){
  pcList=list||[];
  pcEnsureDOM();
  pcApplyPaneI18n();   // pcEnsureDOM은 1회만 실행 → 언어 전환 시 여기서 라벨을 다시 입힌다
  document.querySelectorAll('#pcViewToggle button').forEach(function(b){ b.classList.toggle('on', b.dataset.view===pcListView); });
  document.body.classList.toggle('pc-table', pcListView==='table');   // 표 뷰: 지도/상세 패널 숨김 → 표 전체화면
  if(pcListView==='table' && typeof pcExitFullscreen==='function') pcExitFullscreen();   // 지도 사라지면 전체화면 강제 해제(해제 버튼 접근 불가 방지)
  if(pcListView!=='table') pcCloseDetailModal();                      // 카드 뷰로 전환 시 상세 모달 닫기
  // 담당자 오늘 완료 데이터(첫 진입 시 로드) + 좌측 카드 렌더
  if(!pcRecentRequested){
    pcRecentRequested=true;
    pcLoadRecent(function(){ pcRenderRecentCard(); pcRenderRouteCard(); if(pcRightMode!=='detail' && pcMapVisible()) pcShowMap(pcList); });
  }
  pcRenderRecentCard();
  pcRenderRouteCard();
  pcRenderLeft(pcList);
  if(pcRightMode==='detail' && pcSelName){
    var tl=document.getElementById('pcRightTtl'); if(tl) tl.textContent=pcSelName;
    var bm=document.getElementById('pcBackMap'); if(bm) bm.style.display='';
    document.getElementById('pcRight').classList.add('detail');
    pcRenderDetail(pcSelName);
  } else {
    var tl2=document.getElementById('pcRightTtl'); if(tl2) tl2.textContent='🗺 '+t('mapTitle');
    var bm2=document.getElementById('pcBackMap'); if(bm2) bm2.style.display='none';
    document.getElementById('pcRight').classList.remove('detail');
    if(pcMapVisible()) pcShowMap(pcList);   // 표 뷰·접힘(지도 숨김)에서는 지도 렌더 생략
  }
  pcHighlight();
  // 검색어가 바뀐 순간에만 지도를 검색 결과에 맞춘다(폴링 재렌더에는 무반응).
  // pcShowMap보다 뒤에 둬야 한 곳으로 좁혀졌을 때의 줌이 전체 맞춤에 덮이지 않는다.
  try{ pcApplySearchView(); }catch(e){ console.warn('[검색] 지도 반영 오류:',e); }
}
window.pcRender=pcRender;
// 한 번만 만든 지도 패널의 라벨·툴팁을 현재 언어로 다시 입힌다(언어 전환 대응)
function pcApplyPaneI18n(){
  if(!pcDomReady) return;
  var m={
    '#pcMapCtl [data-mapctl="zin"]':'mapZoomIn', '#pcMapCtl [data-mapctl="zout"]':'mapZoomOut',
    '#pcMapCtl [data-mapctl="clearsel"]':'mapClearSel', '#pcMapGrip':'mapResize'
  };
  Object.keys(m).forEach(function(sel){ var el=document.querySelector(sel); if(el){ el.setAttribute('title',t(m[sel])); el.setAttribute('aria-label',t(m[sel])); } });
  // 맞춤 버튼은 title(설명)과 aria-label(이름)이 다르다
  var fr=document.querySelector('#pcMapCtl [data-mapctl="fitres"]');
  if(fr){ fr.setAttribute('title',t('mapFitResultTip')); fr.setAttribute('aria-label',t('mapFitResult')); }
  var fa=document.querySelector('#pcMapCtl [data-mapctl="fitall"]');
  if(fa){ fa.setAttribute('title',t('mapFitEveryTip')); fa.setAttribute('aria-label',t('mapFitEvery')); }
  // 범례·힌트·툴바
  var lg=document.getElementById('pcMapLegend');
  if(lg){
    lg.setAttribute('aria-label', t('mapLegend'));
    var lgs=lg.querySelectorAll('.lg'), keys=['lgResult','lgNear','lgDone','lgProg'];
    for(var i=0;i<lgs.length && i<keys.length;i++){
      var sw=lgs[i].querySelector('.sw');
      lgs[i].textContent=t(keys[i]);
      if(sw) lgs[i].insertBefore(sw, lgs[i].firstChild);
    }
  }
  var hint=document.getElementById('pcMapHint'); if(hint) hint.textContent=t('mapWheelHint');
  var ph=document.getElementById('pcHint'); if(ph) ph.textContent=t('pcHint');
  var vt=document.getElementById('pcViewToggle');
  if(vt){
    var bc=vt.querySelector('[data-view="cards"]'); if(bc) bc.textContent=t('viewCards');
    var bt=vt.querySelector('[data-view="table"]'); if(bt) bt.textContent=t('viewTable');
  }
  var bm=document.getElementById('pcBackMap'); if(bm) bm.textContent='← 🗺 '+t('mapTitle');
  try{ pcMapInteractSync(); }catch(e){}
  // 접기/고정 버튼은 상태에 따라 라벨이 달라진다
  var col=document.body.classList.contains('pc-mapcol'), unpin=document.body.classList.contains('pc-mapunpin');
  var fb=document.querySelector('#pcHeadCtl [data-headctl="fold"]'); if(fb){ var fk=col?'mapExpand':'mapCollapse'; fb.setAttribute('title',t(fk)); fb.setAttribute('aria-label',t(fk)); }
  var pb=document.querySelector('#pcHeadCtl [data-headctl="pin"]'); if(pb){ var pk=unpin?'mapPin':'mapUnpin'; pb.setAttribute('title',t(pk)); pb.setAttribute('aria-label',t(pk)); }
  var fsb=document.querySelector('#pcHeadCtl [data-headctl="fs"]'); if(fsb){ var fsk=document.body.classList.contains('pc-mapfs')?'mapExitFull':'mapFullscreen'; fsb.setAttribute('title',t(fsk)); fsb.setAttribute('aria-label',t(fsk)); }
  // 지도 모드일 때 제목도 갱신
  if(pcRightMode==='map'){ var rtl=document.getElementById('pcRightTtl'); if(rtl && rtl.textContent.indexOf('🗺')===0 && rtl.textContent.indexOf('5km')<0) rtl.textContent='🗺 '+t('mapTitle'); }
}

/* ── 자정 넘김 감시 ───────────────────────────────────────────────────────
   공용 PC 는 탭을 하루 종일 열어 둔다. 예전에는 TODAY 가 로드 시각에 고정돼
   자정을 넘겨도 점검 경과일·상태 배지·'오늘 완료'가 어제 값에 머물렀다.
   Asia/Seoul 날짜가 바뀌면 캐시를 버리고 화면을 다시 그린다
   (현장 일정 일일 초기화는 기존 pcDailyResetCheck 가 그대로 담당). */
BazDate.onDayChange(function(day){
  console.log('[날짜] Asia/Seoul 날짜 전환 →', day);
  try{ pcDailyResetCheck(); }catch(e){}
  try{ bazClearVerMemo(); }catch(e){}
  try{ render(); }catch(e){}
  try{ if(curTab==='dash') renderDash(); }catch(e){}
  try{ if(curTab==='recent') renderRecent(); }catch(e){}
  try{ pcRenderRecentCard(); pcRenderRouteCard(); }catch(e){}
});
BazDate.startWatch(30000);

// ===== 헤더 높이 → 필터 sticky 오프셋(--hdr-h) =====
function pcSetHdrH(){ var h=document.querySelector('header'); if(h) document.documentElement.style.setProperty('--hdr-h', h.offsetHeight+'px'); }
pcSetHdrH();
// 창 크기가 바뀌면 지도 높이 최대치도 달라진다 → 저장값을 현재 화면에 맞게 재클램프(sticky 보호)
// 보고 있던 중심·배율은 컨트롤러가 저장·복원한다(창 크기 변경으로 지도가 튀지 않게).
var pcResizeT=0;
function pcOnResize(){
  if(pcResizeT) clearTimeout(pcResizeT);
  pcResizeT=setTimeout(function(){
    pcResizeT=0;
    pcMapTransition(function(){
      pcSetHdrH();
      try{
        var cur=parseInt(getComputedStyle(document.documentElement).getPropertyValue('--pc-map-h'))||PC_MAPH_DEF;
        pcMapHApply(cur, false);
      }catch(e){}
    });
  }, 120);
}
window.addEventListener('resize', pcOnResize);
window.addEventListener('load', pcSetHdrH);

// ===== 화면 모드 (Window / Mobile) =====
(function(){
  var KEY='baz_viewmode';
  function apply(mode){
    if(mode!=='window' && typeof pcExitFullscreen==='function'){ try{ pcExitFullscreen(); }catch(e){} }   // 모바일 모드로 나가면 #pcPane이 사라지므로 전체화면 강제 해제
    document.body.classList.toggle('mode-window', mode==='window');
    document.body.classList.toggle('mode-mobile', mode==='mobile');
    try{ pcSetHdrH(); }catch(e){}
    var tg=document.getElementById('modeToggle');
    if(tg) tg.querySelectorAll('button').forEach(function(b){ b.classList.toggle('on', b.dataset.mode===mode); });
    // 레이아웃 전환 → 목록 재렌더 (mobile ↔ window). 지도 폭 변경은 컨트롤러가 반영.
    try{ if(typeof pcMapTransition==='function'){ pcMapTransition(function(){ if(typeof render==='function' && curTab==='list') render(); }); }
         else if(typeof render==='function' && curTab==='list') render(); }catch(e){}
  }
  function get(){
    var saved=localStorage.getItem(KEY);
    if(saved==='window'||saved==='mobile') return saved;
    /* [브레이크포인트 일치] 예전엔 여기만 900px 이고 지도 sticky 해제·2열 해제는 980px 이었다.
       900~980px 구간에서는 Window 모드로 들어가면서 sticky 지도가 풀린 어중간한 화면이 됐다.
       PC_WIDE_MIN(980) 한 값으로 맞춘다 — CSS @media(max-width:980px) 와 같은 경계. */
    return (window.matchMedia && window.matchMedia('(min-width:'+PC_WIDE_MIN+'px)').matches) ? 'window' : 'mobile';
  }
  var cur=get(); apply(cur);
  var tg=document.getElementById('modeToggle');
  if(tg) tg.addEventListener('click', function(e){
    var btn=e.target.closest('button[data-mode]'); if(!btn) return;
    cur=btn.dataset.mode; localStorage.setItem(KEY, cur); apply(cur);
  });
})();

</script>
