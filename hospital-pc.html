// ── 지도 그리기: 레이어별로 분리 ──────────────────────────────────────────────
// 예전에는 한 함수가 기본 마커·오늘완료·진행중·주변 4개 레이어를 매번 전부 재생성했다.
// 진행중 상태만 바뀌어도 마커 수백 개가 새로 만들어져, 폴링이 잦아진 뒤 체감이 나빠졌다.
// 이제 레이어마다 독립된 키를 두고 실제로 바뀐 레이어만 다시 그린다.

// (1) 기본 병원 마커 + 클러스터러 — 목록이 바뀔 때만
function pcDrawBase(list, bounds){
  var key=pcListHash(list);
  if(key===pcBaseKey && pcMapMarkers.length){
    pcMapMarkers.forEach(function(m){ var p=m.getPosition(); if(p) bounds.extend(p); });
    return pcMapMarkers.length>0;
  }
  pcBaseKey=key;
  if(pcMapClusterer){ pcMapClusterer.clear(); }
  pcMapMarkers.forEach(function(m){m.setMap(null);}); pcMapMarkers=[]; pcMarkerByName={};
  var clustered=[], any=false;
  list.forEach(function(h){
    if(h.lat==null||h.lng==null) return;
    var pos=new kakao.maps.LatLng(h.lat,h.lng);
    var mk=new kakao.maps.Marker({position:pos, title:h.n});
    pcMapMarkers.push(mk); pcMarkerByName[h.n]=mk;
    kakao.maps.event.addListener(mk,'click',function(){ pcSelect(h.n); });
    clustered.push(mk); bounds.extend(pos); any=true;
  });
  // [B2] 마커 클러스터링: 400+ 마커를 줌 레벨별로 묶어 가독성·성능 개선.
  // 라이브러리 로드 실패 시 일반 마커로 폴백.
  if(typeof kakao.maps.MarkerClusterer==='function'){
    if(!pcMapClusterer){
      pcMapClusterer=new kakao.maps.MarkerClusterer({
        map:pcMapObj, averageCenter:true, minLevel:7, gridSize:70, disableClickZoom:false,
        styles:[
          {width:'34px',height:'34px',background:'rgba(27,47,94,.88)',color:'#fff',borderRadius:'17px',textAlign:'center',lineHeight:'34px',fontSize:'12px',fontWeight:'800',border:'2px solid #fff',boxShadow:'0 2px 8px rgba(0,0,0,.3)'},
          {width:'42px',height:'42px',background:'rgba(46,125,158,.9)',color:'#fff',borderRadius:'21px',textAlign:'center',lineHeight:'42px',fontSize:'13px',fontWeight:'800',border:'2px solid #fff',boxShadow:'0 2px 10px rgba(0,0,0,.32)'},
          {width:'52px',height:'52px',background:'rgba(192,57,43,.9)',color:'#fff',borderRadius:'26px',textAlign:'center',lineHeight:'52px',fontSize:'14px',fontWeight:'800',border:'2px solid #fff',boxShadow:'0 3px 12px rgba(0,0,0,.35)'}
        ],
        calculator:[50,200]
      });
    }
    pcMapClusterer.addMarkers(clustered);
  } else {
    clustered.forEach(function(m){ m.setMap(pcMapObj); });
  }
  return any;
}

// (2) 오늘 완료(초록)·진행중(파랑) 오버레이 — 이 둘은 자주 바뀌지만 개수가 적다
function pcDrawOverlays(bounds){
  var today=pcTodayList();
  var key=today.map(function(r){return r.hosp+(r.fse||'');}).join(',')
    +'#'+Object.keys(pcInProgress||{}).sort().map(function(k){return k+':'+pcInProgress[k];}).join(',');
  if(key===pcOverlayKey && (pcRecentOverlays.length||pcProgOverlays.length)){
    pcRecentOverlays.concat(pcProgOverlays).forEach(function(o){ var p=o.getPosition(); if(p) bounds.extend(p); });
    return pcRecentOverlays.length>0||pcProgOverlays.length>0;
  }
  pcOverlayKey=key;
  var any=false;
  // 오늘 완료(현장) 병원 → 초록 마커 + FSE 라벨로 강조
  pcRecentOverlays.forEach(function(o){o.setMap(null);}); pcRecentOverlays=[];
  today.forEach(function(r){
    var h=pcHospByName(r.hosp); if(!h||h.lat==null||h.lng==null) return;
    var pos=new kakao.maps.LatLng(h.lat,h.lng);
    var el=document.createElement('div'); el.className='pc-cmk';
    el.innerHTML='<span class="dot"></span><span class="lb">'+escapeHtml(r.fse||r.hosp)+'</span>';
    (function(hn){ el.addEventListener('click',function(){ pcFocusHospOnMap(hn,null); }); })(h.n);
    var ov=new kakao.maps.CustomOverlay({position:pos, content:el, yAnchor:1, zIndex:6});
    ov.setMap(pcMapObj); pcRecentOverlays.push(ov);
    bounds.extend(pos); any=true;
  });
  // 현재 처리중(현장 일정 진행중) 병원 → 파란 마커 + 라벨로 강조 (병원 조회 지도 연동)
  pcProgOverlays.forEach(function(o){o.setMap(null);}); pcProgOverlays=[];
  Object.keys(pcInProgress||{}).forEach(function(hn){
    var h=pcHospByName(hn); if(!h||h.lat==null||h.lng==null) return;
    var pos=new kakao.maps.LatLng(h.lat,h.lng);
    var who=pcInProgress[hn]||'';
    var el=document.createElement('div'); el.className='pc-pmk';
    el.innerHTML='<span class="dot"></span><span class="lb">🔵 처리중'+(who?' · '+escapeHtml(who):'')+'</span>';
    (function(nm){ el.addEventListener('click',function(){ pcSelect(nm); }); })(h.n);
    var ov2=new kakao.maps.CustomOverlay({position:pos, content:el, yAnchor:1, zIndex:9});
    ov2.setMap(pcMapObj); pcProgOverlays.push(ov2);
    bounds.extend(pos); any=true;
  });
  return any;
}

// (3) 검색 중 반경 5km 주변 병원 — 검색어·목록이 그대로면 유지
// [성능] DOM CustomOverlay(줌 시 뒤처짐) 대신 네이티브 마커 사용 — 파란 원 이미지 재사용.
function pcDrawNearby(list, bounds){
  var q=searchQ?normalize(searchQ):'';
  var key=q+'#'+(q?pcListHash(list):'');
  if(key===pcNearKey){
    pcNearbyMarkers.forEach(function(m){ var p=m.getPosition(); if(p) bounds.extend(p); });
    return pcNearbyMarkers.length;
  }
  pcNearKey=key;
  pcNearbyMarkers.forEach(function(m){m.setMap(null);}); pcNearbyMarkers=[];
  if(!q || !list.length) return 0;
  if(!pcNearbyImg){
    var svg='<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14"><circle cx="7" cy="7" r="5" fill="rgba(46,125,158,.75)" stroke="#fff" stroke-width="2"/></svg>';
    pcNearbyImg=new kakao.maps.MarkerImage('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg), new kakao.maps.Size(14,14), {offset:new kakao.maps.Point(7,7)});
  }
  pcNearbyOf(list, 5).forEach(function(o){
    var npos=new kakao.maps.LatLng(o.lat,o.lng);
    var nmk=new kakao.maps.Marker({position:npos, image:pcNearbyImg, title:o.n, zIndex:3});
    (function(nm){ kakao.maps.event.addListener(nmk,'click',function(){ pcSelect(nm); }); })(o.n);
    nmk.setMap(pcMapObj); pcNearbyMarkers.push(nmk);
    bounds.extend(npos);
  });
  return pcNearbyMarkers.length;
}

function pcShowMap(list){
  var pane=document.getElementById('pcMapPane'); if(!pane) return;
  loadKakao(function(ok){
    if(ok===false){ pane.innerHTML='<div class="pc-mapfail">지도를 불러올 수 없습니다.<br>네트워크 연결 또는 지도 키 설정을 확인해 주세요.</div>'; return; }
    if(pane.querySelector('.pc-mapfail')) pane.innerHTML='';
    if(pcMapTimer){ clearTimeout(pcMapTimer); pcMapTimer=null; }  // 이전 setBounds 예약 취소(복귀 위치 보호)
    var center=new kakao.maps.LatLng(PC_DEFAULT_CENTER.lat,PC_DEFAULT_CENTER.lng);
    if(!pcMapObj){
      pcMapObj=new kakao.maps.Map(pane,{center:center,level:9,tileAnimation:false});   /* 타일 페이드 끄기 → 확대/축소 반응성↑ */
      try{ kakao.maps.event.addListener(pcMapObj,'zoom_changed',pcMapCtlSync); }catch(e){}   // 휠·제스처 줌에도 +/- 상태 동기화
    }
    else { pcMapObj.relayout(); }
    var restore=pcRestoreView && pcMapState; pcRestoreView=false;

    var bounds=new kakao.maps.LatLngBounds();
    var a1=pcDrawBase(list, bounds);
    var a2=pcDrawOverlays(bounds);
    var nearCnt=pcDrawNearby(list, bounds);
    var any=a1||a2||nearCnt>0;
    pcMapBounds=bounds; pcMapBoundsAny=any;   // '전체 보기' 버튼이 재계산 없이 사용

    if(pcRightMode==='map'){
      var rtl=document.getElementById('pcRightTtl');
      if(rtl) rtl.textContent = nearCnt ? ('🗺 지도 · 주변 5km '+nearCnt+'곳') : '🗺 지도';
    }
    if(restore){ pcApplyMapState(); }
    else if(any){ pcMapObj.setBounds(bounds); }
    pcMapCtlSync();
    // 컨테이너가 자리잡은 뒤 한 번 더 보정 — sticky·리사이즈로 크기가 늦게 확정될 때의 회색화 방지.
    // 상시 relayout은 ResizeObserver가 담당하고, 여기서는 뷰포트(setBounds/복원)만 재적용한다.
    pcMapTimer=setTimeout(function(){ pcMapTimer=null; if(pcMapObj){ pcMapObj.relayout(); if(restore) pcApplyMapState(); else if(any) pcMapObj.setBounds(bounds); pcMapCtlSync(); } },120);
  });
}

function pcSelect(name){
  // 표(전체화면) 뷰: 상단 패널이 숨겨져 있으므로 상세를 중앙 모달로 표시
  if(pcListView==='table'){
    pcSelName=name;
    pcRenderDetail(name, document.getElementById('pcDetailModalBody'));
    var dm=document.getElementById('pcDetailModal'); if(dm) dm.classList.add('show');
    var dmb=document.getElementById('pcDetailModalBody'); if(dmb) dmb.scrollTop=0;
    pcHighlight();
    return;
  }
  if(pcRightMode==='map') pcSaveMapState();   // 지도→상세: 당시 위치 저장(복귀용)
  pcSelName=name; pcRightMode='detail';
  var r=document.getElementById('pcRight'); if(r) r.classList.add('detail');
  var bm=document.getElementById('pcBackMap'); if(bm) bm.style.display='';
  var tl=document.getElementById('pcRightTtl'); if(tl) tl.textContent=name;
  pcRenderDetail(name);
  pcHighlight();
  var body=document.getElementById('pcDetail'); if(body) body.scrollTop=0;
}
window.pcSelect=pcSelect;

function pcRender(list){
  pcList=list||[];
  pcEnsureDOM();
  pcApplyPaneI18n();   // pcEnsureDOM은 1회만 실행 → 언어 전환 시 여기서 라벨을 다시 입힌다
  document.querySelectorAll('#pcViewToggle button').forEach(function(b){ b.classList.toggle('on', b.dataset.view===pcListView); });
  document.body.classList.toggle('pc-table', pcListView==='table');   // 표 뷰: 지도/상세 패널 숨김 → 표 전체화면
  if(pcListView==='table' && typeof pcExitFullscreen==='function') pcExitFullscreen();   // 지도 사라지면 전체화면 강제 해제(해제 버튼 접근 불가 방지)
  if(pcListView!=='table') pcCloseDetailModal();                      // 카드 뷰로 전환 시 상세 모달 닫기
  // 담당자 오늘 완료 데이터(첫 진입 시 로드) + 좌측 카드 렌더
  if(!pcRecentRequested){
    pcRecentRequested=true;
    pcLoadRecent(function(){ pcRenderRecentCard(); pcRenderRouteCard(); if(pcRightMode!=='detail' && pcMapVisible()) pcShowMap(pcList); });
  }
  pcRenderRecentCard();
  pcRenderRouteCard();
  pcRenderLeft(pcList);
  if(pcRightMode==='detail' && pcSelName){
    var tl=document.getElementById('pcRightTtl'); if(tl) tl.textContent=pcSelName;
    var bm=document.getElementById('pcBackMap'); if(bm) bm.style.display='';
    document.getElementById('pcRight').classList.add('detail');
    pcRenderDetail(pcSelName);
  } else {
    var tl2=document.getElementById('pcRightTtl'); if(tl2) tl2.textContent='🗺 '+t('mapTitle');
    var bm2=document.getElementById('pcBackMap'); if(bm2) bm2.style.display='none';
    document.getElementById('pcRight').classList.remove('detail');
    if(pcMapVisible()) pcShowMap(pcList);   // 표 뷰·접힘(지도 숨김)에서는 지도 렌더 생략
  }
  pcHighlight();
}
window.pcRender=pcRender;
// 한 번만 만든 지도 패널의 라벨·툴팁을 현재 언어로 다시 입힌다(언어 전환 대응)
function pcApplyPaneI18n(){
  var m={
    '#pcMapCtl [data-mapctl="zin"]':'mapZoomIn', '#pcMapCtl [data-mapctl="zout"]':'mapZoomOut',
    '#pcMapCtl [data-mapctl="fit"]':'mapFitAll', '#pcMapGrip':'mapResize'
  };
  Object.keys(m).forEach(function(sel){ var el=document.querySelector(sel); if(el){ el.setAttribute('title',t(m[sel])); el.setAttribute('aria-label',t(m[sel])); } });
  // 접기/고정 버튼은 상태에 따라 라벨이 달라진다
  var col=document.body.classList.contains('pc-mapcol'), unpin=document.body.classList.contains('pc-mapunpin');
  var fb=document.querySelector('#pcHeadCtl [data-headctl="fold"]'); if(fb){ var fk=col?'mapExpand':'mapCollapse'; fb.setAttribute('title',t(fk)); fb.setAttribute('aria-label',t(fk)); }
  var pb=document.querySelector('#pcHeadCtl [data-headctl="pin"]'); if(pb){ var pk=unpin?'mapPin':'mapUnpin'; pb.setAttribute('title',t(pk)); pb.setAttribute('aria-label',t(pk)); }
  var fsb=document.querySelector('#pcHeadCtl [data-headctl="fs"]'); if(fsb){ var fsk=document.body.classList.contains('pc-mapfs')?'mapExitFull':'mapFullscreen'; fsb.setAttribute('title',t(fsk)); fsb.setAttribute('aria-label',t(fsk)); }
  // 지도 모드일 때 제목도 갱신
  if(pcRightMode==='map'){ var rtl=document.getElementById('pcRightTtl'); if(rtl && rtl.textContent.indexOf('🗺')===0 && rtl.textContent.indexOf('5km')<0) rtl.textContent='🗺 '+t('mapTitle'); }
}

// ===== 헤더 높이 → 필터 sticky 오프셋(--hdr-h) =====
function pcSetHdrH(){ var h=document.querySelector('header'); if(h) document.documentElement.style.setProperty('--hdr-h', h.offsetHeight+'px'); }
pcSetHdrH();
// 창 크기가 바뀌면 지도 높이 최대치도 달라진다 → 저장값을 현재 화면에 맞게 재클램프(sticky 보호)
function pcOnResize(){ pcSetHdrH(); try{ if(typeof pcMapHClamp==='function'){ var cur=parseInt(getComputedStyle(document.documentElement).getPropertyValue('--pc-map-h'))||PC_MAPH_DEF; pcMapHApply(cur, false); } }catch(e){} }
window.addEventListener('resize', pcOnResize);
window.addEventListener('load', pcSetHdrH);

// ===== 화면 모드 (Window / Mobile) =====
(function(){
  var KEY='baz_viewmode';
  function apply(mode){
    if(mode!=='window' && typeof pcExitFullscreen==='function'){ try{ pcExitFullscreen(); }catch(e){} }   // 모바일 모드로 나가면 #pcPane이 사라지므로 전체화면 강제 해제
    document.body.classList.toggle('mode-window', mode==='window');
    document.body.classList.toggle('mode-mobile', mode==='mobile');
    try{ pcSetHdrH(); }catch(e){}
    var tg=document.getElementById('modeToggle');
    if(tg) tg.querySelectorAll('button').forEach(function(b){ b.classList.toggle('on', b.dataset.mode===mode); });
    // 레이아웃 전환 → 목록 재렌더 (mobile ↔ window)
    try{ if(typeof render==='function' && curTab==='list') render(); }catch(e){}
    // 카카오맵이 떠 있으면 넓이 변경 반영
    try{ if(typeof mapObj!=='undefined' && mapObj && mapObj.relayout){ setTimeout(function(){ mapObj.relayout(); }, 200); } }catch(e){}
    try{ if(pcMapObj && pcMapObj.relayout){ setTimeout(function(){ pcMapObj.relayout(); }, 220); } }catch(e){}
  }
  function get(){
    var saved=localStorage.getItem(KEY);
    if(saved==='window'||saved==='mobile') return saved;
    return (window.matchMedia && window.matchMedia('(min-width:900px)').matches) ? 'window' : 'mobile';
  }
  var cur=get(); apply(cur);
  var tg=document.getElementById('modeToggle');
  if(tg) tg.addEventListener('click', function(e){
    var btn=e.target.closest('button[data-mode]'); if(!btn) return;
    cur=btn.dataset.mode; localStorage.setItem(KEY, cur); apply(cur);
  });
})();

</script>
