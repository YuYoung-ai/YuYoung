function renderDash(){
  const ncare=HOSPITALS.filter(isNcare);
  // 경과 버킷
  const ages={normal:0,target:0,rec:0,warn:0,none:0};
  ncare.forEach(h=>{
    if(h.st==='미점검'||!h.li){ ages.none++; return; }
    const dd=daysSince(h.li);
    if(dd==null){ ages.none++; }
    else if(dd<=30) ages.normal++;
    else if(dd<=60) ages.target++;
    else if(dd<=90) ages.rec++;
    else ages.warn++;
  });
  const maxAge=Math.max(ages.normal,ages.target,ages.rec,ages.warn,ages.none,1);
  function bar(label,val,color){
    const w=Math.round(val/maxAge*100);
    return '<div class="bar-row"><div class="bar-label">'+label+'</div><div class="bar-track"><div class="bar-fill" style="width:'+(val?Math.max(w,8):0)+'%;background:'+color+'">'+(val||'')+'</div></div></div>';
  }
  // 상태 분포 (도넛 대신 범례+막대)
  const stCount={};
  ncare.forEach(h=>{ const s=h.st||'미점검'; stCount[s]=(stCount[s]||0)+1; });
  // 상태색 단일 소스: CSS 토큰(var)을 그대로 사용 → 다크모드 자동 적응
  const stColors={'정상':'var(--ok)','점검대상':'var(--teal)','권고':'var(--warn)','경고':'var(--danger)','미점검':'var(--neutral)'};
  const stTotal=ncare.length;
  let donut='';
  let acc=0; const segs=[];
  ['정상','점검대상','권고','경고','미점검'].forEach(s=>{
    const v=stCount[s]||0; if(!v) return;
    const pct=v/stTotal*100;
    segs.push(stColors[s]+' '+acc+'% '+(acc+pct)+'%'); acc+=pct;
  });
  const donutBg='conic-gradient('+segs.join(',')+')';
  let legend='';
  ['정상','점검대상','권고','경고','미점검'].forEach(s=>{
    const v=stCount[s]||0; if(!v) return;
    legend+='<div class="legend-item"><span class="legend-dot" style="background:'+stColors[s]+'"></span>'+s+'<span class="legend-val">'+v+'</span></div>';
  });
  // 영업담당별 N-CARE
  const salesCount={};
  ncare.forEach(h=>{ if(h.sa&&h.sa!=='장비OUT') salesCount[h.sa]=(salesCount[h.sa]||0)+1; });
  const salesSorted=Object.keys(salesCount).sort((a,b)=>salesCount[b]-salesCount[a]);
  const maxSales=Math.max(...Object.values(salesCount),1);
  let salesBars='';
  salesSorted.forEach(s=>{
    const v=salesCount[s]; const w=Math.round(v/maxSales*100);
    salesBars+='<div class="bar-row"><div class="bar-label">'+escapeHtml(s)+'</div><div class="bar-track"><div class="bar-fill" style="width:'+Math.max(w,8)+'%;background:var(--purple)">'+v+'</div></div></div>';
  });

  // N-CARE 점검 운영률 = 정상 상태 병원 / 전체 N-CARE (상태 필드 기준)
  const opTotal=ncare.length, opNormal=stCount['정상']||0;
  const opRate=opTotal?Math.round(opNormal/opTotal*100):0;
  const opDue=opTotal-opNormal;
  const opUrgent=(stCount['경고']||0)+(stCount['미점검']||0);   // 상태 기준 시급(경고·미점검)
  const opR=44, opC=2*Math.PI*opR, opDash=(opRate/100)*opC;
  const opColor=opRate>=80?'var(--ok)':opRate>=60?'var(--warn)':'var(--danger)';
  // ── 통합 개요 카드: 운영률 + 상태 분포 + 경과 현황을 한 카드에 ──
  const overviewCard=
    '<div class="dash-card"><div class="dash-title">'+t('dashOverview')+'</div>'+
      // ① 점검 운영률
      '<div class="dash-subtitle">'+t('dashSubOpRate')+'</div>'+
      '<div class="oprate">'+
        '<div class="oprate-ring">'+
          '<svg viewBox="0 0 104 104" width="104" height="104" role="img" aria-label="점검 운영률 '+opRate+'퍼센트">'+
            '<circle cx="52" cy="52" r="'+opR+'" fill="none" style="stroke:var(--surface-2)" stroke-width="11"/>'+
            '<circle cx="52" cy="52" r="'+opR+'" fill="none" style="stroke:'+opColor+'" stroke-width="11" stroke-linecap="round" stroke-dasharray="'+opDash.toFixed(1)+' '+(opC-opDash).toFixed(1)+'" transform="rotate(-90 52 52)"/>'+
          '</svg>'+
          '<div class="oprate-pct" style="color:'+opColor+'">'+opRate+'<span>%</span></div>'+
        '</div>'+
        '<div class="oprate-info">'+
          '<div class="oprate-main">정상 운영 <b style="color:var(--ok)">'+opNormal+'</b>곳 <span>/ 전체 '+opTotal+'곳</span></div>'+
          '<div class="oprate-sub">점검 필요 <b>'+opDue+'</b>곳 · 경고·미점검 <b>'+opUrgent+'</b>곳</div>'+
        '</div>'+
      '</div>'+
      '<hr class="dash-divider">'+
      // ② 점검 상태 분포
      '<div class="dash-subtitle">'+t('dashSubStatus')+'</div>'+
      '<div class="donut-wrap"><div style="width:120px;height:120px;border-radius:50%;background:'+donutBg+';flex:0 0 auto;position:relative;"><div style="position:absolute;inset:26px;background:var(--surface);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:var(--navy);">'+stTotal+'</div></div>'+
        '<div class="legend">'+legend+'</div></div>'+
      '<hr class="dash-divider">'+
      // ③ 점검 경과 현황
      '<div class="dash-subtitle">'+t('dashSubAge')+'</div>'+
      bar(t('bNormal'),ages.normal,'var(--ok)')+
      bar(t('bTarget'),ages.target,'var(--teal)')+
      bar(t('bRec'),ages.rec,'var(--warn)')+
      bar(t('bWarn'),ages.warn,'var(--danger)')+
      bar(t('bNone'),ages.none,'var(--neutral)')+
    '</div>';
  document.getElementById('viewDash').innerHTML=
    '<div class="stats" style="margin-bottom:14px;">'+
      '<div class="s"><div class="num" style="color:var(--teal)">'+ncare.length+'</div><div class="lbl">N-CARE</div></div>'+
      '<div class="s"><div class="num" style="color:var(--amber)">'+(ages.target+ages.rec+ages.warn+ages.none)+'</div><div class="lbl">'+t('stDue')+'</div></div>'+
      '<div class="s"><div class="num" style="color:var(--red)">'+(ages.warn+ages.none)+'</div><div class="lbl">'+t('overDue').replace('⚠ ','').replace('⚠','')+'</div></div>'+
    '</div>'+
    overviewCard+
    dashTrendCard()+
    '<div class="dash-card"><div class="dash-title">'+t('dashSalesTitle')+'</div>'+salesBars+'</div>'+
    renderNcareService(ncare);
}

// ===== N-CARE 전용 서비스 현황 대시보드 =====
// dashboard.html의 N-Care 정기점검 현황 패턴을 로컬 HOSPITALS(가입 병원) 기준으로 이식.
// 정기점검 현황(정상 비율 게이지 + 상태 배지 + 점검 필요 병원 리스트) + 등급/지역 분포.
function renderNcareService(ncare){
  const STCOL=['var(--ok)','var(--teal)','var(--warn)','var(--danger)','var(--neutral)'];
  const STLB=[t('bNormal'),t('bTarget'),t('bRec'),t('bWarn'),t('bNone')];
  const total=ncare.length;
  // 병원별 경과 상태 인덱스(0 정상 ~ 4 미점검) — renderDash의 ages 버킷과 동일 기준
  const cnt=[0,0,0,0,0];
  const list=ncare.map(function(h){
    let si, days=null;
    if(h.st==='미점검'||!h.li){ si=4; }
    else { days=daysSince(h.li);
      if(days==null) si=4; else if(days<=30) si=0; else if(days<=60) si=1; else if(days<=90) si=2; else si=3; }
    cnt[si]++;
    return {hosp:h.n, grade:h.nc, days:days, si:si};
  });
  const rate=total?Math.round(cnt[0]/total*100):0;
  // 점검 필요(si>0) 목록: 경과일 내림차순, 미점검(si4)은 뒤로
  const need=list.filter(function(x){return x.si>0;}).sort(function(a,b){
    if(a.si===4&&b.si!==4) return 1;
    if(b.si===4&&a.si!==4) return -1;
    return (b.days||0)-(a.days||0);
  });
  const inspBlock=
    '<div class="nck-rate">'+
      '<div class="nck-rate-top"><b>✅ '+t('ncsRate')+' '+rate+'%</b>'+
        '<span>'+t('ncsNormalOf').replace('{n}',cnt[0]).replace('{t}',total)+'</span></div>'+
      '<div class="nck-ratebar"><div style="width:'+Math.max(2,rate)+'%"></div></div>'+
    '</div>'+
    '<div class="nck-sum">'+STLB.map(function(lb,i){
      return '<div class="nck-badge" style="background:'+STCOL[i]+'"><b>'+cnt[i]+'</b>'+escapeHtml(lb)+'</div>';
    }).join('')+'</div>'+
    (need.length
      ? '<div class="nck-list">'+need.map(function(x){
          const dy = x.days!=null ? t('dayAgo').replace('{d}',x.days) : t('bNone');
          return '<div class="nck-row">'+
            '<span class="nck-dot" style="background:'+STCOL[x.si]+'"></span>'+
            '<span class="nm">'+escapeHtml(x.hosp)+'</span>'+
            '<span class="gd">'+escapeHtml(x.grade||'')+'</span>'+
            '<span class="dy">'+dy+'</span>'+
          '</div>';
        }).join('')+'</div>'
      : '<div style="text-align:center;padding:20px;color:var(--text-muted);font-size:13px;">'+t('ncsAllDone')+'</div>');
  // 분포 막대 헬퍼 (등급/지역 공용)
  function distBars(counts, color){
    const keys=Object.keys(counts).sort(function(a,b){return counts[b]-counts[a];});
    if(!keys.length) return '<div style="color:var(--text-muted);font-size:12px;text-align:center;padding:12px;">'+t('ncsNoData')+'</div>';
    const mx=Math.max.apply(null,keys.map(function(k){return counts[k];}).concat([1]));
    return keys.map(function(k){
      const v=counts[k], w=Math.round(v/mx*100);
      return '<div class="bar-row"><div class="bar-label" style="width:92px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="'+escapeHtml(k)+'">'+escapeHtml(k)+'</div>'+
        '<div class="bar-track"><div class="bar-fill" style="width:'+Math.max(w,8)+'%;background:'+color+'">'+v+'</div></div></div>';
    }).join('');
  }
  const gradeCount={}; ncare.forEach(function(h){ const g=h.nc||'-'; gradeCount[g]=(gradeCount[g]||0)+1; });
  const regCount={};   ncare.forEach(function(h){ const r=h.rg||'-'; regCount[r]=(regCount[r]||0)+1; });

  return '<div class="dash-card"><div class="dash-title">🩺 '+t('ncsTitle')+
      ' <span style="font-weight:400;color:var(--text-muted);font-size:11px;">'+t('ncsSubscribed').replace('{n}',total)+'</span></div>'+
    '<div class="dash-subtitle">'+t('ncsInspTitle')+'</div>'+
    inspBlock+
    '<hr class="dash-divider">'+
    '<div class="dash-subtitle">'+t('ncsGradeTitle')+'</div>'+
    distBars(gradeCount,'var(--teal)')+
    '<hr class="dash-divider">'+
    '<div class="dash-subtitle">'+t('ncsRegionTitle')+'</div>'+
    distBars(regCount,'var(--purple)')+
  '</div>';
}

// ===== 최근 처리 탭 =====
// HISTORY(병원별 처리 이력)를 날짜순으로 펼쳐 "오늘/이번주에 어느 병원이 어떻게 처리됐는지" 보여준다.
let rcRange = 1;        // 기본: 오늘 (오늘 기준 필터)
let rcFse = '';         // 처리자 필터 ('' = 전체)

// 병원명 → 영업담당 매핑 (HOSPITALS 기준)
function hospSalesMap(){
  const m = {};
  HOSPITALS.forEach(h=>{ if(h.n && !(h.n in m)) m[h.n] = h.sa || ''; });
  return m;
}

// 'yyyy-MM-dd' 안전 파싱 → Date(자정). 실패 시 null
function parseDateYMD(s){
  if(!s) return null;
  const m = String(s).match(/(\d{4})[-.\/](\d{1,2})[-.\/](\d{1,2})/);
  if(!m) return null;
  const d = new Date(+m[1], +m[2]-1, +m[3]);
  return isNaN(d) ? null : d;
}

// 최근 처리 집계에서 제외할 항목 (실제 병원이 아닌 데모/테스트 장비)
function rcIsExcluded(name){
  return /^데모/.test(name);   // "데모", "데모장비(...)" 등
}

// 모든 HISTORY 기록을 평탄화 (병원명 부착)
function flattenHistory(){
  const out = [];
  Object.keys(HISTORY).forEach(name=>{
    if(rcIsExcluded(name)) return;
    const recs = HISTORY[name];
    if(!Array.isArray(recs)) return;
    recs.forEach(r=>{
      const dt = parseDateYMD(r.d);
      if(!dt) return;
      out.push({ name:name, dt:dt, ds:r.d, rec:r });
    });
  });
  return out;
}

// [B1] 최근 30일 일별 처리 추이 — 인라인 SVG 에어리어(단일 시계열, 범례 없음)
// dataviz: 얇은 라인 2px, 은은한 그리드, 끝점 강조, 상태색과 무관한 accent(teal)
function dashTrendCard(){
  var DAYS=30, now=new Date();
  var today=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();
  var counts=new Array(DAYS).fill(0);
  flattenHistory().forEach(function(it){
    if(!it.dt) return;
    var diff=Math.round((today-it.dt.getTime())/86400000);
    if(diff>=0 && diff<DAYS) counts[DAYS-1-diff]++;
  });
  var total=counts.reduce(function(a,b){return a+b;},0);
  var max=Math.max.apply(null,counts.concat([1]));
  var W=600,H=80,padL=8,padR=8,padT=12,padB=18, plotW=W-padL-padR, plotH=H-padT-padB, base=H-padB;
  var X=function(i){ return padL+(DAYS<=1?0:i/(DAYS-1))*plotW; };
  var Y=function(v){ return padT+(1-v/max)*plotH; };
  var pts=counts.map(function(v,i){ return [X(i),Y(v)]; });
  var L=pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1);}).join(' L');
  var line='M'+L;
  var area='M'+X(0).toFixed(1)+','+base+' L'+L+' L'+X(DAYS-1).toFixed(1)+','+base+' Z';
  var midY=Y(max/2).toFixed(1), lp=pts[DAYS-1];
  var hits='';
  for(var i=0;i<DAYS;i++){
    var d=new Date(today-(DAYS-1-i)*86400000);
    var lbl=(d.getMonth()+1)+'/'+d.getDate()+' · '+counts[i]+'건';
    var w=plotW/(DAYS-1||1);
    hits+='<rect x="'+(X(i)-w/2).toFixed(1)+'" y="0" width="'+w.toFixed(1)+'" height="'+base+'" fill="transparent"><title>'+lbl+'</title></rect>';
  }
  var svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="height:auto;display:block;max-height:96px;" role="img" aria-label="최근 30일 일별 처리 건수 추이">'+
    '<line x1="'+padL+'" y1="'+base+'" x2="'+(W-padR)+'" y2="'+base+'" style="stroke:var(--line)" stroke-width="1"/>'+
    '<line x1="'+padL+'" y1="'+midY+'" x2="'+(W-padR)+'" y2="'+midY+'" style="stroke:var(--line)" stroke-width="1" stroke-dasharray="3 4" opacity=".7"/>'+
    '<path d="'+area+'" style="fill:var(--teal)" opacity=".13"/>'+
    '<path d="'+line+'" style="stroke:var(--teal)" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>'+
    '<circle cx="'+lp[0].toFixed(1)+'" cy="'+lp[1].toFixed(1)+'" r="3.6" style="fill:var(--teal);stroke:var(--surface)" stroke-width="2"/>'+
    hits+
  '</svg>';
  return '<div class="dash-card">'+
    '<div class="dash-title" style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;">최근 30일 처리 추이'+
      '<span style="font-size:18px;font-weight:800;color:var(--teal);">'+total+'<span style="font-size:11px;color:var(--text-muted);font-weight:600;"> 건</span></span></div>'+
    svg+
    '<div style="display:flex;justify-content:space-between;font-size:10px;color:var(--text-muted);margin-top:3px;"><span>30일 전</span><span>오늘</span></div>'+
  '</div>';
}

function renderRecent(){
  const wrap = document.getElementById('viewRecent');
  const now = new Date();
  const todayMid = new Date(now.getFullYear(), now.getMonth(), now.getDate());

  // 기간 시작일 (rcRange일 전 자정). '오늘'은 rcRange=1 → 오늘 0시부터
  const startMid = new Date(todayMid);
  startMid.setDate(startMid.getDate() - (rcRange - 1));

  const salesMap = hospSalesMap();

  // 기간 내 기록 추출 + 처리자 필터
  let items = flattenHistory().filter(it => it.dt >= startMid && it.dt <= todayMid);
  if(rcFse) items = items.filter(it => (it.rec.f||'') === rcFse);

  // 날짜 내림차순 (같은 날은 병원명 가나다)
  items.sort((a,b)=> b.dt - a.dt || a.name.localeCompare(b.name,'ko'));

  // 처리자 목록 (필터 드롭다운용 — 현재 보이는 전체 기간 무관, 30일 내 등장한 처리자)
  const fseStartMid = new Date(todayMid); fseStartMid.setDate(fseStartMid.getDate()-29);
  const fseSet = {};
  flattenHistory().forEach(it=>{ if(it.dt>=fseStartMid && it.dt<=todayMid && it.rec.f) fseSet[it.rec.f]=(fseSet[it.rec.f]||0)+1; });
  const fseList = Object.keys(fseSet).sort((a,b)=>fseSet[b]-fseSet[a]);

  // 기간 선택 칩
  const ranges = [[1,'rcToday'],[7,'rc7'],[14,'rc14'],[30,'rc30']];
  let rangeHtml = '<div class="rc-range">';
  ranges.forEach(([d,key])=>{
    rangeHtml += '<button class="chip'+(rcRange===d?' on':'')+'" data-rcrange="'+d+'">'+t(key)+'</button>';
  });
  rangeHtml += '</div>';

  // 처리자 필터
  let fseHtml = '<div class="rc-fsefilter"><select id="rcFseSelect"><option value="">'+t('rcAllFse')+'</option>';
  fseList.forEach(f=>{ fseHtml += '<option value="'+escapeHtml(f)+'"'+(rcFse===f?' selected':'')+'>'+escapeHtml(f)+' ('+fseSet[f]+')</option>'; });
  fseHtml += '</select></div>';

  // 요약
  const hospCount = new Set(items.map(it=>it.name)).size;
  const summary = '<div class="rc-summary">'+t('rcCount').replace('{n}', items.length).replace('{h}', hospCount)+'</div>';

  let body = '';
  if(!items.length){
    body = '<div class="tl-empty">'+t('rcEmpty')+'</div>';
  } else {
    // 날짜별 그룹
    const groups = {};
    items.forEach(it=>{ (groups[it.ds] = groups[it.ds] || []).push(it); });
    const dates = Object.keys(groups).sort((a,b)=> b.localeCompare(a));

    dates.forEach(ds=>{
      const list = groups[ds];
      body += '<div class="rc-day">';
      body += '<div class="rc-dayhead"><span>'+escapeHtml(rcDateLabel(ds))+'</span><span class="rc-daycnt">'+list.length+rcUnit()+'</span></div>';
      list.forEach(it=>{
        const r = it.rec;
        const isInsp = (r.t === '점검');
        const typeLabel = isInsp ? t('rcInsp') : t('rcAS');
        const typeCls = isInsp ? '점검' : 'AS';
        const sym = [r.pt, r.sy].filter(Boolean).join(' · ');
        const fx = r.fx ? escapeHtml(r.fx) : (r.m ? escapeHtml(r.m) : '');
        const meta = [];
        if(r.f) meta.push(t('rcFse')+' '+escapeHtml(r.f));
        const sa = salesMap[it.name];
        if(sa && sa!=='장비OUT') meta.push(t('sales')+' '+escapeHtml(sa));
        if(r.pay) meta.push(escapeHtml(r.pay));
        let metaLine = meta.length ? '<span>'+meta.join('</span><span>')+'</span>' : '';
        if(r.p && r.p!=='없음') metaLine += '<span class="rc-part">🔧 '+escapeHtml(r.p)+'</span>';

        body += '<div class="rc-item" data-rchosp="'+escapeHtml(it.name)+'">'+
          '<div class="rc-item-top"><span class="rc-hname">'+escapeHtml(it.name)+'</span>'+
            '<span class="rc-type '+typeCls+'">'+typeLabel+'</span></div>'+
          (sym ? '<div class="rc-sym">'+escapeHtml(sym)+'</div>' : '')+
          (fx ? '<div class="rc-fx">'+fx+'</div>' : '')+
          (metaLine ? '<div class="rc-metaline">'+metaLine+'</div>' : '')+
        '</div>';
      });
      body += '</div>';
    });
  }

  wrap.innerHTML = rangeHtml + fseHtml + summary + body;
  bindRecent();
}

// 건수 단위 (언어별)
function rcUnit(){ return LANG==='ja' ? '件' : (LANG==='en' ? '' : '건'); }

// 날짜 라벨: 오늘/어제 표기 + 요일
function rcDateLabel(ds){
  const dt = parseDateYMD(ds);
  if(!dt) return ds;
  const now = new Date();
  const todayMid = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const diff = Math.round((todayMid - dt)/86400000);
  const wkKo=['일','월','화','수','목','금','토'];
  const wk = wkKo[dt.getDay()];
  const md = (dt.getMonth()+1)+'월 '+dt.getDate()+'일';
  if(LANG==='en'){
    const wkEn=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const mdEn=(dt.getMonth()+1)+'/'+dt.getDate();
    if(diff===0) return 'Today · '+mdEn+' ('+wkEn[dt.getDay()]+')';
    if(diff===1) return 'Yesterday · '+mdEn+' ('+wkEn[dt.getDay()]+')';
    return mdEn+' ('+wkEn[dt.getDay()]+')';
  }
  if(LANG==='ja'){
    const wkJa=['日','月','火','水','木','金','土'];
    const mdJa=(dt.getMonth()+1)+'月'+dt.getDate()+'日';
    if(diff===0) return '今日 · '+mdJa+'('+wkJa[dt.getDay()]+')';
    if(diff===1) return '昨日 · '+mdJa+'('+wkJa[dt.getDay()]+')';
    return mdJa+'('+wkJa[dt.getDay()]+')';
  }
  if(diff===0) return '오늘 · '+md+' ('+wk+')';
  if(diff===1) return '어제 · '+md+' ('+wk+')';
  return md+' ('+wk+')';
}

function bindRecent(){
  const wrap = document.getElementById('viewRecent');
  wrap.querySelectorAll('[data-rcrange]').forEach(b=>{
    b.addEventListener('click', ()=>{ rcRange = parseInt(b.getAttribute('data-rcrange'),10); renderRecent(); });
  });
  const sel = document.getElementById('rcFseSelect');
  if(sel) sel.addEventListener('change', ()=>{ rcFse = sel.value; renderRecent(); });
  // 카드 탭 → 해당 병원 이력 모달 열기
  wrap.querySelectorAll('[data-rchosp]').forEach(card=>{
    card.addEventListener('click', ()=>{
      const name = card.getAttribute('data-rchosp');
      if(typeof openHist==='function') openHist(name);
    });
  });
}

// 이력 편집은 관리자(레벨2) 권한. 비밀번호는 서버(auth.js)가 검증합니다.
let histEditing = false;
let histCurName = null;

// localStorage에 저장된 이력 편집본 로드 (있으면 덮어쓰기)
(function loadHistEdits(){
  try{
    const saved = localStorage.getItem('baz_hosp_history');
    if(saved){
      const edits = JSON.parse(saved);
      Object.keys(edits).forEach(name=>{ HISTORY[name] = edits[name]; });
    }
  }catch(e){}
})();

function openHist(name){
  histCurName = name;
  histEditing = false;
  document.getElementById('histEditBar').style.display='none';
  document.getElementById('histLock').classList.remove('on');
  document.getElementById('histLock').textContent='🔒';
  renderHistBody();
  document.getElementById('histModal').classList.add('show');
  document.body.style.overflow='hidden';
}

function renderHistBody(){
  const name = histCurName;
  const recs = HISTORY[name] || [];
  document.getElementById('histName').textContent = name;
  document.getElementById('histSub').textContent = t('histCount').replace('{n}', recs.length) + (histEditing?' · '+t('histEditMode'):'');
  const body = document.getElementById('histBody');

  if(histEditing){
    // 편집 모드: 각 기록을 폼으로
    body.innerHTML = recs.map((r,i)=>histEditRow(r,i)).join('') || '<div class="tl-empty">'+t('histEmpty')+'</div>';
    return;
  }
  // 보기 모드
  if(!recs.length){
    body.innerHTML = '<div class="tl-empty">'+t('histEmpty')+'</div>';
  }else{
    body.innerHTML = recs.map(r=>{
      const isInsp = (r.t==='점검');
      const typeLabel = isInsp ? '점검' : 'A/S';
      const typeCls = isInsp ? '점검' : 'AS';
      const symLine = (r.pt||r.sy) ? '<div class="tl-cat">'+escapeHtml([r.pt,r.sy].filter(Boolean).join(' · '))+'</div>' : '';
      const memo = r.m ? '<div class="tl-memo">'+escapeHtml(r.m)+'</div>' : '';
      const fix = r.fx ? '<div class="tl-memo tl-fix">↳ '+escapeHtml(r.fx)+'</div>' : '';
      let partLine='';
      if(r.p){ partLine='<div class="tl-part">🔧 '+t('histPart')+': '+escapeHtml(r.p)+'</div>'; }
      const meta=[];
      if(r.f) meta.push(t('histFse')+' '+escapeHtml(r.f));
      if(r.pay) meta.push(escapeHtml(r.pay));
      const metaLine = meta.length ? '<div class="tl-meta">'+meta.join(' · ')+'</div>' : '';
      return '<div class="tl-item '+(isInsp?'':'as')+'">'+
        '<div class="tl-date">'+escapeHtml(r.d)+'<span class="tl-type '+typeCls+'">'+typeLabel+'</span></div>'+
        metaLine + symLine + memo + fix + partLine +
      '</div>';
    }).join('');
  }
}

function histEditRow(r,i){
  const v=(s)=>escapeHtml(s||'');
  return '<div class="tl-edit" data-i="'+i+'">'+
    '<div class="row2">'+
      '<input type="date" data-f="d" value="'+v(r.d)+'">'+
      '<select data-f="t"><option value="A/S"'+(r.t!=='점검'?' selected':'')+'>A/S</option><option value="점검"'+(r.t==='점검'?' selected':'')+'>점검</option></select>'+
    '</div>'+
    '<div class="row2">'+
      '<input type="text" data-f="pt" placeholder="부위" value="'+v(r.pt)+'">'+
      '<input type="text" data-f="sy" placeholder="현상" value="'+v(r.sy)+'">'+
    '</div>'+
    '<div class="row2">'+
      '<input type="text" data-f="f" placeholder="처리자" value="'+v(r.f)+'">'+
      '<input type="text" data-f="pay" placeholder="유/무상" value="'+v(r.pay)+'">'+
    '</div>'+
    '<textarea data-f="m" rows="2" placeholder="상세 내용">'+v(r.m)+'</textarea>'+
    '<textarea data-f="fx" rows="2" placeholder="처리 내용">'+v(r.fx)+'</textarea>'+
    '<input type="text" data-f="p" placeholder="교환품" value="'+v(r.p)+'">'+
    '<div style="text-align:right;"><button class="tl-edit-del" onclick="histDelRow('+i+')">🗑 삭제</button></div>'+
  '</div>';
}

// 편집 모드의 입력값을 HISTORY에 반영
function histCollectEdits(){
  const name = histCurName;
  const rows = document.querySelectorAll('#histBody .tl-edit');
  const newRecs=[];
  rows.forEach(row=>{
    const rec={};
    row.querySelectorAll('[data-f]').forEach(el=>{
      const f=el.getAttribute('data-f');
      const val=el.value.trim();
      if(val) rec[f]=val;
    });
    if(rec.d || rec.sy || rec.m) newRecs.push(rec);
  });
  // 날짜 내림차순 정렬
  newRecs.sort((a,b)=>(b.d||'').localeCompare(a.d||''));
  HISTORY[name]=newRecs;
}

function histDelRow(i){
  histCollectEdits();
  HISTORY[histCurName].splice(i,1);
  renderHistBody();
}

function histAddRow(){
  histCollectEdits();
  const today=new Date();
  const ds=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
  if(!HISTORY[histCurName]) HISTORY[histCurName]=[];
  HISTORY[histCurName].unshift({d:ds, t:'A/S'});
  renderHistBody();
}

function histSaveEdits(){
  histCollectEdits();
  // localStorage에 편집된 병원만 저장 (전체 누적)
  try{
    let store={};
    const prev=localStorage.getItem('baz_hosp_history');
    if(prev) store=JSON.parse(prev);
    store[histCurName]=HISTORY[histCurName];
    localStorage.setItem('baz_hosp_history', JSON.stringify(store));
    histExitEdit();
    if(typeof bazClearVerMemo==='function') bazClearVerMemo();   // 이력 편집 → 버전 캐시 무효화
    render(); // 카드 목록도 갱신 (이력 버튼 등)
    showHistToast(t('histSaved'));
  }catch(e){
    alert('저장 실패: '+e.message);
  }
}

  histEditing=false;
  document.getElementById('histEditBar').style.display='none';

function showHistToast(msg){
  let toast=document.getElementById('histToast');
  if(!toast){
    toast=document.createElement('div');
    toast.id='histToast';
    toast.style.cssText='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1B2F5E;color:#fff;font-size:13px;font-weight:700;padding:10px 18px;border-radius:20px;z-index:400;box-shadow:0 4px 16px rgba(0,0,0,.25);';
    document.body.appendChild(toast);
  }
  toast.textContent=msg;
  toast.style.opacity='1';
  setTimeout(()=>{ toast.style.transition='opacity .4s'; toast.style.opacity='0'; },1800);
}

// 🤖 AI 문의 버튼 → 현재 장비 정보·이력을 챗봇으로 전달
document.getElementById('histAiBtn').addEventListener('click', ()=>{
  const name = histCurName;
  if(!name) return;
  const hosp = HOSPITALS.find(h=>h.n===name) || {};
  const recs = (HISTORY[name] || []).slice(0, 12);  // 최근 12건만 전달

  // 이력을 챗봇이 읽는 최소 필드로 압축
  const slim = recs.map(r=>({
    d: r.d || '', sy: r.sy || '', fx: r.fx || '',
    p: r.p || '', pt: r.pt || ''
  }));

  // base64(JSON)로 인코딩 — 한글·특수문자 URL 안전 전달
  let ctxParam = '';
  try{
    ctxParam = btoa(unescape(encodeURIComponent(JSON.stringify(slim))));
  }catch(e){ ctxParam = ''; }

  const params = new URLSearchParams({
    hosp: name,
    serial: hosp.s || '',
    status: hosp.st || '',
    ncare: hosp.nc || '',
    pay: hosp.as || '',
    li: hosp.li || ''
  });
  if(ctxParam) params.set('ctx', ctxParam);

  location.href = 'chatbot.html?' + params.toString();
});

  document.getElementById('histPwErr').textContent='';

async function histCheckPw(){

  okBtn.disabled=true; okBtn.textContent='...';
  try{
    const r=await BazAuth.login(v);
    if(r.ok && r.level>=2){
      document.getElementById('histPwModal').classList.remove('show');

      document.getElementById('histPwErr').textContent='인증 서버 미설정 (auth.js의 AUTH_URL 입력)';

    }
  }finally{
    okBtn.disabled=false; okBtn.textContent=prev;
  }
}

function pcGoneEntry(hosp){
  var v=pcGone[hosp]; if(!v) return null;
  if(v.d!==pcTodayStr() || Date.now()-v.t>PC_GONE_TTL){ delete pcGone[hosp]; pcSaveGone(); return null; }
  return v;
}
function pcGoneHas(hosp){ return !!pcGoneEntry(hosp); }
// 최근 추가 보호(anti-tombstone): 방금 로컬에서 추가/설정한 병원을, 서버 왕복(GAS 콜드스타트)
// 지연 동안 폴링이 지우지 않도록 잠시 보존한다. 서버 큐에 반영이 확인되면 즉시 해제, 30초 후 자동 만료.
// (새로고침에도 유지되도록 localStorage 저장 → 저장 직후 새로고침해도 낙관적 추가가 유실되지 않음.)
var pcFresh=(function(){ try{ return JSON.parse(localStorage.getItem('baz_pc_fresh')||'{}')||{}; }catch(e){ return {}; } })();
function pcSaveFresh(){ try{ localStorage.setItem('baz_pc_fresh', JSON.stringify(pcFresh)); }catch(e){} }
function pcFreshMark(hosp){ if(hosp){ pcFresh[hosp]=Date.now(); pcSaveFresh(); } }
function pcFreshDel(hosp){ if(hosp && pcFresh[hosp]!=null){ delete pcFresh[hosp]; pcSaveFresh(); } }
function pcFreshHas(hosp){ var ts=pcFresh[hosp]; if(ts==null) return false; if(Date.now()-ts>30000){ delete pcFresh[hosp]; pcSaveFresh(); return false; } return true; }
// 서버 큐에서 tombstone된 병원 제거 + 서버에 삭제를 재요청할 목록 반환.
// 재요청은 방금(PC_GONE_RESEND 이내) 삭제한 건에만 한정한다 — 오래된 표식으로 서버를 지우면
// 다른 사용자가 오늘 다시 등록한 일정까지 폴링마다 삭제된다.
function pcGoneFilter(queues){
  var removed=[], out={};
  Object.keys(queues||{}).forEach(function(f){
    var arr=(queues[f]||[]).filter(function(x){
      if(!x||!x.h) return true;
      var g=pcGoneEntry(x.h); if(!g) return true;
      if(Date.now()-g.t<=PC_GONE_RESEND) removed.push({fse:f,hosp:x.h});
      return false;
    });
    if(arr.length) out[f]=arr;
  });
  return {q:out, removed:removed};
}
// 현장 일정에 항상 고정으로 표시할 담당자 카드(비어 있어도 노출). 매일 자동 초기화됨.
var PC_FIXED_FSE=['양승주','권오성'];
// 일일 자동 초기화: 날짜(Asia/Seoul)가 바뀌면 어제 일정의 '로컬 캐시'만 비우고 서버를 다시 받아온다.
// 서버(handover_gas.gs progRead_)가 같은 Asia/Seoul 기준으로 자체 초기화하므로 클라이언트는
// 서버에 삭제를 브로드캐스트하지 않는다 — 어제부터 열려 있던 탭이나 며칠 만에 켠 PC가 뒤늦게
// 이 검사를 통과하면서 q_clear를 쏴, 그날 이미 등록된 다른 사람의 현장 일정까지 통째로
// 지워버리던 사고(현장 일정 카드 전체 초기화)를 막는다. 어제 병원 tombstone도 남기지 않는다
// (오늘 다시 방문하는 병원이 폴링마다 서버에서 삭제되던 원인).
function pcDailyResetCheck(){
  var today=(typeof pcTodayStr==='function')?pcTodayStr():'';
  if(!today) return false;
  var last=''; try{ last=localStorage.getItem('baz_pc_sched_day')||''; }catch(e){}
  if(last===today) return false;
  try{ localStorage.setItem('baz_pc_sched_day', today); }catch(e){}
  if(!last) return false;                 // 최초 실행 → 기록만(초기화 안 함)
  pcQueues={}; pcSaveQueues();
  pcInProgress={}; pcSaveProg();
  pcDone={}; pcSaveDone();
  pcFresh={}; pcSaveFresh();
  pcGone={}; pcSaveGone();                // 어제의 삭제 표식이 오늘 일정을 가리지 않도록 폐기
  pcProgHold=0;                            // 로컬을 비웠으니 서버(권위) 상태를 즉시 다시 받아온다
  try{ pcProgPull(); }catch(e){}
  try{ if(typeof curTab!=='undefined' && curTab==='sched') renderSched(); }catch(e){}
  try{ pcRefreshProgViews(null, true); }catch(e){}
  return true;
}
/* 파싱 시점 실행 — 여기서 예외가 새면 이후 스크립트 전체가 정의되지 않아 화면이 통째로
   먹통이 된다. 일일 초기화 확인 실패는 화면을 못 쓰게 만들 만한 일이 아니므로 반드시 삼킨다. */
try{ pcDailyResetCheck(); }catch(e){ try{ console.warn('[현장일정] 일일 초기화 확인 실패(무시):', e); }catch(_){} }
function pcqEnsure(fse){ if(!pcQueues[fse]) pcQueues[fse]=[]; return pcQueues[fse]; }
function pcqFind(q,hosp){ for(var i=0;i<q.length;i++){ if(q[i].h===hosp) return i; } return -1; }
function pcqRemoveAll(hosp){ Object.keys(pcQueues).forEach(function(f){ pcQueues[f]=pcQueues[f].filter(function(x){return x.h!==hosp;}); }); }
function pcqOf(hosp){ var r=''; Object.keys(pcQueues).forEach(function(f){ if(pcqFind(pcQueues[f],hosp)>=0) r=f; }); return r; }
// 큐 → prog/done 파생 (wait 있고 prog 없으면 맨 앞 wait 자동 승격)
function pcDeriveProg(){
  var prog={}, seen={};
  Object.keys(pcQueues).forEach(function(fse){
    // 중복 병원 행 제거(같은 병원이 두 번 들어가는 유령 방지) + 잘못된 항목 정리
    var q=(pcQueues[fse]||[]).filter(function(x){ if(!x||!x.h||seen[x.h]) return false; seen[x.h]=1; return true; });
    pcQueues[fse]=q;
    if(!q.length){ delete pcQueues[fse]; return; }
    if(!q.some(function(x){return x.s==='prog';})){
      for(var i=0;i<q.length;i++){ if(q[i].s==='wait'){ q[i].s='prog'; break; } }
    }
    q.forEach(function(it){ if(it.s==='prog') prog[it.h]=fse; if(it.s==='done') pcDone[it.h]=1; });
  });
  pcInProgress=prog; pcSaveProg(); pcSaveDone(); pcSaveQueues();
}
// 큐 op 적용(로컬 낙관적) + 서버 반영 + 재렌더. 서버 progSave_와 동일 의미.
function pcQueueApply(op, fse, hosp, to){
  fse=(fse||'').trim(); hosp=(hosp||'').trim();
  var extra=null;   // 서버 정합용 보조 op(레거시 clear 등)
  if(op==='q_add' && fse && hosp){ pcGoneDel(hosp); pcFreshMark(hosp); pcqRemoveAll(hosp); pcqEnsure(fse).push({h:hosp,s:'wait'}); if(pcIsDone(hosp)) delete pcDone[hosp]; }
  else if(op==='q_remove' && hosp){ pcqRemoveAll(hosp); pcGoneAdd(hosp); pcFreshDel(hosp); if(pcIsProg(hosp)) delete pcInProgress[hosp]; if(pcIsDone(hosp)){ delete pcDone[hosp]; } extra={op:'clear', hosp:hosp}; }
  else if(op==='q_move' && fse && hosp){ var qm=pcqEnsure(fse),im=pcqFind(qm,hosp); if(im>=0){ var t=Math.max(0,Math.min(qm.length-1,Number(to))); var it=qm.splice(im,1)[0]; qm.splice(t,0,it); } }
  else if(op==='q_clear' && fse){ (pcQueues[fse]||[]).forEach(function(x){ if(x&&x.h){ pcGoneAdd(x.h); pcFreshDel(x.h); if(pcIsProg(x.h)) delete pcInProgress[x.h]; } }); delete pcQueues[fse]; }
  else if((op==='q_done'||op==='done') && hosp){ var f2=fse||pcqOf(hosp); if(f2){ var qd=pcqEnsure(f2),idd=pcqFind(qd,hosp); if(idd>=0) qd[idd].s='done'; } pcDone[hosp]=1; }
  else if(op==='set' && hosp){ pcGoneDel(hosp); pcFreshMark(hosp); pcqRemoveAll(hosp); var qs=pcqEnsure(fse); qs.forEach(function(x){ if(x.s==='prog') x.s='wait'; }); qs.unshift({h:hosp,s:'prog'}); if(pcIsDone(hosp)) delete pcDone[hosp]; }
  else if(op==='clear' && hosp){ pcqRemoveAll(hosp); pcGoneAdd(hosp); pcFreshDel(hosp); }
  else { return; }
  pcDeriveProg();
  var spec={op:op, hosp:hosp, fse:fse};
  if(op==='q_move') spec.to=Number(to);
  pcProgOp(spec);
  if(extra) pcProgOp(extra);
  pcRefreshProgViews(hosp, true);
}
// 레거시 진입점(상세/카드/표) → 큐 op로 라우팅
function pcSetProg(hosp, fse){ pcQueueApply('set', fse, hosp); }
function pcClearProg(hosp){ pcQueueApply('clear', '', hosp); }
function pcMarkDone(hosp){ if(!hosp) return; pcQueueApply('done', '', hosp); }
window.pcMarkDone=pcMarkDone;
// Handover 자동 완료: 진행중 병원이 오늘 handover(오늘 완료)에 기록되면 자동 완료 →
// 다음 병원 자동 진행중 승격. 담당자(fse)+병원 일치 우선(기록에 담당자 없으면 병원만 일치).
// 연쇄로 여러 건이 한 번에 완료되는 경우가 흔하므로 배치로 감싼다
// → POST 왕복 1회 + 재렌더 1회 (기존: 완료 1건마다 POST·전체 재렌더)
function pcAutoAdvanceFromHandover(){
  if(!pcQueues || typeof pcTodayList!=='function') return;
  var today=pcTodayList(); if(!today.length) return;
  var byHF={}, byH={};
  today.forEach(function(r){ var h=normalize(r.hosp); if(!h) return; var f=normalize(r.fse); if(f) byHF[h+'|'+f]=1; else byH[h]=1; });
  function completed(hosp, fse){ var h=normalize(hosp); return !!(byHF[h+'|'+normalize(fse)] || byH[h]); }
  var advanced=false;
  pcBatchRun(function(){
    var guard=0;
    while(guard++<60){
      var found=null;
      var fses=Object.keys(pcQueues);
      for(var i=0;i<fses.length && !found;i++){
        var fse=fses[i], q=pcQueues[fse]||[];
        for(var j=0;j<q.length;j++){ if(q[j].s==='prog' && completed(q[j].h, fse)){ found={fse:fse, h:q[j].h}; break; } }
      }
      if(!found) break;
      pcQueueApply('q_done', found.fse, found.h);   // 자동 완료 + 다음 승격 + 서버 반영
      advanced=true;
    }
  });
  return advanced;
}

// ── 서버 동기화 (HANDOVER_URL, 사용자 간 연동) ──
var pcProgHold=0;    // 로컬 변경 직후 폴링이 되돌리지 않도록 보호(GAS 콜드스타트 대비 넉넉히)
var pcProgRev=0;     // 서버 리비전 — 폴링에 실어 보내면 변경 없을 때 큐 전체를 받지 않는다
var pcLastAct=0;     // 마지막 조작 시각 — 직후에는 폴링을 촘촘히(공동 편집 반응 개선)
var pcOpBatch=null;  // 배치 수집 중이면 op 배열 — 연쇄 변경을 POST 1회로 묶는다
var pcRenderHold=0, pcRenderPending=null;   // >0이면 재렌더를 미뤘다가 배치 끝에 1회로 합친다

// 요청자(로그 시트의 '요청자' 열) — 누가 지웠는지 추적 가능하게
function pcWho(){ try{ return (window.BazAuth&&BazAuth.name&&BazAuth.name())||''; }catch(e){ return ''; } }
// op 1건: 배치 중이면 쌓고, 아니면 즉시 전송
function pcProgOp(spec){
  if(pcOpBatch){ pcOpBatch.push(spec); return; }
  pcProgSend(Object.assign({action:'progress_save', who:pcWho()}, spec));
}
// fn 안에서 일어나는 모든 큐 변경을 한 번의 POST + 한 번의 재렌더로 묶는다
function pcBatchRun(fn){
  if(pcOpBatch){ return fn(); }               // 이미 배치 중이면 그대로 합류
  pcOpBatch=[]; pcRenderHold++;
  try{ fn(); }
  finally{
    var ops=pcOpBatch; pcOpBatch=null;
    pcRenderHold--;
    if(ops.length===1) pcProgSend(Object.assign({action:'progress_save', who:pcWho()}, ops[0]));
    else if(ops.length>1) pcProgSend({action:'progress_save', ops:ops, who:pcWho()});
    var pend=pcRenderPending; pcRenderPending=null;
    if(pend) pcRefreshProgViews(pend.hosp, pend.silent);
  }
}
// 서버가 확정한 상태(POST 응답·GET 응답 공용)를 로컬에 반영. 반영했으면 true.
function pcProgAccept(d){
  if(!d || d.success!==true) return false;
  // 백엔드(v2.5+)가 queues를 줄 때만 서버 상태로 동기화. 구버전(미재배포)은
  // queues 필드가 없으므로 로컬 큐가 진실 — 서버 prog/done으로 덮어쓰지 않는다
  // (일정이 폴링에 사라지거나 유령처럼 되살아나는 문제 방지).
  var hasQ=Object.prototype.hasOwnProperty.call(d,'queues') && d.queues && typeof d.queues==='object';
  if(!hasQ) return false;
  if(typeof d.rev==='number'){
    if(d.rev < pcProgRev) return false;        // 늦게 도착한 옛 응답은 무시(순서 뒤바뀜 방지)
    pcProgRev=d.rev;
  }
  // tombstone: 삭제한 병원이 서버에 남아 되살아나면 걸러내고 서버에 재삭제 요청
  var f=pcGoneFilter(d.queues);
  var nq=f.q;
  if(f.removed.length){
    var ops=[];
    f.removed.forEach(function(r){ ops.push({op:'q_remove',fse:r.fse,hosp:r.hosp}); ops.push({op:'clear',hosp:r.hosp}); });
    pcProgSend({action:'progress_save', ops:ops, who:pcWho()});
  }
  // 최근 추가 보호: 방금 로컬에서 추가한 병원이 서버 왕복(콜드스타트) 지연으로 서버 큐에
  // 아직 없을 때, 폴링이 그 추가를 지우지 않도록 다시 넣어준다. 서버에 이미 있으면 표식 해제.
  // (동시 편집 시 상대의 변경을 반영하면서도 내 최신 추가가 유실되지 않게 함.)
  Object.keys(pcQueues).forEach(function(fq){
    (pcQueues[fq]||[]).forEach(function(x){
      if(!x||!x.h||!pcFreshHas(x.h)) return;
      var inServer=false;
      Object.keys(nq).forEach(function(g){ if(nq[g]&&pcqFind(nq[g],x.h)>=0) inServer=true; });
      if(inServer){ pcFreshDel(x.h); }
      else { if(!nq[fq]) nq[fq]=[]; nq[fq].push({h:x.h, s:'wait'}); }
    });
  });
  var nd=(d.done&&typeof d.done==='object')?d.done:{};
  // 큐가 진실 → 큐에서 prog 파생. done은 tombstone 아닌 항목만 병합 유지.
  if(JSON.stringify(nq)===JSON.stringify(pcQueues)){
    var changed=false; Object.keys(nd).forEach(function(h){ if(!pcGoneHas(h)&&!pcDone[h]){ pcDone[h]=1; changed=true; } });
    if(!changed) return false;
  }
  pcQueues=nq; pcSaveQueues();
  pcDeriveProg();
  Object.keys(nd).forEach(function(h){ if(!pcGoneHas(h)) pcDone[h]=1; });
  pcSaveDone();
  try{ pcAutoAdvanceFromHandover(); }catch(e){}   // handover 기록 반영 자동 승격
  pcRefreshProgViews(null, true);
  return true;
}
function pcProgSend(payload){
  if(!HANDOVER_URL) return;
  pcProgHold=Date.now()+8000;
  pcLastAct=Date.now();
  /* [보안] 서버 쓰기 인증 토큰 동봉 */
  try{ if(window.BazAuth&&BazAuth.token) payload=Object.assign({},payload,{token:BazAuth.token()}); }catch(e){}
  var body=JSON.stringify(payload);
  /* POST 응답에 서버가 확정한 큐가 들어 있다 — 이를 바로 반영하면 다음 폴링(최대 25초)을
     기다리지 않고 왕복 1회로 서버 상태가 확정된다. 응답을 못 읽으면(no-cors 폴백·네트워크
     오류) 로컬이 서버와 어긋났을 수 있으므로 rev를 지워 다음 폴링이 전체를 다시 받게 한다. */
  function fallback(){ pcProgRev=0; try{ fetch(HANDOVER_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:body}); }catch(e){} }
  try{
    fetch(HANDOVER_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:body})
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(!d || d.success!==true){ pcProgRev=0; return; }
        var hs=[]; if(payload.hosp) hs.push(payload.hosp);
        (payload.ops||[]).forEach(function(o){ if(o&&o.hosp) hs.push(o.hosp); });
        hs.forEach(pcFreshDel);          // 서버 반영 확인 → 보호 표식 해제
        pcProgHold=0;                    // 서버가 확정 → 폴링을 더 막아둘 이유가 없다
        pcProgAccept(d);
      })
      .catch(fallback);
  }catch(e){ fallback(); }
}
function pcProgPull(){
  if(!HANDOVER_URL || Date.now()<pcProgHold) return;
  /* rev 동봉 → 변경이 없으면 서버가 {nochange:true}만 반환(큐 직렬화·전송·파싱 생략) */
  var url=HANDOVER_URL+'?action=progress'+(pcProgRev?('&rev='+pcProgRev):'');
  fetch(_tk(url),{method:'GET'})
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(!d || d.success!==true) return;
      if(d.nochange===true){ if(typeof d.rev==='number') pcProgRev=d.rev; return; }
      pcProgAccept(d);
    })
    .catch(function(){});
}
// 초기 동기화 + 적응형 폴링 + 포커스/복귀 시 즉시 갱신(+ 자정 넘김 자동 초기화)
// 조작 직후 90초는 7초 간격 — 같은 일정을 함께 보는 다른 사용자에게 빠르게 전파된다.
// 그 외에는 25초, 숨은 탭은 정지. rev 덕분에 촘촘한 폴링도 대부분 빈 응답이라 비용이 낮다.
var pcPollTimer=null;
function pcPollDelay(){ return (Date.now()-pcLastAct < 90000) ? 7000 : 25000; }
function pcPollTick(){
  if(document.visibilityState!=='hidden'){
    try{ pcDailyResetCheck(); }catch(e){}
    pcProgPull();
    try{ if(pcRecentRequested) pcLoadRecent(); }catch(e){}
  }
  pcPollSchedule();
}
function pcPollSchedule(){ try{ clearTimeout(pcPollTimer); }catch(e){} pcPollTimer=setTimeout(pcPollTick, pcPollDelay()); }
function pcProgWake(){
  try{ pcDailyResetCheck(); }catch(e){}
  pcProgPull();
  try{ if(pcRecentRequested) pcLoadRecent(); }catch(e){}
  pcPollSchedule();
}
try{
  setTimeout(pcProgPull, 250);   // GAS 콜드스타트 예열 겸 첫 동기화를 최대한 앞당긴다
  pcPollSchedule();
  document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='visible') pcProgWake(); });
  window.addEventListener('focus', pcProgWake);
}catch(e){}

// 이벤트 위임 + 포인터 기반 드래그 (한 번만 바인딩)
function pcSchedBind(){
  if(pcSchedBound) return; pcSchedBound=true;
  var box=document.getElementById('viewSched'); if(!box) return;
  box.addEventListener('click', function(e){
    var t2;
    if((t2=e.target.closest('#schAddFseBtn'))){ var sel=document.getElementById('schFseSel'); var f=sel?sel.value:''; if(f){ pcSchedDraft[f]=1; renderSched(); } return; }
    if((t2=e.target.closest('.sch-res'))){ pcQueueApply('q_add', t2.getAttribute('data-fse'), t2.getAttribute('data-h')); return; }
    if((t2=e.target.closest('.sch-done'))){ var f2=t2.getAttribute('data-fse'), h2=t2.getAttribute('data-h'); pcQueueApply('q_done', f2, h2); var nx=pcqNextProg(f2); if(nx){ try{ if(typeof bazToast==='function') bazToast('✅ '+h2+' → '+t('schNext')+': '+nx); }catch(_){} } return; }
    if((t2=e.target.closest('.sch-up, .sch-down'))){ if(t2.disabled) return; pcQueueApply('q_move', t2.getAttribute('data-fse'), t2.getAttribute('data-h'), t2.getAttribute('data-to')); return; }
    if((t2=e.target.closest('.sch-del'))){ pcQueueApply('q_remove', t2.getAttribute('data-fse'), t2.getAttribute('data-h')); return; }
    if((t2=e.target.closest('.sch-fse-del'))){ var fd=t2.getAttribute('data-fse'); if(!pcConfirmClear(fd)) return; pcQueueApply('q_clear', fd); delete pcSchedDraft[fd]; renderSched(); return; }
    if((t2=e.target.closest('.sch-reset'))){ var fr=t2.getAttribute('data-fse'); if(!pcConfirmClear(fr)) return; pcQueueApply('q_clear', fr); delete pcSchedDraft[fr]; renderSched(); return; }
    var nm=e.target.closest('.sch-cn');
    if(nm){ var card=nm.closest('.sch-card'); var hn=card&&card.getAttribute('data-h'); if(hn) pcSchedOpenHosp(hn); return; }
  });
  box.addEventListener('input', function(e){ var s=e.target.closest('.sch-search'); if(s) schSearch(s); });
  // 포인터 드래그로 순서 이동(마우스·터치 공용)
  box.addEventListener('pointerdown', function(e){
    var handle=e.target.closest('.sch-handle'); if(!handle) return;
    var card=handle.closest('.sch-card'); var list=card&&card.parentNode; if(!card||!list) return;
    e.preventDefault();
    var fse=card.getAttribute('data-fse'), h=card.getAttribute('data-h');
    card.classList.add('dragging');
    function onMove(ev){
      var y=ev.clientY;
      var others=[].slice.call(list.querySelectorAll('.sch-card:not(.dragging)'));
      var after=null;
      for(var i=0;i<others.length;i++){ var r=others[i].getBoundingClientRect(); if(y < r.top + r.height/2){ after=others[i]; break; } }
      if(after) list.insertBefore(card, after); else list.appendChild(card);
    }
    function onUp(){
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      card.classList.remove('dragging');
      var all=[].slice.call(list.querySelectorAll('.sch-card'));
      var idx=all.indexOf(card);
      if(idx>=0) pcQueueApply('q_move', fse, h, idx); else renderSched();
    }
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
  });
}

// 목록 동일성 판정용 해시. 예전 키는 첫·마지막 이름만 봐서, 길이와 양끝이 같은 필터 변경을
// 놓치고 지도를 갱신하지 않았다. 전체 이름을 훑되 문자열 연결 없이 32bit로 접는다.
function pcListHash(list){
  var h=2166136261, n=list.length;
  for(var i=0;i<n;i++){
    var s=list[i].n||'', geo=(list[i].lat!=null)?1:0;
    for(var j=0;j<s.length;j++){ h^=s.charCodeAt(j); h=(h*16777619)>>>0; }
    h^=geo; h=(h*16777619)>>>0;
  }
  return n+':'+h;
}

// ── 지도 높이 조절 · 접기 · 고정 ─────────────────────────────────────────────
var PC_MAPH_DEF=400, PC_MAPH_MIN=220;
// 최대 높이는 화면에 맞춰 제한한다. sticky는 슬롯보다 커지면 아래가 접혀 스크롤 이탈하므로
// 이 클램프는 장식이 아니라 '스크롤 고정'을 지키는 핵심이다(큰 모니터 저장값이 노트북을 깨지 않게).
function pcMapHMax(){
  var hdr=0; try{ hdr=parseInt(getComputedStyle(document.documentElement).getPropertyValue('--hdr-h'))||56; }catch(e){ hdr=56; }
  return Math.max(PC_MAPH_MIN, (window.innerHeight||800)-hdr-40);
}
function pcMapHClamp(v){ return Math.max(PC_MAPH_MIN, Math.min(pcMapHMax(), Math.round(v))); }
function pcMapHApply(v, save){
  var h=pcMapHClamp(v);
  try{ document.documentElement.style.setProperty('--pc-map-h', h+'px'); }catch(e){}
  if(save){ try{ localStorage.setItem('baz_pc_maph', String(h)); }catch(e){} }
  return h;
}
function pcMapHInit(){
  var v=PC_MAPH_DEF; try{ var s=localStorage.getItem('baz_pc_maph'); if(s) v=parseInt(s,10)||PC_MAPH_DEF; }catch(e){}
  pcMapHApply(v, false);   // 로드 시 재클램프(저장값이 현재 화면보다 크면 줄인다)
}
// 접기 / 고정 상태 복원 + 토글
function pcMapFoldInit(){
  var f=false, p=false;
  try{ f=localStorage.getItem('baz_pc_mapcol')==='1'; }catch(e){}
  try{ p=localStorage.getItem('baz_pc_mapunpin')==='1'; }catch(e){}
  document.body.classList.toggle('pc-mapcol', f);
  document.body.classList.toggle('pc-mapunpin', p);
  var pb=document.querySelector('#pcHeadCtl [data-headctl="pin"]');
  if(pb){ pb.classList.toggle('on', !p); pb.setAttribute('title', p?t('mapPin'):t('mapUnpin')); }
}
function pcMapFoldToggle(){
  var on=!document.body.classList.contains('pc-mapcol');
  document.body.classList.toggle('pc-mapcol', on);
  try{ localStorage.setItem('baz_pc_mapcol', on?'1':'0'); }catch(e){}
  var fb=document.querySelector('#pcHeadCtl [data-headctl="fold"]');
  if(fb) fb.setAttribute('title', on?t('mapExpand'):t('mapCollapse'));
  // 펼칠 때: 접혀 있던 동안 목록이 바뀌었을 수 있으니 보던 위치를 유지하며 다시 그린다
  if(!on && pcMapVisible()){ pcRestoreView=true; try{ pcShowMap(pcList||[]); }catch(e){} }
}
function pcMapPinToggle(){
  var unpin=!document.body.classList.contains('pc-mapunpin');
  document.body.classList.toggle('pc-mapunpin', unpin);
  try{ localStorage.setItem('baz_pc_mapunpin', unpin?'1':'0'); }catch(e){}
  var pb=document.querySelector('#pcHeadCtl [data-headctl="pin"]');
  if(pb){ pb.classList.toggle('on', !unpin); pb.setAttribute('title', unpin?t('mapPin'):t('mapUnpin')); }
}
// 전체화면 — position:fixed로 흐름에서 빠지므로 문서가 짧아져 스크롤이 튄다.
// 진입 직전 패널 높이만큼 #pcPane에 인라인 padding으로 공간을 예약하고, 해제 시 되돌린다.
// (body 스크롤은 잠그지 않는다 — closeHist가 overflow를 무조건 리셋해 충돌하기 때문.)
function pcMapIsFull(){ return document.body.classList.contains('pc-mapfs'); }
function pcEnterFullscreen(){
  if(pcMapIsFull()) return;
  if(!pcMapVisible()) return;   // 표 뷰·접힘 등 지도 없는 상태에선 무시
  var rt=document.getElementById('pcRight'), pane=document.getElementById('pcPane');
  if(pane && rt){ pane.style.paddingTop=Math.round(rt.getBoundingClientRect().height)+'px'; }
  document.body.classList.add('pc-mapfs');
  pcFsBtnSync();
  // 크기가 확 커지므로 relayout + 현재 목록 전체 맞춤(보던 위치 유지 우선)
  if(pcMapObj){ pcRestoreView=true; try{ pcShowMap(pcList||[]); }catch(e){} setTimeout(function(){ try{ pcMapObj.relayout(); }catch(_){} }, 60); }
}
function pcExitFullscreen(){
  if(!pcMapIsFull()) return;
  document.body.classList.remove('pc-mapfs');
  var pane=document.getElementById('pcPane'); if(pane) pane.style.paddingTop='';
  pcFsBtnSync();
  if(pcMapObj){ pcRestoreView=true; try{ pcShowMap(pcList||[]); }catch(e){} setTimeout(function(){ try{ pcMapObj.relayout(); }catch(_){} }, 60); }
}
function pcToggleFullscreen(){ if(pcMapIsFull()) pcExitFullscreen(); else pcEnterFullscreen(); }
function pcFsBtnSync(){
  var full=pcMapIsFull();
  var fb=document.querySelector('#pcHeadCtl [data-headctl="fs"]');
  if(fb){ fb.classList.toggle('on', full); var k=full?'mapExitFull':'mapFullscreen'; fb.setAttribute('title',t(k)); fb.setAttribute('aria-label',t(k)); }
}
// 지도가 실제로 보이는 상태인가 — 표 뷰·접힘·비Window면 그리지 않는다(0크기 렌더 = 회색 고착 방지)
function pcMapVisible(){
  return pcListView!=='table'
    && !document.body.classList.contains('pc-mapcol')
    && document.body.classList.contains('mode-window');
}
// 드래그 핸들: 현장 일정 카드와 같은 pointer 캡처 패턴
function pcMapGripBind(){
  var grip=document.getElementById('pcMapGrip'); if(!grip || grip._bound) return; grip._bound=1;
  var startY=0, startH=0, dragging=false;
  grip.addEventListener('pointerdown', function(e){
    var rt=document.getElementById('pcRight'); if(!rt) return;
    dragging=true; startY=e.clientY; startH=rt.getBoundingClientRect().height;
    document.body.classList.add('pc-mapresizing');   // transition 끔 → 즉시 따라옴
    try{ grip.setPointerCapture(e.pointerId); }catch(_){}
    e.preventDefault();
  });
  grip.addEventListener('pointermove', function(e){
    if(!dragging) return;
    pcMapHApply(startH + (e.clientY-startY), false);   // #pcRightBody 크기변화 → ResizeObserver가 relayout
  });
  function end(e){
    if(!dragging) return; dragging=false;
    document.body.classList.remove('pc-mapresizing');
    try{ grip.releasePointerCapture(e.pointerId); }catch(_){}
    var rt=document.getElementById('pcRight');
    if(rt) pcMapHApply(rt.getBoundingClientRect().height, true);   // 최종값만 저장
  }
  grip.addEventListener('pointerup', end);
  grip.addEventListener('pointercancel', end);
  grip.addEventListener('dblclick', function(){ pcMapHApply(PC_MAPH_DEF, true); });   // 더블클릭 → 기본 높이
}
// 컨테이너 크기 변화 → relayout(카카오 타일 회색화 방지). 예전의 산발적 setTimeout 대체.
var pcRO=null, pcROraf=0, pcROw=0, pcROh=0;
function pcMapROBind(){
  if(pcRO || typeof ResizeObserver==='undefined') return;
  var body=document.getElementById('pcRightBody'); if(!body) return;
  try{
    pcRO=new ResizeObserver(function(entries){
      var r=entries[0]&&entries[0].contentRect; if(!r) return;
      var w=Math.round(r.width), h=Math.round(r.height);
      if(w===0||h===0) return;                 // 접힘·표뷰·display:none → 그리지 않음
      if(w===pcROw && h===pcROh) return;       // 동일 크기 재발화 무시(피드백 루프 방지)
      pcROw=w; pcROh=h;
      if(pcROraf) cancelAnimationFrame(pcROraf);
      pcROraf=requestAnimationFrame(function(){ pcROraf=0; if(pcMapObj){ try{ pcMapObj.relayout(); }catch(e){} } });
    });
    pcRO.observe(body);
  }catch(e){ pcRO=null; }
}
// [성능] 5km 주변 병원 탐색용 격자 인덱스.
// 예전에는 HOSPITALS(400+) × 목록 전체를 이중 루프로 돌며 distKm을 호출했다.
// 0.05°(≈5.5km) 셀에 한 번만 담아두고, 검사할 때는 인접 9칸만 본다.
var PC_GRID_DEG=0.05, pcGrid=null, pcGridN=0;
function pcGridKey(lat,lng){ return Math.floor(lat/PC_GRID_DEG)+','+Math.floor(lng/PC_GRID_DEG); }
function pcGridBuild(){
  // 지오코딩으로 좌표가 채워지면 개수가 늘어난다 → 개수가 바뀌었을 때만 재구축
  var withLoc=0, i;
  for(i=0;i<HOSPITALS.length;i++){ if(HOSPITALS[i].lat!=null&&HOSPITALS[i].lng!=null) withLoc++; }
  if(pcGrid && pcGridN===withLoc) return pcGrid;
  pcGrid={}; pcGridN=withLoc;
  for(i=0;i<HOSPITALS.length;i++){
    var o=HOSPITALS[i]; if(o.lat==null||o.lng==null) continue;
    var k=pcGridKey(o.lat,o.lng);
    (pcGrid[k]||(pcGrid[k]=[])).push(o);
  }
  return pcGrid;
}
// 기준 병원들 반경 km 안에 있는 '목록 밖' 병원 수집
function pcNearbyOf(list, km){
  var g=pcGridBuild(), seen={}, out=[], inList={};
  list.forEach(function(h){ inList[h.n]=1; });
  var span=Math.ceil(km/111/PC_GRID_DEG);   // 위도 1° ≈ 111km
  list.forEach(function(b){
    if(b.lat==null||b.lng==null) return;
    var ci=Math.floor(b.lat/PC_GRID_DEG), cj=Math.floor(b.lng/PC_GRID_DEG);
    for(var di=-span; di<=span; di++){
      for(var dj=-span; dj<=span; dj++){
        var cell=g[(ci+di)+','+(cj+dj)]; if(!cell) continue;
        for(var i=0;i<cell.length;i++){
          var o=cell[i];
          if(seen[o.n]||inList[o.n]) continue;
          if(distKm(b.lat,b.lng,o.lat,o.lng)<=km){ seen[o.n]=1; out.push(o); }
        }
      }
    }
  });
  return out;
}

function pcVendorTag(h){
  var v=(h.d||'').trim();
  if(v==='납품 1년 이내') return '<span class="h-tag warranty">🛡 워런티 유효</span>';
  if(v) return '<span class="h-tag vendor">'+escapeHtml(v)+'</span>';
  return '';
}
function pcVendorText(h){
  var v=(h.d||'').trim();
  if(v==='납품 1년 이내') return '워런티 유효';
  return v||'-';
}
function pcStatusBadge(h){
  if(pcIsProg(h.n)) return '<span class="st-badge 진행중">🔵 현재 처리중</span>';
  if(pcIsDone(h.n)) return '<span class="st-badge 정상">정상</span>';
  return isNcare(h)
    ? '<span class="st-badge '+(h.st||'미점검')+'">'+escapeHtml(h.st||'미점검')+'</span>'
    : '<span class="st-badge 비대상">'+t('notTarget')+'</span>';
}

function pcEnsureDOM(){
  if(pcDomReady) return;
  var vl=document.getElementById('viewList'); if(!vl) return;
  var pane=document.createElement('div');
  pane.id='pcPane';
  pane.innerHTML=
    '<div id="pcRight">'+                                   /* 지도/상세 — 상단 전폭 */
      '<div id="pcRightHead">'+
        '<span class="ttl" id="pcRightTtl">🗺 '+t('mapTitle')+'</span>'+
        /* 항상 보이는 헤더 컨트롤 — 접기·고정은 접힌 상태에서도 눌러야 하므로 지도 위가 아니라 헤더에 둔다 */
        '<div class="pc-headctl" id="pcHeadCtl">'+
          '<button type="button" class="pc-hctl" data-headctl="pin" title="'+t('mapPin')+'" aria-label="'+t('mapPin')+'">📌</button>'+
          '<button type="button" class="pc-hctl" data-headctl="fs" title="'+t('mapFullscreen')+'" aria-label="'+t('mapFullscreen')+'">⛶</button>'+
          '<button type="button" class="pc-hctl" data-headctl="fold" title="'+t('mapCollapse')+'" aria-label="'+t('mapCollapse')+'">▾</button>'+
        '</div>'+
        '<button class="pc-backmap" id="pcBackMap" type="button" style="display:none;">🗺 '+t('mapTitle')+'로</button>'+
      '</div>'+
      '<div id="pcRightBody">'+
        '<div id="pcMapPane"></div>'+
        /* 지도 위 컨트롤(확대·축소·전체 보기). #pcRightBody의 형제라 카카오가 타일을 다시 그려도
           지워지지 않는다. 상세 모드에선 지도가 안 보이므로 CSS로 함께 숨긴다. */
        '<div id="pcMapCtl" aria-label="'+t('mapControls')+'">'+
          '<button type="button" class="pc-mctl" data-mapctl="zin" title="'+t('mapZoomIn')+'" aria-label="'+t('mapZoomIn')+'">＋</button>'+
          '<button type="button" class="pc-mctl" data-mapctl="zout" title="'+t('mapZoomOut')+'" aria-label="'+t('mapZoomOut')+'">－</button>'+
          '<button type="button" class="pc-mctl" data-mapctl="fit" title="'+t('mapFitAll')+'" aria-label="'+t('mapFitAll')+'">⤢</button>'+
        '</div>'+
        '<div id="pcDetail"></div>'+
      '</div>'+
      '<div id="pcMapGrip" title="'+t('mapResize')+'" aria-label="'+t('mapResize')+'"><span></span></div>'+
    '</div>'+
    '<div id="pcToolbar">'+
      '<div class="pc-viewtoggle" id="pcViewToggle">'+
        '<button type="button" data-view="cards">⊞ 카드</button>'+
        '<button type="button" data-view="table">▤ 표</button>'+
      '</div>'+
      '<span class="pc-hint" id="pcHint">카드·행을 클릭하면 위 지도/상세에서 확인됩니다</span>'+
    '</div>'+
    '<div id="pcLeft"></div>'+
    '<div id="pcMapBackdrop"></div>';
  // #cardList 다음에 삽입
  var cl=document.getElementById('cardList');
  if(cl && cl.parentNode){ cl.parentNode.insertBefore(pane, cl.nextSibling); }
  else { vl.appendChild(pane); }

  // 좌측 필터 하단: 담당자 오늘 완료 카드
  var fr=document.getElementById('filterRail');
  if(fr && !document.getElementById('pcRecentCard')){
    var rc=document.createElement('div'); rc.id='pcRecentCard'; fr.appendChild(rc);
    rc.addEventListener('click', function(e){
      var done=e.target.closest('.rrc-done');
      if(done){ e.stopPropagation(); pcMarkDone(done.getAttribute('data-done-hn')); return; }
      var pl=e.target.closest('.rrc-prog');
      if(pl){ pcFocusHospOnMap(pl.getAttribute('data-hn'), null); return; }
      var it=e.target.closest('.rrc-item'); if(!it) return;
      pcFocusHospOnMap(it.getAttribute('data-hn'), it);
    });
  }
  // 좌측 필터 하단: 주변 이동 소요시간 카드
  if(fr && !document.getElementById('pcRouteCard')){
    var rtc=document.createElement('div'); rtc.id='pcRouteCard'; fr.appendChild(rtc);
    rtc.addEventListener('click', function(e){
      var so=e.target.closest('.prc-sort button[data-rsort]');
      if(so){ var v=so.getAttribute('data-rsort'); if(v!==pcRouteSort){ pcRouteSort=v; try{ localStorage.setItem('baz_pc_routesort',v); }catch(_){} pcRenderRouteCard(); } return; }
      var pb=e.target.closest('.prc-prog');
      if(pb){ pcToggleInProgress(pb.getAttribute('data-fse'), pb.getAttribute('data-hn')); return; }
      var dn=e.target.closest('.prc-done');
      if(dn){ e.stopPropagation(); pcMarkDone(dn.getAttribute('data-done-hn')); return; }
      var pc=e.target.closest('.prc-prog-cur');
      if(pc){ pcFocusHospOnMap(pc.getAttribute('data-hn'), null); return; }
      var it=e.target.closest('.prc-item'); if(!it) return;
      pcFocusHospOnMap(it.getAttribute('data-hn'), it);
    });
  }

  // 뷰 토글(카드/표)
  document.getElementById('pcViewToggle').addEventListener('click', function(e){
    var b=e.target.closest('button[data-view]'); if(!b) return;
    pcListView=b.dataset.view; localStorage.setItem('baz_pc_listview', pcListView);
    pcRender(pcList);
  });
  // 왼쪽(카드/표) 클릭 → 정렬 or 선택
  document.getElementById('pcLeft').addEventListener('click', function(e){
    var th=e.target.closest('th[data-sortkey]');
    if(th){
      var k=th.getAttribute('data-sortkey');
      if(pcSort.key===k) pcSort.dir*=-1; else { pcSort.key=k; pcSort.dir=1; }
      pcRenderLeft(pcList); pcHighlight(); return;
    }
    var pcg=e.target.closest('.pc-progchip');
    if(pcg){ pcToggleProgHosp(pcg.getAttribute('data-prog-hn')); return; }
    if(e.target.closest('#pcMoreBtn')){ pcShowCount+=60; pcRenderLeft(pcList); pcHighlight(); return; }
    if(e.target.closest('button, a')) return; // 카드 내 액션버튼은 통과
    var el=e.target.closest('[data-hname]'); if(!el) return;
    pcSelect(el.getAttribute('data-hname'));
  });
  document.getElementById('pcBackMap').addEventListener('click', pcBackToMap);
  // 지도 컨트롤(확대·축소·전체 보기)
  var mctl=document.getElementById('pcMapCtl');
  if(mctl) mctl.addEventListener('click', function(e){
    var b=e.target.closest('[data-mapctl]'); if(!b) return;
    var act=b.getAttribute('data-mapctl');
    if(act==='zin') pcMapZoom(-1);
    else if(act==='zout') pcMapZoom(1);
    else if(act==='fit') pcMapFitAll();
  });
  // 헤더 컨트롤(고정·접기)
  var hctl=document.getElementById('pcHeadCtl');
  if(hctl) hctl.addEventListener('click', function(e){
    var b=e.target.closest('[data-headctl]'); if(!b) return;
    var act=b.getAttribute('data-headctl');
    if(act==='pin') pcMapPinToggle();
    else if(act==='fold') pcMapFoldToggle();
    else if(act==='fs') pcToggleFullscreen();
  });
  // 딤 배경 클릭 → 전체화면 해제
  var bd=document.getElementById('pcMapBackdrop');
  if(bd) bd.addEventListener('click', pcExitFullscreen);
  // 높이 초기화 + 접기/고정 복원 + 드래그·리사이즈 감시
  pcMapHInit(); pcMapFoldInit(); pcMapGripBind(); pcMapROBind();
  pcDomReady=true;
}

function pcCardsHTML(list){
  return '<div class="pc-cards">'+ list.map(function(h){
    var on=pcIsProg(h.n);
    var chip='<button class="pc-progchip'+(on?' on':'')+'" data-prog-hn="'+escapeHtml(h.n)+'" title="진행중 설정/해제">'+(on?'🔵 진행중':'진행중')+'</button>';
    return '<div class="pc-cardwrap'+(h.n===pcSelName?' sel':'')+(on?' prog':'')+'" data-hname="'+escapeHtml(h.n)+'">'+chip+cardHTML(h)+'</div>';
  }).join('') +'</div>';
}

function pcTableHTML(list, limit){
  var cols=[
    {k:'n',  label:'병원명',   sv:function(h){return normalize(h.n);},        cell:function(h){return (pcIsProg(h.n)?'<span class="pc-progchip tbl on" data-prog-hn="'+escapeHtml(h.n)+'" title="진행중 해제">🔵</span>':'<span class="pc-progchip tbl" data-prog-hn="'+escapeHtml(h.n)+'" title="진행중 설정">○</span>')+'<b>'+escapeHtml(h.n)+'</b>';}},
    {k:'rg', label:'지역',     sv:function(h){return h.rg||'';},              cell:function(h){return escapeHtml(h.rg||'-');}},
    {k:'sa', label:'영업담당', sv:function(h){return h.sa||'';},              cell:function(h){return escapeHtml(h.sa||'-');}},
    {k:'st', label:'상태',     sv:function(h){return isNcare(h)?(PC_ST_ORDER[h.st]!=null?PC_ST_ORDER[h.st]:9):99;}, cell:function(h){return pcStatusBadge(h);}},
    {k:'days',label:'점검경과',sv:function(h){var d=daysSince(h.li);return d==null?-1:d;}, cell:function(h){var d=daysSince(h.li);return d==null?'<span style="color:var(--text-muted)">-</span>':(d+'일');}},
    {k:'nc', label:'N-CARE',   sv:function(h){return isNcare(h)?(h.nc||''):'zzz';}, cell:function(h){return isNcare(h)?escapeHtml(h.nc):'<span style="color:var(--text-muted)">미가입</span>';}},
    {k:'d',  label:'거래처',   sv:function(h){return pcVendorText(h);},        cell:function(h){var v=(h.d||'').trim(); if(v==='납품 1년 이내') return '<span class="pc-badge" style="background:var(--ok-soft);color:var(--ok);">워런티 유효</span>'; return v?escapeHtml(v):'<span style="color:var(--text-muted)">-</span>';}},
    {k:'hp', label:'HP',       sv:function(h){return (h.hpv||'').trim()||getLastHpVer(h.n)||'';}, cell:function(h){var x=(h.hpv||'').trim()||getLastHpVer(h.n);return x?escapeHtml(x):'-';}},
    {k:'ui', label:'UI',       sv:function(h){return (h.uiv||'').trim()||getLastUiVer(h.n)||'';}, cell:function(h){var x=(h.uiv||'').trim()||getLastUiVer(h.n);return x?escapeHtml(x):'-';}}
  ];
  var col=null; for(var i=0;i<cols.length;i++){ if(cols[i].k===pcSort.key){col=cols[i];break;} }
  if(!col) col=cols[0];
  var sorted=list.slice().sort(function(a,b){
    var va=col.sv(a), vb=col.sv(b);
    if(va<vb) return -1*pcSort.dir; if(va>vb) return 1*pcSort.dir; return normalize(a.n)<normalize(b.n)?-1:1;
  });
  var head='<tr>'+cols.map(function(c){
    var ar = (c.k===pcSort.key) ? '<span class="ar">'+(pcSort.dir>0?'▲':'▼')+'</span>' : '<span class="ar">↕</span>';
    return '<th data-sortkey="'+c.k+'">'+c.label+ar+'</th>';
  }).join('')+'</tr>';
  if(limit) sorted=sorted.slice(0,limit);   // [성능] 정렬 후 표시 개수만 렌더
  var rows=sorted.map(function(h){
    var cls=[]; if(h.n===pcSelName) cls.push('sel'); if(pcIsProg(h.n)) cls.push('prog');
    return '<tr data-hname="'+escapeHtml(h.n)+'"'+(cls.length?' class="'+cls.join(' ')+'"':'')+'>'+
      cols.map(function(c){return '<td>'+c.cell(h)+'</td>';}).join('')+'</tr>';
  }).join('');
  return '<div class="pc-table-wrap"><table class="pc-table"><thead>'+head+'</thead><tbody>'+rows+'</tbody></table></div>';
}

// ===== 최근 완료(현장 처리) — handover 시트 기록 반영 =====
function pcHospByName(name){
  var k=normalize(name); if(!k) return null;
  for(var i=0;i<HOSPITALS.length;i++){ if(normalize(HOSPITALS[i].n)===k) return HOSPITALS[i]; }
  for(var j=0;j<HOSPITALS.length;j++){ var n=normalize(HOSPITALS[j].n); if(n && (n.indexOf(k)>=0||k.indexOf(n)>=0)) return HOSPITALS[j]; }
  return null;
}
function pcMergeRecent(rows){
  var seen={}, out=[];
  (rows||[]).forEach(function(r){
    var hosp=String(r.hosp||'').trim(); if(!hosp) return;
    var date=String(r.date||'').trim(), fse=String(r.fse||'').trim();
    var key=normalize(hosp)+'|'+date+'|'+normalize(fse);
    if(seen[key]) return; seen[key]=1;
    out.push({hosp:hosp, fse:fse, date:date, gubun:String(r.gubun||'').trim()});
  });
  out.sort(function(a,b){ return pcDateKey(b.date).localeCompare(pcDateKey(a.date)); });
  return out.slice(0,40);
}
function pcLocalRecent(){ try{ return JSON.parse(localStorage.getItem('baz_recent_handover')||'[]')||[]; }catch(e){ return []; } }

/* ── 사용자 숙련도 평가 (handover R·S·T열) — 병원별 최신 1건만 카드 배지로 ──
   ※ PC_SKILL 초기화는 렌더보다 먼저 실행되어야 하므로 상단 유틸 영역에 있음 */
function pcBuildSkill(rows){
  var map={};
  (rows||[]).forEach(function(r){
    var hosp=String(r.hosp||'').trim(); if(!hosp) return;
    var nsFill=String(r.nsFill||'').trim(), nsAmt=String(r.nsAmt||'').trim(), jet=String(r.jet||'').trim();
    if(!nsFill && !nsAmt && !jet) return;                 /* 평가 없는 기록은 무시 */
    var k=normalize(hosp), dk=pcDateKey(r.date);
    if(map[k] && map[k].dk >= dk) return;                 /* 더 최근 방문 값만 유지 */
    map[k]={dk:dk, nsFill:nsFill, nsAmt:nsAmt, jet:jet};
  });
  PC_SKILL=map;
  try{ localStorage.setItem('baz_pc_skill_cache', JSON.stringify(map)); }catch(e){}
}
/* 병원별 숙련도 라벨: 3항목 중 X·부족·교육 필요면 '교육 필요', 그 외(O·정상·과다·가능)는 '교육 완료'.
   평가 데이터 없으면 '' — 배지·검색 대상 공용 */
function pcSkillLabel(name){
  var s=PC_SKILL && PC_SKILL[normalize(name)];
  if(!s) return '';
  return (s.nsFill==='X'||s.nsAmt==='부족'||s.jet==='교육 필요') ? '교육 필요' : '교육 완료';
}
function pcSkillBadge(name){
  var s=PC_SKILL && PC_SKILL[normalize(name)];   /* 초기화 전이어도 카드 렌더가 죽지 않도록 방어 */
  if(!s) return '';
  var label=pcSkillLabel(name), need=(label==='교육 필요');
  var detail=['NS충진 '+(s.nsFill||'-'), '충진량 '+(s.nsAmt||'-'), '젯 '+(s.jet||'-')].join(' · ');
  return '<span class="h-skill'+(need?' warn':' ok')+'" title="사용자 숙련도 평가 · '+escapeHtml(detail)+(s.dk?' · '+s.dk:'')+'">'+(need?'🎓':'✅')+' '+label+'</span>';
}
function pcLoadRecent(cb){
  var local=pcLocalRecent();
  var cached=null, ts=parseInt(localStorage.getItem('baz_pc_recent_ts')||'0',10);
  try{ cached=JSON.parse(localStorage.getItem('baz_pc_recent_cache')||'null'); }catch(e){}
  if(cached && cached.length){ pcRecent=pcMergeRecent(local.concat(cached)); pcRecentState='done'; if(!pcFseAll.length) pcCollectFse(local.concat(cached), false); try{ pcAutoAdvanceFromHandover(); }catch(e){} if(cb) cb(); }
  else if(local.length){ pcRecent=pcMergeRecent(local); if(!pcFseAll.length) pcCollectFse(local, false); try{ pcAutoAdvanceFromHandover(); }catch(e){} if(cb) cb(); }
  if(cached && (Date.now()-ts)<5*60*1000) return;      // 5분 캐시 신선
  if(!HANDOVER_URL){ if(!pcRecent.length){ pcRecentState='done'; } return; }
  if(pcRecentState!=='done') pcRecentState='loading';
  fetch(_tk(HANDOVER_URL+'?action=all'),{method:'GET'})
    .then(function(r){ return r.json(); })
    .then(function(d){
      var data=(d&&d.data)||[];
      pcRecent=pcMergeRecent(pcLocalRecent().concat(data));
      pcCollectFse(data, true);   // 전체 handover 응답 기준으로 CS 담당자 목록 갱신(권위)
      pcBuildSkill(data);         // 같은 응답에서 숙련도 평가 맵 생성(추가 요청 없음)
      pcRecentState='done';
      try{ localStorage.setItem('baz_pc_recent_cache', JSON.stringify(pcRecent)); localStorage.setItem('baz_pc_recent_ts', String(Date.now())); }catch(e){}
      try{ pcAutoAdvanceFromHandover(); }catch(e){}
      if(cb) cb();
    })
    .catch(function(){ pcRecentState=pcRecent.length?'done':'error'; if(cb) cb(); });
}
// 오늘 날짜(yyyy-MM-dd) — 서버(handover_gas.gs)·handover 시트와 동일하게 Asia/Seoul 고정.
// PC 시계/표준시간대가 어긋나 있으면 하루가 엉뚱한 시각에 넘어가 일정이 근무 중에 초기화되고
// '오늘 완료' 매칭도 빗나가므로 기기 로컬 시간을 쓰지 않는다(미지원 환경만 로컬로 폴백).
// 캐시는 함수 객체에 둔다(pcTodayStr._c). 이 함수는 선언보다 앞선 파싱 시점 코드
// (pcDailyResetCheck)에서 호출되므로, 모듈 스코프 var에 캐시를 두면 그 시점엔 아직
// undefined라 접근 자체가 예외가 되고 이후 스크립트 전체가 죽는다.
function pcTodayStr(){
  var now=Date.now(), c=pcTodayStr._c;
  if(c && c.v && now-c.t<30000) return c.v;   // 폴링·필터에서 자주 호출 → 30초 캐시
  var v='';
  try{
    var s=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
    if(/^\d{4}-\d{2}-\d{2}$/.test(s)) v=s;
  }catch(e){}
  if(!v){ var d=new Date(), z=function(n){return (n<10?'0':'')+n;}; v=d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate()); }
  pcTodayStr._c={t:now, v:v};
  return v;
}
// 시트 표시형식(getDisplayValues)이 'yyyy. M. d' 등 로케일 형태로 오므로
// 구분자·공백에 상관없이 yyyy-MM-dd 키로 정규화 (handover 날짜 매칭 안정화)
function pcDateKey(s){
  if(!s) return '';
  var m=String(s).match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
  if(!m) return '';
  return m[1]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[3]).slice(-2);
}
function pcTodayList(){
  var today=pcTodayStr();
  return pcRecent.filter(function(r){ return pcDateKey(r.date)===today; });
}
// 좌측 필터 하단: 담당자 오늘 완료 카드
function pcRenderRecentCard(){
  var box=document.getElementById('pcRecentCard'); if(!box) return;
  var list=pcTodayList();
  // 총 건수는 오늘 전체 완료 건수 유지
  var head='<div class="rrc-head">🏁 오늘 완료 <span class="rrc-cnt">'+list.length+'건</span></div>';
  // 인원(FSE)별 가장 최신 완료 1건 + 건수 (pcTodayList는 오래된→최신 순 → 마지막이 최신)
  var latestByFse={}, cntByFse={}, order=[];
  list.forEach(function(r){
    var fse=String(r.fse||'').trim(); if(!fse) fse='(담당 미상)';
    if(!(fse in latestByFse)) order.push(fse);
    latestByFse[fse]=r; cntByFse[fse]=(cntByFse[fse]||0)+1;
  });
  // 현장 일정에서 진행중인 담당자(오늘 완료가 없어도 표시 → 일정↔완료 연동)
  var progByFse={};
  Object.keys(pcInProgress||{}).forEach(function(hn){ var f=pcInProgress[hn]; if(f){ progByFse[f]=hn; if(order.indexOf(f)<0) order.push(f); } });
  if(!order.length){
    var msg=(pcRecentState==='loading')?'불러오는 중…':(pcRecentState==='error')?'불러오기 실패 (네트워크 확인)':'오늘 완료 내역이 없습니다';
    box.innerHTML=head+'<div class="rrc-empty">'+msg+'</div>'; return;
  }
  box.innerHTML=head+'<div class="rrc-list">'+order.map(function(fse){
    var r=latestByFse[fse];
    var g=(r&&r.gubun)?'<span class="rrc-g">'+escapeHtml(r.gubun)+'</span>':'';
    var cnt=cntByFse[fse]||0;
    var cntTag=(cnt>1)?'<span class="rrc-cnt2">오늘 '+cnt+'건</span>':'';
    var prog=progByFse[fse]||pcProgHospOf(fse);   // 이 담당자의 현재 진행중 병원(일정 기준)
    var progLine=prog
      ? '<div class="rrc-prog" data-hn="'+escapeHtml(prog)+'">🔵 '+t('schProg')+' · '+escapeHtml(prog)+
          '<button class="rrc-done" type="button" data-done-hn="'+escapeHtml(prog)+'" title="완료 처리">'+t('schDone')+'</button></div>'
      : '';
    var nm = r ? escapeHtml(r.hosp) : ('🗺 '+escapeHtml(fse)+' · '+t('schActive'));
    var dataHn = r ? (function(){ var h=pcHospByName(r.hosp); return escapeHtml(h?h.n:r.hosp); })() : escapeHtml(prog||'');
    var meta = r
      ? '<div class="rrc-meta"><span class="fse">🧑‍🔧 '+escapeHtml(fse)+'</span>'+g+cntTag+'</div>'
      : '<div class="rrc-meta"><span class="fse">🧑‍🔧 '+escapeHtml(fse)+'</span><span class="rrc-g">'+t('schActive')+'</span></div>';
    return '<div class="rrc-item" data-hn="'+dataHn+'">'+
      (r?'<div class="rrc-nm">'+nm+'</div>':'')+
      meta+
      progLine+
    '</div>';
  }).join('')+'</div>';
}

// ===== 주변 병원 이동 소요시간 카드 =====
// 오늘 완료한 FSE 담당자별로, 가장 최근 처리 병원 위치 기준 가까운 병원 최대 3곳 + 예상 이동시간
function pcEstMin(km){ return Math.max(1, Math.round(km * 2.6)); }  // 도로계수 1.3 · 평균 30km/h 추정
// 정렬 모드: 'near'(가까운 순) | 'due'(점검필요 우선). localStorage 저장.
var pcRouteSort = (function(){ var v=localStorage.getItem('baz_pc_routesort'); return (v==='due'||v==='near')?v:'near'; })();
// 점검 심각도 랭크(높을수록 시급) — N-CARE 기준
function pcSevRank(h){ var m={'미점검':4,'경고':3,'권고':2,'점검대상':1}; return m[h.st]||0; }
function pcSevColor(h){
  if(!isNcare(h)) return 'var(--neutral)';
  return {'정상':'var(--ok)','점검대상':'var(--teal)','권고':'var(--warn)','경고':'var(--danger)','미점검':'var(--neutral)'}[h.st]||'var(--neutral)';
}
// 후보 병원 풀(현재 위치 from 기준). near=반경 5km(없으면 10km) 점검대상,
// due=반경 15km 점검대상(심각도 우선).
function pcRouteCandidates(from, mode){
  mode = mode || 'near';
  var all=[];
  for(var i=0;i<HOSPITALS.length;i++){
    var h=HOSPITALS[i];
    if(h.lat==null||h.lng==null) continue;
    if(h.n===from.n) continue;
    if(/^데모/.test(h.n)) continue;
    if(!isNcare(h)) continue;                          // N-CARE 가입 병원만
    if(!isDue(h)) continue;                             // 점검대상만
    all.push({h:h, d:distKm(from.lat,from.lng,h.lat,h.lng)});
  }
  if(mode==='due'){
    var pool=all.filter(function(x){ return x.d<=15; });
    pool.sort(function(a,b){ var sa=pcSevRank(a.h), sb=pcSevRank(b.h); if(sa!==sb) return sb-sa; return a.d-b.d; });
    return pool;
  }
  var within=all.filter(function(x){ return x.d<=5; });
  if(!within.length) within=all.filter(function(x){ return x.d<=10; });
  within.sort(function(a,b){ return a.d-b.d; });
  return within;
}
// 최적 동선(최근접 이웃 그리디): from → 가장 가까운 후보 → 그 지점에서 다시 최근접… 최대 n곳.
// 각 구간 거리(leg)·소요(legMin)와 누적 시간(cum) 반환.
function pcOptimalRoute(from, cands, n){
  var remaining=cands.slice(), route=[], cur={lat:from.lat,lng:from.lng}, cum=0;
  for(var k=0;k<n && remaining.length;k++){
    var bi=-1, bd=Infinity;
    for(var i=0;i<remaining.length;i++){ var d=distKm(cur.lat,cur.lng,remaining[i].h.lat,remaining[i].h.lng); if(d<bd){ bd=d; bi=i; } }
    if(bi<0) break;
    var pick=remaining.splice(bi,1)[0];
    var legMin=pcEstMin(bd); cum+=legMin;
    route.push({h:pick.h, leg:bd, legMin:legMin, cum:cum});
    cur={lat:pick.h.lat, lng:pick.h.lng};
  }
  return route;
}
function pcRenderRouteCard(){
  var box=document.getElementById('pcRouteCard'); if(!box) return;
  var head='<div class="prc-head">🚗 주변 이동 소요시간 <span class="prc-sub">오늘 기준</span></div>'+
    '<div class="prc-sort" role="group" aria-label="정렬">'+
      '<button type="button" data-rsort="near"'+(pcRouteSort==='near'?' class="on"':'')+'>가까운 순</button>'+
      '<button type="button" data-rsort="due"'+(pcRouteSort==='due'?' class="on"':'')+'>점검필요 우선</button>'+
    '</div>';
  var today=pcTodayList();
  // FSE 담당자별 '가장 최근' 오늘 완료 병원.
  // handover는 시트 하단에 append(오래된→최신)되어 pcTodayList도 오래된→최신 순 →
  // 마지막(최신)이 이기도록 덮어쓴다. 좌표가 없어도 '현재'는 최신 완료를 표시하고,
  // 주변 병원 계산은 좌표가 있을 때만 수행한다.
  var curByFse={}, order=[];
  today.forEach(function(r){
    var fse=String(r.fse||'').trim(); if(!fse) return;
    var name=String(r.hosp||'').trim(); if(!name) return;
    if(!(fse in curByFse)) order.push(fse);
    var h=pcHospByName(name);
    curByFse[fse]={ name:name, from:(h&&h.lat!=null&&h.lng!=null)?h:null };   // 최신으로 갱신
  });
  // 진행중(현재 처리중) 병원이 있으면 그 병원을 각 담당자의 '현재 위치'로 우선 적용 —
  // 이동 소요시간을 지금 있는(진행중) 병원 기준으로 계산. 진행중만 있고 오늘 완료가 없는 담당자도 포함.
  Object.keys(pcInProgress||{}).forEach(function(hn){
    var fse=String(pcInProgress[hn]||'').trim(); if(!fse) return;
    if(!(fse in curByFse)) order.push(fse);
    var h=pcHospByName(hn);
    curByFse[fse]={ name:hn, from:(h&&h.lat!=null&&h.lng!=null)?h:null };
  });
  if(!order.length){
    var msg=(pcRecentState==='loading')?'불러오는 중…':'오늘 완료 내역이 없습니다';
    box.innerHTML=head+'<div class="prc-empty">'+msg+'</div>'; return;
  }
  box.innerHTML=head+order.map(function(fse){
    var cur=curByFse[fse];
    var prog=pcProgHospOf(fse);   // 이 담당자의 진행중 병원
    var fseAttr=escapeHtml(fse);
    var body;
    if(cur.from){
      var cands=pcRouteCandidates(cur.from, pcRouteSort);
      var route=pcOptimalRoute(cur.from, cands, 3);
      if(route.length){
        var totalMin=route[route.length-1].cum;
        body = '<div class="prc-total">🧭 '+t('schRouteTotal').replace('{n}',route.length).replace('{m}',totalMin)+'</div>'+
          route.map(function(x,i){
            var on=(prog===x.h.n);
            var dueCls=isDue(x.h)?' due':'';
            return '<div class="prc-item'+(on?' prog':'')+dueCls+'" data-hn="'+escapeHtml(x.h.n)+'">'+
              '<span class="prc-rank">'+(i+1)+'</span>'+
              '<span class="prc-sev" style="background:'+pcSevColor(x.h)+'" title="'+escapeHtml(x.h.st||'')+'"></span>'+
              '<span class="prc-nm">'+escapeHtml(x.h.n)+'</span>'+
              '<span class="prc-dt">'+x.leg.toFixed(1)+'km · '+t('schCum')+' '+x.cum+'분</span>'+
              '<button class="prc-prog" data-fse="'+fseAttr+'" data-hn="'+escapeHtml(x.h.n)+'" title="진행중으로 표시">'+(on?'진행중':'진행')+'</button>'+
            '</div>';
          }).join('');
      } else {
        body = '<div class="prc-empty" style="padding:2px 6px;">'+(pcRouteSort==='near'?'반경 10km 내 점검대상 병원 없음':'반경 15km 내 점검대상 병원 없음')+'</div>';
      }
    } else {
      body = '<div class="prc-empty" style="padding:2px 6px;">📍 좌표 미등록 병원 — 주변 이동 계산 불가</div>';
    }
    var progLine = prog ? '<div class="prc-prog-cur" data-fse="'+fseAttr+'" data-hn="'+escapeHtml(prog)+'">🔵 진행중 · '+escapeHtml(prog)+'<button class="prc-done" type="button" data-done-hn="'+escapeHtml(prog)+'" title="완료 처리">완료</button></div>' : '';
    return '<div class="prc-fse">'+
      '<div class="prc-fse-h">🧑‍🔧 '+escapeHtml(fse)+'<span class="prc-cur">'+((prog&&prog===cur.name)?'🔵 진행중 ':'현재 ')+escapeHtml(cur.name)+'</span></div>'+
      progLine+
      body+
    '</div>';
  }).join('');
}
// 담당자별 진행중 병원 토글 (주변 이동 소요시간 카드에서 주변 병원 선택 → 진행상태)
function pcToggleInProgress(fse, hosp){
  if(!fse||!hosp) return;
  if(pcProgHospOf(fse)===hosp) pcClearProg(hosp);
  else pcSetProg(hosp, fse);
  pcRefreshProgViews(hosp);
  if(pcIsProg(hosp)){ try{ pcFocusHospOnMap(hosp, null); }catch(e){} }
}
// 오늘 완료 병원을 상단 지도에서 위치로 이동 + 하이라이트
function pcFocusHospOnMap(name, itemEl){
  document.querySelectorAll('#pcRecentCard .rrc-item').forEach(function(el){ el.classList.toggle('sel', el===itemEl); });
  if(pcRightMode==='detail'){ pcBackToMap(); }
  var h=pcHospByName(name); if(!h||h.lat==null||h.lng==null) return;
  if(pcMapObj && typeof kakao!=='undefined'){
    var pos=new kakao.maps.LatLng(h.lat,h.lng);

    var info='', tl=pcTodayList(), nk=normalize(name);
    for(var i=0;i<tl.length;i++){ if(normalize(tl[i].hosp)===nk){ info='🧑‍🔧 '+escapeHtml(tl[i].fse||'-')+(tl[i].gubun?' · '+escapeHtml(tl[i].gubun):''); break; } }

      '<div style="font-size:12.5px;font-weight:800;color:#1B2F5E;white-space:nowrap;">'+escapeHtml(h.n)+'</div>'+
      (info?'<div style="font-size:11px;color:#6B7A99;margin-top:3px;white-space:nowrap;">'+info+'</div>':'')+
      '<button onclick="pcSelect(\''+nameJs+'\')" style="margin-top:8px;width:100%;border:0;background:#2E7D9E;color:#fff;font-size:11.5px;font-weight:700;padding:6px 8px;border-radius:7px;cursor:pointer;font-family:inherit;">🕑 이력 보기</button>'+
    '</div>';
    var mk=pcMarkerByName[h.n];
    pcFocusIW=new kakao.maps.InfoWindow({content:content, position:pos, removable:true});
    if(mk) pcFocusIW.open(pcMapObj, mk); else pcFocusIW.open(pcMapObj);

}

function pcHistTimeline(name){

  return recs.map(function(r){
    var isInsp=(r.t==='점검');
    var typeLabel=isInsp?'점검':'A/S', typeCls=isInsp?'점검':'AS';
    var symLine=(r.pt||r.sy)?'<div class="tl-cat">'+escapeHtml([r.pt,r.sy].filter(Boolean).join(' · '))+'</div>':'';
    var memo=r.m?'<div class="tl-memo">'+escapeHtml(r.m)+'</div>':'';
    var fix=r.fx?'<div class="tl-memo tl-fix">↳ '+escapeHtml(r.fx)+'</div>':'';
    var partLine=r.p?'<div class="tl-part">🔧 '+t('histPart')+': '+escapeHtml(r.p)+'</div>':'';
