<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>이전 병원정보 연결 | BAZ CS</title><script src="auth.js"></script><link rel="stylesheet" href="css/hospital-work.css?v=196"><style>.relink-panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:24px;max-width:1100px;margin:auto}.actions{display:flex;gap:12px;margin:20px 0;flex-wrap:wrap}.summary{white-space:pre-line;line-height:1.9}progress{width:100%;height:16px}td{white-space:pre-line}</style></head><body><header class="topbar"><a class="brand" href="hospital-work.html">CS 서비스 현황</a><div class="top-actions"><span id="account"></span><a href="hospital-work.html">현황으로</a></div></header><main><section class="relink-panel"><h1>이전 병원정보 연결</h1><p class="hint">확인한 대응표를 사용해 Flow에서 이전한 접수를 병원정보 DB에 연결합니다. 데모 장비·삭제된 접수는 제외하며 원본 병원명, 방문일, 상태, 장비 번호와 댓글·처리 결과는 보존합니다.</p><label class="field">병원명 대응표<input id="mapping-file" type="file" accept=".json,application/json"></label><div class="actions"><button id="preview" disabled>연결 내역 확인</button><button id="apply" class="primary" disabled>확인한 병원 연결 적용</button><button id="export" disabled>결과 내려받기</button></div><p id="summary" class="summary" role="status">대응표를 선택하세요.</p><progress id="progress" value="0" max="1" hidden></progress><p id="status" class="summary" role="status" aria-live="polite"></p><div id="error" class="notice" role="alert" hidden></div><details><summary>전체 연결 내역</summary><div class="table-scroll" id="table"></div></details></section></main><script src="js/baz-work-api.js?v=207"></script><script src="js/baz-work-relink.js?v=207"></script></body></html>
