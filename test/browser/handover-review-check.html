<!doctype html><html lang="ko"><meta charset="utf-8"><title>Handover 검수 로컬 검증</title><link rel="stylesheet" href="../../css/hospital-work.css"><h1>로컬 검증 · 운영 데이터 사용 없음</h1><button id="fixture-open">검수 화면 열기</button><button id="fixture-other-window">다른 창 저장 재현</button><label><input type="checkbox" id="fixture-loss">응답 유실 재현</label><p>다른 사용자의 공유본</p><pre id="fixture-published"></pre><p id="fixture-versions"></p><section id="review-control" class="review-control" hidden><details><summary>Handover 검수 관리</summary><p id="review-config-status"></p><label>인증 계정 ID <code id="review-admin-identity"></code></label><div><button id="review-config-refresh" type="button">검수 설정 확인</button><button id="review-activate" type="button" hidden>기존 대기열 확인 후 검수 활성화</button><button id="review-inbox-open" type="button">전체 Handover · 미연결 기록</button></div></details></section>
<dialog id="review-inbox"><div class="dialog-heading"><h2>Handover 검수 기록</h2><button id="review-inbox-close" type="button">닫기</button></div><div id="review-inbox-list" class="form-body"></div><button id="review-inbox-more" type="button">다음 기록</button></dialog>
<dialog id="handover-review-dialog"><form id="review-form"><div class="dialog-heading"><h2>Handover 본문 검수</h2><button id="review-close" type="button">닫기</button></div><div class="form-body"><p id="review-record"></p><p id="review-status"></p><p id="review-message" role="status"></p><div id="review-fields" class="form-grid"></div><label class="check"><input id="review-identity-confirm" type="checkbox">병원·처리일·장비·실제 처리자 변경을 확인했습니다. 기존 접수 연결은 유지됩니다.</label><details><summary>최초 저장본 / 이전 연동 기준본</summary><pre id="review-original"></pre></details><details><summary>검수 저장 이력</summary><button id="review-history-load" type="button">최근 이력 확인</button><pre id="review-history"></pre><button id="review-history-more" type="button" hidden>이전 이력</button></details><details open><summary>다른 창의 최신 저장본과 비교</summary><pre id="review-comparison"></pre><button id="review-rebase" type="button" hidden>최신 버전 확인 후 내 입력으로 계속 수정</button></details></div><div class="form-footer"><button id="review-apply" type="button">✓ 입력 적용</button><button id="review-receipt" type="button">저장 결과 확인</button><button id="review-save" type="submit" class="primary">Handover 저장</button></div></form></dialog>
<script>
const fields=['hospitalName','date','sn','engineer','gubun','cat','type','part','cost','detail','result','remark','nozzleReuse','nsFill','nsAmt','jet'];let original=Object.fromEntries(fields.map(f=>[f,'']));Object.assign(original,{hospitalName:'로컬 검증 병원',date:'2026-10-16',sn:'SN1',engineer:'현장',gubun:'A/S',detail:'마지막 저장본',result:'정상'});
let published={...original},version=0,audits=0,receipts={};const copy=v=>JSON.parse(JSON.stringify(v));function display(){document.getElementById('fixture-published').textContent=published.detail;document.getElementById('fixture-versions').textContent='버전 '+version+' / 감사 '+audits;}
window.BazAuth={name:()=> '검증 관리자',cachedLevel:()=>3};window.BazWorkAPI={id:()=>crypto.randomUUID(),get:async(a,p)=>{if(a==='work_review_config')return {success:true,enabled:true,canReview:true,configured:true,identityUid:'fixture-admin'};if(a==='work_review_receipt')return {success:true,found:!!receipts[p.operationId],result:receipts[p.operationId]};if(a==='work_review_get')return {success:true,recordId:'fixture-record',original,published:copy(published),reviewVersion:version,bodyVersion:'body-'+version,provenance:'현장 최초 저장본',canReview:true,mirrorPending:version>0,appliedVersion:0,reviewedBy:'검증 관리자',reviewedAt:'2026-10-16'};return {success:true,items:[]};},post:async(a,p)=>{if(p.baseReviewVersion!==version)return {success:false,conflict:true,error:'다른 창에서 본문을 저장했습니다.',current:{published:copy(published),reviewVersion:version,bodyVersion:'body-'+version}};published=copy(p.body);version++;audits++;const result={success:true,recordId:'fixture-record',reviewVersion:version};receipts[p.operationId]=result;display();if(document.getElementById('fixture-loss').checked)throw new Error('응답 유실');return result;}};
document.getElementById('fixture-open').onclick=()=>BazHandoverReview.open('fixture-record','');document.getElementById('fixture-other-window').onclick=()=>{published.detail='다른 창에서 확정한 본문';version++;display();};display();
</script><script src="../../js/baz-handover-review.js"></script></html>
