# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  upload:
    env:
      PAGES_ARTIFACT: github-pages-${{ github.run_attempt }}
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.artifact.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
          name: ${{ env.PAGES_ARTIFACT }}
      - name: Record the uploaded artifact name
        id: artifact
        run: echo "name=$PAGES_ARTIFACT" >> "$GITHUB_OUTPUT"

  deploy:
    needs: upload
    env:
      PAGES_ARTIFACT: ${{ needs.upload.outputs.artifact }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Wait for uploaded artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..12}; do
            count=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              -f "name=$PAGES_ARTIFACT" --jq '[.artifacts[] | select(.expired == false)] | length') || count=0
            if [[ "$count" == 1 ]]; then
              echo "Pages artifact $PAGES_ARTIFACT is ready."
              exit 0
            fi
            sleep 5
          done
          echo "::error::The uploaded Pages artifact could not be resolved uniquely."
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT }}
