name: Customer survey checks
on:
  pull_request:
    paths: ['customer-survey.html', 'survey-admin.html', 'js/*survey*', 'css/baz-survey.css', 'cloudflare/customer-survey/**', '.github/workflows/customer-survey.yml']
  push:
    branches: [main]
    paths: ['customer-survey.html', 'survey-admin.html', 'js/*survey*', 'css/baz-survey.css', 'cloudflare/customer-survey/**', '.github/workflows/customer-survey.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test cloudflare/customer-survey/test/worker.test.mjs
      - run: node --check js/baz-customer-survey.mjs && node --check js/baz-survey-admin.mjs
