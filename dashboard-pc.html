<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<title>현장 처리 대시보드 (PC) | BAZ CS</title>
<style>
/* Pretendard Variable (자체 호스팅, 오프라인 PWA — sw.js 프리캐시) · hospital-pc 와 같은 폰트 */
@font-face{
  font-family:'Pretendard Variable';
  font-weight:45 920; font-style:normal; font-display:swap;
  src:url('fonts/PretendardVariable.woff2') format('woff2-variations');
}
:root{
  --navy:#1B2F5E; --navy-light:#2A4080; --teal:#2E7D9E; --teal-soft:#EAF4F8;
  --bar:#1A7BA3; --bar-dim:#B9CFDD;
  --white:#FFFFFF; --gray-bg:#F5F7FA; --gray-line:#DDE3EE; --text:#1A1A2E;
  --text-muted:#6B7A99; --red:#C0392B; --green:#1E7E4E; --amber:#B8860B;
  /* 표면 단계 — 다크모드는 그림자 대신 표면 명도로 층을 만든다 */
  --surface:#FFFFFF;      /* 카드·패널 */
  --surface-2:#FBFCFE;    /* 카드 안 타일 */
  --track:#F0F4F9;        /* 막대 트랙·세그먼트 배경 */
  --seg-on:#FFFFFF;       /* 세그먼트 선택 알약 */
  --scope-fg:#1A6B54; --scope-bg:#E8F4EF; --scope-bd:#BFDDD1;
  --rate-bg:#F4F8FB; --rate-bd:#CFE0EA;
  --li-line:#F0F3F8;
  --font-ui:'Pretendard Variable','Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
/* ── 다크 모드 (hospital-pc 와 같은 팔레트) ── */
body.dark{
  --navy:#5E82C8; --navy-light:#7A9BD8; --teal:#54AAD0; --teal-soft:#17303A;
  --bar:#54AAD0; --bar-dim:#33465F;
  --gray-bg:#0E1420; --gray-line:#2A3446; --text:#E6EAF2; --text-muted:#97A3BA;
  --red:#E07A6E; --green:#57B87E; --amber:#D9A93F;
  --surface:#1A2234; --surface-2:#141B2A; --track:#232D40; --seg-on:#2A3650;
  --scope-fg:#8FD3B8; --scope-bg:#15291D; --scope-bd:#2C4A38;
  --rate-bg:#17222F; --rate-bd:#33465F;
  --li-line:#232D40;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--gray-bg);color:var(--text);
  font-family:var(--font-ui);
  font-size:14px;line-height:1.5;padding-bottom:40px;
  font-feature-settings:'ss06';-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body.dark header{background:#141E36}
header{background:var(--navy);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:20;
  display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 10px}
header>div:first-child{min-width:0;flex:1 1 auto}
header h1{margin:0;font-size:15px;font-weight:700;white-space:nowrap}
header .sub{font-size:11px;color:#B9C6E4;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 좁은 화면에서 헤더 버튼이 넘치지 않도록 축소·줄바꿈 허용 (모바일 가로 스크롤 방지) */
.hd-btns{display:flex;gap:6px;flex-wrap:wrap;flex:1 1 auto;min-width:0;justify-content:flex-end}
.hd-btn{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:8px;
  padding:6px 10px;font-size:12px;font-family:inherit;cursor:pointer;white-space:nowrap}
.hd-btn:active{background:rgba(255,255,255,.15)}
.wrap{max-width:1080px;margin:0 auto;padding:12px;transition:max-width .18s ease}

/* ===== Window(PC) 모드 : 넓은 화면 활용 ===== */
.mode-toggle{display:flex;gap:2px;background:var(--track);border:1px solid var(--gray-line);border-radius:8px;padding:2px}
.mode-toggle button{background:transparent;border:0;color:var(--text-muted);font-size:11px;font-weight:700;padding:6px 9px;border-radius:6px;cursor:pointer;line-height:1;font-family:inherit}
.mode-toggle button.on{background:var(--navy);color:#fff}
body.mode-window .wrap{max-width:1480px}
@media(max-width:720px){ body.mode-window .wrap{max-width:1080px} }
body.mode-mobile .wrap{max-width:560px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.kpi{background:var(--surface);border:1px solid var(--gray-line);border-radius:12px;padding:12px 10px;text-align:center}
.kpi b{display:block;font-size:22px;color:var(--navy);line-height:1.2;font-weight:800;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.kpi span{font-size:11px;color:var(--text-muted)}
@media (max-width:560px){ .kpis{grid-template-columns:repeat(2,1fr)} .kpi b{font-size:19px} }

/* 필터(슬라이서) */
.filters{background:var(--surface);border:1px solid var(--gray-line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.filters summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--navy);list-style:none;
  display:flex;justify-content:space-between;align-items:center}
.filters summary::-webkit-details-marker{display:none}
.filters summary .cnt{font-size:11px;color:var(--teal);font-weight:600}
.fgroup{margin-top:10px;padding-top:10px;border-top:1px dashed #E4E9F2}
.fgroup:first-of-type{border-top:none;padding-top:4px}
.fgroup h5{margin:0 0 6px;font-size:11px;color:var(--text-muted);font-weight:700;letter-spacing:.3px}
.fnote{font-style:normal;font-weight:600;font-size:10px;color:#9AA6B8;margin-left:4px}
.range-row{display:flex;align-items:center;gap:6px}
.range-row input[type=date]{flex:1;min-width:0;padding:9px 8px;border:1px solid var(--gray-line);
  border-radius:8px;font-size:13px;font-family:inherit;-webkit-appearance:none;appearance:none;background:var(--surface);color:var(--text)}
.range-row input[type=date]:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
.range-row .tilde{color:var(--text-muted);flex-shrink:0}
/* 검색형 드롭다운 */
.cb-wrap{position:relative}
.ac2{display:none;position:absolute;left:0;right:0;top:100%;z-index:25;background:var(--surface);
  border:1px solid var(--gray-line);border-radius:10px;max-height:40vh;overflow:auto;
  box-shadow:0 8px 24px rgba(27,47,94,.16);margin-top:4px;-webkit-overflow-scrolling:touch}
.cb-item{display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:11px 12px;min-height:44px;font-size:13px;cursor:pointer;border-bottom:1px solid #F0F3F8}
.cb-item:last-child{border-bottom:none}
.cb-item:active{background:var(--teal-soft)}
.cb-item.on{background:var(--teal-soft);font-weight:700;color:var(--teal)}
.cb-item b{color:var(--text-muted);font-weight:400;font-size:11px;white-space:nowrap}
/* N-Care 정기점검 현황 */
.nck-rate{margin-bottom:10px}
.nck-rate-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
.nck-rate-top b{font-size:13.5px;color:var(--green)}
.nck-rate-top span{font-size:11px;color:var(--text-muted)}
.nck-ratebar{height:10px;background:var(--track);border-radius:5px;overflow:hidden}
.nck-ratebar div{height:100%;background:var(--green);border-radius:5px;transition:width .3s}
.nck-sum{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.nck-badge{flex:1;min-width:70px;text-align:center;border-radius:8px;padding:7px 4px;font-size:11px;color:#fff}
.nck-badge b{display:block;font-size:17px;line-height:1.2}
.nck-list{max-height:260px;overflow:auto;-webkit-overflow-scrolling:touch}
.nck-row{display:flex;align-items:center;gap:8px;padding:7px 2px;border-bottom:1px solid #F0F3F8;font-size:12.5px}
.nck-row:last-child{border-bottom:none}
.nck-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.nck-row .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nck-row .gd{color:var(--teal);font-size:11px;flex-shrink:0}
.nck-row .dy{color:var(--text-muted);font-size:11px;white-space:nowrap;flex-shrink:0}
.cmp-legend{display:flex;gap:14px;margin-bottom:11px;font-size:11.5px;color:var(--text-muted)}
.cmp-legend span{display:inline-flex;align-items:center;gap:5px}
.cmp-legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.cmp-table{width:100%;border-collapse:collapse;font-size:12.5px}
.cmp-table th{font-size:11px;color:var(--text-muted);font-weight:700;padding:2px 8px 8px;text-align:right}
.cmp-table th:first-child{text-align:left}
.cmp-table td{padding:8px;border-top:1px solid #F0F3F8;vertical-align:middle}
.cmp-table td.lbl{color:var(--text);font-weight:600;white-space:nowrap}
.cmp-cell{display:flex;flex-direction:column;gap:4px;min-width:92px}
.cmp-cell .v{font-size:14px;font-weight:800;color:var(--navy);text-align:right;font-variant-numeric:tabular-nums}
.cmp-cell .v small{font-size:10.5px;font-weight:600;color:var(--text-muted);margin-left:2px}
.cmp-bar{height:7px;background:var(--track);border-radius:4px;overflow:hidden}
.cmp-bar i{display:block;height:100%;border-radius:4px;transition:width .3s}
.cmp-insight{margin-top:13px;padding:10px 12px;background:var(--gray-bg);border:1px solid var(--gray-line);border-radius:9px;font-size:12px;line-height:1.65;color:var(--text)}
.cmp-insight b{color:var(--navy)}
.gcmp-seg{display:flex;gap:4px;margin:16px 0 13px;background:var(--track);border-radius:9px;padding:3px;width:fit-content}
.gcmp-seg button{border:0;background:transparent;color:var(--text-muted);font-family:inherit;font-size:12px;font-weight:700;padding:6px 15px;border-radius:6px;cursor:pointer}
.gcmp-seg button.on{background:var(--seg-on);color:var(--navy);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.gcmp-list{display:flex;flex-direction:column;gap:12px}
.gcmp-item{display:grid;grid-template-columns:118px 1fr;gap:10px;align-items:center}
.gcmp-lb{font-size:12px;color:var(--text);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
.gcmp-bars{display:flex;flex-direction:column;gap:3px;min-width:0}
.gcmp-bar{display:flex;align-items:center;gap:8px}
.gcmp-track{flex:1;height:11px;background:var(--track);border-radius:5px;overflow:hidden;min-width:0}
.gcmp-track i{display:block;height:100%;border-radius:5px;min-width:2px;transition:width .35s}
.gcmp-track i.nc{background:#1A7BA3}
.gcmp-track i.mg{background:#E08A2B}
.gcmp-num{font-size:11px;font-weight:700;color:var(--navy);width:30px;text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums}
.gcmp-empty{color:var(--text-muted);font-size:12px;padding:10px 2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
@media (max-width:560px){ .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch} }
.chip{border:1px solid var(--gray-line);background:var(--surface);color:var(--text);border-radius:16px;
  padding:5px 11px;font-size:12px;font-family:inherit;cursor:pointer;white-space:nowrap;transition:.12s}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:700}
.chip:active{transform:scale(.96)}
.hosp-search{width:100%;margin-top:6px;padding:9px 11px;border:1px solid var(--gray-line);border-radius:8px;
  font-size:13px;font-family:inherit}
.hosp-search:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
.freset{margin-top:10px;width:100%;padding:9px;border:1px solid var(--red);background:var(--surface);color:var(--red);
  border-radius:8px;font-size:12.5px;font-weight:700;font-family:inherit;cursor:pointer;display:none}

/* 차트 카드 */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:720px){ .grid2{grid-template-columns:1fr} }
.card{background:var(--surface);border:1px solid var(--gray-line);border-radius:12px;padding:12px;margin-bottom:10px}
.card h3{margin:0 0 10px;font-size:12.5px;font-weight:700;color:var(--navy);
  padding-bottom:7px;border-bottom:1px solid var(--gray-line);display:flex;justify-content:space-between}
.card h3 .tot{color:var(--text-muted);font-weight:400;font-size:11px}
/* 노즐 재사용 현황 */
.nz-wrap{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.nz-wrap{grid-template-columns:1fr}}
.nz-sub{font-size:12px;font-weight:700;color:var(--teal);margin:0 0 8px;padding-left:2px}
.nz-metrics{display:flex;gap:6px;margin-bottom:8px}
.nz-metric{flex:1;text-align:center;border:1px solid var(--gray-line);border-radius:9px;padding:8px 4px;background:var(--surface-2)}
.nz-metric span{display:block;font-size:10.5px;color:var(--text-muted);margin-bottom:3px}
.nz-metric b{font-size:16px;line-height:1.2;color:var(--navy)}
.nz-listwrap{background:var(--gray-bg);border:1px solid var(--gray-line);border-radius:9px;padding:9px 11px}
.nz-listtit{font-size:11px;font-weight:700;color:var(--navy);margin-bottom:5px}
.nz-list{margin:0;padding-left:16px}
.nz-list li{font-size:12.5px;color:var(--text);margin-bottom:2px}
.nz-list li.nz-none{list-style:none;margin-left:-16px;color:var(--text-muted)}
.nz-wrap.c3{grid-template-columns:repeat(3,1fr)}   /* 숙련도 평가: 항목별 3그룹 */
@media(max-width:960px){.nz-wrap.c3{grid-template-columns:1fr}}
/* 가로 막대 */
.hbar{display:flex;align-items:center;gap:8px;margin-bottom:6px;cursor:pointer}
.hbar .lb{width:34%;font-size:11.5px;text-align:right;color:var(--text);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;flex-shrink:0}
.hbar .tr{flex:1;background:var(--track);border-radius:4px;height:18px;position:relative;overflow:hidden}
.hbar .fl{height:100%;background:var(--bar);border-radius:0 5px 5px 0;min-width:3px;transition:width .35s}
.hbar .vl{font-size:11px;font-weight:700;color:var(--navy);width:34px;flex-shrink:0;text-align:right;font-variant-numeric:tabular-nums}
.hbar.sel .fl{background:var(--amber)}
.hbar:hover .fl{filter:brightness(1.06)}
.hbar:active .tr{filter:brightness(.95)}
/* 세로 막대(월별) */
.vchart{display:flex;align-items:flex-end;gap:8px;height:130px;padding-top:16px;border-bottom:1px solid #EAEEF4}
.vchart.vscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
.vchart.vscroll .vcol{min-width:38px;flex:1 0 38px}
.vcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;cursor:pointer}
.vcol .vnum{font-size:11px;font-weight:700;color:var(--navy);margin-bottom:3px;font-variant-numeric:tabular-nums}
.vcol:hover .vbar{filter:brightness(1.06)}
.vcol .vbar{width:72%;max-width:44px;background:var(--bar);border-radius:5px 5px 0 0;min-height:3px;transition:height .35s}
.vcol.sel .vbar{background:var(--amber)}
.vcol .vlb{font-size:10.5px;color:var(--text-muted);margin-top:4px;white-space:nowrap}
.empty{color:var(--text-muted);font-size:12px;text-align:center;padding:14px 0}
.status{font-size:11px;color:var(--text-muted);text-align:center;margin:6px 0}
.loading{padding:40px 0;text-align:center;color:var(--text-muted)}
.spin{display:inline-block;width:22px;height:22px;border:3px solid var(--gray-line);
  border-top-color:var(--teal);border-radius:50%;animation:sp 0.8s linear infinite;margin-bottom:8px}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;
  padding:10px 20px;border-radius:24px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:30}
.toast.on{opacity:1}
/* 주간보고 모달 */
.modal{display:none;position:fixed;inset:0;background:rgba(20,30,60,.5);z-index:40;padding:16px;overflow:auto}
.modal.show{display:flex;align-items:center;justify-content:center}
.mbox{background:#fff;border-radius:14px;max-width:420px;width:100%;padding:18px}
.mbox h2{margin:0 0 12px;font-size:15px;color:var(--navy)}
.mrow{margin-bottom:12px}
.mrow label{display:block;font-size:12px;font-weight:700;color:var(--navy);margin-bottom:5px}
.mrow select,.mrow input{width:100%;padding:10px;border:1px solid var(--gray-line);border-radius:8px;
  font-size:14px;font-family:inherit}
.mbtns{display:flex;gap:8px;margin-top:14px}
.mbtn{flex:1;padding:12px;border:none;border-radius:9px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer}
.mbtn.go{background:var(--navy);color:#fff}
.mbtn.cancel{background:#E8EDF6;color:var(--text-muted)}
.mhint{font-size:11px;color:var(--text-muted);margin-top:4px}
.report-box{max-width:620px;max-height:calc(100vh - 32px);overflow:auto}
.voc-desc-editor{margin-top:12px;border:1px solid var(--gray-line);border-radius:10px;background:var(--surface-2);overflow:hidden}
.voc-desc-editor summary{cursor:pointer;padding:10px 12px;font-size:12px;font-weight:700;color:var(--navy);list-style:none}
.voc-desc-editor summary::-webkit-details-marker{display:none}
.voc-desc-editor summary:after{content:'▾';float:right;color:var(--text-muted)}
.voc-desc-editor[open] summary:after{content:'▴'}
.voc-desc-help{padding:0 12px 8px;font-size:10.5px;color:var(--text-muted)}
.voc-desc-rows{padding:0 10px 10px;display:flex;flex-direction:column;gap:7px}
.voc-desc-row{display:grid;grid-template-columns:minmax(120px,.8fr) minmax(0,2fr);gap:8px;align-items:center}
.voc-desc-row label{font-size:11px;font-weight:700;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.voc-desc-row input{width:100%;padding:8px 9px;border:1px solid var(--gray-line);border-radius:7px;background:var(--surface);color:var(--text);font:11px inherit}
.voc-desc-row input.missing{border-color:var(--amber);background:#FFF6DC}
.voc-desc-empty{font-size:11px;color:var(--text-muted);padding:4px 2px}
/* 특이사항 확인·수정 — VOC 설명 에디터와 같은 틀을 쓰되 문장은 여러 줄 입력이다 */
.note-row{display:grid;grid-template-columns:minmax(0,1fr) 30px;gap:6px;align-items:start}
.note-row textarea{width:100%;padding:7px 9px;border:1px solid var(--gray-line);border-radius:7px;
  background:var(--surface);color:var(--text);font-family:inherit;font-size:11.5px;line-height:1.5;
  resize:vertical;min-height:44px}
.note-row textarea:focus-visible{outline:2px solid var(--navy);outline-offset:-2px}
.note-del{border:1px solid var(--gray-line);border-radius:7px;background:var(--surface);
  color:var(--text-muted);cursor:pointer;height:32px;font-size:12px;line-height:1}
.note-del:hover{border-color:var(--red);color:var(--red)}
.note-del:focus-visible{outline:2px solid var(--navy);outline-offset:1px}
.note-tools{padding:0 10px 10px}
.note-reset{border:1px solid var(--gray-line);border-radius:7px;background:var(--surface);
  color:var(--navy);cursor:pointer;font-family:inherit;font-size:11px;font-weight:700;padding:6px 10px}
.note-reset:hover{background:var(--teal-soft)}
.note-reset:focus-visible{outline:2px solid var(--navy);outline-offset:1px}
@media(max-width:560px){.voc-desc-row{grid-template-columns:1fr}.voc-desc-row input{font-size:12px}}
/* PPT 생성·미리보기 모달은 다크에서도 라이트 그대로 둔다 — 슬라이드 디자인이 바뀌면 안 된다.
   토큰을 모달 안에서 라이트 값으로 되돌려 안쪽 요소가 전부 원래 색을 쓰게 한다. */
body.dark .mbox{
  --navy:#1B2F5E; --navy-light:#2A4080; --teal:#2E7D9E; --teal-soft:#EAF4F8;
  --gray-bg:#F5F7FA; --gray-line:#DDE3EE; --text:#1A1A2E; --text-muted:#6B7A99;
  --red:#C0392B; --green:#1E7E4E; --amber:#B8860B; --surface:#FFFFFF; --surface-2:#FBFCFE;
  background:#fff;color:#1A1A2E;
}

/* ══════════════════ 보고 모드(임원 보고용) ══════════════════
   · 문서 스크롤 없이 한 화면 — body를 세로 flex로 잡고 .ex-body만 남은 높이를 채운다
   · 상세 분석 모드(#app)와 DOM을 공유하지 않고 표시 전환만 한다 */
body.view-exec{height:100vh;overflow:hidden;display:flex;flex-direction:column;padding-bottom:0}
body.view-exec header{position:static;flex:0 0 auto}
body.view-exec .wrap{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
  max-width:none;width:100%;padding:8px 12px 10px;margin:0}
#execRoot{display:none;flex-direction:column;min-height:0;flex:1 1 auto;gap:8px}

/* 고정 필터 한 줄 */
.ex-fbar{position:relative;flex:0 0 auto;display:flex;align-i…51453 tokens truncated…VOC 유형 변화', (cmp?cmp.label:'이전 기간')+' 대비 · A/S 기준 · 이상 없음 제외 · '+per)
    +'<div class="ex-cbody">'
    +(!x.prev
      ? '<div class="ex-empty">비교 데이터 없음</div>'
      : '<div class="ex-change-cols">'+changeGroup('증가 TOP 3 ↑',up,'up')+changeGroup('감소 TOP 3 ↓',down,'down')+'</div>')
    +'</div>';

  /* ── 금주 관리 신호 4 ── */
  var repeatCount=buildRepeatIssues(x.rows).length;
  function watchTile(label, value, fn){
    var on=value>0;
    return '<button type="button" class="ex-tile ex-tile-btn"'+(on?' onclick="'+fn+'()" title="전체 명단 보기"':' disabled')+'>'
      +'<span>'+label+'</span><b>'+exNum(value)+'</b></button>';
  }
  document.getElementById('exWatchCard').innerHTML=
    exH3('금주 관리 신호', '선택 기간 · 숫자를 누르면 전체 명단 표시')
    +'<div class="ex-cbody"><div class="ex-tiles c4">'
      +watchTile('반복 발생 병원',repeatCount,'exShowRepeat')
      +watchTile('교육 보완 필요',K.needCount,'exShowSkill')
      +watchTile('교육 미평가',K.unratedCount,'exShowSkillUnrated')
      +watchTile('노즐 미평가',U.unrated,'exShowNozUnrated')
    +'</div></div>';

  /* ── 특이사항 (사실 기반 문장만) ──
     문장은 buildExecutiveNotes() 한 곳에서만 만든다 — 1페이지 보고서 PPT가 같은 결과를 쓴다. */
  var s=buildExecutiveNotes(x, {up:up, monthNote:mNote});
  document.getElementById('exSummaryCard').innerHTML=
    exH3('특이사항', per+' · 사실 기반')
    +'<ul class="ex-sumlist">'+s.map(function(t){ return '<li>· '+t+'</li>'; }).join('')+'</ul>';
}

/* ══════ 탭 ② 원인 분석 ══════ */
function renderExecutiveCause(x){
  var per=exPeriodLabel(), cmp=x.cmp, cmpTxt=cmp?(cmp.label+' 대비'):'비교 없음';

  /* ── VOC 유형 상위 5 ── */
  var types=exDimCompare(x.rows, x.prev, 'type', true).slice(0,5);
  document.getElementById('exTypeCard').innerHTML=
    exH3('VOC 유형 TOP 5', 'A/S 기준 · 이상 없음 제외 · '+per+' · '+cmpTxt)
    +'<div class="ex-cbody">'+exBars(types,{empty:'A/S 기록 없음', histDim:'type'})+'</div>';

  /* ── 교체품 상위 5 ── */
  var parts=exDimCompare(x.rows, x.prev, 'part', false).slice(0,5);
  document.getElementById('exPartCard').innerHTML=
    exH3('교체품 TOP 5', '수량 기준 · '+per+' · '+cmpTxt)
    +'<div class="ex-cbody">'+exBars(parts,{empty:'교체품 기록 없음', histDim:'part'})+'</div>';

  /* ── 반복 발생 병원 ── */
  var rep=buildRepeatIssues(x.rows);
  function repLi(r){
    return '<div class="ex-li">'
      +'<span class="nm" title="'+esc(r.hosp+' · '+r.type)+'">'+esc(r.hosp)+'<em>'+esc(r.type)+'</em></span>'
      +'<span class="rt"><b>'+r.count+'회</b> · 최근 '+(r.last.getMonth()+1)+'/'+r.last.getDate()+'</span></div>';
  }
  document.getElementById('exRepeatCard').innerHTML=
    exH3('반복 발생 병원', 'A/S · 동일 병원·유형이 다른 날 30일 이내 재발 · 같은 날 중복 기록은 1회')
    +'<div class="ex-cbody">'
      +(rep.length ? '<div class="ex-rows">'+rep.slice(0,5).map(repLi).join('')+'</div>'
                   : '<div class="ex-empty">반복 발생 병원 없음</div>')
      +(rep.length>5 ? '<button type="button" class="ex-more" onclick="exShowRepeat()">전체 명단 보기 ('+rep.length+')</button>' : '')
    +'</div>';

  /* ── N-Care 가입 / 미가입 비교 (총건수만이 아니라 병원당 수치도 함께) ── */
  var G=x.cmpNc, ncH=G.nc.hosp, mgH=G.mg.hosp;
  function per1(a,b){ return b? (a/b).toFixed(1) : '0.0'; }
  function pctv(a,b){ return b? Math.round(a/b*100) : 0; }
  var defs=[
    ['병원 수',        exNum(ncH)+'<small>곳</small>',                 exNum(mgH)+'<small>곳</small>'],
    ['A/S(VOC) 건수',  exNum(G.nc.voc)+'<small>건</small>',            exNum(G.mg.voc)+'<small>건</small>'],
    ['점검 건수',      exNum(G.nc.insp)+'<small>건</small>',           exNum(G.mg.insp)+'<small>건</small>'],
    ['병원당 A/S(VOC)',per1(G.nc.voc,ncH)+'<small>건/곳</small>',      per1(G.mg.voc,mgH)+'<small>건/곳</small>'],
    ['병원당 점검',    per1(G.nc.insp,ncH)+'<small>건/곳</small>',     per1(G.mg.insp,mgH)+'<small>건/곳</small>'],
    ['무상 처리 비율', pctv(G.nc.free,G.nc.tot)+'<small>%</small>',    pctv(G.mg.free,G.mg.tot)+'<small>%</small>']
  ];
  document.getElementById('exNcCmpCard').innerHTML=
    exH3('N-Care 가입 / 미가입 비교', per+' · 병원당 수치 포함')
    +'<div class="ex-cbody">'
      +(x.rows.length
        ? '<table class="ex-ctable"><thead><tr><th>지표</th><th>N-Care 가입</th><th>미가입</th></tr></thead><tbody>'
          +defs.map(function(d){
            return '<tr><td>'+d[0]+'</td><td class="ex-nc">'+d[1]+'</td><td class="ex-mg">'+d[2]+'</td></tr>';
          }).join('')+'</tbody></table>'
        : '<div class="ex-empty">표시할 데이터가 없습니다</div>')
      /* 표에 "건"(처리 기록)과 "곳"(고유 병원)이 함께 나오므로 두 기준의 차이를 한 줄로 밝힌다 */
      +exNote('<em>'+exCmpNoteNum(G)+'</em> — '+esc(EX_NOTE_CMP), exCmpNoteText(G))
    +'</div>';
}
function exShowRepeat(){
  var rep=buildRepeatIssues(EX_ROWS);
  openExList('반복 발생 병원 전체 명단',
    'A/S 기준 · 동일 병원·동일 유형이 서로 다른 날 30일 이내에 다시 발생한 경우 · '
      +'같은 날 중복 기록은 1회 · 횟수는 발생일 수 · '+exPeriodLabel(),
    exListGroup('반복 발생', rep, function(r){
      return esc(r.hosp)+'<em>'+esc(r.type)+' · '+r.count+'회 · 최근 '
        +(r.last.getMonth()+1)+'/'+r.last.getDate()+'</em>';
    }));
}

/* ══════ 탭 ③ 관리 대상 ══════ */
function exNckDays(r){
  return r.last ? (r.days+'일 경과 · '+(r.last.getMonth()+1)+'/'+r.last.getDate()) : '점검 기록 없음';
}
function renderExecutiveActions(x){
  var per=exPeriodLabel();

  /* ── N-CARE 점검 현황 (전체 가입 병원 기준 · 오늘 현황) ── */
  var S=x.ncare, ST=NCK_ST;
  document.getElementById('exNckCard').innerHTML=
    exH3('N-CARE 점검 현황', (S.list.length?'가입 '+S.list.length+'곳 · ':'')+'전체 가입 병원 기준 · 오늘 현황', true)
    +'<div class="ex-cbody">'
    +(S.list.length
      ? '<div class="ex-rate"><b>✅ 점검 운영률 '+S.rate+'%</b>'
           +'<span>30일 이내 점검 '+S.cnt[0]+' / '+S.list.length+'</span></div>'
       +'<div class="ex-ratebar"><i style="width:'+Math.max(2,S.rate)+'%"></i></div>'
       +'<div class="ex-nckbar">'+ST.slice(0,4).map(function(s,i){
           return '<div style="background:'+s[1]+'"><b>'+S.cnt[i]+'</b>'+s[0]+'</div>';
         }).join('')+'</div>'
       +'<div class="ex-nckbar wide"><div style="background:'+ST[4][1]+'"><b>'+S.cnt[4]+'</b>'+ST[4][0]+'</div></div>'
       +'<div class="ex-skhd"><span>잔여 점검 병원</span>'
         +'<em>전체 가입 병원 중 점검이 남아있는 병원</em></div>'
       +(S.need.length
         ? '<div class="ex-rows">'+S.need.slice(0,5).map(function(r){
             return '<div class="ex-li">'
               +'<span class="nm" title="'+esc(r.hosp+' · '+ST[r.si][0])+'">'
                 +'<i class="ex-dot" style="background:'+ST[r.si][1]+'"></i>'+esc(r.hosp)
                 +'<em class="gd">'+esc(r.ncare)+'</em></span>'
               +'<span class="rt">'+exNckDays(r)+'</span></div>';
           }).join('')+'</div>'
         : '<div class="ex-empty">🎉 모든 가입 병원이 최근 점검 완료 상태입니다</div>')
       +(S.need.length>5 ? '<button type="button" class="ex-more" onclick="exShowNck()">전체 명단 보기 ('+S.need.length+')</button>' : '')
      : '<div class="ex-empty">N-CARE 가입 병원 기록 없음</div>')
    +'</div>';

  /* ── 사용자 교육 관리 (선택 기간 내 최신 평가 기준) ──
     방문 병원 = 평가 병원 + 미평가 대상 관계와 교육 필요 · 미흡률 · 두 명단을
     buildSkillData() 한 곳의 결과로만 그린다(필터·모달과도 같은 값). */
  var K=x.skill, kRate=skRateTxt_(K);
  document.getElementById('exSkillCard').innerHTML=
    exH3('사용자 교육 관리', '병원별 최신 평가 기준 · '+per)
    +'<div class="ex-cbody">'
      /* 방문 병원 70곳 = 평가 병원 23곳 + 미평가 대상 47곳 이 한 줄로 읽히게 둔다 */
      +'<div class="ex-skflow">'
        +'<div class="ex-skf"><span>방문 병원</span><b>'+exNum(K.visited)+'<u>곳</u></b></div>'
        +'<i class="ex-skar">=</i>'
        +'<div class="ex-skf"><span>평가 병원</span><b>'+exNum(K.evaluated)+'<u>곳</u></b></div>'
        +'<i class="ex-skar">+</i>'
        +'<div class="ex-skf warn'+(K.unratedCount?' click':'')+'"'
          +(K.unratedCount?' role="button" tabindex="0" title="미평가 대상 전체 명단 보기"'
              +' onclick="exShowSkillUnrated()" onkeydown="exKeyOpen(event, exShowSkillUnrated)"':'')
          +'><span>미평가 대상</span><b>'+exNum(K.unratedCount)+'<u>곳</u></b></div>'
      +'</div>'
      +'<div class="ex-tiles c2" style="margin-bottom:7px">'
        +'<div class="ex-tile"><span>교육 필요</span><b>'+exNum(K.needCount)+'</b></div>'
        +'<div class="ex-tile"><span>미흡률</span><b>'+kRate+'</b></div>'
      +'</div>'
      +'<div class="ex-skhd"><span>교육 보완 필요 병원</span>'
        +'<em>NS 충진 '+K.gFill.bad+' · 충진량 부족 '+K.gAmt.bad+' · 젯 분사 교육 '+K.gJet.bad+'</em></div>'
      +(!K.evaluated
        ? '<div class="ex-empty">평가 데이터 없음</div>'
        : (K.need.length
           ? '<div class="ex-rows">'+K.need.slice(0,5).map(function(h){
               return '<div class="ex-li"><span class="nm" title="'+esc(h.name)+'">'+esc(h.name)+'</span>'
                 +'<span class="rt">'+esc(h.items.join(' · '))+'</span></div>';
             }).join('')+'</div>'
           : '<div class="ex-empty">교육이 필요한 병원 없음</div>'))
      +(K.need.length>5 ? '<button type="button" class="ex-more" onclick="exShowSkill()">전체 명단 보기 ('+K.needCount+')</button>' : '')
      /* 미평가 대상 명단 — 수치와 같은 배열을 그대로 쓴다(뺄셈으로 만든 숫자가 아니다) */
      +'<div class="ex-skhd"><span>미평가 대상 병원</span>'
        +'<em>NS 충진 · 충진량 · 젯 분사 평가값 없음</em></div>'
      +(K.unratedCount
        ? '<div class="ex-rows">'+K.unrated.slice(0,5).map(function(nm){
            return '<div class="ex-li"><span class="nm" title="'+esc(nm)+'">'+esc(nm)+'</span>'
              +'<span class="rt">미평가</span></div>';
          }).join('')+'</div>'
        : '<div class="ex-empty">미평가 대상 없음</div>')
      +(K.unratedCount>5 ? '<button type="button" class="ex-more" onclick="exShowSkillUnrated()">전체 명단 보기 ('+K.unratedCount+')</button>' : '')
      +exNote(esc(exUnratedNoteText_(K.unratedCount, EX_NOTE_SKILL)),
              exUnratedNoteText_(K.unratedCount, EX_NOTE_SKILL))
    +'</div>';

  /* ── 노즐 재사용 (선택 기간 방문 병원 기준) ── */
  var nz=x.noz, j=nz?nz.joined:null, n=nz?nz.nonJoined:null;
  var reuseTot=nz?(j.reuse+n.reuse):0;
  function nozList(title, g){
    return '<div class="ex-li" style="border-bottom:none;padding-bottom:2px">'
      +'<span class="nm" style="font-weight:700;color:var(--navy)">'+esc(title)+'</span>'
      +'<span class="rt">'+g.reuse+' / '+g.total+'곳 · <b>'+g.percent.toFixed(1)+'%</b></span></div>'
      +(g.hospitals.length
        ? g.hospitals.slice(0,5).map(function(h){
            return '<div class="ex-li"><span class="nm" title="'+esc(h)+'">· '+esc(h)+'</span><span class="rt"></span></div>';
          }).join('')
        : '<div class="ex-li"><span class="nm" style="color:var(--text-muted)">재사용 병원 없음</span><span class="rt"></span></div>');
  }
  var U=x.nozUn;
  document.getElementById('exNozCard').innerHTML=
    exH3('노즐 재사용', '선택 기간 방문 병원 기준 · '+per)
    +'<div class="ex-cbody">'
    +(nz
      /* 방문 병원 = 확인 완료(재사용 또는 미재사용) + 미평가 대상 — 아래 재사용률은 종전 계산 그대로다 */
      ? '<div class="ex-tiles" style="margin-bottom:7px">'
         +'<div class="ex-tile"><span>방문 병원</span><b>'+exNum(U.visited)+'</b></div>'
         +'<div class="ex-tile"><span>확인 완료</span><b>'+exNum(U.done)+'</b></div>'
         +'<div class="ex-tile warn'+(U.unrated?' click':'')+'"'
           +(U.unrated?' role="button" tabindex="0" title="미평가 대상 전체 명단 보기"'
               +' onclick="exShowNozUnrated()" onkeydown="exKeyOpen(event, exShowNozUnrated)"':'')
           +'><span>미평가 대상</span><b>'+exNum(U.unrated)+'</b></div>'
        +'</div>'
       +'<div class="ex-tiles" style="margin-bottom:9px">'
         +'<div class="ex-tile"><span>N-Care 재사용률</span><b>'+j.percent.toFixed(1)+'%</b></div>'
         +'<div class="ex-tile"><span>미가입 재사용률</span><b>'+n.percent.toFixed(1)+'%</b></div>'
         +'<div class="ex-tile"><span>재사용 병원</span><b>'+reuseTot+'</b></div>'
        +'</div>'
       +'<div class="ex-rows">'+nozList('N-Care', j)+nozList('미가입', n)+'</div>'
       +((j.hospitals.length>5||n.hospitals.length>5)
         ? '<button type="button" class="ex-more" onclick="exShowNoz()">전체 명단 보기 ('+reuseTot+')</button>' : '')
       /* 미평가 대상 명단 — 가입/미가입을 나눠 보여주고 전체는 모달에서 확인한다 */
       +'<div class="ex-skhd"><span>미평가 대상 병원</span>'
         +'<em>N-Care '+U.joined.length+'곳 · 미가입 '+U.nonJoined.length+'곳</em></div>'
       +(U.unrated
         ? '<div class="ex-rows">'+U.joined.concat(U.nonJoined).slice(0,5).map(function(nm,i){
             return '<div class="ex-li"><span class="nm" title="'+esc(nm)+'">'+esc(nm)+'</span>'
               +'<span class="rt">'+(i<U.joined.length?'N-Care':'미가입')+'</span></div>';
           }).join('')+'</div>'
         : '<div class="ex-empty">미평가 대상 없음</div>')
       +(U.unrated>5 ? '<button type="button" class="ex-more" onclick="exShowNozUnrated()">전체 명단 보기 ('+U.unrated+')</button>' : '')
      : '<div class="ex-empty">통계 모듈 로드 실패</div>')
    +exNote(esc(exUnratedNoteText_(U.unrated, EX_NOTE_NOZ)),
            exUnratedNoteText_(U.unrated, EX_NOTE_NOZ))
    +'</div>';
}
function exShowNck(){
  var S=buildNcareStatus(), ST=NCK_ST;
  openExList('잔여 점검 병원 전체 명단',
    '전체 가입 병원 중 점검이 남아있는 병원 · 전체 가입 병원 기준 · 오늘 현황 · '
      +'점검 기록 없음 → 우선 점검 → 점검 필요 → 점검 예정 → 경과일이 긴 순',
    exListGroup('잔여 점검 병원', S.need, function(r){
      return esc(r.hosp)+'<em>'+esc(ST[r.si][0])+' · '+esc(r.ncare)+' · '+exNckDays(r)+'</em>';
    }));
}
function exShowSkill(){
  var K=buildSkillData(EX_ROWS);
  openExList('교육 보완 필요 병원 전체 명단',
    '병원별 최신 평가 기준 · '+exPeriodLabel()
      +' · 평가 병원 '+K.evaluated+'곳 · 교육 필요 '+K.needCount+'곳 · 미흡률 '+skRateTxt_(K)
      +' · 미흡 항목이 많은 병원 우선',
    exListGroup('교육 보완 필요', K.need, function(h){
      return esc(h.name)+'<em>'+esc(h.items.join(' · '))+'</em>';
    }));
}

/* 집계 캐시를 버리고 보고 모드만 다시 그린다 (필터 변경이 아닌 데이터 보강용) */
function exInvalidate(){
  EX_CACHE=null; EX_DRAWN={};
  if(VIEW==='exec' && DATA_READY) renderExecutiveDashboard(EX_ROWS);
}

/* ── 보고 모드 렌더링 진입점 (활성 탭만 그린다) ── */
function renderExecutiveDashboard(rows){
  rows=rows||[];
  if(EX_DRAWN[EX_TAB]) return;
  var x=exBuild(rows);
  try{
    if(EX_TAB==='summary')      renderExecutiveSummary(x);
    else if(EX_TAB==='cause')   renderExecutiveCause(x);
    else                        renderExecutiveActions(x);
    EX_DRAWN[EX_TAB]=true;
  }catch(e){
    /* 카드 오류가 화면 전체를 막지 않도록 격리 */
    if(window.console&&console.error) console.error('보고 모드 렌더 오류', e);
  }
}

initExecView();   /* 데이터 로드보다 먼저 — 캐시가 있으면 loadData()가 즉시 boot()한다 */
loadData(false);

// ===== 다크 모드 (hospital-pc 와 같은 키·동작) =====
(function(){
  var KEY='baz_theme';
  var btn=document.getElementById('themeToggle');
  function apply(dark){
    document.body.classList.toggle('dark', dark);
    if(btn) btn.textContent = dark ? '☀️' : '🌙';
    var mt=document.querySelector('meta[name="theme-color"]');
    if(mt) mt.setAttribute('content', dark ? '#141E36' : '#1B2F5E');
  }
  var dark=false;
  try{ dark = localStorage.getItem(KEY)==='dark'; }catch(e){}
  apply(dark);
  if(btn) btn.addEventListener('click', function(){
    dark=!dark;
    try{ localStorage.setItem(KEY, dark?'dark':'light'); }catch(e){}
    apply(dark);
  });
})();

// ===== 화면 모드 (Window / Mobile) =====
(function(){
  var KEY='baz_viewmode';
  function apply(mode){
    document.body.classList.toggle('mode-window', mode==='window');
    document.body.classList.toggle('mode-mobile', mode==='mobile');
    var tg=document.getElementById('modeToggle');
    if(tg) tg.querySelectorAll('button').forEach(function(b){ b.classList.toggle('on', b.dataset.mode===mode); });
    window.dispatchEvent(new Event('resize')); // 차트 리사이즈 유도
  }
  function get(){
    var saved=localStorage.getItem(KEY);
    if(saved==='window'||saved==='mobile') return saved;
    return (window.matchMedia && window.matchMedia('(min-width:900px)').matches) ? 'window' : 'mobile';
  }
  var cur=get(); apply(cur);
  var tg=document.getElementById('modeToggle');
  if(tg) tg.addEventListener('click', function(e){
    var btn=e.target.closest('button[data-mode]'); if(!btn) return;
    cur=btn.dataset.mode; localStorage.setItem(KEY, cur); apply(cur);
  });
})();
</script>
