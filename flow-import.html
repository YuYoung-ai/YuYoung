<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flow 접수 이전 | BAZ CS</title><script src="auth.js"></script><link rel="stylesheet" href="css/hospital-work.css?v=196"><style>.import-panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:24px;max-width:1100px;margin:auto}.import-actions{display:flex;flex-wrap:wrap;gap:12px;margin:20px 0}.import-summary{font-size:16px;line-height:1.9;white-space:pre-line}.review-item{padding:16px 0;border-bottom:1px solid var(--line)}.review-item select{display:block;width:100%;margin-top:8px}.import-progress{white-space:pre-line}progress{width:100%;height:16px}#preview-table td{white-space:pre-line;max-width:350px}details{margin-top:16px}</style></head><body><header class="topbar"><a class="brand" href="hospital-work.html">CS 서비스 현황</a><div class="top-actions"><span id="account"></span><a href="hospital-work.html">현황으로</a></div></header><main><section class="import-panel"><h1>Flow 접수 이전</h1><p class="hint">2026년 방문 내역만 가져옵니다. 엑셀에서 이전하는 등록일시는 방문일시와 동일하게 저장합니다. 요청 구분·접수 상세내용·담당자·원문·기존 완료 상태를 보존합니다.</p><p class="hint">기존 접수는 덮어쓰지 않고 Flow 원문을 이력에 추가합니다. 다시 실행하면 이미 가져온 원본은 건너뜁니다.</p><label class="field">준비된 이전 파일<input id="flow-file" type="file" accept=".json,application/json"></label><div class="import-actions"><button id="preview" type="button" disabled>이전 내역 확인</button><button id="apply" class="primary" type="button" disabled>확인한 내역 적용</button><button id="export-report" type="button" disabled>이전 결과 내려받기</button></div><p id="summary" class="import-summary" role="status">파일을 선택하세요.</p><div id="review"></div><progress id="progress" max="1" value="0" hidden></progress><p id="status" class="import-progress" role="status" aria-live="polite"></p><div id="error" class="notice" role="alert" hidden></div><details><summary>전체 이전 내역 확인</summary><div class="table-scroll" id="preview-table"></div></details></section></main><script src="js/baz-work-api.js?v=196"></script><script src="js/baz-work-flow-import.js?v=196"></script></body></html>
