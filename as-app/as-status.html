</head><body data-page="status"><header><strong>CUREJET <span class="test-badge" data-local hidden>테스트</span></strong><nav class="status-header-actions" aria-label="접수 메뉴"><button id="refresh-status" type="button">새로고침</button><a id="return-hospital" class="button" href="index.html">병원 접수</a></nav></header><main><h1>접수 진행 확인</h1><div id="cudori-slot" hidden></div><p id="message" class="notice" role="status" aria-live="polite" hidden></p>
<section id="request-card" class="card"><span class="status-pill" id="request-state">조회 중</span><h2 id="status-hospital"></h2><dl id="status-facts" class="facts"></dl><div class="notification-inline"><span class="notification-label">접수 알림</span><div class="notification-controls"><span id="push-state" role="status" aria-live="polite"></span><button id="connect-push" type="button" aria-label="접수 알림 설정">알림 받기</button><details id="push-options" class="push-options"><summary aria-label="접수 알림 설정" title="접수 알림 설정"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 3 6 0 1 3 3 1 2 5-2 5-3 1-1 3H9l-1-3-3-1-2-5 2-5 3-1 1-3Z"/><circle cx="12" cy="12" r="3"/></svg></summary><div class="push-options-menu"><button id="push-unblock" type="button" hidden>차단 해제 안내</button><button id="check-push" type="button">알림 점검</button><button id="disconnect-push" type="button" aria-label="접수 알림 끄기" hidden>끄기</button></div></details></div></div></section>
<section id="survey-section" class="card" hidden><h2>고객만족도 조사</h2><p id="public-result"></p><p class="help">서비스 만족도를 알려주세요.</p><button id="open-survey" class="primary" type="button">고객만족도 조사 참여</button></section>
<details id="change-section" class="card"><summary>일정 변경 · 취소 요청</summary><p id="change-state" class="notice" hidden></p><form id="change-form"><label>요청 종류<select id="change-kind"><option value="reschedule">일정 변경</option><option value="cancel">취소</option></select></label><label>희망 일시 (선택)<input id="preferred-at" type="datetime-local"></label><label>내용<textarea id="change-note" maxlength="1000"></textarea></label><button type="submit">요청하기</button></form></details></main>
<dialog id="notification-dialog" class="notification-sheet" aria-labelledby="notification-title" aria-describedby="notification-description"><h2 id="notification-title">접수가 완료되었습니다</h2><p id="notification-description">접수 진행 상황을 실시간 알림으로 받으려면 아래 알림 허용을 눌러 주세요.</p><section class="notification-permission" aria-label="알림 접근 권한"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg><div><strong>알림 <span>(선택)</span></strong><p>방문 예정·일정 변경·처리 완료·방문 취소 알림</p></div></section><details id="notification-help" class="notification-help" hidden><summary>알림 설정 도움말</summary><p id="notification-details" class="help"></p></details><p id="notification-error" class="notice error" role="status" aria-live="polite" hidden></p><button id="notification-test" type="button" hidden>이 기기 표시 테스트</button><div class="actions"><button id="notification-later" type="button">나중에</button><button id="notification-allow" class="primary" type="button" autofocus>알림 허용</button></div></dialog></body></html>
