<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#579BCE"><link rel="stylesheet" href="../css/baz-brand.css?v=292"><title>접수 진행 확인 | Curejet</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="app.css?v=292"><link rel="stylesheet" href="../css/qr-design.css?v=293"><script src="config.js"></script><script defer src="../js/qr-design.js"></script><script defer src="app.js?v=292"></script></head><body data-page="status"><header><strong>CUREJET <span class="test-badge" data-local hidden>테스트</span></strong><nav class="status-header-actions" aria-label="접수 메뉴"><button id="refresh-status" type="button">새로고침</button><a id="return-hospital" class="button" href="index.html">병원 접수</a></nav></header><main><h1>접수 진행 확인</h1><p id="message" class="notice" role="status" aria-live="polite" hidden></p>
<section id="request-card" class="card"><span class="status-pill" id="request-state">조회 중</span><h2 id="status-hospital"></h2><dl id="status-facts" class="facts"></dl><div class="notification-inline"><span class="notification-label">접수 알림</span><div class="notification-controls"><span id="push-state" role="status" aria-live="polite"></span><button id="connect-push" type="button" aria-label="접수 알림 설정">설정</button><button id="disconnect-push" type="button" aria-label="접수 알림 끄기" hidden>끄기</button></div></div></section>
<section id="signature-section" class="card" hidden><h2>내역서 서명</h2><p id="signature-summary"></p><button id="draft-document">서명할 내역서 보기</button><label>성명<input id="sign-name" maxlength="60"></label><label><input id="sign-confirm" type="checkbox">내용을 확인하고 서명합니다.</label><button id="sign-document" class="primary">서명하기</button></section>
<section id="document-section" class="card" hidden><h2>처리 내역서</h2><p id="public-result"></p><p id="document-state"></p><div id="issued-document" hidden><p id="document-summary"></p><div class="actions"><button id="open-document">내역서 보기</button><button id="download-document">다운로드</button><button id="confirm-document" class="primary">확인 완료</button></div></div></section>
<section id="survey-section" class="card" hidden><h2>서비스 만족도 조사</h2><p id="survey-state"></p><form id="survey-form"><div id="survey-questions"></div><button class="primary" type="submit">제출하기</button></form><button id="refresh-survey" type="button">설문 확인</button></section>
<details id="change-section" class="card"><summary>일정 변경 · 취소 요청</summary><p id="change-state" class="notice" hidden></p><form id="change-form"><label>요청 종류<select id="change-kind"><option value="reschedule">일정 변경</option><option value="cancel">취소</option></select></label><label>희망 일시 (선택)<input id="preferred-at" type="datetime-local"></label><label>내용<textarea id="change-note" maxlength="1000"></textarea></label><button type="submit">요청하기</button></form></details></main>
<dialog id="notification-dialog" class="notification-sheet" aria-labelledby="notification-title"><h2 id="notification-title">접수 알림을 받으시겠어요?</h2><p id="notification-description">방문 일정과 처리 결과를 알려드립니다.</p><div class="actions"><button id="notification-later" type="button">나중에</button><button id="notification-allow" class="primary" type="button">알림 허용</button></div></dialog></body></html>
