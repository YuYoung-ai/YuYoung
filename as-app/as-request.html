<!doctype html><html lang="ko" data-as-release="316"><head><script src="update.js?v=316"></script>
<script src="../js/baz-theme.js?v=306"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#579BCE"><link rel="stylesheet" href="../css/baz-brand.css?v=306"><title>서비스 접수 | Curejet</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="app.css?v=316"><link rel="stylesheet" href="../css/qr-design.css?v=293"><script src="config.js"></script><script defer src="../js/qr-design.js?v=306"></script><script src="../js/baz-perf.js?v=306"></script><script defer src="push.js?v=316"></script><script defer src="app.js?v=316"></script><link rel="stylesheet" href="../css/baz-theme.css?v=307">

<link rel="stylesheet" href="../css/baz-quality.css?v=309">

</head><body data-page="request"><header><strong>CUREJET <span class="test-badge" data-local hidden>테스트</span></strong><a id="hospital-home" href="index.html">접수 진행 확인</a></header><main><h1>서비스 접수</h1><h2 id="hospital-name"></h2><p class="notice" id="message" role="status" aria-live="polite" hidden></p>
<form id="request-form"><section class="card"><h2>접수 내용</h2><dl id="service-terms" class="facts" aria-live="polite" aria-busy="true"><dt>AS 유/무상</dt><dd>확인 중…</dd><dt>N-CARE 서비스</dt><dd>확인 중…</dd></dl><p id="paid-service-note" class="help" hidden>점검 수리 내용에 따라 비용이 발생할 수 있습니다.</p><div class="grid"><label>요청 유형<select id="request-type"><option>A/S</option><option>점검</option><option>장비 문의</option></select></label><label>대상 장비<input id="equipment" readonly maxlength="200" placeholder="장비명 또는 미확인"></label></div><label>요청 내용<textarea id="symptom" maxlength="3000" required></textarea></label><label>사진 첨부 (선택)<input id="photos" type="file" accept="image/png,image/jpeg" multiple></label><div id="photo-preview" class="photo-strip"></div></section>
<section class="card"><h2>연락처</h2><div class="grid"><label>담당자 성명 (선택)<input id="contact-name" autocomplete="name" maxlength="60"></label><label>전화번호<input id="phone" type="tel" autocomplete="tel" required maxlength="24" placeholder="010-0000-0000"></label></div><label>이메일 (선택)<input id="email" type="email" autocomplete="email" maxlength="254"></label></section>
<section class="card"><div class="booking-heading"><h2>방문 희망 일정</h2><button id="refresh-times" type="button">새로고침</button></div><p class="help">선택한 순서대로 최대 3순위까지 접수할 수 있습니다. CS 확인 후 방문 일정이 확정되면 알려드립니다.</p><label>방문 희망 날짜<input id="booking-date" type="date"></label><div id="times" class="slots"></div><ol id="preferred-times" class="preference-list" aria-label="방문 희망 순위"></ol></section><div class="actions"><button class="primary" type="submit" id="submit-request">접수하기</button><button id="continue-draft" type="button">입력 이어가기</button></div><p id="pending-note" class="notice" hidden></p><button id="retry-create" type="button" hidden>접수 결과 다시 확인</button></form>
<section class="card" id="continue-result" hidden><h2>이어가기 코드</h2><code id="continue-code" class="linkbox"></code><button type="button" id="copy-continue">코드 복사</button></section></main></body></html>
